<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="fresh.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>我切你選・全班配對</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="live.js"></script>
<style>
:root{--bg:#FAF7F2;--ink:#1E242B;--co:#D95D39;--te:#2A6F68;--mu:#475569;--ln:#E3DED7;--or:#F2A65A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-size:19px;line-height:1.55}
p{margin:0}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
.host{max-width:none;padding:18px 28px}
h1{font-size:clamp(28px,5vw,44px);font-weight:900;margin:0;line-height:1.25}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:900;margin:0;line-height:1.4}
.kick{font-size:18px;font-weight:700;color:var(--co);letter-spacing:2px}
.lead{font-size:clamp(19px,2.6vw,23px);color:var(--mu)}
.card{background:#fff;border:2px solid var(--ln);border-radius:20px;box-shadow:0 4px 24px rgba(30,36,43,.06);padding:clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:10px}
.card.dark{background:#1E242B;border:0;color:#FAF7F2}
.btn{font:inherit;font-size:clamp(20px,2.8vw,26px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--co);color:#fff;cursor:pointer;line-height:1.4}
.btn.te{background:var(--te)} .btn.gh{background:#fff;color:var(--ink);border:3px solid var(--ln)} .btn.sm{font-size:16px;padding:6px 12px}
.btn[disabled]{opacity:.35;cursor:default}
.net{font-size:15px;color:var(--mu)} .net b{color:var(--te)} .net.off b{color:var(--co)}
input.code{font:inherit;font-size:44px;font-weight:900;letter-spacing:12px;text-align:center;width:100%;border:3px solid var(--ln);border-radius:16px;padding:8px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.seat{font:inherit;font-size:24px;font-weight:900;border:3px solid var(--ln);background:#fff;border-radius:14px;padding:10px 0;cursor:pointer}
.seat.taken{background:#EEE;color:#AAA;cursor:default}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.roomcode{font-size:64px;font-weight:900;letter-spacing:10px;color:var(--te);line-height:1}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pr{border:2px solid var(--ln);border-radius:14px;padding:8px 12px;background:#fff;font-size:20px}
.pr b{color:var(--co)}
.hist{display:flex;align-items:flex-end;gap:6px;height:220px;padding-top:10px}
.hist .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.hist .c span.b{display:block;width:100%;background:#94A3B8;border-radius:8px 8px 0 0}
.hist .c.mid span.b{background:var(--te)}
.hist .c small{font-size:16px;font-weight:700}
.stat{font-size:28px;font-weight:900}
.cake{width:100%;height:auto;touch-action:none;display:block}
</style>
</head>
<body>
<div id="app"></div>
<script>
var K=(function(){try{var k=new URLSearchParams(location.search).get('k');return k&&/^[a-z0-9]{3,16}$/.test(k)?k:null}catch(e){return null}})();
var MAXSEAT=35,LEN=20,app=document.getElementById('app'),esc=LIVE.esc,ls=LIVE.ls;
function netHTML(ok){return '<p class="net'+(ok?'':' off')+'">連線：<b>'+(ok?'正常':'連線中…')+'</b></p>'}
function nm(s){return s===0?'電腦小芸':s+' 號'}
/* 蛋糕：cut=刀子位置（公分），pick=被挑走的那一塊 'L'/'R' */
function cake(cut,pickSide,id){var W=600,x=20+560*cut/LEN;var o='<svg class="cake" id="'+(id||'')+'" viewBox="0 0 600 170" aria-label="20 公分長的蛋糕，刀子切在 '+cut+' 公分">';
 o+='<rect x="20" y="50" width="560" height="80" rx="14" fill="#F2D3BF" stroke="#D95D39" stroke-width="4"/><rect x="20" y="50" width="560" height="22" rx="10" fill="#FFF5F2"/>';
 for(var i=0;i<10;i++){var sx=48+i*56;o+='<circle cx="'+sx+'" cy="46" r="11" fill="#D95D39"/>'}
 if(pickSide){var px=pickSide==='L'?20:x,pw=pickSide==='L'?x-20:580-x;o+='<rect x="'+px+'" y="50" width="'+pw+'" height="80" rx="10" fill="#2A6F68" opacity=".35"/>'}
 o+='<line x1="'+x+'" y1="20" x2="'+x+'" y2="150" stroke="#1E242B" stroke-width="6" stroke-linecap="round"/>';
 o+='<text x="'+((20+x)/2)+'" y="100" text-anchor="middle" font-size="26" font-weight="900" fill="#1E242B" font-family="Noto Sans TC,sans-serif">'+cut+'</text><text x="'+((x+580)/2)+'" y="100" text-anchor="middle" font-size="26" font-weight="900" fill="#1E242B" font-family="Noto Sans TC,sans-serif">'+(LEN-cut)+'</text>';
 return o+'</svg>'}

/* ======================= 老師的大螢幕 ======================= */
if(location.hash.indexOf('host')>=0){
 var H=ls('hdcut-host');
 if(!H||location.hash.indexOf('new')>=0||(K&&H.room!==K)){H={room:K||String(1000+Math.floor(Math.random()*9000)),ph:'lobby',r:1,seats:{},pairs:[],hist:[]};ls('hdcut-host',H);try{history.replaceState(null,'','#host')}catch(e){}}
 var T='hdcut/'+H.room+'/';
 var conn=LIVE.connect([T+'in'],function(t,d){var seat=+d.seat;
  if(d.t==='join'){if(!(seat>=1&&seat<=MAXSEAT))return;var own=H.seats[seat];
   if(!own||own===d.cid){Object.keys(H.seats).forEach(function(k){if(H.seats[k]===d.cid&&+k!==seat)delete H.seats[k]});H.seats[seat]=d.cid}save()}
  else if(d.t==='cut'){var p=find(seat,'cutter');if(!p||H.seats[seat]!==d.cid||p.cut!=null||H.ph!=='play')return;p.cut=Math.max(0,Math.min(LEN,Math.round(+d.v*2)/2));
   if(p.chooser===0){p.pick=p.cut>=LEN/2?'L':'R'}save()}
  else if(d.t==='pick'){var q=find(seat,'chooser');if(!q||H.seats[seat]!==d.cid||q.cut==null||q.pick||H.ph!=='play')return;q.pick=d.v==='L'?'L':'R';save()}
  else if(d.t==='hello')bc()},function(){render()});
 function find(s,role){return H.pairs.filter(function(p){return p[role]===s})[0]}
 function bc(){conn.pub(T+'state',{ph:H.ph,r:H.r,seats:H.seats,pairs:H.pairs},true)}
 function save(){ls('hdcut-host',H);render();bc()}
 setInterval(bc,3000);
 window.makePairs=function(){var s=Object.keys(H.seats).map(Number);for(var i=s.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=s[i];s[i]=s[j];s[j]=t}
  H.pairs=[];for(var k=0;k<s.length;k+=2)H.pairs.push({cutter:s[k],chooser:s[k+1]==null?0:s[k+1],cut:null,pick:null});
  H.r=1;H.hist=[];H.ph='play';save()};
 window.swapRound=function(){H.hist.push({r:H.r,pairs:JSON.parse(JSON.stringify(H.pairs))});
  H.pairs=H.pairs.map(function(p){return p.chooser===0?{cutter:p.cutter,chooser:0,cut:null,pick:null}:{cutter:p.chooser,chooser:p.cutter,cut:null,pick:null}});H.r=2;H.ph='play';save()};
 window.finish=function(){H.hist.push({r:H.r,pairs:JSON.parse(JSON.stringify(H.pairs))});H.ph='sum';save()};
 window.replay=function(){if(confirm('同一班重玩：重新配對，座號保留。')){H.ph='lobby';H.pairs=[];H.hist=[];H.r=1;save()}};
 window.newRoom=function(){if(confirm(K?'清空紀錄、換新班級？\n已經進來的學生都會被退出、回到選座號，之前的紀錄不再計入。':'要全部重置、開新房號嗎？（換下一班時用）')){conn.pub(T+'state',{ts:Date.now(),ph:'closed',seats:{},pairs:[]},true);if(K)conn.pub('hdboard/'+K+'/epoch',{ts:Date.now()},true);setTimeout(function(){if(K){ls('hdcut-host',null);location.hash='#host'}else{location.hash='#host-new'}location.reload()},400)}};
 window.release=function(s){if(H.ph==='lobby'&&confirm('要把 '+s+' 號空出來嗎？')){delete H.seats[s];save()}};
 function got(p){if(p.cut==null||!p.pick)return null;var L=p.cut,R=LEN-p.cut;return {chooser:p.pick==='L'?L:R,cutter:p.pick==='L'?R:L}}
 function stats(pairs){var done=pairs.filter(function(p){return got(p)}),even=done.filter(function(p){return p.cut===10}).length,
   avgC=done.length?(done.reduce(function(a,p){return a+got(p).cutter},0)/done.length):0;
  var bins=[];for(var b=0;b<=LEN;b+=2)bins.push(0);pairs.forEach(function(p){if(p.cut!=null){var k=Math.min(10,Math.round(Math.min(p.cut,LEN-p.cut)))/1;}});
  var cnt={};pairs.forEach(function(p){if(p.cut!=null){var small=Math.min(p.cut,LEN-p.cut);var key=small>=10?'10':small>=9?'9～9.5':small>=8?'8～8.5':small>=6?'6～7.5':'6 以下';cnt[key]=(cnt[key]||0)+1}});
  return {done:done.length,even:even,avgC:Math.round(avgC*10)/10,cnt:cnt}}
 function histHTML(cnt){var keys=['6 以下','6～7.5','8～8.5','9～9.5','10'],mx=Math.max.apply(null,[1].concat(keys.map(function(k){return cnt[k]||0})));
  return '<div class="hist">'+keys.map(function(k){var v=cnt[k]||0;return '<div class="c'+(k==='10'?' mid':'')+'"><small>'+v+' 組</small><span class="b" style="height:'+(v/mx*150)+'px"></span><small>'+k+'</small></div>'}).join('')+'</div><p class="lead" style="text-align:center">比較小的那一塊有幾公分（切成兩塊 10 公分，就是最右邊）</p>'}
 function render(){var n=Object.keys(H.seats).length,h='<div class="wrap host"><div class="top"><div><p class="kick">第 4 課・活動三　全班配對</p><h1>我切你選</h1>'+
  (K?'<p class="lead">學生用簡報上的「全班版」連結進來，按自己的座號就能進場。</p></div>':'<p class="lead">學生網址：games.twranger.com/cutlive.html　輸入房號 →</p></div>')+'<div style="text-align:right">'+(K?'<p class="lead">免房號</p>':'<p class="lead">房號</p><p class="roomcode">'+H.room+'</p>')+''+netHTML(conn.ok())+
  '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn gh sm" onclick="replay()">同一班重玩</button><button class="btn gh sm" onclick="newRoom()">清空紀錄・換新班級</button></div></div></div>';
  if(H.ph==='lobby'){
   h+='<div class="card"><h2>已經進場：'+n+' 人</h2><div class="pairs">'+Object.keys(H.seats).map(Number).sort(function(a,b){return a-b}).map(function(s){return '<div class="pr" onclick="release('+s+')">'+s+' 號</div>'}).join('')+'</div><p class="net">選錯座號的同學：點他的座號，就能空出來。人數是單數時，最後一位會和「電腦小芸」一組。</p></div>'+
    '<div class="card"><p>規則：兩個人分一條 20 公分的蛋糕。<b>一個人切，另一個人先挑</b>，切的人拿剩下的那一塊。</p></div>'+
    '<button class="btn te" '+(n?'':'disabled')+' onclick="makePairs()">隨機配對，開始第 1 回合</button>';
  } else if(H.ph==='play'){
   var st=stats(H.pairs);
   h+='<div class="card"><h2>第 '+H.r+' 回合：'+(H.r===1?'第一次切':'換人切')+'　已經分好：'+st.done+' / '+H.pairs.length+' 組</h2><div class="pairs">'+H.pairs.map(function(p){var g=got(p);
    return '<div class="pr">'+nm(p.cutter)+' 切，'+nm(p.chooser)+' 挑<br>'+(p.cut==null?'切蛋糕中……':g?'切成 <b>'+p.cut+'</b> 和 <b>'+(LEN-p.cut)+'</b>；切的人拿到 <b>'+g.cutter+'</b> 公分':'切好了，等對方挑……')+'</div>'}).join('')+'</div></div>'+
    '<div class="card"><h2>大家切成怎樣？</h2>'+histHTML(st.cnt)+'</div>'+
    (H.r===1?'<button class="btn te" onclick="swapRound()">第 2 回合：兩個人交換，換人切</button>':'<button class="btn te" onclick="finish()">看兩回合的比較</button>');
  } else {
   h+='<div class="card"><h2>兩回合比一比</h2><table style="width:100%;font-size:24px;border-collapse:collapse">'+
    '<tr style="background:#F3EEE7"><th style="text-align:left;padding:8px">回合</th><th style="text-align:left;padding:8px">切成兩塊 10 公分的組</th><th style="text-align:left;padding:8px">切的人平均拿到</th></tr>'+
    H.hist.map(function(x){var s=stats(x.pairs);return '<tr><td style="padding:8px;border-bottom:2px solid #E3DED7">第 '+x.r+' 回合</td><td style="padding:8px;border-bottom:2px solid #E3DED7"><b style="color:#D95D39">'+s.even+'</b> / '+x.pairs.length+' 組</td><td style="padding:8px;border-bottom:2px solid #E3DED7"><b style="color:#D95D39">'+s.avgC+'</b> 公分</td></tr>'}).join('')+'</table></div>'+
    '<div class="card dark"><p style="font-size:24px">切的人知道對方會先挑，切得不平均，大的那一塊就會被拿走。所以就算只想到自己，最好的做法也是<b style="color:#F2A65A">切得一樣大</b>。這就是「切的人後拿」這條規則的厲害之處。</p></div>';
  }
  app.innerHTML=h+'</div>'}
 render();
}
/* ======================= 學生的平板 ======================= */
else{
 var S=ls('hdcut-me')||{room:'',seat:null};var CID=LIVE.cid();
 var ST=null,conn=null,draft=10,sentCut=false,m=location.hash.match(/room=(\d{4})/);if(m)S.room=m[1];if(K)S.room=K;
 function T(){return 'hdcut/'+S.room+'/'}
 function send(o){o.cid=CID;o.seat=S.seat;conn&&conn.pub(T()+'in',o)}
 function join(){conn=LIVE.connect([T()+'state'],function(t,d){if(d.ph==='closed'){try{if(d.ts&&sessionStorage.getItem('hdclosed')==String(d.ts))return;sessionStorage.setItem('hdclosed',String(d.ts))}catch(e){}if(!K)S.room='';S.seat=null;ls('hdcut-me',S);location.reload();return}
   if(ST&&d.r!==ST.r){draft=10;sentCut=false}ST=d;render()},function(ok){if(ok)send({t:'hello'});render()})}
 window.enter=function(){var v=(document.getElementById('code').value||'').replace(/\D/g,'');if(v.length!==4){alert('房號是 4 個數字');return}S.room=v;ls('hdcut-me',S);join();render()};
 window.pick=function(s){S.seat=s;ls('hdcut-me',S);send({t:'join'});render()};
 window.adj=function(d){draft=Math.max(0,Math.min(LEN,draft+d));var c=document.getElementById('ckw');if(c)c.innerHTML=cake(draft,null,'');var t=document.getElementById('cv');if(t)t.textContent=draft+' 公分 ／ '+(LEN-draft)+' 公分';};
 window.doCut=function(){sentCut=true;send({t:'cut',v:draft});render()};
 window.choose=function(side){send({t:'pick',v:side})};
 window.again=function(){localStorage.removeItem('hdcut-me');location.reload()};
 function bindDrag(){var c=document.getElementById('ckw');if(!c)return;function mv(e){var r=c.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;var cm=Math.round(((x/r.width*600-20)/560*LEN)*2)/2;adj(Math.max(0,Math.min(LEN,cm))-draft)}
  c.onpointerdown=function(e){try{c.setPointerCapture(e.pointerId)}catch(x){}mv(e);c.onpointermove=mv};c.onpointerup=c.onpointerleave=function(){c.onpointermove=null}}
 function render(){var h='<div class="wrap"><p class="kick">我切你選・全班配對'+(S.seat?'　｜　我是 '+S.seat+' 號':'')+'</p>';
  var mine=ST&&S.seat&&ST.seats[S.seat]===CID;
  if(!S.room||!conn){h+='<h1>輸入房號</h1><p class="lead">看大螢幕右上角的 4 個數字。</p><input id="code" class="code" inputmode="numeric" maxlength="4" value="'+esc(S.room)+'"><button class="btn te" onclick="enter()">進入</button>'}
  else if(!ST){h+='<h2>正在連到房號 '+esc(S.room)+'……</h2><p class="lead">如果一直停在這裡，請確認房號對不對。</p><button class="btn gh" onclick="again()">重新輸入房號</button>'}
  else if(!mine){h+='<h1>按下你的座號</h1><p class="lead">灰色的座號已經有人選了。</p><div class="seats">';
   for(var i=1;i<=MAXSEAT;i++){var tk=ST.seats[i]&&ST.seats[i]!==CID;h+='<button class="seat'+(tk?' taken':'')+'" '+(tk?'disabled':'')+' onclick="pick('+i+')">'+i+'</button>'}h+='</div>'}
  else if(ST.ph==='lobby'){h+='<div class="card"><h2>你已經進場了！</h2><p class="lead">等老師配對。你會和一位同學一起分一條 20 公分的蛋糕。</p></div>'}
  else if(ST.ph==='play'){
   var p=ST.pairs.filter(function(x){return x.cutter===S.seat||x.chooser===S.seat})[0];
   if(!p){h+='<div class="card"><h2>這一回合你沒有被配對到</h2><p class="lead">請舉手告訴老師。</p></div>'}
   else if(p.cutter===S.seat){
    if(p.cut==null&&!sentCut){h+='<h1>第 '+ST.r+' 回合：你來切</h1><div class="card"><p>你和 <b>'+nm(p.chooser)+'</b> 一組。你切完以後，<b>'+nm(p.chooser)+'會先挑</b>，你拿剩下的那一塊。</p></div>'+
      '<div id="ckw" style="touch-action:none">'+cake(draft,null,'')+'</div><p class="stat" id="cv" style="text-align:center">'+draft+' 公分 ／ '+(LEN-draft)+' 公分</p>'+
      '<div class="grid4"><button class="btn gh" onclick="adj(-1)">−1</button><button class="btn gh" onclick="adj(-0.5)">−0.5</button><button class="btn gh" onclick="adj(0.5)">+0.5</button><button class="btn gh" onclick="adj(1)">+1</button></div>'+
      '<p class="lead">用手指在蛋糕上左右拖，也可以按按鈕移動刀子。</p><button class="btn" onclick="doCut()">就切這裡！</button>'}
    else if(!p.pick){h+='<h1>切好了！</h1>'+cake(p.cut==null?draft:p.cut)+'<div class="card"><h2>等 '+nm(p.chooser)+' 挑……</h2></div>'}
    else{var mineCm=p.pick==='L'?LEN-p.cut:p.cut;h+='<h1>'+nm(p.chooser)+'挑走了'+(p.pick==='L'?'左邊':'右邊')+'</h1>'+cake(p.cut,p.pick)+'<div class="card dark"><p class="stat">你拿到 <span style="color:#F2A65A">'+mineCm+' 公分</span></p><p>'+(mineCm<10?'切得不平均，大的那一塊被別人挑走了。':'切得一樣大，誰也不吃虧。')+'</p></div>'}
   } else {
    if(p.cut==null){h+='<h1>第 '+ST.r+' 回合：你來挑</h1><div class="card"><p>你和 <b>'+p.cutter+' 號</b>一組。等他切好蛋糕，<b>你可以先挑</b>。</p></div>'+cake(10)+'<div class="card"><h2>等 '+p.cutter+' 號切……</h2></div>'}
    else if(!p.pick){h+='<h1>'+p.cutter+' 號切好了，你先挑！</h1>'+cake(p.cut)+'<div class="grid2"><button class="btn te" onclick="choose(\'L\')">我要左邊（'+p.cut+' 公分）</button><button class="btn te" onclick="choose(\'R\')">我要右邊（'+(LEN-p.cut)+' 公分）</button></div>'}
    else{var got=p.pick==='L'?p.cut:LEN-p.cut;h+='<h1>你挑了'+(p.pick==='L'?'左邊':'右邊')+'</h1>'+cake(p.cut,p.pick)+'<div class="card dark"><p class="stat">你拿到 <span style="color:#F2A65A">'+got+' 公分</span></p></div>'}
   }
   h+='<p class="lead">兩個人都做完以後，請看大螢幕，等老師說下一步。</p>';
  } else {h+='<h1>做完了！</h1><p class="lead">請看大螢幕，比比看兩回合有什麼不一樣。</p>'}
  h+=(conn?netHTML(conn.ok()):'')+'</div>';app.innerHTML=h;bindDrag()}
 if(S.room)join();render();
}
</script>
</body>
</html>
