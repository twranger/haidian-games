<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="fresh.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>紀念品交換日・全班市場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="live.js"></script>
<style>
:root{--bg:#FAF7F2;--ink:#1E242B;--co:#D95D39;--te:#2A6F68;--mu:#475569;--ln:#E3DED7;--y:#C99A2E;--yl:#FBF3DD;--c:#2A6F68;--cl:#F0F7F6;--or:#F2A65A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-size:19px;line-height:1.55}
p{margin:0}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
.host{max-width:none;padding:18px 28px}
h1{font-size:clamp(28px,5vw,44px);font-weight:900;margin:0;line-height:1.25}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:900;margin:0;line-height:1.4}
.kick{font-size:18px;font-weight:700;color:var(--co);letter-spacing:2px}
.lead{font-size:clamp(19px,2.6vw,23px);color:var(--mu)}
.card{background:#fff;border:2px solid var(--ln);border-radius:20px;box-shadow:0 4px 24px rgba(30,36,43,.06);padding:clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:10px}
.card.y{background:var(--yl);border-color:#EBD9A6}.card.c{background:var(--cl);border-color:#CFE3E0}
.card.dark{background:#1E242B;border:0;color:#FAF7F2}
.btn{font:inherit;font-size:clamp(20px,2.8vw,26px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--co);color:#fff;cursor:pointer;line-height:1.4}
.btn.te{background:var(--te)} .btn.gh{background:#fff;color:var(--ink);border:3px solid var(--ln)} .btn.sm{font-size:16px;padding:6px 12px}
.btn[disabled]{opacity:.35;cursor:default}
.net{font-size:15px;color:var(--mu)} .net b{color:var(--te)} .net.off b{color:var(--co)}
input.code{font:inherit;font-size:44px;font-weight:900;letter-spacing:12px;text-align:center;width:100%;border:3px solid var(--ln);border-radius:16px;padding:8px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.seat{font:inherit;font-size:24px;font-weight:900;border:3px solid var(--ln);background:#fff;border-radius:14px;padding:10px 0;cursor:pointer}
.seat.taken{background:#EEE;color:#AAA;cursor:default}
.price{font-size:clamp(64px,15vw,110px);font-weight:900;line-height:1;text-align:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.roomcode{font-size:64px;font-weight:900;letter-spacing:10px;color:var(--te);line-height:1}
.crowd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.av{width:84px;display:flex;flex-direction:column;align-items:center;cursor:default}
.av svg{width:64px;height:82px}
.av .tag{font-weight:900;font-size:16px;min-height:24px}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.col h3{margin:0 0 8px;font-size:26px}
.br{display:flex;align-items:center;gap:8px;margin:3px 0}
.br .s{width:56px;font-weight:900;text-align:right}
.br .t{flex:1;height:26px;background:#F3EEE7;border-radius:8px;overflow:hidden}
.br .f{height:100%;display:block;border-radius:8px}
.br .v{width:80px;font-weight:900}
.br.deal .s{color:var(--co)}
.stat{font-size:30px;font-weight:900}
</style>
</head>
<body>
<div id="app"></div>
<script>
var K=(function(){try{var k=new URLSearchParams(location.search).get('k');return k&&/^[a-z0-9]{3,16}$/.test(k)?k:null}catch(e){return null}})();
var MAXSEAT=35,MAXP=500;
var app=document.getElementById('app'),esc=LIVE.esc,ls=LIVE.ls;
function person(fill,num){return '<svg viewBox="0 0 58 74" aria-hidden="true"><circle cx="29" cy="18" r="13" fill="'+fill+'"/><path d="M6 72 Q6 36 29 36 Q52 36 52 72 Z" fill="'+fill+'"/><text x="29" y="64" text-anchor="middle" font-size="18" font-weight="900" fill="#fff" font-family="Noto Sans TC,sans-serif">'+num+'</text></svg>'}
function netHTML(ok){return '<p class="net'+(ok?'':' off')+'">連線：<b>'+(ok?'正常':'連線中…')+'</b></p>'}
function median(a){if(!a.length)return 0;var b=a.slice().sort(function(x,y){return x-y}),m=Math.floor(b.length/2);return b.length%2?b[m]:Math.round((b[m-1]+b[m])/2)}
function KEYCHAIN(w){return '<svg width="'+w+'" viewBox="0 0 120 120" aria-label="虱目魚鑰匙圈"><circle cx="30" cy="26" r="14" fill="none" stroke="#475569" stroke-width="5"/><path d="M38 36 L48 50" stroke="#475569" stroke-width="5"/><path d="M40 80 Q70 44 104 70 Q70 104 40 80 Z" fill="#CFE3E0" stroke="#2A6F68" stroke-width="5"/><path d="M40 80 L22 66 L24 94 Z" fill="#CFE3E0" stroke="#2A6F68" stroke-width="5" stroke-linejoin="round"/><circle cx="88" cy="70" r="4" fill="#1E242B"/></svg>'}

/* ======================= 老師的大螢幕 ======================= */
if(location.hash.indexOf('host')>=0){
 var H=ls('hdsv-host');
 if(!H||location.hash.indexOf('new')>=0||(K&&H.room!==K)){H={room:K||String(1000+Math.floor(Math.random()*9000)),ph:'lobby',seats:{},role:{},price:{},deals:[]};ls('hdsv-host',H);try{history.replaceState(null,'','#host')}catch(e){}}
 var T='hdsv/'+H.room+'/';
 var conn=LIVE.connect([T+'in'],function(t,d){var seat=+d.seat;
  if(d.t==='join'){if(!(seat>=1&&seat<=MAXSEAT))return;var own=H.seats[seat];
   if(!own||own===d.cid){Object.keys(H.seats).forEach(function(k){if(H.seats[k]===d.cid&&+k!==seat){delete H.seats[k];delete H.role[k]}});H.seats[seat]=d.cid;
    if(H.ph!=='lobby'&&!H.role[seat]){var ny=Object.keys(H.role).filter(function(k){return H.role[k]==='y'}).length,nc=Object.keys(H.role).length-ny;H.role[seat]=ny<=nc?'y':'c'}}
   save()}
  else if(d.t==='price'){if(H.ph!=='price'||H.seats[seat]!==d.cid)return;H.price[seat]=Math.max(0,Math.min(MAXP,+d.v||0));save()}
  else if(d.t==='hello')bc()},function(){render()});
 function bc(){conn.pub(T+'state',{ph:H.ph,seats:H.seats,role:H.role,price:H.price,deals:H.deals},true)}
 function save(){ls('hdsv-host',H);render();bc()}
 setInterval(bc,3000);
 window.startPrice=function(){var s=Object.keys(H.seats).map(Number);for(var i=s.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=s[i];s[i]=s[j];s[j]=t}
  H.role={};s.forEach(function(x,i){H.role[x]=i%2?'c':'y'});H.price={};H.deals=[];H.ph='price';save()};
 window.openMarket=function(){var ys=[],cs=[];Object.keys(H.price).forEach(function(k){(H.role[k]==='y'?ys:cs).push({s:+k,p:H.price[k]})});
  ys.sort(function(a,b){return a.p-b.p});cs.sort(function(a,b){return b.p-a.p});H.deals=[];
  for(var i=0;i<Math.min(ys.length,cs.length);i++){if(cs[i].p>=ys[i].p)H.deals.push({y:ys[i].s,c:cs[i].s,p:Math.round((ys[i].p+cs[i].p)/2/5)*5});else break}
  H.ph='market';save()};
 window.reveal=function(){H.ph='reveal';save()};
 window.replay=function(){if(confirm('同一班重玩：重新分組、重新寫點數，座號保留。')){H.ph='lobby';H.role={};H.price={};H.deals=[];save()}};
 window.newRoom=function(){if(confirm(K?'要清空這一班的紀錄，換下一班嗎？學生的平板會自動回到選座號。':'要全部重置、開新房號嗎？（換下一班時用）')){conn.pub(T+'state',{ts:Date.now(),ph:'closed',seats:{},role:{},price:{},deals:[]},true);setTimeout(function(){if(K){ls('hdsv-host',null);location.hash='#host'}else{location.hash='#host-new'}location.reload()},400)}};
 window.release=function(s){if(H.ph==='lobby'&&confirm('要把 '+s+' 號空出來嗎？')){delete H.seats[s];save()}};
 function crowd(showRole){var h='';Object.keys(H.seats).map(Number).sort(function(a,b){return a-b}).forEach(function(s){
   var r=H.role[s],fill=showRole?(r==='y'?'#C99A2E':'#2A6F68'):'#94A3B8',done=H.price[s]!=null;
   h+='<div class="av" onclick="release('+s+')">'+person(fill,s)+'<span class="tag">'+(H.ph==='price'?(done?'✓':''):'')+'</span></div>'});return h||'<p class="lead">還沒有人進場。</p>'}
 function bars(list,max,color,dealSet){return list.map(function(x){return '<div class="br'+(dealSet[x.s]?' deal':'')+'"><span class="s">'+x.s+' 號</span><span class="t"><span class="f" style="width:'+(max?x.p/max*100:0)+'%;background:'+color+'"></span></span><span class="v">'+x.p+' 點</span></div>'}).join('')}
 function render(){var n=Object.keys(H.seats).length,h='<div class="wrap host"><div class="top"><div><p class="kick">第 2 課・活動二　全班市場</p><h1>紀念品交換日</h1>'+
  (K?'<p class="lead">學生用簡報上的「全班版」連結進來，按自己的座號就能進場。</p></div>':'<p class="lead">學生網址：games.twranger.com/souvenirlive.html　輸入房號 →</p></div>')+'<div style="text-align:right">'+(K?'<p class="lead">免房號</p>':'<p class="lead">房號</p><p class="roomcode">'+H.room+'</p>')+''+netHTML(conn.ok())+
  '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn gh sm" onclick="replay()">同一班重玩</button><button class="btn gh sm" onclick="newRoom()">換下一班（全部重置）</button></div></div></div>';
  if(H.ph==='lobby'){
   h+='<div class="card"><h2>已經進場：'+n+' 人</h2><div class="crowd">'+crowd(false)+'</div><p class="net">選錯座號的同學：點他的小人，就能把座號空出來。</p></div>'+
    '<div class="card"><p>開始以後，平板會偷偷把全班分成兩組。每個人寫下一個點數，最後全班一起「開市」，看看有幾個人真的成交。</p></div>'+
    '<button class="btn te" '+(n>1?'':'disabled')+' onclick="startPrice()">大家都進場了，開始</button>';
  } else if(H.ph==='price'){
   var k=Object.keys(H.price).length;
   h+='<div class="card"><h2>請在平板上寫下你的點數</h2><p class="lead">兩組看到的問題不一樣，請不要告訴旁邊的同學。寫好的人，小人下面會出現 ✓。</p><p class="stat">已經寫好：'+k+' / '+n+' 人</p><div class="crowd">'+crowd(false)+'</div></div>'+
    '<button class="btn te" '+(k>1?'':'disabled')+' onclick="openMarket()">開市！看看誰和誰能成交</button>';
  } else {
   var ys=[],cs=[],ds={};H.deals.forEach(function(d){ds[d.y]=1;ds[d.c]=1});
   Object.keys(H.price).forEach(function(k){(H.role[k]==='y'?ys:cs).push({s:+k,p:H.price[k]})});
   ys.sort(function(a,b){return a.p-b.p});cs.sort(function(a,b){return b.p-a.p});
   var mx=Math.max.apply(null,[1].concat(ys.map(function(x){return x.p}),cs.map(function(x){return x.p}))),half=Math.floor(Math.min(ys.length,cs.length)/2);
   var rv=H.ph==='reveal',yn=rv?'黃組：手上有鑰匙圈的人（最少要多少點才肯賣）':'黃組',cn=rv?'青組：手上沒有的人（最多肯花多少點買）':'青組';
   h+='<div class="card dark"><p class="stat">一共成交了 <span style="color:#F2A65A">'+H.deals.length+' 對</span>'+(half?'　（如果每個人心裡覺得鑰匙圈值的點數差不多，大約會有 '+half+' 對）':'')+'</p>'+
    (H.deals.length?'<p>'+H.deals.map(function(d){return d.y+' 號 → '+d.c+' 號（'+d.p+' 點）'}).join('　')+'</p>':'')+'</div>'+
    '<div class="mk"><div class="card y col"><h3>'+yn+'</h3><p class="lead">中間的點數：<b>'+median(ys.map(function(x){return x.p}))+' 點</b></p>'+bars(ys,mx,'#C99A2E',ds)+'</div>'+
    '<div class="card c col"><h3>'+cn+'</h3><p class="lead">中間的點數：<b>'+median(cs.map(function(x){return x.p}))+' 點</b></p>'+bars(cs,mx,'#2A6F68',ds)+'</div></div>'+
    '<p class="lead">配對方法：黃組從開價最低的排起，青組從出價最高的排起，一對一對比；青組出的點數大於或等於黃組要的點數，就成交，價錢取兩個人的中間。紅色座號是有成交的人。</p>'+
    (rv?'<div class="card"><p style="font-size:24px">同一個鑰匙圈，<b>已經拿到的人</b>開的價，通常比<b>還沒有的人</b>願意出的價高很多，所以真正成交的人比想像中少。這就是「稟賦效應」：東西變成自己的，就覺得它更值錢。</p></div>':
     '<button class="btn te" onclick="reveal()">揭曉：兩組差在哪裡</button>');
  }
  app.innerHTML=h+'</div>'}
 render();
}
/* ======================= 學生的平板 ======================= */
else{
 var S=ls('hdsv-me')||{room:'',seat:null};var CID=LIVE.cid();
 var ST=null,conn=null,draft=null,m=location.hash.match(/room=(\d{4})/);if(m)S.room=m[1];if(K)S.room=K;
 function T(){return 'hdsv/'+S.room+'/'}
 function send(o){o.cid=CID;o.seat=S.seat;conn&&conn.pub(T()+'in',o)}
 function join(){conn=LIVE.connect([T()+'state'],function(t,d){if(d.ph==='closed'){try{if(d.ts&&sessionStorage.getItem('hdclosed')==String(d.ts))return;sessionStorage.setItem('hdclosed',String(d.ts))}catch(e){}if(!K)S.room='';S.seat=null;ls('hdsv-me',S);location.reload();return}ST=d;render()},function(ok){if(ok)send({t:'hello'});render()})}
 window.enter=function(){var v=(document.getElementById('code').value||'').replace(/\D/g,'');if(v.length!==4){alert('房號是 4 個數字');return}S.room=v;ls('hdsv-me',S);join();render()};
 window.pick=function(s){S.seat=s;ls('hdsv-me',S);send({t:'join'});render()};
 window.adj=function(d){draft=Math.max(0,Math.min(MAXP,(draft||0)+d));render()};
 window.sendP=function(){send({t:'price',v:draft||0})};
 window.again=function(){localStorage.removeItem('hdsv-me');location.reload()};
 function render(){var h='<div class="wrap"><p class="kick">紀念品交換日・全班市場'+(S.seat?'　｜　我是 '+S.seat+' 號':'')+'</p>';
  var mine=ST&&S.seat&&ST.seats[S.seat]===CID,role=mine?ST.role[S.seat]:null;
  if(!S.room||!conn){h+='<h1>輸入房號</h1><p class="lead">看大螢幕右上角的 4 個數字。</p><input id="code" class="code" inputmode="numeric" maxlength="4" value="'+esc(S.room)+'"><button class="btn te" onclick="enter()">進入</button>'}
  else if(!ST){h+='<h2>正在連到房號 '+esc(S.room)+'……</h2><p class="lead">如果一直停在這裡，請確認房號對不對。</p><button class="btn gh" onclick="again()">重新輸入房號</button>'}
  else if(!mine){h+='<h1>按下你的座號</h1><p class="lead">灰色的座號已經有人選了。</p><div class="seats">';
   for(var i=1;i<=MAXSEAT;i++){var tk=ST.seats[i]&&ST.seats[i]!==CID;h+='<button class="seat'+(tk?' taken':'')+'" '+(tk?'disabled':'')+' onclick="pick('+i+')">'+i+'</button>'}h+='</div>'}
  else if(ST.ph==='lobby'){h+='<div class="card" style="align-items:center">'+person('#94A3B8',S.seat)+'<h2>你已經進場了！</h2><p class="lead">等老師開始。</p></div>'}
  else if(ST.ph==='price'){var done=ST.price[S.seat]!=null;if(draft==null)draft=done?ST.price[S.seat]:50;
   h+=(role==='y'?'<div class="card y" style="align-items:center"><p class="kick" style="color:#C99A2E">你是黃組</p>'+KEYCHAIN(130)+'<h2>老師送你一個虱目魚鑰匙圈，它是你的了！</h2><p class="lead">班上有一位同學很喜歡它，想用點數跟你買。他<b>最少</b>要給你多少點，你才肯賣給他？</p></div>'
    :'<div class="card c" style="align-items:center"><p class="kick" style="color:#2A6F68">你是青組</p>'+KEYCHAIN(130)+'<h2>班上有一位同學有這個虱目魚鑰匙圈。</h2><p class="lead">如果你想跟他買，你<b>最多</b>肯花多少點？</p></div>')+
    '<p class="price" style="color:'+(role==='y'?'#C99A2E':'#2A6F68')+'">'+draft+' 點</p>'+
    '<div class="grid4"><button class="btn gh" onclick="adj(-50)">−50</button><button class="btn gh" onclick="adj(-10)">−10</button><button class="btn gh" onclick="adj(10)">+10</button><button class="btn gh" onclick="adj(50)">+50</button></div>'+
    '<button class="btn te" onclick="sendP()">'+(done?'已送出 '+ST.price[S.seat]+' 點（可以再改）':'送出')+'</button><p class="lead">點數只在遊戲裡用，不是真的錢。請不要告訴旁邊的同學你是哪一組。</p>'}
  else{var d=(ST.deals||[]).filter(function(x){return x.y===S.seat||x.c===S.seat})[0],my=ST.price[S.seat];
   h+='<h1>開市了！</h1><div class="card"><p style="font-size:26px;font-weight:900">'+(d?(role==='y'?'你用 '+d.p+' 點，把鑰匙圈賣給了 '+d.c+' 號。':'你用 '+d.p+' 點，向 '+d.y+' 號買到了鑰匙圈。'):'這一次你沒有成交。')+'</p>'+
    '<p class="lead">你寫的是 '+(my==null?'—':my+' 點')+'。全班一共成交 '+ST.deals.length+' 對。</p></div><p class="lead">請看大螢幕，等老師揭曉兩組差在哪裡。</p>'}
  h+=(conn?netHTML(conn.ok()):'')+'</div>';app.innerHTML=h}
 if(S.room)join();render();
}
</script>
</body>
</html>
