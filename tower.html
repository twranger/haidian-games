<meta charset="utf-8">
<script src="fresh.js"></script>
<title>帳單疊疊樂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: six months, one "really want it" item per month → see this month's bill tower → buy now pay later or skip → blocks stack, paid-off blocks disappear, tower shakes past the 500 line → months 7-9 preview (look only) → two no-right-answer questions → summary for a show of hands. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --u:50px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:980px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px;min-width:0}
.scene{font-size:clamp(23px,3.3vw,30px);font-weight:900;line-height:1.5;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);font-weight:700}
.opts .btn.alt{text-align:left}
.btn.alt.pick{border-color:var(--gold);background:#FBF1DC}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:#FBF1DC}
.money{font-size:clamp(19px,2.6vw,24px);margin:0;line-height:1.7}
.money b{font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.4vw,22px)}
td{padding:10px 8px;border-bottom:2px solid var(--line);vertical-align:top} td.k{color:var(--muted);font-weight:700} td.n{text-align:right;font-weight:900}

/* main + tower */
.play{display:grid;grid-template-columns:minmax(0,1fr) 310px;grid-template-areas:'a t' 'b t';gap:16px;align-items:start}
.pa{grid-area:a}.pb{grid-area:b}.play>.side{grid-area:t}
.side{display:flex;flex-direction:column;gap:8px}
.tw{position:relative;height:calc(var(--u)*7 + 54px);border-bottom:6px solid var(--muted);display:flex;flex-direction:column-reverse;align-items:stretch;padding-left:6px;padding-right:62px}
.tw.shake{animation:shake .6s ease-in-out 2}
.blk{height:calc(var(--u)*var(--h));border:3px solid rgba(31,42,46,.35);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;font-size:19px;font-weight:900;line-height:1.2;overflow:hidden;flex:none}
.blk + .blk{margin-bottom:0}
.blk small{font-size:16px;font-weight:700;background:rgba(255,255,255,.75);border-radius:8px;padding:1px 6px;white-space:nowrap}
.blk .nm{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.blk.new{animation:drop .7s cubic-bezier(.3,1.3,.6,1)}
.blk.gone{position:absolute;left:6px;right:62px;bottom:0;opacity:0;animation:fade 1s ease-out;pointer-events:none}
.line{position:absolute;left:0;right:0;bottom:calc(var(--u)*5);border-top:4px dashed var(--rust);z-index:2;pointer-events:none}
.line span{position:absolute;right:0;top:-17px;font-size:19px;font-weight:900;color:var(--rust);background:var(--bg);padding:0 6px;border-radius:6px}
.twcap{font-size:clamp(19px,2.4vw,22px);font-weight:900;text-align:center;margin:0}
.over{background:#FBE3D6;border:3px solid var(--rust);border-radius:16px;padding:10px 14px;font-size:clamp(19px,2.4vw,22px);font-weight:700;margin:0}
.empty{position:absolute;inset:auto 0 12px 0;text-align:center;color:var(--muted);font-size:19px;margin:0}

.cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cal.nine{grid-template-columns:repeat(9,minmax(0,1fr))}
.cell{border:3px solid var(--line);border-radius:12px;background:var(--card);text-align:center;padding:6px 2px;font-size:clamp(17px,2.2vw,20px);line-height:1.35;font-variant-numeric:tabular-nums}
.cell b{display:block;font-size:clamp(19px,2.6vw,24px)}
.cell.now{border-color:var(--sea);background:var(--note)}
.cell.hot b{color:var(--rust)}
.cell.fut{color:var(--muted)}
.cell.btn{padding:10px 2px;color:var(--ink);font-weight:700}

.mon3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chip{display:inline-block;border-radius:10px;padding:2px 10px;margin:3px 4px 3px 0;font-size:19px;font-weight:700;border:2px solid rgba(31,42,46,.25)}

@keyframes drop{from{transform:translateY(-320px);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:1;transform:none}to{opacity:0;transform:translateX(60px)}}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-1.6deg)}75%{transform:rotate(1.6deg)}}
@media (prefers-reduced-motion:reduce){.blk.new,.tw.shake{animation:none}.blk.gone{display:none}}
@media (max-width:760px){.play{grid-template-columns:1fr;grid-template-areas:'a' 't' 'b'}.cal.nine{grid-template-columns:repeat(3,minmax(0,1fr))}.mon3{grid-template-columns:1fr}}
@media (max-width:440px){.two{grid-template-columns:1fr}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
var app=document.getElementById('app');
var KEY='tower-v1';
var POCKET=500;
// p: price, n: months, per: each month, used: used up right away
var IT=[
 {nm:'新球鞋',p:1200,n:6,per:200,c:'#CFE3F1',d:'走路、上體育課都可以穿。'},
 {nm:'手遊點數',p:300,n:3,per:100,c:'#F6D7C8',d:'點數這個月就會用完。',used:true},
 {nm:'藍牙耳機',p:900,n:3,per:300,c:'#D6EAD8',d:'可以一邊聽音樂一邊寫作業。'},
 {nm:'整套漫畫',p:600,n:6,per:100,c:'#F3E6B9',d:'可以放在書櫃，一看再看。'},
 {nm:'夜市抓娃娃',p:200,n:2,per:100,c:'#E6DAF0',d:'在安南區的夜市玩，當天晚上就玩完了。',used:true},
 {nm:'同學生日禮物',p:300,n:3,per:100,c:'#F5D3DE',d:'送給好朋友，他一定很開心。'}
];
var WHY=['你走過運動用品店，看到一雙好帥的新球鞋。','同學都在玩一款手機遊戲，你也好想買點數。','你看到廣告，一副藍牙耳機正在特價。','書店擺出一整套你最愛的漫畫。','週末去夜市，抓娃娃機裡有你最喜歡的玩偶。','好朋友下個禮拜生日，你想送他一份禮物。'];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
var st=load()||{step:0,m:0,buy:[null,null,null,null,null,null],q1:null,q2:null};
var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function B(t,cls,fn){var b=el('button',cls||'btn',t);b.type='button';b.addEventListener('click',fn);return b}
function go(){save(st);render();window.scrollTo(0,0)}
// item i (bought in month i) pays in months i .. i+n-1 (0-based)
function active(k,upto){var a=[];IT.forEach(function(x,i){if(i<=upto&&st.buy[i]===true&&k>=i&&k<i+x.n)a.push(i)});return a}
function bill(k,upto){return active(k,upto==null?5:upto).reduce(function(s,i){return s+IT[i].per},0)}
function MN(k){return (k+1)+' 月'}
function leftTxt(b){return b<=POCKET?'付完帳，零用錢還剩 <b>'+(POCKET-b)+'</b> 元。':'這個月的零用錢不夠付帳了，還差 <b>'+(b-POCKET)+'</b> 元。'}

function blockEl(i,k,cls){
  var x=IT[i];var b=el('div','blk'+(cls?' '+cls:''));b.style.setProperty('--h',x.per/100);b.style.background=x.c;
  var nm=el('span','nm',x.nm);var paid=k-i+1;
  if(x.used&&k>i)nm.appendChild(el('small',null,'已經用完了'));
  else if(cls!=='gone')nm.appendChild(el('small',null,'第 '+paid+'／'+x.n+' 期'));
  b.append(nm,el('span',null,x.per));return b;
}
function tower(k,upto,fresh,gone){
  var box=el('div','side');
  var t=el('div','tw');var ln=el('div','line','<span>500</span>');t.appendChild(ln);
  var a=active(k,upto);
  if(!a.length)t.appendChild(el('p','empty','這個月沒有帳單'));
  a.forEach(function(i){t.appendChild(blockEl(i,k,i===fresh&&!reduce?'new':''))});
  (gone||[]).forEach(function(i){if(!reduce){var g=blockEl(i,k-1,'gone');g.addEventListener('animationend',function(){g.remove()});t.appendChild(g)}});
  var b=bill(k,upto);
  box.append(el('p','twcap',MN(k)+'要付的帳單：'+b+' 元'),t,el('p','lead','紅色虛線＝每個月的零用錢 500 元'));
  if(b>POCKET){box.appendChild(el('p','over','這個月的零用錢不夠付帳了，還差 '+(b-POCKET)+' 元。'));if(!reduce)setTimeout(function(){t.classList.add('shake')},fresh!=null&&fresh>=0?700:150)}
  return box;
}
function calendar(n,now){
  var c=el('div','cal'+(n===9?' nine':''));
  for(var k=0;k<n;k++){var b=bill(k,now==null?5:now);var cls='cell'+(k===now?' now':'')+(now!=null&&k>now?' fut':'')+(b>POCKET?' hot':'');c.appendChild(el('div',cls,MN(k)+'<b>'+b+'</b>'))}
  return c;
}

function intro(){
  app.innerHTML='';
  var c=el('div','card');
  c.append(el('p','lead','你升上六年級了，每個月有 500 元零用錢。（這個遊戲裡的數字都是假設的。）'),
    el('p','lead','有一種「先買後付」的方法：東西可以先拿回家，之後每個月付一部分，直到付完為止。'),
    el('p','lead','接下來的 6 個月，每個月都會出現一樣你好想要的東西。你可以「先買後付」，也可以「這次不買」，兩個都可以選，沒有對錯。'),
    el('p','lead','畫面上會有一座「帳單塔」：每一筆還沒付完的分期是一塊積木，塔越高，代表這個月要付的錢越多。紅色虛線是 500 元零用錢。'));
  app.append(el('h1',null,'帳單疊疊樂'),c,B('開始，進入 1 月',null,function(){st.step=1;st.m=0;go()}));
}

var anim={fresh:null,gone:null};
function month(){
  var m=st.m,x=IT[m],ch=st.buy[m];
  app.innerHTML='';
  var left=el('div','opts pa');left.style.gap='14px';var low=el('div','opts pb');low.style.gap='14px';
  var before=bill(m,m-1);
  left.append(el('p','case','第 '+(m+1)+' 個月，共 6 個月'),el('h2',null,MN(m)+'到了'),
    el('p','money','這個月要先付之前買的分期：<b>'+before+'</b> 元。'+(m===0?'（第一個月，還沒有帳單。）':'')));
  var c=el('div','card');
  c.append(el('p','scene',WHY[m]),el('p','money','<b>'+x.nm+'</b>　'+x.p+' 元<br>先買後付：分 '+x.n+' 個月，每個月付 <b>'+x.per+'</b> 元。'),el('p','lead',x.d));
  var g=el('div','two');
  var b1=B('先買後付','btn alt'+(ch===true?' pick':''),function(){if(st.buy[m]!==true){st.buy[m]=true;anim={fresh:m,gone:null};save(st);month()}});
  var b2=B('這次不買','btn alt'+(ch===false?' pick':''),function(){if(st.buy[m]!==false){st.buy[m]=false;anim={fresh:-1,gone:null};save(st);month()}});
  g.append(b1,b2);c.appendChild(g);left.appendChild(c);
  if(ch!=null){
    var now=bill(m,m);var end=Math.min(m+x.n,9);
    var txt=ch?x.nm+'先拿回家了。從這個月開始，每個月要付 '+x.per+' 元，一共付 '+x.n+' 個月，一直付到 '+end+' 月。':'這次不買。'+x.nm+'沒有拿回家，這個月的帳單也沒有變多。';
    left.append(el('p','note'+(now>POCKET?' warm':''),txt+'<br>這個月一共要付 <b>'+now+'</b> 元。'+leftTxt(now)+'<br><span style="font-size:.85em;color:var(--muted)">想換另一個選擇也可以，直接點另一個按鈕。</span>'));
    low.appendChild(B(m<5?'到 '+MN(m+1):'看看 7～9 月',null,function(){
      var prev=active(m,5);st.m++;if(st.m>5){st.step=2;st.m=5;anim={fresh:null,gone:null}}else{var nx=active(st.m,st.m-1);anim={fresh:null,gone:prev.filter(function(i){return nx.indexOf(i)<0})}}go()}));
  }
  low.appendChild(el('p','lead','每個月要付多少（到目前為止買的）：'));
  low.appendChild(calendar(6,m));
  var lay=el('div','play');lay.append(left,low,tower(m,ch==null?m-1:m,anim.fresh,anim.gone));
  anim={fresh:null,gone:null};
  app.append(lay);
}

function later(){
  app.innerHTML='';
  var n=st.buy.filter(function(v){return v===true}).length;
  app.append(el('p','case','只看，不用選'),el('h2',null,'6 個月過完了。<br>接下來的 7～9 月呢？'),
    el('p','lead',n?'7 月以後不會再出現新東西，你也不用再做決定。可是之前買的分期，有些還沒付完。':'你這 6 個月都沒有買，所以 7～9 月也沒有帳單。'));
  var g=el('div','mon3');
  for(var k=6;k<9;k++){var c=el('div','card');var b=bill(k);
    c.append(el('p','scene',MN(k)+'：'+b+' 元'));
    var a=active(k,5);var w=el('div');
    if(!a.length)w.appendChild(el('p','lead','沒有帳單'));
    a.forEach(function(i){var ch=el('span','chip',IT[i].nm+' '+IT[i].per);ch.style.background=IT[i].c;w.appendChild(ch)});
    c.append(w,el('p','money',leftTxt(b)));g.appendChild(c)}
  app.append(g,el('p','lead','1～9 月，每個月要付的帳單：'),calendar(9,null),
    B('下一步',null,function(){st.step=3;go()}));
}

function q1(){
  app.innerHTML='';
  var bs=[];for(var k=0;k<9;k++)bs.push(bill(k));var mx=Math.max.apply(null,bs);
  app.append(el('p','case','第 1 題，沒有對錯'),el('h2',null,'你覺得哪一個月最辛苦？'),
    el('p','lead','下面是 1～9 月每個月要付的帳單。'+(mx>0?'帳單最多的月份標成紅色。':'')+'點一個你覺得最辛苦的月份。'));
  var g=el('div','cal nine');
  bs.forEach(function(b,k){var cls='cell btn'+(b===mx&&mx>0?' hot':'')+(st.q1===k?' alt pick':'');
    var bt=B(MN(k)+'<b>'+b+'</b>',cls,function(){st.q1=k;go()});g.appendChild(bt)});
  app.appendChild(g);
  if(st.q1!=null){var b=bs[st.q1];
    app.append(el('p','note',MN(st.q1)+'要付 <b>'+b+'</b> 元的帳單。'+leftTxt(b)+'<br><span style="font-size:.85em;color:var(--muted)">想換一個月份也可以，直接點別的月份。</span>'),
      B('下一題',null,function(){st.step=4;go()}));}
}

function q2(){
  app.innerHTML='';
  var got=[];st.buy.forEach(function(v,i){if(v===true)got.push(i)});
  app.append(el('p','case','第 2 題，沒有對錯'),el('h2',null,'你買過的東西裡，哪一樣你最不想再付錢了？'));
  if(!got.length){
    app.append(el('p','note','你這 6 個月都沒有用「先買後付」，所以沒有要付的分期。'),B('看看我的紀錄',null,function(){st.q2=-1;st.step=5;go()}));return}
  var g=el('div','opts');
  got.forEach(function(i){var x=IT[i];g.appendChild(B(x.nm+'（每月 '+x.per+' 元，付 '+x.n+' 個月）','btn alt'+(st.q2===i?' pick':''),function(){st.q2=i;go()}))});
  app.append(el('p','lead','選你心裡最先想到的那一樣。'),g);
  if(st.q2!=null&&st.q2>=0){
    app.append(el('p','note','很多人會選已經用完的東西，例如手遊點數、抓娃娃。<br><span style="font-size:.85em;color:var(--muted)">想換一樣也可以，直接點別的東西。</span>'),
      B('看看我的紀錄',null,function(){st.step=5;go()}));}
}

function end(){
  app.innerHTML='';
  var bs=[];for(var k=0;k<9;k++)bs.push(bill(k));var mx=Math.max.apply(null,bs);
  var n=st.buy.filter(function(v){return v===true}).length;
  var over=bs.filter(function(b){return b>POCKET}).length;
  var mxm=mx>0?bs.map(function(b,k){return b===mx?MN(k):null}).filter(Boolean).join('、')+'，'+mx+' 元':'沒有帳單';
  var rows=[['我買了幾樣（共 6 樣）',n+' 樣'],['帳單最多的月份',mxm],['零用錢不夠付的月份',over+' 個月'],
    ['第 1 題：我覺得最辛苦的月份',st.q1!=null?MN(st.q1)+'（'+bs[st.q1]+' 元）':'—'],
    ['第 2 題：最不想再付錢的',st.q2==null?'—':st.q2<0?'沒有買東西':IT[st.q2].nm]];
  var t=el('table');rows.forEach(function(r){var tr=el('tr');tr.append(el('td','k',r[0]),el('td','n',r[1]));t.appendChild(tr)});
  var c=el('div','card');c.append(t,el('p','lead','1～9 月，每個月要付的帳單：'),calendar(9,null));
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}

function render(){[intro,month,later,q1,q2,end][st.step]?[intro,month,later,q1,q2,end][st.step]():intro()}
render();
})();
</script>
