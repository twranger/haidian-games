<meta charset="utf-8">
<script src="fresh.js"></script>
<title>猜猜是哪一簍</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: harbour story + two baskets drawn as 10-crab grids → play page (basket scene with hand animation on the left, a vertical "confidence flagpole" on the right, tray of drawn crabs below; flag must be re-set after every draw) → reveal (a second, computed flag climbs crab by crab to 97 % beside the student's flag, plain-words explanation) → the student's 13 flags as a small line chart with reference lines and three neutral shape descriptions → one reflection question (each option shows only its effect) → summary for a show of hands. Fixed script (left basket, 8 red / 4 flower), no randomness. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --lt:#F6DCCF; --rt:#DCE8F0; --myf:#F3D27A; --cf:#2F7D4F;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:20px 36px;display:flex;flex-direction:column;gap:14px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.6vw,32px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4}
.lead{font-size:clamp(19px,2.6vw,24px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px;min-width:0}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;justify-content:flex-start;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.soft{background:var(--card);color:var(--sea);border:3px solid var(--sea)}
.btn:focus-visible,.ptrack:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.5vw,23px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
.hint{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn svg.i{width:1.5em;height:1.5em}
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;border-radius:50%;color:#fff;font-weight:900;font-size:.9em;flex:none;line-height:1;background:var(--sea)}
.L{color:var(--rust);font-weight:900}.R{color:var(--sea);font-weight:900}
.say{display:flex;gap:14px;align-items:center}
.say .av{width:72px;height:72px;flex:none}
.say p{margin:0}
.bub{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 16px;font-size:clamp(19px,2.5vw,23px);font-weight:700;position:relative}
/* intro */
.harbor{width:100%;height:auto;display:block;border-radius:18px;border:3px solid var(--line);background:#E3EFF4}
.bk2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bk{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;min-width:0}
.bk.l{border-top:8px solid var(--rust)}.bk.r{border-top:8px solid var(--sea)}
.bk h3{display:flex;align-items:center;gap:6px}
.bk h3 svg.i{width:40px;height:40px}
.g10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%;max-width:300px}
.g10 span{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.g10 span.cr{background:#FCEDE6}.g10 span.cf{background:#EEF3FA}
.g10 svg.i{width:84%;height:84%}
.bk p{margin:0;font-size:clamp(19px,2.3vw,22px);line-height:1.5}
.key{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:clamp(19px,2.3vw,22px)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key svg.i{width:40px;height:40px}
/* play */
.play{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.lcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.sbox{position:relative;background:#E3EFF4;border:3px solid var(--line);border-radius:20px;overflow:hidden}
.scene{width:100%;height:auto;display:block}
.pop{position:absolute;left:4%;top:6%;transform:scale(.6);transform-origin:0 0;opacity:0;background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:clamp(21px,3vw,28px);white-space:nowrap;pointer-events:none;box-shadow:0 5px 0 rgba(31,42,46,.2);transition:opacity .25s,transform .25s}
.pop.on{opacity:1;transform:scale(1)}
.pop svg.i{width:58px;height:58px}
.status{min-height:3.4em}
.status b{font-weight:900}
.cnt{font-variant-numeric:tabular-nums}
/* tray */
.tray h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tray h3 small{font-size:clamp(19px,2.2vw,21px);color:var(--muted);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.slot{border:2px dashed var(--line);border-radius:12px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0;position:relative;transition:background .25s,border-color .25s,box-shadow .25s}
.slot .no{position:absolute;top:1px;left:5px;font-size:15px;line-height:1.2;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.slot svg.i{width:40px;height:40px;margin-top:8px}
.slot em{font-style:normal;font-weight:900;font-size:16px;line-height:1.2}
.slot.cr{border:2px solid #E5B7A4;background:#FCEDE6}.slot.cr em{color:var(--rust)}
.slot.cf{border:2px solid #B9CDE4;background:#EEF3FA}.slot.cf em{color:var(--sea)}
.slots.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.slot.new{animation:slotin .45s ease-out}
.slot.hl{box-shadow:0 0 0 4px var(--cf);border-color:var(--cf)}
@keyframes slotin{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
/* pole */
.rcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.polebox{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px 10px 12px}
.pcap{font-weight:900;font-size:19px;line-height:1.3;border-radius:12px;padding:3px 10px;white-space:nowrap}
.pcap.t{background:var(--lt);color:var(--rust)}.pcap.b{background:var(--rt);color:var(--sea)}
.ptrack{--lw:84px;--cw:0px;--mw:14px;--fw:74px;position:relative;height:var(--ph,440px);width:calc(var(--lw) + var(--cw) + var(--mw) + var(--fw) + 6px);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;margin:34px 0 18px}
.ptrack.comp{--cw:86px}
.ptrack .mast{position:absolute;top:-12px;bottom:-12px;left:calc(var(--lw) + var(--cw));width:var(--mw);border:2.5px solid var(--ink);border-radius:7px;background:linear-gradient(var(--lt) 0 50%,var(--rt) 50% 100%)}
.ptrack .ball{position:absolute;top:-30px;left:calc(var(--lw) + var(--cw) + var(--mw)/2 - 10px);width:20px;height:20px;border-radius:50%;background:var(--myf);border:2.5px solid var(--ink)}
.ptrack .tk{position:absolute;left:0;width:calc(var(--lw) - 8px);transform:translateY(-50%);text-align:right;font-size:19px;font-weight:700;color:var(--muted);line-height:1.2;white-space:nowrap}
.ptrack .tk.mid{color:var(--ink);font-weight:900}
.ptrack .tk.end{color:var(--ink);font-weight:900}
.ptrack .gl{position:absolute;left:calc(var(--lw) - 4px);right:0;height:0;border-top:2px dotted #C9CFC7;pointer-events:none}
.ptrack .gl.mid{border-top:2px solid #AEB5AC}
.ptrack .tm{position:absolute;left:calc(var(--lw) + var(--cw) - 6px);width:calc(var(--mw) + 12px);height:3px;margin-top:-1.5px;background:var(--ink);border-radius:2px;pointer-events:none}
.flag{position:absolute;width:var(--fw);height:44px;transform:translateY(-50%);transition:top .28s ease-out;pointer-events:none;display:flex;align-items:center}
.flag svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flag span{position:relative;font-weight:900;font-size:17px;line-height:1;padding-left:8px;white-space:nowrap}
.flag.my{left:calc(var(--lw) + var(--cw) + var(--mw) - 1px);pointer-events:auto;cursor:grab}
.flag.my.off{pointer-events:none}
.flag.cp{left:calc(var(--lw) + 1px);width:calc(var(--cw) - 2px)}
.flag.cp span{color:#fff;padding-left:16px;font-size:16px}
.flag.my.pend svg path{stroke-dasharray:6 5;fill:#FBF4E2}
.flag.my.pend{animation:wob 1.3s ease-in-out infinite}
@keyframes wob{0%,100%{margin-left:0}50%{margin-left:5px}}
.flag.off{opacity:0}
.ptrack.drag .flag{transition:none}
.ptrack.lock{cursor:default}
.ptrack .start{position:absolute;left:calc(var(--lw) + var(--cw) + var(--mw) + 4px);top:50%;transform:translateY(-50%);background:var(--warm);border:3px dashed var(--gold);border-radius:12px;padding:4px 6px;font-size:17px;font-weight:900;line-height:1.3;width:calc(var(--fw) + 4px);text-align:center;pointer-events:none;animation:pul 1.4s ease-in-out infinite}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.55}}
.readout{text-align:center;font-size:19px;line-height:1.4;margin:0}
.readout b{display:block;font-size:clamp(21px,2.6vw,24px)}
.keep{font-size:19px;padding:8px 12px;border-radius:14px;max-width:190px}
@media (prefers-reduced-motion:reduce){.flag,.slot,.pop{transition:none!important;animation:none!important}}
/* reveal */
.rev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp2 div{border-radius:16px;padding:10px 14px;border:3px solid var(--line);background:var(--card)}
.cmp2 .m{border-color:var(--gold);background:var(--warm)}
.cmp2 .c{border-color:var(--cf);background:#E8F2EC}
.cmp2 small{display:block;font-size:19px;color:var(--muted);font-weight:700}
.cmp2 b{font-size:clamp(22px,3vw,28px)}
.steps4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.steps4 div{border:3px solid var(--line);border-radius:16px;padding:8px;text-align:center;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:19px;line-height:1.4}
.steps4 .rr{display:flex;gap:0;flex-wrap:wrap;justify-content:center;min-height:30px}
.steps4 .rr svg.i{width:28px;height:28px}
.steps4 b{font-size:clamp(21px,2.8vw,26px);color:var(--rust)}
.steps4 div:last-child{border-color:var(--rust);background:#FCEDE6}
.dots{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px;max-width:520px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--lt);border:2.5px solid var(--rust)}
.dots i.r{background:var(--rt);border-color:var(--sea)}
.dkey{display:flex;gap:16px;flex-wrap:wrap;font-size:19px;font-weight:700}
.dkey span{display:inline-flex;align-items:center;gap:6px}
.dkey i{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--lt);border:2.5px solid var(--rust)}
.dkey i.r{background:var(--rt);border-color:var(--sea)}
.fade{animation:fadein .5s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* track */
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;gap:4px 8px}
.ylab{display:flex;flex-direction:column;justify-content:space-between;font-size:19px;font-weight:700;line-height:1.2;text-align:right;padding:2px 0}
.ylab .t{color:var(--rust)}.ylab .b{color:var(--sea)}.ylab .m{color:var(--ink)}
.chart svg{width:100%;height:auto;display:block;background:#FDFDFB;border:2px solid var(--line);border-radius:12px}
.xlab{grid-column:2;display:flex;justify-content:space-between;font-size:19px;color:var(--muted);font-weight:700}
.lgd{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:19px;font-weight:700}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd svg{width:36px;height:12px}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kind{border:3px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.kind svg{width:100%;height:auto;display:block}
.kind h3{font-size:clamp(20px,2.4vw,23px)}
.kind p{margin:0;font-size:19px;line-height:1.55;color:var(--muted)}
.kind.me{border-color:var(--gold);background:var(--warm);box-shadow:0 0 0 3px var(--myf)}
.kind .tag{display:inline-block;align-self:flex-start;background:var(--gold);color:#fff;font-weight:900;font-size:19px;border-radius:10px;padding:0 10px}
/* end */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
.sum td:first-child{color:var(--muted);font-weight:700;width:44%}
.sum td b{font-size:1.1em}
.ec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6}
.ec dt{font-weight:900;white-space:nowrap;color:var(--good)}
.ec dd{margin:0}
@media (max-width:760px){
  .rev{grid-template-columns:minmax(0,1fr)}
  .rev .rcol{order:-1}
  .kinds{grid-template-columns:1fr}
  .kind{flex-direction:row;align-items:center;gap:12px}
  .kind svg{width:110px;flex:none}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .play{gap:8px}
  .ptrack{--lw:62px;--fw:62px;--mw:12px;height:var(--ph,400px)}
  .ptrack.comp{--cw:76px}
  .pop{top:auto;bottom:4%;padding:4px 10px 4px 6px}
  .pop svg.i{width:42px;height:42px}
  .ptrack .tk{font-size:19px;letter-spacing:-1px}
  .ptrack .tk.mid span{display:block;line-height:1.1}
  .flag span{font-size:16px;padding-left:6px}
  .polebox{padding:8px 4px 10px}
  .pcap{font-size:18px;padding:2px 6px}
  .slots{grid-template-columns:repeat(6,minmax(0,1fr))}
  .status{min-height:0}
  .bk{padding:10px 6px}
  .bk h3 svg.i{width:32px;height:32px}
  .cmp2{grid-template-columns:1fr}
  .sum td:first-child{width:auto}
  .sum,.sum tbody,.sum tr,.sum td{display:block}
  .sum td{border:0;padding:2px 0}
  .sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ec{grid-template-columns:1fr;gap:0}
  .ec dd{margin-bottom:6px}
  .say .av{width:58px;height:58px}
  .dots{grid-template-columns:repeat(11,minmax(0,1fr))}
  .keep{max-width:150px}
}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

function flagSVG(dir,fill,stroke){

function makePole(opt){
  var box=el('div','polebox');
  box.append(el('div','pcap t','一定是左簍'));
  var tr=el('div','ptrack'+(opt.comp?' comp':''));
  if(opt.h)tr.style.setProperty('--ph',opt.h+'px');
  tr.append(el('div','mast'),el('div','ball'));
  for(var v=100;v>=0;v-=10){
    var top=(100-v)+'%';
    var g=el('div','gl'+(v===50?' mid':''));g.style.top=top;tr.append(g);
    var tm=el('div','tm');tm.style.top=top;tr.append(tm);
    var lab=v===50?'<span>一半</span><span>一半</span>':cn(v>50?v:100-v);
    var t=el('div','tk'+(v===50?' mid':'')+(v===100||v===0?' end':''),lab);t.style.top=top;t.setAttribute('data-v',v);tr.append(t);
  }
  var cp=null;
  if(opt.comp){cp=el('div','flag cp',flagSVG(-1,'#2F7D4F','#1E5233')+'<span>算出來</span>');cp.style.top='50%';tr.append(cp)}
  var my=el('div','flag my',flagSVG(1,'#F3D27A','#1F2A2E')+'<span>你的</span>');tr.append(my);
  var start=el('div','start','點一下<br>升旗');tr.append(start);
  box.append(tr);
  box.append(el('div','pcap b','一定是右簍'));
  tr.setAttribute('role','slider');tr.setAttribute('aria-label','你的把握：越高越覺得是左簍，越低越覺得是右簍');
  tr.setAttribute('aria-valuemin','0');tr.setAttribute('aria-valuemax','100');
  var api={el:box,track:tr,locked:!opt.interactive,onSet:null,
    setMy:function(v,pend){
      if(v==null){my.classList.add('off');start.style.display=opt.interactive?'':'none';tr.removeAttribute('aria-valuenow');tr.setAttribute('aria-valuetext','還沒升旗')}
      else{my.classList.remove('off');start.style.display='none';my.style.top=(100-v)+'%';tr.setAttribute('aria-valuenow',Math.round(v));tr.setAttribute('aria-valuetext',pos(v))}
      my.classList.toggle('pend',!!pend);
    },
    setComp:function(v){if(cp)cp.style.top=(100-v)+'%'},
    lock:function(b){api.locked=b;tr.classList.toggle('lock',b);tr.tabIndex=b?-1:0}
  };
  api.lock(!opt.interactive);
  if(opt.interactive){
    var down=false,moved=false,sy=0,tgt=null,tkv=null;
    function fromY(y){var r=tr.getBoundingClientRect();var v=100-(y-r.top)/r.height*100;v=Math.round(v/5)*5;return Math.max(0,Math.min(100,v))}
    function emit(v){if(api.onSet)api.onSet(v)}
    tr.addEventListener('pointerdown',function(e){
      if(api.locked||e.button>0)return;down=true;moved=false;sy=e.clientY;
      var tk=e.target.closest('.tk');tgt=tk?'tk':(e.target.closest('.flag.my')?'flag':null);tkv=tk?+tk.getAttribute('data-v'):null;
      try{tr.setPointerCapture(e.pointerId)}catch(_){}
      if(!tgt)emit(fromY(e.clientY));
      tr.classList.add('drag');e.preventDefault();
    });
    tr.addEventListener('pointermove',function(e){
      if(!down||api.locked)return;
      if(!moved&&Math.abs(e.clientY-sy)>5)moved=true;
      if(moved)emit(fromY(e.clientY));
    });
    function up(e,cancel){
      if(!down)return;down=false;tr.classList.remove('drag');
      if(cancel||moved||api.locked)return;
      if(tgt==='tk'){emit(tkv)}
      else if(tgt==='flag'){emit(api.cur!=null?api.cur:fromY(e.clientY))}
    }
    tr.addEventListener('pointerup',function(e){up(e,false)});
    tr.addEventListener('pointercancel',function(e){up(e,true)});
    tr.addEventListener('keydown',function(e){
      if(api.locked)return;var v=api.cur==null?50:api.cur;
      if(e.key==='ArrowUp'||e.key==='ArrowRight'){emit(Math.min(100,v+5));e.preventDefault()}
      else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){emit(Math.max(0,v-5));e.preventDefault()}
      else if(e.key==='Home'){emit(100);e.preventDefault()}else if(e.key==='End'){emit(0);e.preventDefault()}
      else if(e.key==='Enter'||e.key===' '){emit(v);e.preventDefault()}
    });
  }
  return api;
}

    else{
      var last=SEQ[k-1];
      status.innerHTML='第 '+k+' 隻是<b class="'+(last==='R'?'L':'R')+'">'+crabName(last)+'</b>。看完已經放回去、搖一搖了。'+(pend?'<br>不想移，就點一下旗子，或按「旗子不動」。':'');
    }
    drawB.style.display=k<12?'':'none';drawB.disabled=busy||pend;
    doneB.style.display=k===12?'':'none';doneB.disabled=busy||pend;
    keep.style.display=(!busy&&pend&&prev!=null)?'':'none';
    ro.innerHTML='你的旗子<b>'+(cur!=null?posH(cur):(prev!=null?'等你重新升旗':'還沒升旗'))+'</b>';
    th.innerHTML='摸到的螃蟹 <small>紅蟳 '+c.r+' 隻、花蟹 '+c.f+' 隻</small>';
    slots.innerHTML=slotsHTML(k);
    if(newSlot!=null){var sl=slots.querySelector('[data-i="'+newSlot+'"]');if(sl)sl.classList.add('new')}
  }
  function A(elm,frames,ms){return new Promise(function(res){if(RM||!elm.animate){var f=frames[frames.length-1];for(var p in f)elm.style[p]=f[p];res();return}var a=elm.animate(frames,{duration:ms,easing:'ease-in-out',fill:'forwards'});a.onfinish=function(){var f=frames[frames.length-1];for(var p in f)elm.style[p]=f[p];try{a.cancel()}catch(_){}res()}})}
  function wait(ms){return new Promise(function(r){setTimeout(r,RM?0:ms)})}
  function shake(){return A(bkg,[{transform:'rotate(0deg)'},{transform:'rotate(-3deg)'},{transform:'rotate(3deg)'},{transform:'rotate(-2deg)'},{transform:'rotate(0deg)'}],420)}
  function draw(){
    if(busy||st.n>=12||st.s[st.n]==null)return;
    var k=st.n,c=SEQ[k];
    st.n=k+1;save(st);
    busy=true;upd();
    held.innerHTML=heldCrab(c);held.setAttribute('opacity','0');
    A(arm,[{transform:'translate(0px,-300px)'},{transform:'translate(0px,0px)'}],650)
    .then(shake)
    .then(function(){held.setAttribute('opacity','1');return A(arm,[{transform:'translate(0px,0px)'},{transform:'translate(0px,-118px)'}],550)})
    .then(function(){pop.innerHTML=crabIc(c)+'<span class="'+(c==='R'?'L':'R')+'">'+crabName(c)+'！</span>';pop.classList.add('on');busy=false;upd(k);return wait(900)})
    .then(function(){pop.classList.remove('on');setTimeout(function(){if(!pop.classList.contains('on'))pop.innerHTML=''},RM?0:300);return A(arm,[{transform:'translate(0px,-118px)'},{transform:'translate(0px,0px)'}],380)})
    .then(function(){held.setAttribute('opacity','0');return Promise.all([shake(),A(arm,[{transform:'translate(0px,0px)'},{transform:'translate(0px,-300px)'}],460)])});
  }
  upd();
}

/* ---------- reveal ---------- */
function revealPage(){
  var my=st.s[12];
  app.append(el('p','case','揭曉'));
  app.append(el('h2',null,'算出來的旗子，會升到哪裡？'));
  var rev=el('div','rev');var l=el('div','lcol');var r=el('div','rcol');
  var pole=makePole({interactive:false,comp:true,h:420});pole.setMy(my,false);
  r.append(pole.el);
  var cmp=el('div','cmp2');
  var cv=el('b');
  cmp.append(el('div','m','<small>你最後的旗子</small><b>'+posH(my)+'</b>'));
  var cd=el('div','c');cd.append(el('small',null,'算出來的旗子'),cv);cmp.append(cd);
  var tray=el('div','card tray');tray.append(el('h3',null,'算出來的旗子，也是一隻一隻跟著螃蟹走 <small>紅蟳 8 隻、花蟹 4 隻</small>'));
  var slots=el('div','slots six');tray.append(slots);
  var more=el('div');
  l.append(cmp,tray,more);
  rev.append(l,r);app.append(rev);
  var nx=button(ic('trend')+'看看你的旗子是怎麼走的','btn',function(){go('track')});
  var again=button('再看一次算出來的旗子','btn soft',function(){run()});
  app.append(nx);
  function setC(k){pole.setComp(COMP[k]);cv.innerHTML=posH(COMP[k]);slots.innerHTML=slotsHTML(12,k>0?k-1:null)}
  var timer=null;
  function run(){
    if(timer)clearTimeout(timer);more.innerHTML='';nx.disabled=true;again.disabled=true;
    var k=0;setC(0);
    (function step(){k++;if(k>12){finish();return}setC(k);timer=setTimeout(step,RM?0:520)})();
  }
  function finish(){st.rev=true;save(st);setC(12);slots.innerHTML=slotsHTML(12);explain();nx.disabled=false;again.disabled=false}
  function explain(){
    more.innerHTML='';
    var c=el('div','card fade');
    c.append(el('h3',null,'為什麼算出來這麼有把握？'));
    c.append(el('p','note','左簍紅蟳多，右簍花蟹多。所以每摸到一隻<b class="L">紅蟳</b>，是左簍的機會就<b>變大一點</b>；每摸到一隻<b class="R">花蟹</b>，是右簍的機會就變大一點。'));
    c.append(el('p','note','一隻紅蟳和一隻花蟹，剛好互相抵消。你摸到 8 隻紅蟳、4 隻花蟹，抵消掉 4 對以後，<b>還多出 4 隻紅蟳</b>。'));
    var s4=el('div','steps4');
    var lab=['2 倍多','5 倍多','12 倍多','30 倍'];
    for(var i=1;i<=4;i++){var rr='';for(var j=0;j<i;j++)rr+=ic('basket_red');s4.append(el('div',null,'<span class="rr">'+rr+'</span>多 '+i+' 隻紅蟳<span>左簍的機會大約是右簍的</span><b>'+lab[i-1]+'</b>'))}
    c.append(s4);
    var dots='';for(var d=0;d<31;d++)dots+='<i'+(d===30?' class="r"':'')+'></i>';
    c.append(el('p','note warm','30 倍是什麼意思？想像有 <b>31 個小朋友</b>，每個人都拿到一簍，也都剛好摸到 8 隻紅蟳、4 隻花蟹。大約 <b>30 個人</b>手上的是<b class="L">左簍</b>，只有 <b>1 個人</b>是<b class="R">右簍</b>。'));
    c.append(el('div','dots',dots));
    c.append(el('div','dkey','<span><i></i>拿到左簍的人</span><span><i class="r"></i>拿到右簍的人</span>'));
    c.append(el('p','note','所以，算出來的旗子升到<b>接近十成的「九成七」</b>。一條一條的小線索加起來，可以讓人變得非常有把握。'));
    var d=my-FINAL,cmpTxt;
    if(Math.abs(d)<2.5)cmpTxt='你的旗子和算出來的<b>幾乎一樣高</b>。';
    else if(d<0)cmpTxt='你的旗子比算出來的<b>低了大約'+diffTxt(my)+'</b>。';
    else cmpTxt='你的旗子比算出來的<b>高了大約'+diffTxt(my)+'</b>：你放在十成，算出來還留著一點點「可能是右簍」的空間。';
    c.append(el('p','note warm',cmpTxt));
    var say=el('div','say');say.innerHTML=av('grandpa');say.append(el('p','bub','阿伯把布掀開：「這一簍，是左簍喔！」'));
    c.append(say);
    more.append(c,again);
  }
  if(st.rev){finish()}else{setC(0);setTimeout(run,RM?0:600)}
}

/* ---------- track ---------- */
function spark(v,w,hgt,color,dash,dots){
  var pts=v.map(function(x,i){return [(i/12*(w-16)+8).toFixed(1),(8+(100-x)/100*(hgt-16)).toFixed(1)]});
  var s='<polyline points="'+pts.map(function(p){return p.join(',')}).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="'+(dots?4:3.5)+'" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="9 7"':'')+'/>';
  if(dots)pts.forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="#F3D27A" stroke="#1F2A2E" stroke-width="2.5"/>'});
  return s;
}
function trackPage(){
  var s=st.s,k=kindOf(s);
  app.append(el('p','case',ic('trend')+'你的 13 次升旗'));
  app.append(el('h2',null,'你的旗子一路是怎麼走的？'));
  var c=el('div','card');
  var W=window.innerWidth<560?300:420,H=240;
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="你 13 次升旗的高度折線圖">';
  g+='<rect x="0" y="0" width="'+W+'" height="'+(H/2)+'" fill="#FCF1EC"/><rect x="0" y="'+(H/2)+'" width="'+W+'" height="'+(H/2)+'" fill="#F0F5FA"/>';
  for(var i=0;i<=12;i++){var x=(i/12*(W-16)+8).toFixed(1);g+='<path d="M'+x+' 4V'+(H-4)+'" stroke="#E3E6E0" stroke-width="1.5"/>'}
  g+='<path d="M0 '+(H/2)+'H'+W+'" stroke="#8E968C" stroke-width="2.5"/>';
  g+=spark(COMP,W,H,'#2F7D4F',true,false);
  g+=spark(s,W,H,'#B7862B',false,true);
  g+='</svg>';
  var ch=el('div','chart');
  ch.append(el('div','ylab','<span class="t">左簍<br>十成</span><span class="m">一半<br>一半</span><span class="b">右簍<br>十成</span>'));
  ch.append(el('div',null,g));
  ch.append(el('div','xlab','<span>摸之前</span><span>第 6 隻</span><span>第 12 隻</span>'));
  c.append(ch);
  c.append(el('div','lgd','<span><svg viewBox="0 0 36 12"><path d="M2 6H34" stroke="#B7862B" stroke-width="4"/><circle cx="18" cy="6" r="4.5" fill="#F3D27A" stroke="#1F2A2E" stroke-width="2"/></svg>你的旗子</span><span><svg viewBox="0 0 36 12"><path d="M2 6H34" stroke="#2F7D4F" stroke-width="3.5" stroke-dasharray="7 5"/></svg>參考線：算出來的旗子</span><span><svg viewBox="0 0 36 12"><path d="M2 6H34" stroke="#8E968C" stroke-width="2.5"/></svg>一半一半</span>'));
  var hi=Math.max.apply(null,s),lo=Math.min.apply(null,s),drops=0;for(var j=1;j<=12;j++)if(s[j]<s[j-1])drops++;
  c.append(el('p','note','你的旗子：摸之前在<b>'+pos(s[0])+'</b>，最高到<b>'+pos(hi)+'</b>，最低到<b>'+pos(lo)+'</b>，最後停在<b>'+pos(s[12])+'</b>。12 次裡面，有 <b>'+drops+'</b> 次往下拉。'));
  app.append(c);
  app.append(el('h3',null,'旗子的走法，大致有這幾種：'));
  var ks=el('div','kinds');var list=['still','jump','up'];if(k==='down')list.push('down');
  list.forEach(function(key){
    var K=KIND[key],me=key===k;
    var sv='<svg viewBox="0 0 120 64" aria-hidden="true"><rect width="120" height="64" rx="8" fill="#FDFDFB" stroke="#D4D9D2" stroke-width="2"/><path d="M0 32H120" stroke="#AEB5AC" stroke-width="2"/>'+spark(K.ex,120,64,me?'#B7862B':'#56605C',false,false)+'</svg>';
    var d=el('div','kind'+(me?' me':''));
    d.innerHTML=sv+'<div>'+(me?'<span class="tag">你比較像這一種</span>':'')+'<h3>'+K.n+'</h3><p>'+K.d+'</p></div>';
    ks.append(d);
  });
  app.append(ks);
  app.append(el('p','note warm','每一種走法都很常見，沒有誰對誰錯。等一下老師會問大家：你的旗子比較像哪一種？為什麼你會這樣移？'));
  app.append(button(ic('think')+'最後一題','btn',function(){go('reflect')}));
}

/* ---------- reflection (no forced answer) ---------- */
var RF={
  A:{n:'旗子不動',e:'你把「6 隻紅蟳、6 隻花蟹」看成兩邊一樣多、互相抵消。前面 12 隻留下來的線索，你都還算進去。'},
  B:{n:'往中間調一點',e:'你把這 12 隻當成一個提醒：「好像沒有那麼確定。」旗子降下來一點，留一點空間，等更多線索再決定。'},
  C:{n:'直接改成右簍',e:'你讓最新的這一次決定一切。前面摸到的 8 隻紅蟳、4 隻花蟹，就先不算了。'}
};
function reflectPage(){
  app.append(el('p','case',ic('think')+'最後一題'));
  app.append(el('h2',null,'如果再摸 12 次，結果是 6 隻紅蟳、6 隻花蟹，你會怎麼調旗子？'));
  app.append(el('p','lead','這一題<b>沒有標準答案</b>。選好以後，會看到這個選擇的作用，等一下全班一起討論。'));
  var o=el('div','opts');var bs={};var fb=el('div');
  ['A','B','C'].forEach(function(k){var b=button('<span class="lt">'+k+'</span><span>'+RF[k].n+'</span>','btn alt'+(st.r===k?' pick':''),function(){st.r=k;save(st);upd()});bs[k]=b;o.append(b)});
  var nx=button('完成','btn',function(){if(st.r)go('end')});
  app.append(o,fb,nx);
  function upd(){
    Object.keys(bs).forEach(function(k){bs[k].classList.toggle('pick',st.r===k);bs[k].setAttribute('aria-pressed',st.r===k?'true':'false')});
    fb.innerHTML='';nx.disabled=!st.r;
    if(st.r){var m=RF[st.r];var c=el('div','card');c.append(el('h3',null,st.r+'　'+m.n));c.append(el('dl','ec','<dt>作用</dt><dd>'+m.e+'</dd>'));fb.append(c)}
  }
  upd();
}

/* ---------- end ---------- */
function endPage(){
  app.append(el('h1',null,'做完了！請停在這一頁，等其他同學。'));
  var my=st.s[12],k=kindOf(st.s);
  var dir=Math.abs(my-FINAL)<2.5?'（幾乎一樣）':(my<FINAL?'（比算出來的低）':'（比算出來的高）');
  var rows=[
    ['摸完 12 次，你的旗子',posH(my)],
    ['算出來的旗子','<span class="L">左簍</span> 九成七（接近十成）'],
    ['差了幾成',diffTxt(my)==='不到半成'?'不到半成（幾乎一樣）':'大約'+diffTxt(my)+dir],
    ['你的軌跡',KIND[k].n],
    ['再摸 6 紅 6 花，你會',st.r+'　'+RF[st.r].n]
  ];
  var c=el('div','card');var tb=el('table','sum');
  tb.innerHTML='<tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>'}).join('')+'</tbody>';
  c.append(tb);app.append(c);
  app.append(el('p','note warm','老師等一下會請大家舉手：最後的旗子在九成以上的有幾個人？七、八成的呢？一半附近的呢？'));
}

function render(){
  app.innerHTML='';
  var s=st.step,done=st.n===12&&st.s[12]!=null;
  if(s==='intro')intro();
  else if(s==='play')playPage();
  else if(s==='reveal'&&done)revealPage();
  else if(s==='track'&&done)trackPage();
  else if(s==='reflect'&&done)reflectPage();
  else if(s==='end'&&done&&st.r)endPage();
  else{st=fresh();save(st);intro()}
}
render();
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}st=fresh();save(st);render();try{window.scrollTo(0,0)}catch(e){}}});
})();
</script>
