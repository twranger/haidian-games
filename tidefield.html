<title>一塊地三條路</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#FAF7F2; --card:#FFFFFF; --ink:#1E242B; --muted:#475569; --line:#E3DED7;
  --coral:#D95D39; --teal:#2A6F68; --lc:#FFF5F2; --lt:#F0F7F6;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,48px);font-weight:900;margin:0;line-height:1.3}
h2{font-size:clamp(23px,3.8vw,32px);font-weight:900;margin:0;line-height:1.45}
.kick{font-size:clamp(17px,2.3vw,20px);font-weight:700;color:var(--coral);letter-spacing:2px;margin:0}
.lead{font-size:clamp(19px,2.7vw,24px);color:var(--muted);margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 24px rgba(30,36,43,.06);padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,24px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--coral);color:#fff;cursor:pointer;line-height:1.45}
.btn.teal{background:var(--teal)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;font-weight:700}
.btn.alt.pick{border-color:var(--coral);background:var(--lc)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.note{background:var(--lt);border-radius:16px;padding:14px 18px;font-size:clamp(18px,2.6vw,23px);line-height:1.7;margin:0}
.note.warm{background:var(--lc)}
.row{display:flex;gap:12px;align-items:center}
.ico{flex:none;display:flex}
table{border-collapse:collapse;width:100%;font-size:clamp(17px,2.4vw,21px)}
th,td{padding:9px 6px;border-bottom:2px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--muted);font-weight:700}
.big{font-size:clamp(40px,8vw,64px);font-weight:900;color:var(--coral);margin:0;line-height:1.1;font-variant-numeric:tabular-nums}
.drag-ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%);opacity:.9}
details{background:var(--lt);border-radius:16px;padding:12px 16px;font-size:clamp(18px,2.5vw,22px)}
summary{font-weight:900;cursor:pointer}
td:first-child{white-space:nowrap}
@media (max-width:480px){table{font-size:16px}th,td{padding:8px 4px}}

.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tok{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 6px;font-size:clamp(19px,2.6vw,23px);font-weight:900;color:var(--ink);cursor:grab;user-select:none}
.tok.chosen{border-color:var(--coral);background:var(--lc)}
.plot{border:3px dashed var(--teal);border-radius:20px;background:var(--lt);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;font-size:clamp(18px,2.5vw,22px);color:var(--teal);font-weight:700}
.plot.over{background:#DCEFEC}
.weather{display:flex;gap:14px;align-items:center}
.weather p{font-size:clamp(21px,3vw,27px);font-weight:900;margin:0;line-height:1.5}
.baskets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bk{border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(17px,2.3vw,20px)}
.bk.mine{background:var(--lc);border:3px solid var(--coral)}
.bk.ghost{background:var(--card);border:3px dashed #B9B2A8;color:var(--muted)}
.bk b{font-size:clamp(28px,5vw,40px);line-height:1.2;color:var(--ink)}
.bk.ghost b{color:var(--muted)}
.tag{font-size:clamp(15px,2vw,18px);font-weight:900;border-radius:999px;padding:2px 10px}
.mine .tag{background:var(--coral);color:#fff}.ghost .tag{background:var(--line);color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
</style>
<main class="wrap" id="app" aria-live="polite"></main>

// 拖曳小工具：把 token 拖到 target（data-drop 屬性）上；也可以直接點 target。
function makeDrag(token,onDrop){
  var ghost=null,sx=0,sy=0,moved=false;
  token.style.touchAction='none';
  token.addEventListener('click',function(e){if(moved){e.stopImmediatePropagation();e.preventDefault();moved=false}},true);
  token.addEventListener('pointerdown',function(e){
    if(token.disabled)return;sx=e.clientX;sy=e.clientY;moved=false;
    try{token.setPointerCapture(e.pointerId)}catch(_){}
  });
  token.addEventListener('pointermove',function(e){
    if(!token.hasPointerCapture||!token.hasPointerCapture(e.pointerId))return;
    if(!moved&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<8)return;
    if(!ghost){moved=true;ghost=token.cloneNode(true);ghost.classList.add('drag-ghost');ghost.style.width=token.offsetWidth+'px';document.body.appendChild(ghost)}
    ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
    var t=hit(e.clientX,e.clientY);document.querySelectorAll('[data-drop]').forEach(function(d){d.classList.toggle('over',d===t)});
  });
  function hit(x,y){if(ghost)ghost.style.display='none';var el=document.elementFromPoint(x,y);if(ghost)ghost.style.display='';return el&&el.closest?el.closest('[data-drop]'):null}
  function end(e){
    if(ghost){var t=hit(e.clientX,e.clientY);ghost.remove();ghost=null;document.querySelectorAll('[data-drop]').forEach(function(d){d.classList.remove('over')});if(t)onDrop(t.getAttribute('data-drop'))}
  }
  token.addEventListener('pointerup',end);token.addEventListener('pointercancel',function(){if(ghost){ghost.remove();ghost=null}});
}
function rnd(n){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}

(function(){
"use strict";
var app=document.getElementById('app'),KEY='u2a-tidefield-v1';
var USE=[['rice','種稻'],['fish','養魚'],['salt','曬鹽']];
var Y=[
 {w:'rain',t:'今年雨下得很多，河水把這塊地沖得很淡。',v:[8,5,1]},
 {w:'wave',t:'颱風把海水灌了進來，這塊地變得很鹹。',v:[0,7,5]},
 {w:'sun',t:'今年幾乎不下雨，天天都是大太陽。',v:[2,4,9]},

];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
if(location.hash==='#reset'){try{localStorage.removeItem(KEY)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
var st=load()||{y:-1,pick:[],ans:[],first:[]};
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function btn(t,cls,f){var b=el('button','btn'+(cls?' '+cls:''),t);b.type='button';b.addEventListener('click',f);return b}
function oc(y,k){var o=Y[y].v.filter(function(_,i){return i!==k});return Math.max.apply(null,o)}
function intro(){
  app.innerHTML='';
  var c=el('div','card');
  c.append(el('p','lead','想像你住在兩百年前七股的海邊。你家有一塊靠海的新土地，可是一年只能拿來做一件事：種稻、養魚，或是曬鹽。魚與熊掌不可兼得，選了一樣，另外兩樣就得割愛。'),
   el('p','lead','每一年開始的時候，你要選一塊牌子立在地上。立了哪一塊牌子，這一年就做那一件事。一共要過 4 年。'),
   el('p','lead','每一年結束的時候，你會看到自己收成了幾點，也會看到另外兩種用途本來可以收成幾點。這個故事和點數都是假設的，只是用來練習。'));
  app.append(el('p','kick','線上小遊戲・機會成本'),el('h1',null,'一塊地三條路'),c,btn('開始第 1 年','',function(){st.y=0;save();year()}));
}
function year(){
  if(st.y>=Y.length){end();return}
  var y=st.y,q=Y[y],k=st.pick[y];app.innerHTML='';
  app.append(el('p','kick','現在是第 '+(y+1)+' 年，一共要過 4 年'));
  var wc=el('div','card');var wr=el('div','weather');wr.append(el('span','ico',IC(q.w,'#2A6F68','#F0F7F6',64)),el('p',null,q.t));wc.append(wr);app.append(wc);
  if(k==null){
    app.append(el('h2',null,'今年這塊地要拿來做什麼？請把一塊牌子拖到下面的地上，也可以直接點一下牌子。'));
    var sg=el('div','signs');
    USE.forEach(function(u,i){var b=el('button','tok',IC(u[0],'#1E242B','#FFF5F2',56)+'<span>'+u[1]+'</span>');b.type='button';b.setAttribute('aria-label','把「'+u[1]+'」的牌子立在地上');
      b.addEventListener('click',function(){place(i)});makeDrag(b,function(){place(i)});sg.appendChild(b)});
    var pl=el('div','plot',IC('plot','#2A6F68','#FFFFFF',72)+'<span>這是你家的地。<br>請把牌子立在這裡。</span>');pl.setAttribute('data-drop','plot');
    app.append(sg,pl);
    return;
  }
  // 揭曉
  app.append(el('h2',null,'你在地上立了「'+USE[k][1]+'」的牌子。到了年底，三種用途的收成是這樣：'));
  var bs=el('div','baskets');
  USE.forEach(function(u,i){var m=i===k;var d=el('div','bk '+(m?'mine':'ghost'));
    d.innerHTML=IC(u[0],m?'#D95D39':'#475569',m?'#FFFFFF':'#FAF7F2',44)+'<span>'+u[1]+'</span><b>'+q.v[i]+' 點</b><span class="tag">'+(m?'我選的':'沒有選的')+'</span>';bs.appendChild(d)});
  app.append(bs);
  var o=Y[y].v.filter(function(_,i){return i!==k});var best=Math.max.apply(null,o),small=Math.min.apply(null,o),sum=o[0]+o[1];
  app.append(el('h2',null,'這一年你選了「'+USE[k][1]+'」，你放棄了幾點？這就是這一年的機會成本。'),el('p','lead','提示：一塊地一年只能做一件事。想一想，如果你沒有選「'+USE[k][1]+'」，你會改選哪一種？'));
  var ch=[[best,'best'],[sum,'sum'],[small,'small'],[0,'zero']];
  var seen={};ch=ch.filter(function(c){if(seen[c[0]])return false;seen[c[0]]=1;return true});ch.sort(function(x,y){return x[0]-y[0]});
  var g=el('div','opts'),fb=el('div');fb.style.display='flex';fb.style.flexDirection='column';fb.style.gap='12px';
  ch.forEach(function(c){var b=el('button','btn alt',c[0]+' 點'+(c[1]==='zero'?'，我選的收成最多，沒有放棄什麼':''));b.type='button';
    b.addEventListener('click',function(){Array.prototype.forEach.call(g.children,function(x){x.classList.remove('pick')});b.classList.add('pick');
      if(st.first[y]==null)st.first[y]=c[1]==='best';st.ans[y]=c[1];save();feedback(fb,c[1],best,sum,q.v[k],k)});g.appendChild(b)});
  app.append(g,fb);
  if(st.ans[y])feedback(fb,st.ans[y],best,sum,q.v[k],k);
}
function feedback(fb,t,best,sum,got,k){
  fb.innerHTML='';var msg;
  if(t==='best')msg='答對了！機會成本只算沒選的用途裡，收成最多、最讓人捨不得的那一種，所以是 '+best+' 點。';
  else if(t==='sum')msg='魚與熊掌不可兼得：一塊地一年只能做一件事，沒選的兩種用途本來就不可能一起做，所以不能加起來。只要算收成比較多的那一種，也就是 '+best+' 點。';
  else if(t==='small')msg='你放棄的兩種用途裡，收成比較多的那一種，才是你最捨不得的。所以機會成本是 '+best+' 點，不是收成比較少的那一種。';
  else msg='有一好，沒兩好。就算你選了收成最多的用途，別的用途的收成，你這一年還是拿不到。只要做了選擇，就一定有割愛的東西。這一年你放棄了 '+best+' 點。';
  var cmp=got>=best?'你得到了 '+got+' 點，放棄了 '+best+' 點。得到的比放棄的多，所以這一年你選得很划算。':'你得到了 '+got+' 點，放棄了 '+best+' 點。放棄的比得到的多，這一年選得有點划不來。';
  fb.append(el('p','note'+(t==='best'?'':' warm'),msg),el('p','note',cmp),btn(st.y<Y.length-1?'繼續過第 '+(st.y+2)+' 年':'看看這 4 年的紀錄','teal',function(){st.y++;save();year();window.scrollTo(0,0)}));
}
function place(i){if(st.pick[st.y]!=null)return;st.pick[st.y]=i;save();year()}
function end(){
  app.innerHTML='';var tot=0,win=0,right=0;
  var t=el('table');t.innerHTML='<tr><th>哪一年</th><th>我選的用途</th><th>我得到</th><th>我放棄（機會成本）</th></tr>';
  Y.forEach(function(q,y){var k=st.pick[y];if(k==null)return;var b=oc(y,k);tot+=q.v[k];if(q.v[k]>=b)win++;if(st.first[y])right++;
    var tr=el('tr');tr.innerHTML='<td>第 '+(y+1)+' 年</td><td>'+USE[k][1]+'</td><td>'+q.v[k]+' 點</td><td>'+b+' 點</td>';t.appendChild(tr)});
  var c=el('div','card');
  c.append(t,el('p','note','請記下這三個數字，等一下老師會請大家舉手：<br>① 這 4 年一共收成了 <b>'+tot+'</b> 點。<br>② 有 <b>'+win+'</b> 年選得划算：我得到的比放棄的多。<br>③ 算機會成本的時候，有 <b>'+right+'</b> 年是第一次就答對的。'),
   el('p','note warm','想一想：就算每一年都選了收成最多的用途，機會成本會不會是 0？為什麼？'));
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}
if(st.y<0)intro();else year();
})();
</script>
