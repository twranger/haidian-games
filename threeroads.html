<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="fresh.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>臺江三岔路・全班連線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="live.js"></script>
<script src="room.js"></script>
<style>
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.road{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:3px solid transparent}
.road .nm{font-size:clamp(26px,4vw,40px);font-weight:900}
.road .v{font-size:clamp(40px,7vw,72px);font-weight:900;line-height:1}
.road.best{border-color:#F2A65A;box-shadow:0 0 0 4px #F2A65A inset}
.pickbtn{font:inherit;width:100%;border:4px solid #E3DED7;background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.pickbtn b{font-size:30px}.pickbtn span{font-size:18px;color:#475569}
.pickbtn.on{border-color:#2A6F68;background:#F0F7F6}
.ev{font-size:clamp(30px,5vw,52px);font-weight:900;color:#F2A65A}
</style>
</head>
<body>
<script>
var YEARS=3,SEC=20;
var P={fish:{n:'養魚',c:'#2A6F68',bg:'#F0F7F6',hint:'虱目魚價錢好，可是怕颱風、寒流'},rice:{n:'種稻',c:'#C99A2E',bg:'#FBF3DD',hint:'比較穩，可是怕乾旱、缺水'},salt:{n:'曬鹽',c:'#475569',bg:'#F1F3F5',hint:'出大太陽最好，可是怕連續下雨'}};
var KEYS=['fish','rice','salt'];
var EV=[{n:'風調雨順',d:'雨水剛剛好，三種都不錯。',v:{fish:7,rice:7,salt:4}},
 {n:'大颱風',d:'魚塭的堤被沖破，魚跑掉了；稻子也倒了一些。',v:{fish:1,rice:3,salt:3}},
 {n:'大旱',d:'整年很少下雨，稻田缺水，可是很適合曬鹽。',v:{fish:4,rice:1,salt:9}},
 {n:'寒流',d:'冬天特別冷，虱目魚凍死不少。',v:{fish:2,rice:6,salt:5}},
 {n:'虱目魚大豐收',d:'魚長得又大又多，市場搶著要。',v:{fish:9,rice:5,salt:3}},
 {n:'梅雨下不停',d:'連續下雨，鹽田曬不了鹽。',v:{fish:6,rice:6,salt:1}}];
function players(H){return Object.keys(H.seats).length}
function counts(g){var c={fish:0,rice:0,salt:0};Object.keys(g.pick||{}).forEach(function(k){c[g.pick[k]]++});return c}
function factor(n,N){if(!N)return 1;var s=n/N;return s>0.5?0.6:s<0.2?1.3:1}
function reveal(H){var g=H.g,N=Object.keys(g.pick).length,c=counts(g),e=EV[g.deck[g.year-1]],pay={};
 KEYS.forEach(function(k){pay[k]=Math.round(e.v[k]*factor(c[k],N))});
 Object.keys(g.pick).forEach(function(s){g.score[s]=(g.score[s]||0)+pay[g.pick[s]]});
 var best=Math.max(pay.fish,pay.rice,pay.salt),nb=Object.keys(g.pick).filter(function(s){return pay[g.pick[s]]===best}).length;
 g.hist.push({year:g.year,ev:g.deck[g.year-1],c:c,pay:pay,f:{fish:factor(c.fish,N),rice:factor(c.rice,N),salt:factor(c.salt,N)},nbest:nb,n:N,pick:g.pick});H.ph='reveal'}
function topList(g){var s=g.score||{};return Object.keys(s).sort(function(a,b){return s[b]-s[a]}).slice(0,5).map(function(k){return k+' 號（'+s[k]+' 點）'}).join('、')||'—'}
function roadCards(h,show){var best=Math.max(h.pay.fish,h.pay.rice,h.pay.salt);return '<div class="three">'+KEYS.map(function(k){var f=h.f[k];
  return '<div class="road'+(h.pay[k]===best?' best':'')+'" style="background:'+P[k].bg+'"><span class="nm" style="color:'+P[k].c+'">'+P[k].n+'</span><span>'+h.c[k]+' 人選</span>'+
  (show?'<span class="v" style="color:'+P[k].c+'">'+h.pay[k]+' 點</span><span>'+(f<1?'太多人做，價錢跌了':f>1?'做的人少，價錢比較好':'價錢普通')+'</span>':'')+'</div>'}).join('')+'</div>'}
ROOM.start({
 key:'roads',title:'臺江三岔路',kick:'第 1 課・機會成本　全班連線',studentUrl:'threeroads.html',
 rules:'<p>每個人都有一塊海邊的地。每一年，你要替它選一條路：<b>養魚、種稻，還是曬鹽</b>。只能選一條。</p><p>大家選好以後，老師開獎：今年的天氣怎麼樣、價錢怎麼樣。<b>同一條路太多人做，價錢會跌；做的人少，價錢會比較好。</b>一共 3 年。</p>',
 init:function(H){H.g={}},
 onStart:function(H){var g=H.g,d=[0,1,2,3,4,5];for(var i=d.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=d[i];d[i]=d[j];d[j]=t}
  g.deck=d;g.year=1;g.pick={};g.score={};g.hist=[];g.deadline=Date.now()+SEC*1000;H.ph='choose'},
 pub:function(H){var g=H.g;return {g:{year:g.year,picked:Object.keys(g.pick||{}).length,hist:g.hist,score:g.score,deck:g.deck}}},
 onMsg:function(H,d,seat){if(d.t==='pick'&&H.ph==='choose'&&P[d.v]){H.g.pick[seat]=d.v;return true}},
 tickText:function(H){var l=Math.max(0,Math.ceil((H.g.deadline-Date.now())/1000));return l?'建議 '+l+' 秒內選好':'時間到了，可以開獎'},
 act:{open:function(H){if(H.ph!=='choose')return false;reveal(H)},
  next:function(H){var g=H.g;if(H.ph!=='reveal')return false;if(g.year>=YEARS){H.ph='sum';return}g.year++;g.pick={};g.deadline=Date.now()+SEC*1000;H.ph='choose'}},
 keys:{o:'open'},
 bar:function(H){if(H.ph==='choose')return '<button class="btn" data-act="open">開獎（O）</button>';if(H.ph==='reveal')return '<button class="btn te" data-act="next">'+(H.g.year>=YEARS?'看 3 年的結果':'下一年')+'</button>';return ''},
 hostView:function(H){var g=H.g,N=players(H),h='';
  if(H.ph==='choose'){var c=counts(g);
   h+='<div class="card dark"><p class="stat">第 '+g.year+' 年（一共 '+YEARS+' 年）：請大家替自己的地選一條路</p><p>已經選好：'+Object.keys(g.pick).length+' / '+N+' 人　<span id="hdtick"></span></p></div>'+
    '<div class="card"><h2>目前大家的選擇（開獎前先不告訴大家天氣）</h2>'+roadCards({c:c,pay:{fish:0,rice:0,salt:0},f:{}},false)+'</div>'}
  else if(H.ph==='reveal'){var x=g.hist[g.hist.length-1],e=EV[x.ev];
   h+='<div class="card dark"><p>第 '+x.year+' 年開獎</p><p class="ev">'+e.n+'</p><p style="font-size:24px">'+e.d+'</p></div>'+
    '<div class="card"><h2>今年三條路各賺幾點</h2>'+roadCards(x,true)+'<p class="stat">選到今年最好那一條路的：'+x.nbest+' / '+x.n+' 人</p>'+
    '<p class="lead">每個人的平板上會寫：你放棄的路裡，最好的那一條今年值多少。這就是你的<b>機會成本</b>。</p></div>'+
    '<div class="card"><p>3 年加起來目前最多：'+topList(g)+'</p></div>'}
  else{h+='<div class="card"><h2>3 年的開獎紀錄</h2><table><tr><th>年</th><th>天氣</th><th>養魚</th><th>種稻</th><th>曬鹽</th><th>選到最好的人</th></tr>'+
    g.hist.map(function(x){return '<tr><td>第 '+x.year+' 年</td><td>'+EV[x.ev].n+'</td><td>'+x.pay.fish+' 點（'+x.c.fish+' 人）</td><td>'+x.pay.rice+' 點（'+x.c.rice+' 人）</td><td>'+x.pay.salt+' 點（'+x.c.salt+' 人）</td><td>'+x.nbest+' / '+x.n+'</td></tr>'}).join('')+'</table><p>3 年加起來最多：'+topList(g)+'</p></div>'+
    '<div class="card dark"><p style="font-size:24px">每一年最好的路都不一樣，誰也沒辦法每次都選對。選了一條路，就一定放棄了另外兩條；放棄的路裡最好的那一條，就是這個選擇的<b style="color:#F2A65A">機會成本</b>。</p></div>'}
  return h},
 studentView:function(ST,me,api){var g=ST.g||{},h='',my=(g.score||{})[me]||0;
  if(ST.ph==='choose'){var cur=api.local['y'+(g.deck||[]).join('')+g.year];
   h+='<h1>第 '+g.year+' 年：替你的地選一條路</h1><p class="lead">只能選一條。開獎以前都可以改。</p>';
   KEYS.forEach(function(k){h+='<button class="pickbtn'+(cur===k?' on':'')+'" data-act="take" data-arg="'+k+'"><b style="color:'+P[k].c+'">'+P[k].n+'</b><span>'+P[k].hint+'</span></button>'});
   h+='<div class="card"><p>3 年加起來，我目前有：<b>'+my+' 點</b></p></div>'}
  else if(ST.ph==='reveal'){var x=(g.hist||[])[g.hist.length-1]||{},mine=(x.pick||{})[me],e=EV[x.ev]||{};
   if(!mine)h+='<h1>今年是「'+e.n+'」</h1><div class="card"><p class="stat">你這一年沒有選，地就空著。</p></div>';
   else{var others=KEYS.filter(function(k){return k!==mine}),bo=others[0];others.forEach(function(k){if(x.pay[k]>x.pay[bo])bo=k});var diff=x.pay[bo]-x.pay[mine];
    h+='<h1>今年是「'+e.n+'」</h1><div class="card"><p class="stat">你選了'+P[mine].n+'，賺了 '+x.pay[mine]+' 點</p></div>'+
     '<div class="card '+(diff>0?'warm':'cool')+'"><p style="font-size:22px">你放棄的路裡，最好的是<b>'+P[bo].n+'</b>，今年值 <b>'+x.pay[bo]+' 點</b>。</p><p style="font-size:22px;font-weight:900">'+(diff>0?'如果選它，會多賺 '+diff+' 點。':diff<0?'你的選擇比它多賺 '+(-diff)+' 點，選得好！':'和你賺的一樣多。')+'</p><p class="lead">放棄的路裡最好的那一條，就是你這個選擇的「機會成本」。</p></div>'}
   h+='<div class="card"><p>3 年加起來，我目前有：<b>'+my+' 點</b></p></div>'}
  else h+='<h1>3 年結束了！</h1><div class="card"><p class="stat">我一共賺了 '+my+' 點</p></div><p class="lead">請看大螢幕。</p>';
  return h},
 sact:{take:function(ST,me,api,v){var g=ST.g;api.local={};api.local['y'+(g.deck||[]).join('')+g.year]=v;api.send({t:'pick',v:v});api.save()}}
});
</script>
</body>
</html>
