<meta charset="utf-8">
<script src="fresh.js"></script>
<title>標籤拆拆看</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: intro → palette (our class: tap 1–5 paint blobs, a class-photo strip gets painted) → palette (fictional 安和國小) → compare the two strips → six label pages (a label stuck on a cardboard standee; pick 全部都是／很多是／有些是／說不準, then hold or drag the label to peel it; three short stories appear; "did your view change?") → 草地郎 question (every option shows what it does) → summary for a show of hands. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --kraft:#E6D2AC; --kraft2:#CDB283;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.case svg.i{width:1.4em;height:1.4em;vertical-align:-0.35em;margin-right:8px}
.nw{white-space:nowrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.grid2 .btn.alt{text-align:center}
.btn.go{background:var(--rust)}
.btn:disabled{opacity:.45;cursor:default}
.btn.alt:disabled{opacity:1;color:var(--muted)}
.btn.alt.pick:disabled{color:var(--ink)}
.btn:focus-visible,.blob:focus-visible,.lbwrap:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.parts{display:flex;flex-direction:column;gap:12px}
.part{display:flex;gap:14px;align-items:center;font-size:clamp(19px,2.6vw,24px);line-height:1.55}
.part svg.i{width:52px;height:52px;flex:none;color:var(--ink)}
.part b{display:block}

/* ---------- palette ---------- */
.scale{display:flex;justify-content:space-between;gap:12px;font-size:clamp(19px,2.3vw,21px);font-weight:700;color:var(--muted);margin:0}
.scale span:last-child{text-align:right}
.pal{position:relative;width:min(100%,580px);aspect-ratio:1.62;margin:0 auto;background:var(--kraft);border:3px solid var(--kraft2);border-radius:50% 46% 44% 52% / 58% 56% 44% 42%;box-shadow:inset 0 -8px 0 rgba(120,90,40,.10)}
.pal .hole{position:absolute;left:13%;top:58%;width:16%;aspect-ratio:1;border-radius:50%;background:var(--bg);border:3px solid var(--kraft2)}
.blob{position:absolute;width:19%;aspect-ratio:1;border:3px dashed rgba(31,42,46,.35);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:transparent}
.blob .paint{position:absolute;inset:6%;border-radius:inherit;background:var(--c);opacity:.38;transition:opacity .12s}
.blob .tick{position:relative;width:46%;aspect-ratio:1;border-radius:50%;background:#FBFCF9;color:var(--ink);display:none;align-items:center;justify-content:center;border:2px solid var(--ink)}
.blob .tick svg{width:78%;height:78%}
.blob.on{border:3px solid var(--ink);transform:scale(1.08);box-shadow:0 4px 0 rgba(31,42,46,.18)}
.blob.on .paint{opacity:1;inset:0}
.blob.on .tick{display:flex}
.blob:active{transform:scale(.96)}
.b0{left:31%;top:10%;border-radius:52% 48% 55% 45%/48% 55% 45% 52%}
.b1{left:53%;top:7%;border-radius:45% 55% 48% 52%/55% 45% 55% 45%}
.b2{left:74%;top:22%;border-radius:55% 45% 50% 50%/50% 52% 48% 50%}
.b3{left:66%;top:56%;border-radius:48% 52% 45% 55%/52% 48% 52% 48%}
.b4{left:41%;top:52%;border-radius:50% 50% 55% 45%/45% 55% 50% 50%}
.count{font-size:clamp(23px,3.8vw,32px);font-weight:900;text-align:center;margin:0;line-height:1.4}
.count small{display:block;font-size:clamp(19px,2.6vw,23px);font-weight:700;color:var(--muted)}
.photo{display:flex;justify-content:center;gap:clamp(2px,1vw,10px);background:#FFFDF6;border:3px solid var(--line);border-radius:16px;padding:12px 8px 0;overflow:hidden}
.photo svg{width:11%;max-width:62px;height:auto;display:block}
.photo .kid path,.photo .kid circle{transition:fill .25s}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center}
.cmp .who{font-weight:900;font-size:clamp(19px,2.8vw,25px);display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.3;min-width:5.2em}
.cmp .who svg.i{width:40px;height:40px}
.cmp .who small{font-size:clamp(19px,2.4vw,21px);color:var(--muted)}
.cmp .photo{padding-top:8px}

/* ---------- label standee ---------- */
.stand{position:relative;width:min(100%,440px);margin:0 auto;aspect-ratio:300/250}
.stand > svg{position:absolute;inset:0;width:100%;height:100%}
.lbwrap{position:absolute;left:5%;right:5%;top:53%;transform-origin:20% 40%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none;border-radius:10px;-webkit-tap-highlight-color:transparent}
.lbwrap.locked{cursor:default}
.lbwrap.gone{transition:transform .5s cubic-bezier(.4,0,.8,.6),opacity .5s;opacity:0}
.lbface{background:#FFFDF4;border:2px solid #CBBE98;border-radius:10px;padding:12px 16px;font-size:clamp(23px,3.4vw,30px);font-weight:900;line-height:1.35;text-align:center;color:var(--ink);box-shadow:0 3px 0 rgba(90,70,30,.15)}
.lbface .pos{display:block;font-size:clamp(19px,2.3vw,21px);font-weight:700;color:var(--rust)}
.fold{position:absolute;right:0;bottom:0;width:14px;height:14px;background:linear-gradient(135deg,#F1EAD6 0%,#E2D6B4 60%,#CDBE95 100%);clip-path:polygon(0 0,100% 0,0 100%);pointer-events:none;filter:drop-shadow(-1px -1px 0 rgba(0,0,0,.08))}
.peelhint{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:900;color:var(--rust);font-size:clamp(19px,2.6vw,24px);margin:0;text-align:left}
.peelhint svg.i{width:1.6em;height:1.6em}
.peelhint.wait{color:var(--muted);font-weight:700}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.2deg)}75%{transform:rotate(2.2deg)}}
.lbwrap.wiggle{animation:wig .5s ease-in-out 2}
.three{position:absolute;left:5%;right:5%;top:50%;display:flex;justify-content:space-around;align-items:center;gap:4px;background:rgba(255,253,244,.85);border:3px dashed #CBBE98;border-radius:12px;padding:6px}
.three svg.av{width:30%;max-width:84px;height:auto}
.ppl{display:flex;flex-direction:column;gap:10px}
.pp{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 16px}
.pp svg.av{width:72px;height:72px}
.pp p{margin:0;font-size:clamp(19px,2.6vw,23px);line-height:1.65}
.pp .nm{font-weight:900;font-size:clamp(19px,2.6vw,23px);color:var(--sea);display:block}
.pp .nm small{font-weight:700;color:var(--muted);font-size:.9em;margin-left:6px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pp.in{animation:rise .45s both}
.was{margin:0;font-size:clamp(19px,2.4vw,22px);color:var(--muted);font-weight:700}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.6vw,24px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
td:first-child{color:var(--muted);font-weight:700}
td b{font-size:1.1em}
td .sw{display:inline-flex;gap:4px;vertical-align:-0.1em;margin-left:8px}
td .sw i{width:.9em;height:.9em;border-radius:50%;border:2px solid var(--ink);display:inline-block}
td.lb{color:var(--ink);font-weight:700}
.chg{display:inline-block;font-size:.85em;font-weight:700;color:var(--rust);margin-left:6px}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  th,td{padding:8px 4px}
  .grid2{gap:8px}
  .grid2 .btn{padding:12px 8px}
  .pp{padding:10px 12px;gap:10px}
  .pp svg.av{width:58px;height:58px}
  .cmp{grid-template-columns:1fr}
  .cmp .who{flex-direction:row;gap:8px;min-width:0;justify-content:flex-start}
  table.sum, table.sum tbody, table.sum tr, table.sum td{display:block}
  table.sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  table.sum td{border:0;padding:2px 4px}
}
</style>

/* hold or drag to peel */
function peelable(wrap,face,fold,can,done,nope){
  var p=0,down=false,t0=0,sx=0,sy=0,dx=0,dy=0,finished=false,pid=null,auto=false;
  function draw(){
    var H=face.offsetHeight||80,W=face.offsetWidth||300;
    var s=Math.round(14+p*(Math.min(H*0.95,W*0.45)-14));
    face.style.clipPath='polygon(0 0,100% 0,100% calc(100% - '+s+'px),calc(100% - '+s+'px) 100%,0 100%)';
    face.style.webkitClipPath=face.style.clipPath;
    fold.style.width=fold.style.height=s+'px';
    if(!finished)wrap.style.transform='translate('+(dx*0.35)+'px,'+(dy*0.35-p*10)+'px) rotate('+(-p*5)+'deg)';
  }
  function tick(){
    if(finished)return;
    if(down||auto){
      var hp=(performance.now()-t0)/(auto?650:1000),dp=Math.sqrt(dx*dx+dy*dy)/170;
      p=Math.min(1,Math.max(hp,dp));draw();
      if(p>=1){finish();return}
      requestAnimationFrame(tick);
    }
  }
  function back(){
    var p0=p,dx0=dx,dy0=dy,t1=performance.now();
    (function f(){if(down||finished)return;var k=Math.min(1,(performance.now()-t1)/200);p=p0*(1-k);dx=dx0*(1-k);dy=dy0*(1-k);draw();if(k<1)requestAnimationFrame(f)})();
  }
  function finish(){
    finished=true;down=false;
    wrap.classList.add('gone');
    wrap.style.transform='translate(170px,-260px) rotate(32deg)';
    setTimeout(done,480);
  }
  wrap.addEventListener('pointerdown',function(e){
    if(finished)return;
    if(!can()){nope();return}
    e.preventDefault();
    try{wrap.setPointerCapture(e.pointerId)}catch(_){}
    pid=e.pointerId;down=true;t0=performance.now();sx=e.clientX;sy=e.clientY;dx=dy=0;
    wrap.classList.remove('wiggle');
    requestAnimationFrame(tick);
  });
  wrap.addEventListener('pointermove',function(e){if(!down||e.pointerId!==pid)return;dx=e.clientX-sx;dy=e.clientY-sy});
  function up(e){if(!down)return;down=false;if(!finished)back()}
  wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
  wrap.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    e.preventDefault();if(finished||auto)return;
    if(!can()){nope();return}
    auto=true;t0=performance.now();requestAnimationFrame(tick);
  });
  requestAnimationFrame(draw);
}

  function show(){fb.innerHTML='';if(st.word!=null)fb.appendChild(el('p','note','<b>'+WORD[st.word][0]+'：</b>'+WORD[st.word][1]+'<br>每一個選擇都可以，等一下全班一起聊一聊。'))}
  WORD.forEach(function(w,k){
    var b=button(w[0],'btn alt'+(st.word===k?' pick':''),function(){
      st.word=k;save(st);
      Array.prototype.forEach.call(g.children,function(x){x.classList.remove('pick')});b.classList.add('pick');nx.disabled=false;show();
    });
    g.appendChild(b);
  });
  show();
  app.append(g,fb,nx);
}

/* ---------- step 11: end ---------- */
function end(){
  app.innerHTML='';
  var a=sum(st.us),b=sum(st.them);
  var rows=[
    [ic('crowd')+' 我們班多不一樣','<b>'+a+'</b> 個顏色'+swatch(st.us)],
    [ic('school')+' 隔壁學校多不一樣','<b>'+b+'</b> 個顏色'+swatch(st.them)],
    ['我們班的顏色比隔壁學校','<b>'+(a>b?'比較多':a===b?'一樣多':'比較少')+'</b>']
  ];
  var nchg=0;
  LB.forEach(function(L,i){
    var S=st.lb[i];if(S.chg===1)nchg++;
    rows.push(['<span class="lbt">'+(i+1)+'. '+L.t+'</span>','<b>'+(S.op!=null?OPS[S.op]:'—')+'</b>'+(S.chg===1?'<span class="chg">撕開後有改變</span>':'')]);
  });
  rows.push([ic('peel')+' 撕開後改變想法','<b>'+nchg+'</b> 張（共 6 張）']);
  rows.push([ic('talk')+' 被叫一個詞時','<b>'+(st.word!=null?WORD[st.word][0]:'—')+'</b>']);
  var t=el('table','sum');
  rows.forEach(function(r){var tr=el('tr');tr.append(el('td',null,r[0]),el('td',null,r[1]));t.appendChild(tr)});
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}

function render(){
  var s=st.step|0;
  if(s>=2&&!sum(st.us))s=1;
  else if(s>=3&&!sum(st.them))s=2;
  if(s>=5){for(var i=0;i<6&&4+i<s;i++){if(st.lb[i].chg==null||!st.lb[i].peeled){s=4+i;break}}}
  if(s>=11&&st.word==null)s=10;
  st.step=s;
  if(s===0)intro();else if(s===1)palette(0);else if(s===2)palette(1);else if(s===3)compare();
  else if(s>=4&&s<=9)labelPage(s-4);else if(s===10)oneWord();else if(s===11)end();else intro();
}
render();
})();
</script>
