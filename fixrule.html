<meta charset="utf-8">
<script src="fresh.js"></script>
<title>規則修理站</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: intro → for each of 3 "rule machines": guess what goes wrong (4 options, all allowed) → the machine runs and shows what came out (neutral note on the guess + why) → drag a tool from the toolbox onto the machine's tool socket (or tap it), the machine runs again and shows the new result, what it helps and what it costs; tools can be swapped → summary for a show of hands. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h1 svg.i{width:1.1em;height:1.1em;vertical-align:-0.18em;margin-right:10px;color:var(--ink)}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,3vw,27px);font-weight:900;margin:0;line-height:1.45}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.case svg.i{width:1.4em;height:1.4em;vertical-align:-0.35em;margin-right:8px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.go{background:var(--rust)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tool:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.letter{display:inline-block;min-width:1.6em;font-weight:900;color:var(--sea)}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.steps3{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:clamp(19px,2.6vw,24px)}

/* ---------- rule machine ---------- */
.mcard{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(12px,2.6vw,20px);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.mcard.hot{border-color:var(--gold);background:var(--warm)}
.port{display:flex;flex-direction:column;gap:6px}
.plabel{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:clamp(17px,2.2vw,20px);font-weight:900;color:#fff;background:var(--sea);border-radius:999px;padding:2px 14px;letter-spacing:1px}
.plabel.out{background:var(--rust)}
.rulecard{background:#FBF4E2;border:3px solid #E3CF9E;border-radius:14px;padding:10px 14px;font-size:clamp(20px,2.8vw,25px);font-weight:900;line-height:1.5;margin:0}
.rulecard .add{display:block;font-size:clamp(19px,2.5vw,22px);font-weight:700;color:var(--rust);margin-top:4px}
.mach{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;overflow:visible}
.outbox{background:#FFF;border:3px dashed var(--line);border-radius:14px;padding:10px 14px;min-height:64px;display:flex;flex-direction:column;gap:8px}
.outbox.full{border-style:solid;border-color:#E3B9A6;background:#FDF5F1}
.outbox.fixed{border-style:solid;border-color:#B9D3C1;background:#F3F8F3}
.outtxt{margin:0;font-size:clamp(20px,2.8vw,25px);font-weight:900;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.outtxt svg.i{width:1.6em;height:1.6em;margin-top:.05em}
.outtxt.wait{color:var(--muted);font-weight:700}
.pc{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start;margin:0}
.pc .tag{font-size:clamp(17px,2.2vw,19px);font-weight:900;border-radius:10px;padding:2px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;margin-top:.15em}
.pc .tag.g{background:#DDEEDF;color:#1F5C38}
.pc .tag.c{background:#F8E0D4;color:#8A3714}
.pc .tag svg.i{width:1em;height:1em;vertical-align:0}
.pc p{margin:0;font-size:clamp(19px,2.5vw,23px);line-height:1.6}
/* machine animation */
.mach .g1,.mach .g2,.mach .needle{transform-box:fill-box;transform-origin:center}
.mach .needle{transform-origin:0 0;transform-box:view-box}
.mach .pin{opacity:0}
.mach .pout{opacity:0}
.mach.done .pout{opacity:1;transform:translateY(16px)}
.mach.done .lamp{fill:#9FD0AE}
.mach.wait .slotbox{stroke:var(--gold);animation:pulse 1s ease-in-out infinite}
.mach.run .pin{animation:pin .55s ease-in forwards}
.mach.run .g1{animation:spin 1.3s linear .35s}
.mach.run .g2{animation:spinr 1.3s linear .35s}
.mach.run .needle{animation:swing 1.3s ease-in-out .35s}
.mach.run .lamp{animation:blink .32s steps(2,jump-none) infinite}
.mach.run .shake{animation:shake .12s linear .4s 9}
.mach.run .pout{animation:pout .45s ease-out 1.25s forwards}
.mach.run .toolin{animation:pop .4s ease-out}
@keyframes pin{0%{opacity:1;transform:translateY(-16px)}80%{opacity:1}100%{opacity:0;transform:translateY(46px)}}
@keyframes pout{0%{opacity:0;transform:translateY(-14px)}100%{opacity:1;transform:translateY(16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-540deg)}}
@keyframes swing{0%{transform:rotate(0)}30%{transform:rotate(70deg)}60%{transform:rotate(-40deg)}100%{transform:rotate(0)}}
@keyframes blink{0%{fill:#F3D27A}100%{fill:#F2B8A0}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes pulse{50%{stroke-opacity:.35}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.mach .toolin{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){
  .mach.run .g1,.mach.run .g2,.mach.run .needle,.mach.run .shake,.mach.run .lamp{animation:none}
  .mach.run .pin{animation-duration:.2s}
  .mach.run .pout{animation-duration:.2s;animation-delay:.2s}
}

/* ---------- toolbox ---------- */
.fixgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.tbox{background:#F7E7DF;border:3px solid #E3B9A6;border-radius:22px;padding:clamp(12px,2.4vw,18px);display:flex;flex-direction:column;gap:10px}
.tbox h3 svg.i{width:1.3em;height:1.3em;vertical-align:-0.3em;margin-right:6px}
.tbox .hint{margin:0;font-size:clamp(19px,2.2vw,20px);color:var(--muted);line-height:1.5}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 6px 8px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;position:relative;transition:transform .08s,border-color .12s}
.tool:active{transform:scale(.96)}
.tool svg.i{width:52px;height:52px;pointer-events:none}
.tool .tn{font-size:clamp(15px,1.9vw,17px);font-weight:700;color:var(--muted);line-height:1.3}
.tool .tf{font-size:clamp(19px,2.3vw,21px);font-weight:900;line-height:1.35}
.tool.on{border-color:var(--rust);background:#FDF5F1}
.tool.tried .badge{display:inline-flex}
.badge{display:none;position:absolute;top:6px;right:6px;align-items:center;gap:2px;font-size:15px;font-weight:900;color:var(--good);background:#DDEEDF;border-radius:999px;padding:0 8px 0 4px}
.badge svg.i{width:18px;height:18px}
.tool.on .badge{color:#fff;background:var(--rust)}
.ghost{position:fixed;left:0;top:0;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:18px;background:var(--card);border:3px solid var(--gold);box-shadow:0 8px 22px rgba(31,42,46,.25);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
.ghost svg.i{width:52px;height:52px}
.ghost.fly{transition:transform .38s ease-in-out,opacity .38s}
.choose{display:flex;flex-direction:column;gap:8px}
.choose p{margin:0;color:var(--muted);font-size:clamp(19px,2.3vw,21px)}

/* ---------- end ---------- */
.sum{display:flex;flex-direction:column;gap:12px}
.sum .card{gap:6px}
.sum h3{color:var(--sea);display:flex;align-items:center;gap:8px}
.sum h3 svg.i{width:1.3em;height:1.3em}
.row2{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:clamp(19px,2.6vw,24px);line-height:1.55}
.row2 .k{color:var(--muted);font-weight:700;white-space:nowrap}
.row2 .v{font-weight:900}
.row2 .v svg.i{margin-right:4px}

@media (max-width:760px){
  .fixgrid{grid-template-columns:1fr}
}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .tool svg.i{width:44px;height:44px}
}
@media (max-width:440px){
  .row2{grid-template-columns:1fr;gap:0}
  .row2 .v{margin-bottom:6px}
}
.tool .badge svg.i{width:18px;height:18px}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

/* ---------- machine drawing ---------- */
function gear(cx,cy,R,n){
  var r0=R-6,d='',w=Math.PI/n*0.42;
  for(var i=0;i<n;i++){
    var t=i*2*Math.PI/n,t2=t+Math.PI/n;
    var pts=[[r0,t-w*1.3],[R,t-w],[R,t+w],[r0,t+w*1.3]];
    pts.forEach(function(p,j){d+=(i===0&&j===0?'M':'L')+(cx+p[0]*Math.cos(p[1])).toFixed(1)+' '+(cy+p[0]*Math.sin(p[1])).toFixed(1)});
    d+='A'+r0+' '+r0+' 0 0 1 '+(cx+r0*Math.cos(t2+w*0.7)).toFixed(1)+' '+(cy+r0*Math.sin(t2+w*0.7)).toFixed(1);
  }
  return d+'Z';
}

/* builds the machine card; out = {html, cls} for the output box; returns the card */
function machineCard(c,toolKey,done){
  var m=el('div','mcard');
  var inp=el('div','port');
  var t=CASES[c].tools.filter(function(x){return x.k===toolKey})[0];
  inp.append(el('span','plabel',ic('chev')+'入口：放進的規則'),el('p','rulecard','「'+CASES[c].rule+'」'+(t?'<span class="add">'+ic('plus')+'加上修法：'+t.fix+'</span>':'')));
  var holder=el('div');holder.innerHTML=machSvg(toolKey);
  var svg=holder.firstChild;if(done)svg.classList.add('done');
  var out=el('div','port');
  var box=el('div','outbox');
  out.append(el('span','plabel out',ic('chev')+'出口：跑出來的結果'),box);
  m.append(inp,svg,out);
  m._svg=svg;m._box=box;
  return m;
}
function runMachine(m,cb){
  var svg=m._svg;svg.classList.remove('done');
  void svg.getBoundingClientRect();
  svg.classList.add('run');
  m._box.className='outbox';m._box.innerHTML='<p class="outtxt wait">機器運轉中……</p>';
  setTimeout(function(){svg.classList.remove('run');svg.classList.add('done');cb&&cb()},RUN_MS);
}
function problemHtml(c){var p=CASES[c].problem;return '<p class="outtxt">'+ic(p.icon)+'<span>'+p.text+'</span></p>'}
function fixHtml(t){
  return '<p class="outtxt">'+ic(t.k)+'<span>'+t.out+'</span></p>'+
   '<div class="pc"><span class="tag g">'+ic('plus')+'作用</span><p>'+t.good+'</p><span class="tag c">'+ic('minus')+'代價</span><p>'+t.cost+'</p></div>';
}
function caseTag(c,first){return el('p','case',ic(CASES[c].icon)+'第 '+(c+1)+' 台機器'+(first?'（共 3 台）':'：'+CASES[c].name))}

  C.opts.forEach(function(o,k){
    var b=button('<span class="letter">'+L[k]+'</span>'+o.t,'btn alt'+(S.g===k?' pick':''),function(){

    });
    g.appendChild(b);
  });
  app.append(caseTag(c,true),el('h2',null,C.name),sc,m,el('h2',null,'這條規則放進機器，會跑出什麼問題？'),el('p','lead','先猜猜看，每一個都可以選。'),g,nx);

/* ---------- reveal ---------- */
function reveal(c){
  var C=CASES[c],S=st.c[c];app.innerHTML='';
  var m=machineCard(c,null,S.seen);
  var after=el('div','opts');
  var o=C.opts[S.g];
  after.append(el('p','note warm','你猜的是 <b>'+L[S.g]+'：'+o.t+'</b>。<br>'+o.n),
    (function(){var k=el('div','card');k.append(el('h3',null,'為什麼會這樣？'),el('p','lead',C.why));return k})(),
    button('打開工具箱，修修看','btn',function(){go(st.step+1)}));
  app.append(caseTag(c),el('h2',null,'機器開動了！看看出口跑出什麼'),m,after);
  function show(){m._box.className='outbox full';m._box.innerHTML=problemHtml(c);after.style.display=''}
  if(S.seen){show()}
  else{
    after.style.display='none';
    m._box.innerHTML='<p class="outtxt wait">準備開動……</p>';
    setTimeout(function(){runMachine(m,function(){S.seen=true;save(st);show()})},350);
  }
}

  var choose=el('div','choose');
  function updTools(){
    C.tools.forEach(function(t){var b=tbtn[t.k];b.classList.toggle('tried',S.tried.indexOf(t.k)>=0);b.classList.toggle('on',S.tool===t.k);
      b.querySelector('.badge').innerHTML=ic('check')+(S.tool===t.k?'裝上了':'試過')});
    choose.innerHTML='';
    if(cur&&!busy){
      choose.append(button('就選這個修法：'+cur.fix,'btn',function(){go(st.step+1)}),el('p',null,'想比一比的話，可以再換一個工具裝上去。'));
    }
  }
  updTools();
  app.append(caseTag(c),el('h2',null,'挑一個工具，修好這台機器'),el('p','lead','每一種修法都有作用，也有代價，可以換工具試試看，再選一個你覺得最好的。'),grid,choose);

  function install(t){
    if(busy)return;busy=true;
    S.tool=t.k;if(S.tried.indexOf(t.k)<0)S.tried.push(t.k);save(st);cur=t;
    buildMachine();m._svg.classList.remove('done');updTools();
    try{var r=m.getBoundingClientRect();if(r.top<0||r.top>window.innerHeight*0.6)m.scrollIntoView({behavior:REDUCE?'auto':'smooth',block:'start'})}catch(e){}
    runMachine(m,function(){busy=false;m._box.className='outbox fixed';m._box.innerHTML=fixHtml(t);updTools()});
  }
  function slotRect(){var s=m&&m._svg.querySelector('.slotbox');return s?s.getBoundingClientRect():null}
  function overMachine(x,y){var r=m.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
  function attachDrag(b,t){
    var sx=0,sy=0,down=false,drag=false,ghost=null,pid=null,suppress=false;
    b.addEventListener('pointerdown',function(e){
      if(busy||(e.pointerType==='mouse'&&e.button!==0))return;
      down=true;drag=false;sx=e.clientX;sy=e.clientY;pid=e.pointerId;
      try{b.setPointerCapture(pid)}catch(er){}
    });
    b.addEventListener('pointermove',function(e){
      if(!down||e.pointerId!==pid)return;
      var dx=e.clientX-sx,dy=e.clientY-sy;
      if(!drag&&dx*dx+dy*dy>64){
        drag=true;ghost=el('div','ghost',ic(t.k));document.body.appendChild(ghost);m._svg.classList.add('wait');
      }
      if(drag){
        e.preventDefault();
        ghost.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';
        m.classList.toggle('hot',overMachine(e.clientX,e.clientY));
      }
    });
    function end(e,cancel){
      if(!down||e.pointerId!==pid)return;down=false;
      try{b.releasePointerCapture(pid)}catch(er){}
      if(drag){
        suppress=true;setTimeout(function(){suppress=false},400);
        var hit=!cancel&&overMachine(e.clientX,e.clientY);
        m.classList.remove('hot');
        if(ghost){ghost.remove();ghost=null}
        if(hit)install(t);
        else if(!S.tool)m._svg.classList.add('wait');else m._svg.classList.remove('wait');
      }
      drag=false;
    }
    b.addEventListener('pointerup',function(e){end(e,false)});
    b.addEventListener('pointercancel',function(e){end(e,true)});
    b.addEventListener('click',function(){
      if(suppress||busy){suppress=false;return}
      // tap fallback: the tool flies to the socket, then the machine runs
      var r0=b.getBoundingClientRect(),r1=slotRect();
      if(!r1||REDUCE){install(t);return}
      busy=true;
      var gh=el('div','ghost',ic(t.k));gh.style.transform='translate('+(r0.left+r0.width/2)+'px,'+(r0.top+r0.height/2)+'px)';
      document.body.appendChild(gh);void gh.offsetWidth;gh.classList.add('fly');
      gh.style.transform='translate('+(r1.left+r1.width/2)+'px,'+(r1.top+r1.height/2)+'px) scale(.8)';
      setTimeout(function(){gh.remove();busy=false;install(t)},400);
    });
  }
}

/* ---------- end ---------- */
function end(){
  app.innerHTML='';
  var sum=el('div','sum'),same=0;
  CASES.forEach(function(C,c){
    var S=st.c[c],o=S.g!=null?C.opts[S.g]:null,t=C.tools.filter(function(x){return x.k===S.tool})[0];
    if(S.g===C.real)same++;
    var k=el('div','card');
    var r=el('div','row2');
    r.append(el('span','k','我猜的問題'),el('span','v',o?L[S.g]+'　'+o.s:'—'),
             el('span','k','我選的修法'),el('span','v',t?ic(t.k)+t.fix:'—'));
    k.append(el('h3',null,ic(C.icon)+'第 '+(c+1)+' 台：'+C.name),r);
    sum.appendChild(k);
  });
  var tot=el('div','card');
  tot.appendChild(el('div','row2','<span class="k">猜的和機器跑出來一樣</span><span class="v">'+same+' 台（共 3 台）</span>'));
  sum.appendChild(tot);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),sum);
}

function render(){
  var s=st.step|0;
  if(s<0||s>10)s=0;
  // guard: never land on a step whose earlier choices are missing
  for(var c=0;c<3;c++){
    var base=1+3*c;
    if(s>base&&st.c[c].g==null){s=base;break}
    if(s>base+2&&!st.c[c].tool){s=base+2;break}
  }
  st.step=s;
  if(s===0)intro();
  else if(s===10)end();
  else{var c2=Math.floor((s-1)/3),sub=(s-1)%3;[guess,reveal,fix][sub](c2)}
}
render();
})();
</script>
