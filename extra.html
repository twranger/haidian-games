<meta charset="utf-8">
<script src="fresh.js"></script>
<title>多出來的那一個</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: intro → three rounds of "gift boxes" (drag 5 stickers one by one into two people's boxes; the 5th can also go to a recycling bin or back to the teacher's drawer) → summary for a show of hands. Drag works with touch and mouse (pointer events); tapping a box is the fallback. No right answer: each choice only shows what it does. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);font-weight:700}
.btn.small{font-size:clamp(19px,2.4vw,21px);padding:10px 14px;text-align:center}
.btn.go{background:var(--rust)}
.btn:focus-visible,.zone:focus-visible,.stk:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 220px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
/* story */
.story{display:flex;flex-direction:row;gap:14px;align-items:center}
.story .faces{display:flex;flex:none}
.story .faces svg{width:64px;height:64px}
.story .faces svg+svg{margin-left:-14px}
.story p{margin:0;font-size:clamp(19px,2.6vw,23px);line-height:1.65}
/* tray */
.tray{display:flex;align-items:center;gap:16px;background:var(--warm);border:3px solid #EAD9B0;border-radius:22px;padding:12px 16px}
.stk{font:inherit;flex:none;width:92px;height:92px;border:0;background:transparent;padding:0;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;position:relative}
.stk svg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(31,42,46,.18))}
.stk.five svg{animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(0)}}
.stk.lift{opacity:.25}
.tray .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.tray .k{margin:0;font-weight:900;font-size:clamp(20px,2.9vw,26px);line-height:1.35}
.tray .h{margin:0;color:var(--muted);font-size:clamp(19px,2.3vw,21px);line-height:1.45}
.pips{display:flex;gap:4px;color:var(--ink)}
.pips svg.i{width:26px;height:26px}
.pips .used{opacity:.22}
.ghost{position:fixed;left:0;top:0;width:96px;height:96px;pointer-events:none;z-index:50;transform:translate(-50%,-50%) rotate(-6deg) scale(1.06)}
.ghost svg{width:100%;height:100%;filter:drop-shadow(0 8px 8px rgba(31,42,46,.25))}
/* zones */
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone{font:inherit;color:var(--ink);background:var(--card);border:4px dashed #B9C2BA;border-radius:22px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:border-color .15s,background .15s,transform .1s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-width:0}
.zone.hot{border-style:solid;border-color:var(--gold);background:var(--warm);transform:scale(1.03)}
.zone.flash{border-color:var(--sea)}
.zone.off{cursor:default}
.zone .av{width:64px;height:64px}
.zone .nm{font-weight:900;font-size:clamp(22px,3.2vw,28px);line-height:1.3}
.zone .wk{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px;font-size:clamp(19px,2.3vw,21px);color:var(--muted);font-weight:700;line-height:1.4}
.zone .box{display:flex;align-items:center;gap:8px;margin-top:4px}
.zone .box>svg.i{width:46px;height:46px}
.zone .cnt{font-size:clamp(30px,5vw,42px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.zone .cnt small{font-size:.5em;margin-left:2px}
.bag{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:30px}
.bag svg.i{width:28px;height:28px}
.zone.pop .box{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.zone.side{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;text-align:left}
.zone.side>svg.i{width:52px;height:52px}
.zone.side .t{display:flex;flex-direction:column;min-width:0}
.zone.side .t b{font-size:clamp(20px,2.9vw,25px);line-height:1.35}
.zone.side .t span{font-size:clamp(19px,2.3vw,21px);color:var(--muted);line-height:1.4}
.zone.side .bag{justify-content:flex-start;min-height:0}
.zone.side .bag svg.i{opacity:.55}
.zone.chosen{border-style:solid;border-color:var(--rust)}
.lt{position:absolute;top:8px;left:10px;width:34px;height:34px;border-radius:50%;background:var(--sea);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;line-height:1}
.zone.side .lt{position:static;flex:none}
/* summary */
.sum{gap:0}
.srow{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:2px solid var(--line)}
.srow:first-child{padding-top:0}
.srow:last-child{border-bottom:0;padding-bottom:0}
.srow p{margin:0}
.srow .rt{color:var(--muted);font-weight:700;font-size:clamp(19px,2.4vw,22px)}
.srow .pk{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(23px,3.4vw,30px);line-height:1.4}
.srow .pk .lt{position:static;flex:none;width:38px;height:38px;font-size:22px}
.srow .rs{font-size:clamp(19px,2.6vw,23px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;font-size:clamp(19px,2.4vw,22px);color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .lt{position:static;width:30px;height:30px;font-size:18px}
.howto{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--muted)}
.howto svg.i{width:72px;height:72px;color:var(--ink)}
.howto .arr{width:44px;height:44px;color:var(--gold)}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .zones{gap:10px}
  .zone .av{width:54px;height:54px}
  .stk{width:80px;height:80px}
  .story .faces svg{width:52px;height:52px}

}
@media (max-width:440px){
  .story{flex-direction:column;align-items:flex-start;gap:6px}
  .zone.side{flex-direction:column;align-items:center;text-align:center;padding:10px 6px;gap:4px}
  .zone.side .t{align-items:center}
  .zone.side .lt{position:absolute}
  .zone.side>svg.i{width:44px;height:44px}
  .tray{padding:10px 12px;gap:12px}
}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
var ICI={"sticker": "<path d=\"M5.6 3.5h12.8a2.1 2.1 0 0 1 2.1 2.1v9.2l-5.7 5.7H5.6a2.1 2.1 0 0 1-2.1-2.1V5.6a2.1 2.1 0 0 1 2.1-2.1z\" fill=\"#F7D6E0\"/><path d=\"M20.5 14.8h-3.6a2.1 2.1 0 0 0-2.1 2.1v3.6\" fill=\"#FBFCF9\"/><path d=\"M11 6.2l1.4 2.9 3.2.5-2.3 2.2.5 3.1-2.8-1.5-2.8 1.5.5-3.1-2.3-2.2 3.2-.5z\" fill=\"#F3D27A\"/>", "gift": "<rect x=\"4\" y=\"10.4\" width=\"16\" height=\"10.6\" rx=\"1.6\" fill=\"#DCE8F0\"/><rect x=\"2.8\" y=\"7\" width=\"18.4\" height=\"3.6\" rx=\"1.2\" fill=\"#FBFCF9\"/><path d=\"M12 7v14\"/><path d=\"M12 7C10.2 2.4 5 2.2 5.6 5.2 6 7 12 7 12 7zM12 7c1.8-4.6 7-4.8 6.4-1.8C18 7 12 7 12 7z\" fill=\"#F2B8A0\"/>", "bin": "<path d=\"M5.6 7.6h12.8l-1.1 12.5a1.6 1.6 0 0 1-1.6 1.4H8.3a1.6 1.6 0 0 1-1.6-1.4z\" fill=\"#CFE3C4\"/><path d=\"M3.5 7.6h17\"/><path d=\"M9.4 7.6V5.1a1 1 0 0 1 1-1h3.2a1 1 0 0 1 1 1v2.5\"/><path d=\"M10 11.2v6.6M14 11.2v6.6\"/>", "drawer": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"11.6\" rx=\"1.6\" fill=\"#F3E3BE\"/><path d=\"M3 8.8h18\"/><path d=\"M10 5.9h4M10 11.7h4\"/><path d=\"M1.8 14.6h20.4v4.9a1.5 1.5 0 0 1-1.5 1.5H3.3a1.5 1.5 0 0 1-1.5-1.5z\" fill=\"#FBF4E2\"/><path d=\"M10 17.8h4\"/>", "broom": "<path d=\"M12 2v8.4\"/><rect x=\"9\" y=\"10.4\" width=\"6\" height=\"2.6\" rx=\".8\" fill=\"#DCE8F0\"/><path d=\"M9.2 13L5 21.2h14L14.8 13z\" fill=\"#F3E3BE\"/><path d=\"M8.4 21.2l1.8-5M12 21.2v-5M15.6 21.2l-1.8-5\"/>", "window": "<rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"1.6\" fill=\"#DCE8F0\"/><path d=\"M12 3.5v17M3.5 12h17\"/><path d=\"M6.4 9.2l2.6-2.6M14.6 17.4l2.6-2.6\"/>"};
function ic(k,c){return '<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICI[k]+'</svg>'}
var AVI={"man": "<circle cx=\"32\" cy=\"32\" r=\"31\" fill=\"#EEF1EC\"/><path d=\"M12 64 Q13 44 32 44 Q51 44 52 64 Z\" fill=\"#205E86\"/><circle cx=\"32\" cy=\"27\" r=\"13\" fill=\"#E9BE96\"/><path d=\"M19 25 Q19 12 32 13 Q45 12 45 25 Q40 18 32 18.5 Q24 18 19 25 Z\" fill=\"#2B2118\"/><circle cx=\"27.5\" cy=\"28\" r=\"1.8\" fill=\"#1F2A2E\"/><circle cx=\"36.5\" cy=\"28\" r=\"1.8\" fill=\"#1F2A2E\"/><path d=\"M27.5 33 Q32 36.5 36.5 33\" fill=\"none\" stroke=\"#1F2A2E\" stroke-width=\"2\" stroke-linecap=\"round\"/>", "woman": "<circle cx=\"32\" cy=\"32\" r=\"31\" fill=\"#EEF1EC\"/><path d=\"M12 64 Q13 44 32 44 Q51 44 52 64 Z\" fill=\"#2F7D4F\"/><circle cx=\"32\" cy=\"27\" r=\"13\" fill=\"#F2CFAE\"/><path d=\"M18 34 Q16 12 32 12.5 Q48 12 46 34 Q44 22 40 19 Q32 22 22 19.5 Q19 24 18 34 Z\" fill=\"#5A3A22\"/><circle cx=\"27.5\" cy=\"28\" r=\"1.8\" fill=\"#1F2A2E\"/><circle cx=\"36.5\" cy=\"28\" r=\"1.8\" fill=\"#1F2A2E\"/><path d=\"M27.5 33 Q32 36.5 36.5 33\" fill=\"none\" stroke=\"#1F2A2E\" stroke-width=\"2\" stroke-linecap=\"round\"/>", "person": "<circle cx=\"32\" cy=\"32\" r=\"31\" fill=\"#EEF1EC\"/><path d=\"M12 64 Q13 44 32 44 Q51 44 52 64 Z\" fill=\"#B7862B\"/><circle cx=\"32\" cy=\"27\" r=\"13\" fill=\"#E3B48C\"/><path d=\"M19.5 24 Q20 12.5 32 13 Q44 12.5 44.5 24 Q38 17 26 19 Q22 20 19.5 24 Z\" fill=\"#3A2A1C\"/><circle cx=\"27.5\" cy=\"28\" r=\"1.8\" fill=\"#1F2A2E\"/><circle cx=\"36.5\" cy=\"28\" r=\"1.8\" fill=\"#1F2A2E\"/><path d=\"M27.5 33 Q32 36.5 36.5 33\" fill=\"none\" stroke=\"#1F2A2E\" stroke-width=\"2\" stroke-linecap=\"round\"/>"};
function av(k){return '<svg class="av" viewBox="0 0 64 64" aria-hidden="true">'+AVI[k]+'</svg>'}

var app=document.getElementById('app');
var KEY='extra-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function fresh(){return {step:0,r:[{give:[],fifth:null},{give:[],fifth:null},{give:[],fifth:null}]}}
var st=load();
if(!st||!st.r||st.r.length!==3)st=fresh();
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function button(txt,cls,fn){var b=el('button',cls||'btn',txt);b.type='button';b.addEventListener('click',fn);return b}
function go(n){st.step=n;save(st);render();try{window.scrollTo(0,0)}catch(e){}}

var BROOM=ic('broom')+'掃地', WIN=ic('window')+'擦窗戶';
var R=[
 {tag:'第一關',names:['阿宏','小芸'],av:['man','woman'],work:[[BROOM],[BROOM]],
  story:'放學後，五年13班的阿宏和小芸留下來，一起把教室打掃乾淨。阿宏掃前半間，小芸掃後半間，兩個人做得<b>一樣多</b>。老師拿出 5 張很漂亮的貼紙，請你幫忙分給他們。',
  ask:'最後這一張怎麼辦？'},
 {tag:'第二關',names:['阿宏','小芸'],av:['man','woman'],work:[[BROOM,WIN],[BROOM]],
  story:'第二天，阿宏和小芸又一起打掃，一樣一人掃半間。掃完以後，阿宏還多擦了窗戶，這次<b>阿宏做得比較多</b>。老師一樣拿出 5 張貼紙，請你分給他們。',
  ask:'這次阿宏做得比較多。最後這一張，你會怎麼處理？'},
 {tag:'第三關',names:['你','小芸'],av:['person','woman'],work:[[BROOM],[BROOM]],
  story:'這次換你了！你和小芸一起打掃，一人掃半間，兩個人做得<b>一樣多</b>。老師把 5 張貼紙交給你：「你來分，你自己也可以拿喔。」',
  ask:'最後這一張可以給你自己。你會拿嗎？'}
];
var LT={a:'A',b:'B',t:'C',d:'D'};
function label(ri,k){
  if(k==='a')return ri===2?'自己拿':'給阿宏';
  if(k==='b')return '給小芸';
  if(k==='t')return '丟進回收桶';
  return '放回老師的抽屜';
}
function counts(r){
  var a=0,b=0;r.give.forEach(function(x){if(x==='a')a++;else b++});
  if(r.fifth==='a')a++;if(r.fifth==='b')b++;
  return {a:a,b:b};
}
function pair(ri,c){return R[ri].names[0]+' '+c.a+' 張、小芸 '+c.b+' 張'}
function effect(ri){
  var r=st.r[ri],c=counts(r),k=r.fifth,d=c.a-c.b,s='';
  if(k==='a'||k==='b'){
    s='5 張全都發出去了，現在是'+pair(ri,c)+'。';
    if(ri===0){if(d!==0)s+='兩個人做得一樣多，'+(d>0?'阿宏':'小芸')+'多拿了 '+Math.abs(d)+' 張。'}
    else if(ri===1){if(d>0)s+='做得比較多的阿宏，也拿得比較多。';else if(d<0)s+='做得比較多的阿宏，這次反而拿得比較少。'}
    else{if(d>0)s+='兩個人做得一樣多，你自己多拿了 '+d+' 張。';else if(d<0)s+='兩個人做得一樣多，你把多的讓給了小芸，她多拿了 '+(-d)+' 張。'}
  }else{
    s='現在是'+pair(ri,c)+'。'+(d===0?'兩個人一樣多。':'');
    if(ri===1&&d===0)s+='阿宏做得比較多，拿到的和小芸一樣多。';
    s+=k==='t'?'可是這一張丟進回收桶就沒了，誰都用不到。':'這一張沒有丟掉，放回抽屜下次再用；只是今天沒有人拿到它。';
  }
  return s;
}

/* ---------- step 0: intro ---------- */
function intro(){
  app.innerHTML='';
  var c=el('div','card');
  c.append(el('p','lead','老師有一些很漂亮的貼紙，想請你幫忙分。一共有三關，每一關都是 <b style="white-space:nowrap">5 張</b>。'),
    el('div','howto',ic('sticker')+'<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13.5 6.5L19 12l-5.5 5.5"/></svg>'+ic('gift')),
    el('p','lead','<b>怎麼玩：</b>用手指按住貼紙，拖到誰的禮物盒，放開就送給誰了。不方便拖的話，直接點一下盒子也可以。'),
    el('p','note','這幾題沒有標準答案，照你自己的想法分就好。'));
  app.append(el('h1',null,'多出來的那一個'),c,button('開始第一關','btn',function(){go(1)}));
}

/* ---------- steps 1–3: rounds ---------- */
var lastK=null;
function round(ri){
  var D=R[ri],r=st.r[ri],n=r.give.length,done=r.fifth!=null,five=n>=4;
  app.innerHTML='';
  var story=el('div','card story');
  story.append(el('div','faces',av(D.av[0])+av(D.av[1])),el('p',null,D.story));
  var h,lead;
  if(!five){
    h=el('h2',null,'先把 4 張貼紙放進兩個人的盒子');
    lead=el('p','lead','一次一張。拖到誰的盒子，就是給誰；也可以直接點盒子。');
  }else if(!done){
    h=el('h2',null,D.ask);
    lead=el('p','lead','可以'+(ri===2?'自己拿':'拖給阿宏')+'、給小芸，丟進<b>回收桶</b>（丟掉了就沒了），或放回<b>老師的抽屜</b>，下次再用。');
  }else{
    h=el('h2',null,'第 5 張：'+label(ri,r.fifth));
    lead=null;
  }
  h.id='q';
  /* tray */
  var tray=el('div','tray'),stk=null;
  var pips=el('div','pips');
  for(var i=0;i<5;i++)pips.insertAdjacentHTML('beforeend',ic('sticker',i<n+(done?1:0)?'used':''));
  if(!done){
    stk=el('button','stk'+(five?' five':''),'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICI.sticker+'</svg>');
    stk.type='button';stk.setAttribute('aria-label','第 '+(n+1)+' 張貼紙，拖到盒子裡');
    var tx=el('div','tx');
    tx.append(el('p','k',five?'第 5 張，也是最後一張':'第 '+(n+1)+' 張'),pips,el('p','h','拖過去，或點盒子'));
    tray.append(stk,tx);
  }else{tray=null}
  /* zones */
  var zones=el('div','zones'),Z={};
  [0,1].forEach(function(p){
    var k=p===0?'a':'b';
    var z=el('button','zone'+(done?' off':'')+(done&&r.fifth===k?' chosen':''));z.type='button';z.dataset.k=k;
    var cnt=r.give.filter(function(x){return x===k}).length+(r.fifth===k?1:0);
    var bag='';for(var j=0;j<cnt;j++)bag+=ic('sticker');
    z.innerHTML=(five?'<span class="lt">'+LT[k]+'</span>':'')+av(D.av[p])+'<span class="nm">'+D.names[p]+'</span><span class="wk">'+D.work[p].map(function(w){return '<span>'+w+'</span>'}).join('')+'</span>'+
      '<span class="box">'+ic('gift')+'<span class="cnt">'+cnt+'<small>張</small></span></span><span class="bag">'+bag+'</span>';
    z.setAttribute('aria-label',D.names[p]+'的禮物盒，現在 '+cnt+' 張'+(done?'':'，點一下把貼紙放進去'));
    Z[k]=z;zones.appendChild(z);
  });
  var side=null;
  if(five){
    side=el('div','zones');
    [['t','bin','回收桶','丟掉了就沒了'],['d','drawer','老師的抽屜','放回去，下次再用']].forEach(function(o){
      var z=el('button','zone side'+(done?' off':'')+(r.fifth===o[0]?' chosen':''));z.type='button';z.dataset.k=o[0];
      z.innerHTML='<span class="lt">'+LT[o[0]]+'</span>'+ic(o[1])+'<span class="t"><b>'+o[2]+'</b><span>'+o[3]+'</span>'+(r.fifth===o[0]?'<span class="bag">'+ic('sticker')+'</span>':'')+'</span>';
      z.setAttribute('aria-label',o[2]+'：'+o[3]);
      Z[o[0]]=z;side.appendChild(z);
    });
  }
  function place(k){
    if(st.r[ri].fifth!=null)return;
    if(st.r[ri].give.length<4){if(k!=='a'&&k!=='b')return;st.r[ri].give.push(k)}
    else st.r[ri].fifth=k;
    save(st);lastK=k;var wasFour=st.r[ri].give.length===4&&st.r[ri].fifth==null;
    round(ri);
    if(wasFour||st.r[ri].fifth!=null){try{document.getElementById('q').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}}
  }
  Object.keys(Z).forEach(function(k){Z[k].addEventListener('click',function(){if(!done)place(k)})});
  if(lastK&&Z[lastK]){Z[lastK].classList.add('pop')}lastK=null;
  /* drag */
  if(stk){
    var drag=null;
    function zoneAt(x,y){
      var list=document.elementsFromPoint?document.elementsFromPoint(x,y):[];
      for(var i=0;i<list.length;i++){var z=list[i].closest&&list[i].closest('.zone');if(z&&Z[z.dataset.k]===z)return z}
      return null;
    }
    function clearHot(){Object.keys(Z).forEach(function(k){Z[k].classList.remove('hot')})}
    function end(){if(!drag)return;if(drag.g)drag.g.remove();stk.classList.remove('lift');clearHot();drag=null}
    stk.addEventListener('pointerdown',function(e){
      if(e.button!=null&&e.button>0)return;
      e.preventDefault();try{stk.setPointerCapture(e.pointerId)}catch(x){}
      drag={x:e.clientX,y:e.clientY,g:null};
    });
    stk.addEventListener('pointermove',function(e){
      if(!drag)return;
      if(!drag.g){
        if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<6)return;
        drag.g=el('div','ghost',stk.innerHTML);document.body.appendChild(drag.g);stk.classList.add('lift');
      }
      drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
      clearHot();var z=zoneAt(e.clientX,e.clientY);if(z)z.classList.add('hot');
    });
    stk.addEventListener('pointerup',function(e){
      if(!drag)return;
      var moved=!!drag.g,z=moved?zoneAt(e.clientX,e.clientY):null;end();
      if(z)place(z.dataset.k);
      else if(!moved){Object.keys(Z).forEach(function(k){var b=Z[k];b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');setTimeout(function(){b.classList.remove('flash')},600)})}
    });
    stk.addEventListener('pointercancel',end);
    stk.addEventListener('lostpointercapture',function(){setTimeout(end,0)});
  }
  /* bottom */
  var bottom=el('div','opts');bottom.style.display='flex';bottom.style.flexDirection='column';bottom.style.gap='12px';
  if(done){
    bottom.append(el('p','note warm',effect(ri)),el('p','lead','這一題沒有標準答案。等一下老師會問大家，各選了哪一種。'));
    var bb=el('div','row-btns');
    bb.append(button('把第 5 張拿回來，重新想','btn alt small',function(){st.r[ri].fifth=null;save(st);round(ri)}),
      button(ri<2?'下一關':'看看我的選擇','btn go',function(){go(ri+2)}));
    bottom.appendChild(bb);
  }else if(n>0&&!five){
    bottom.appendChild(button('這幾張重新分','btn alt small',function(){st.r[ri].give=[];save(st);round(ri)}));
  }else if(five){
    bottom.appendChild(button('前 4 張重新分','btn alt small',function(){st.r[ri].give=[];save(st);round(ri)}));
  }
  app.append(el('p','case',D.tag),story,h);
  if(lead)app.appendChild(lead);
  if(tray)app.appendChild(tray);
  app.appendChild(zones);
  if(side)app.appendChild(side);
  app.appendChild(bottom);
}

/* ---------- step 4: end ---------- */
function end(){
  app.innerHTML='';
  var head=['第一關：阿宏和小芸做得一樣多','第二關：阿宏做得比較多（多擦了窗戶）','第三關：你和小芸做得一樣多'];
  var c=el('div','card sum');
  st.r.forEach(function(r,ri){
    var x=counts(r),b=el('div','srow');
    b.append(el('p','rt',head[ri]),el('p','pk',r.fifth?'<span class="lt">'+LT[r.fifth]+'</span>第 5 張：'+label(ri,r.fifth):'還沒選'),el('p','rs','最後：'+pair(ri,x)));
    c.appendChild(b);
  });
  var lg=el('p','legend','<span><span class="lt">A</span>給阿宏（第三關是自己拿）</span><span><span class="lt">B</span>給小芸</span><span><span class="lt">C</span>丟進回收桶</span><span><span class="lt">D</span>放回老師的抽屜</span>');
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c,lg);
}

function render(){
  var s=st.step|0;
  for(var i=0;i<3;i++){if(s>i+1&&st.r[i].fifth==null){s=i+1;break}}
  st.step=s;
  if(s===0)intro();else if(s<=3)round(s-1);else end();
}
render();
})();
</script>
