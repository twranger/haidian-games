<meta charset="utf-8">
<script src="fresh.js"></script>
<title>班長排順序</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: class meeting story + three option cards → three preference groups (9/8/8) + guess → agenda board (drag or tap three option cards into
   "match 1: _ vs _ / match 2: winner vs _"), press 開會表決, raised hands animate match by match → repeat until all three arrangements tried →
   compare (three winners + cycle diagram) → mission: make 寫卡片 win → what to do about the agenda setter (all options ok, effect/cost) → summary. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn:disabled{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.small{font-size:clamp(19px,2.4vw,21px);padding:10px 14px;text-align:center;justify-content:center}
.btn.go{background:var(--rust)}
.btn:focus-visible,.tok:focus-visible,.slot:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 220px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn.alt svg.i{width:1.6em;height:1.6em}
/* option colors */
.oX{--oc:#A8441A;--of:#F6DCCF}.oY{--oc:#205E86;--of:#DCE8F0}.oZ{--oc:#2F7D4F;--of:#DCEBD5}
.onm{font-weight:900;color:var(--oc);white-space:nowrap}
.onm svg.i{color:var(--ink)}
/* intro options */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{background:var(--card);border:3px solid var(--oc);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.opt svg.i{width:64px;height:64px}
.opt h3{margin:0;font-size:clamp(22px,3.2vw,28px);color:var(--oc)}
.opt p{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted);line-height:1.55}
/* groups */
.grp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gcard{background:var(--card);border:3px solid var(--gc);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.g0{--gc:#A8441A;--gf:#F6DCCF}.g1{--gc:#205E86;--gf:#DCE8F0}.g2{--gc:#2F7D4F;--gf:#DCEBD5}
.gcard h3{margin:0;font-size:clamp(22px,3vw,27px);display:flex;align-items:center;gap:8px;color:var(--gc)}
.gcard h3 small{font-size:.8em;color:var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.dots svg{width:22px;height:22px}
.gcard ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:clamp(19px,2.4vw,22px)}
.gcard li{display:flex;align-items:center;gap:6px}
.gcard li .rk{display:inline-block;min-width:3.6em;color:var(--muted);font-weight:700}
/* agenda board */
.board{background:#F4ECD8;border:3px solid #CDB98A;border-radius:22px;padding:clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:14px}
.board .bt{margin:0;font-size:clamp(21px,3vw,27px);font-weight:900;display:flex;align-items:center;gap:8px}
.mrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.mrow .lab{font-weight:900;font-size:clamp(19px,2.7vw,24px);white-space:nowrap}
.mslots{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.mslots .vs{font-weight:900;color:var(--muted);flex:none;font-size:clamp(19px,2.6vw,23px)}
.slot{flex:1 1 0;min-width:0;min-height:68px;border:3px dashed #B9A777;border-radius:16px;background:#FBF7EC;display:flex;align-items:center;justify-content:center;padding:4px;color:#8C7A4C;font-weight:700;font-size:clamp(19px,2.4vw,21px);transition:background .12s,border-color .12s}
.slot.over{background:var(--warm);border-color:var(--gold);border-style:solid}
.slot.fixed{border-style:solid;border-color:#CDB98A;background:#EFE5CC;color:var(--ink);font-weight:900;text-align:center;line-height:1.3}
.slot .tok{width:100%}
.tray{border:3px dashed var(--line);border-radius:18px;padding:10px;display:flex;gap:10px;flex-wrap:wrap;min-height:86px;align-items:center;justify-content:center;transition:background .12s}
.tray.over{background:var(--note)}
.tray .empty{color:var(--muted);font-size:clamp(19px,2.4vw,21px)}
.tok{font:inherit;font-size:clamp(19px,2.6vw,23px);font-weight:900;color:var(--oc);background:var(--of);border:3px solid var(--oc);border-radius:14px;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;min-height:56px;white-space:nowrap}
.tray .tok{flex:0 1 auto;min-width:130px}
.tok svg.i{width:1.5em;height:1.5em;color:var(--ink)}
.tok .grip{width:.9em;height:.9em;color:var(--muted);opacity:.7}
.tok.dragging{opacity:.3}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.22);transform:translate(-50%,-50%) rotate(-3deg);cursor:grabbing}
.hint{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted)}
/* matches */
.match{gap:10px}
.match .mh{margin:0;font-size:clamp(21px,3vw,26px);font-weight:900}
.match .mh .tag2{color:var(--sea)}
.vsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);transition:border-color .3s,background .3s,opacity .3s}
.col .ct{font-size:clamp(20px,2.8vw,25px);font-weight:900;color:var(--oc);display:flex;align-items:center;gap:6px}
.col .ct svg.i{width:1.5em;height:1.5em;color:var(--ink)}
.col .cnt{font-size:clamp(38px,6.5vw,56px);font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.col .cnt small{font-size:.4em;margin-left:3px;color:var(--muted)}
.hands{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;min-height:56px;align-content:flex-start}
.hands svg{width:26px;height:26px;transition:transform .25s,opacity .25s}
.hands svg.pre{opacity:0;transform:translateY(14px) scale(.6)}
.col .res{font-weight:900;font-size:clamp(19px,2.6vw,23px);display:flex;align-items:center;gap:6px;min-height:1.6em}
.col.win{border-color:var(--gold);background:var(--warm)}
.col.win .res{color:#7A5A16}
.col.lose{opacity:.55}
.col.lose .res{color:var(--muted)}
.col .res.pre{visibility:hidden}
ul.gl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:clamp(19px,2.4vw,22px)}
ul.gl li{display:block;border-radius:12px;padding:4px 8px;transition:background .2s}
ul.gl li.on{background:var(--warm)}
ul.gl li b.gn{color:var(--gc)}
ul.gl svg.hh{width:24px;height:24px;vertical-align:-5px;margin-right:6px}
.match.pre{display:none}
.final{background:var(--warm);border:3px solid var(--gold);border-radius:22px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.final.pre{display:none}
.final .k{margin:0;font-size:clamp(19px,2.6vw,24px);font-weight:700;color:var(--muted)}
.final .v{margin:0;font-size:clamp(34px,6vw,52px);font-weight:900;display:flex;align-items:center;gap:10px;line-height:1.2}
.final .v svg.i{width:1.3em;height:1.3em}
/* record */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:700}
td.w{white-space:nowrap}
td.todo{color:var(--muted)}
.rec td:first-child{white-space:nowrap;font-weight:700;color:var(--muted)}
.cyc{display:flex;justify-content:center}
.cyc svg{width:100%;max-width:440px;height:auto}
.big{font-size:clamp(40px,8vw,72px);font-weight:900;text-align:center;color:var(--good);margin:0;line-height:1.2}
.big svg.i{color:var(--ink)}
.why{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:clamp(19px,2.6vw,24px);line-height:1.65}
.eff{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.6vw,24px);line-height:1.65}
.eff dt{font-weight:900;white-space:nowrap}
.eff dt.a{color:var(--good)}.eff dt.c{color:var(--rust)}
.eff dd{margin:0}
.sum td:first-child{color:var(--muted);font-weight:700;width:38%}
@media (max-width:700px){
  .three,.grp3{grid-template-columns:1fr}
  .opt{flex-direction:row;text-align:left;align-items:center;gap:12px}
  .opt svg.i{width:52px;height:52px}
  .mrow{grid-template-columns:1fr;gap:6px}
}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .tok{padding:6px 6px;gap:4px}
  .tok .grip{display:none}
  .tray .tok{min-width:0;flex:1 1 0}
  .mslots{gap:6px}
  .hands svg{width:22px;height:22px}
  th,td{padding:8px 4px}
  .sum td:first-child{width:40%}
}
@media (prefers-reduced-motion:reduce){.hands svg,.col,ul.gl li{transition:none}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

function rank(g,k){return g.r.indexOf(k)}
/* one pairwise vote: every group raises hands for whichever of a,b it ranks higher */
function match(a,b){
  var va=0,vb=0,gs=[];
  GR.forEach(function(g,i){var to=rank(g,a)<rank(g,b)?a:b;if(to===a)va+=g.n;else vb+=g.n;gs.push({g:i,to:to})});
  return {a:a,b:b,va:va,vb:vb,w:va>vb?a:b,l:va>vb?b:a,gs:gs};
}
/* board = [first match left, first match right, waits for second match] */
function runAgenda(bd){var m1=match(bd[0],bd[1]);var m2=match(m1.w,bd[2]);return {m1:m1,m2:m2,w:m2.w}}
window.agendaCalc={match:match,runAgenda:runAgenda};

function onm(k,noIcon){return '<span class="onm o'+k+'">'+(noIcon?'':ic(O[k].ic)+' ')+O[k].name+'</span>'}
function descr(bd){return '先比 '+onm(bd[0],1)+' 和 '+onm(bd[1],1)+'，最後才比 '+onm(bd[2],1)}

/* ---------- agenda board with drag + tap ---------- */
function boardUI(bd,onChange){
  var wrap=el('div','opts');
  var board=el('div','board');
  var tray=el('div','tray');tray.setAttribute('aria-label','選項牌');
  var slots=[];
  function tokEl(k){
    var b=el('button','tok o'+k,ic('grip','grip')+ic(O[k].ic)+'<span>'+O[k].name+'</span>');b.type='button';b.dataset.k=k;
    var where=bd.indexOf(k);
    b.setAttribute('aria-label',O[k].name+(where<0?'：點一下放進下一個空格':'：點一下拿回來'));
    attachDrag(b,k);
    return b;
  }
  function draw(){
    board.innerHTML='';slots=[];
    board.appendChild(el('p','bt',ic('clipboard')+'班會議程板'));
    function slot(i){
      var s=el('div','slot');s.dataset.i=i;
      if(bd[i])s.appendChild(tokEl(bd[i]));else s.textContent='放一張牌';
      slots.push(s);return s;
    }
    var r1=el('div','mrow');var ms1=el('div','mslots');ms1.append(slot(0),el('span','vs','對'),slot(1));r1.append(el('span','lab','第一場：'),ms1);
    var r2=el('div','mrow');var ms2=el('div','mslots');ms2.append(el('div','slot fixed','第一場的贏家'),el('span','vs','對'),slot(2));r2.append(el('span','lab','第二場：'),ms2);
    board.append(r1,r2);
    tray.innerHTML='';
    var left=KEYS.filter(function(k){return bd.indexOf(k)<0});
    if(left.length)left.forEach(function(k){tray.appendChild(tokEl(k))});
    else tray.appendChild(el('span','empty','三張牌都排好了'));
  }
  function place(k,i){
    var from=bd.indexOf(k);
    if(i<0){if(from>=0)bd[from]=null}
    else{
      var occ=bd[i];
      if(from>=0)bd[from]=null;
      if(occ&&occ!==k&&from>=0)bd[from]=occ;
      bd[i]=k;
    }
    draw();onChange();
  }
  function tap(k){
    var from=bd.indexOf(k);
    if(from>=0)place(k,-1);
    else{var e=bd.indexOf(null);if(e>=0)place(k,e)}
  }
  var suppress=null;
  function attachDrag(b,k){
    var sx=0,sy=0,dragging=false,ghost=null,pid=null,over=null;
    b.addEventListener('pointerdown',function(ev){
      if(ev.button!==undefined&&ev.button!==0)return;
      pid=ev.pointerId;sx=ev.clientX;sy=ev.clientY;dragging=false;
      try{b.setPointerCapture(pid)}catch(e){}
    });
    b.addEventListener('pointermove',function(ev){
      if(pid!==ev.pointerId)return;
      var dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!dragging&&dx*dx+dy*dy>36){
        dragging=true;
        ghost=b.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=b.offsetWidth+'px';document.body.appendChild(ghost);
        b.classList.add('dragging');
      }
      if(dragging){
        ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
        var t=target(ev.clientX,ev.clientY);
        if(over&&over!==t)over.classList.remove('over');
        if(t)t.classList.add('over');over=t;
        ev.preventDefault();
      }
    });
    function end(ev,cancel){
      if(pid!==ev.pointerId)return;
      pid=null;
      if(!dragging)return;
      dragging=false;suppress=k;setTimeout(function(){if(suppress===k)suppress=null},350);
      if(ghost){ghost.remove();ghost=null}
      b.classList.remove('dragging');
      if(over)over.classList.remove('over');
      var t=cancel?null:target(ev.clientX,ev.clientY);over=null;
      if(!t){draw();return}
      if(t===tray)place(k,-1);else place(k,+t.dataset.i);
    }
    b.addEventListener('pointerup',function(ev){end(ev,false)});
    b.addEventListener('pointercancel',function(ev){end(ev,true)});
    b.addEventListener('click',function(){if(suppress===k)return;tap(k)});
  }
  function target(x,y){
    var e=document.elementFromPoint(x,y);if(!e)return null;
    var s=e.closest('.slot');if(s&&!s.classList.contains('fixed'))return s;
    if(e.closest('.tray'))return tray;
    return null;
  }
  draw();
  wrap.append(board,el('p','case','選項牌'),tray,el('p','hint','用手指或滑鼠把牌拖進空格。也可以用點的：依序點三張牌，會照順序放進空格；點格子裡的牌，可以拿回來重排。'));
  return wrap;
}

    ul.appendChild(li);lis.push(li);

function playBlock(B,t0,speed){
  var t=t0;
  timers.push(setTimeout(function(){B.el.classList.remove('pre');try{B.el.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){}},t));
  t+=500*speed;
  B.m.gs.forEach(function(x,gi){
    var gr=GR[x.g],cc=B.cols[x.to];
    timers.push(setTimeout(function(){B.lis.forEach(function(l){l.classList.remove('on')});B.lis[gi].classList.add('on')},t));
    t+=250*speed;
    for(var j=0;j<gr.n;j++){(function(){
      timers.push(setTimeout(function(){
        var h=cc.hs.querySelector('svg.pre');if(h)h.classList.remove('pre');
        cc.n++;cc.cnt.innerHTML=cc.n+'<small>票</small>';
      },t));t+=70*speed;
    })()}
    t+=380*speed;
  });
  timers.push(setTimeout(function(){
    B.lis.forEach(function(l){l.classList.remove('on')});
    [B.m.a,B.m.b].forEach(function(k){var cc=B.cols[k];cc.col.classList.add(k===B.m.w?'win':'lose');cc.res.classList.remove('pre')});
  },t));
  return t+600*speed;
}
function voteView(bd,anim,after){
  var R=runAgenda(bd);
  var box=el('div','opts');
  var b1=matchBlock(R.m1,'第一場：',anim),b2=matchBlock(R.m2,'第二場：',anim);
  var fin=el('div','final'+(anim?' pre':''));
  fin.append(el('p','k','最後贏的是'),el('p','v o'+R.w,ic(O[R.w].ic)+'<span class="onm">'+O[R.w].name+'</span>'));
  box.append(b1.el,b2.el,fin);
  box.dataset.done=anim?'0':'1';
  if(anim){
    var speed=1;try{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)speed=.35}catch(e){}
    var t=playBlock(b1,200,speed);t=playBlock(b2,t,speed);
    timers.push(setTimeout(function(){fin.classList.remove('pre');box.dataset.done='1';try{fin.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){};if(after)after()},t));
  }
  return box;
}

  app.innerHTML='';
  var bd=st.mTries[st.mTries.length-1];var R=runAgenda(bd);var ok=R.w==='Z';
  var anim=animateNext;animateNext=false;
  var tail=el('div','opts');
  if(ok){
    var c=el('div','card');
    c.append(el('p','big',ic('card')+' 寫卡片贏了'),
      el('p','lead','你讓 '+onm(bd[0],1)+' 和 '+onm(bd[1],1)+' 先比，'+onm(R.m1.w,1)+' '+Math.max(R.m1.va,R.m1.vb)+' 比 '+Math.min(R.m1.va,R.m1.vb)+' 贏了；第二場，寫卡片再以 '+Math.max(R.m2.va,R.m2.vb)+' 比 '+Math.min(R.m2.va,R.m2.vb)+' 打敗它。'),
      el('p','lead','全班的想法一點都沒變，只是順序是你排的。'));
    tail.append(c,button('下一步','btn',function(){go(7)}));
  }else{
    var c2=el('div','card');
    c2.append(el('p','lead','這次最後贏的是「'+O[R.w].name+'」，不是寫卡片。'),
      el('p','note warm','想一想：寫卡片一對一的時候，打得贏哪一個？要讓那一個在第一場先贏，寫卡片留到第二場再上場。'));
    if(st.mReveal)c2.appendChild(el('p','note','參考排法：第一場 '+onm('X',1)+' 對 '+onm('Y',1)+'，躲避球會贏；第二場寫卡片再對躲避球，寫卡片 16 比 9 贏。'));
    var rb=el('div','row-btns');
    rb.appendChild(button('再排一次','btn',function(){st.mBoard=[null,null,null];go(5)}));
    if(!st.mReveal)rb.appendChild(button('看參考排法','btn alt small',function(){st.mReveal=true;save(st);render()}));
    else rb.appendChild(button('下一步','btn alt small',function(){go(7)}));
    tail.append(c2,rb);
  }
  app.append(el('p','case','班長的任務：結果'),el('h2',null,'議程：'+descr(bd)),voteView(bd,anim),tail);
}

/* ---------- step 7: what should we do ---------- */
function feel(){
  app.innerHTML='';
  var g=el('div','opts');var info=el('div','opts');
  var nx=button('下一步','btn',function(){if(st.feel==null)return;go(8)});nx.disabled=st.feel==null;
  function show(){
    info.innerHTML='';if(st.feel==null)return;
    var f=FEEL[st.feel];var c=el('div','card');
    var dl=el('dl','eff');dl.append(el('dt','a','作用'),el('dd',null,f.a),el('dt','c','代價'),el('dd',null,f.c));
    c.append(el('p','lead','你選了「<b>'+f.t+'</b>」。'),dl,el('p','hint','每一種辦法都有人支持，也都有代價。等一下全班一起討論。'));
    info.appendChild(c);
  }
  FEEL.forEach(function(f,i){
    var b=button(ic(f.ic)+'<span>'+f.t+'</span>','btn alt'+(st.feel===i?' pick':''),function(){
      st.feel=i;save(st);Array.prototype.forEach.call(g.children,function(x){x.classList.remove('pick')});b.classList.add('pick');nx.disabled=false;show();
    });
    g.appendChild(b);
  });
  show();
  app.append(el('p','case','你覺得呢？'),el('h2',null,'排順序的人可以決定結果，你覺得怎麼辦比較好？'),el('p','lead','選一個你最贊成的。沒有標準答案，選哪一個都可以。'),g,info,nx);
}

/* ---------- step 8: end ---------- */
function end(){
  app.innerHTML='';
  var gs=st.guess;
  var rows=[['一開始我猜全班最想要',gs==='?'?'看不出來，三個好像差不多':(O[gs]?onm(gs):'—')]];
  st.runs.forEach(function(r,i){rows.push(['第 '+(i+1)+' 種排法',descr(r)+'<br>→ '+onm(runAgenda(r).w)+' 贏'])});
  var last=st.mTries[st.mTries.length-1],ok=last&&runAgenda(last).w==='Z';
  var okIdx=-1;st.mTries.forEach(function(b,i){if(okIdx<0&&runAgenda(b).w==='Z')okIdx=i});
  rows.push(['讓寫卡片贏的排法',ok?descr(last)+'<br>'+(okIdx===0?'（第 1 次就排出來）':'（第 '+(okIdx+1)+' 次排出來）'):'還沒排出來（看了參考排法）']);
  rows.push(['我覺得怎麼辦比較好',st.feel!=null?ic(FEEL[st.feel].ic)+' '+FEEL[st.feel].t:'—']);
  var t=el('table','sum');
  rows.forEach(function(r){var tr=el('tr');tr.append(el('td',null,r[0]),el('td',null,r[1]));t.appendChild(tr)});
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}

function render(){
  var S=[intro,groups,explore,exploreResult,compare,mission,missionResult,feel,end];
  if(st.step>=2&&st.guess==null)st.step=1;
  if(st.step===3&&!st.runs.length)st.step=2;
  if(st.step>=4&&st.runs.length<3)st.step=st.runs.length?3:2;
  if(st.step>=6&&!st.mTries.length)st.step=5;
  if(st.step>=7&&!(st.mTries.some(function(b){return runAgenda(b).w==='Z'})||st.mReveal))st.step=6;
  if(st.step>=8&&st.feel==null)st.step=7;
  (S[st.step]||intro)();
}
render();
})();
</script>
