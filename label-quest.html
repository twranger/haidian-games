<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>標籤闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one tablet screen per question. A hidden random label (A 潛力高手 / B 需要加強) changes time, hints, retries and tone; the 10 questions are identical. Single light classroom look on purpose. */
:root{
  --bg:#EEF2F0; --card:#FBFCFA; --ink:#1F2A2E; --muted:#56605C; --line:#CFD9D4;
  --sea:#205E86; --rust:#A8441A; --good:#2F7D4F; --gold:#B7862B; --gray:#7C8784;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6}
.wrap{min-height:100%;max-width:860px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,4.4vw,40px);font-weight:900;margin:0;line-height:1.4;text-wrap:balance}
.lead{font-size:clamp(20px,2.8vw,26px);color:var(--muted);margin:0}
.badge{border-radius:18px;padding:16px 20px;font-size:clamp(22px,3.2vw,30px);font-weight:900;text-align:center;color:#fff}
.badge.A{background:var(--gold)} .badge.B{background:var(--gray)}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;font-size:clamp(18px,2.6vw,24px);font-weight:700;color:var(--muted)}
.top b{color:var(--sea);font-variant-numeric:tabular-nums}
.timer{height:16px;border-radius:99px;background:#DCE4E0;overflow:hidden}
.timer i{display:block;height:100%;background:var(--sea);width:100%}
.timer.low i{background:var(--rust)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{font:inherit;font-size:clamp(22px,3.4vw,32px);font-weight:900;border:0;border-radius:16px;padding:16px 18px;background:var(--sea);color:#fff;cursor:pointer}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.opt:disabled{opacity:.55;cursor:default}
.ghost{background:transparent;color:var(--sea);border:3px solid var(--sea);font-size:clamp(18px,2.6vw,24px);padding:10px 16px}
.skip{background:transparent;color:var(--gray);border:3px dashed var(--gray);font-size:clamp(18px,2.6vw,24px);padding:10px 16px}
.btn:focus-visible{outline:4px solid var(--rust);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.hint{margin:0;font-size:clamp(20px,2.8vw,26px);color:var(--sea);font-weight:700}
.msg{margin:0;font-size:clamp(22px,3.2vw,30px);font-weight:900;min-height:1.5em}
.msg.ok{color:var(--good)} .msg.no{color:var(--rust)} .msg.cheer{color:var(--gold)}
.big{font-size:clamp(70px,14vw,130px);font-weight:900;line-height:1.1;margin:0;color:var(--sea);font-variant-numeric:tabular-nums}
@media (max-width:440px){.opts{grid-template-columns:1fr}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script src="live.js"></script>
<script>
(function(){
"use strict";
var app=document.getElementById('app');
var KEY='label-quest-v1';
var Q=[
 {q:'2、4、8、16、？',o:['18','24','32','20'],a:2,h:'每一個數字，都是前一個的幾倍？'},
 {q:'1、4、9、16、？',o:['20','25','23','36'],a:1,h:'1×1、2×2、3×3……'},
 {q:'3 ＋ 3 × 3 ＝ ？',o:['18','12','9','15'],a:1,h:'先乘除，後加減。'},
 {q:'時鐘指著 3 點整，時針和分針夾幾度？',o:['30 度','60 度','90 度','180 度'],a:2,h:'一圈 360 度，3 點是四分之一圈。'},
 {q:'1、1、2、3、5、8、？',o:['11','12','13','16'],a:2,h:'前面兩個數字加起來。'},
 {q:'一本書 120 頁，每天看 15 頁，幾天看完？',o:['6 天','8 天','10 天','12 天'],a:1,h:'120 ÷ 15'},
 {q:'哪一個跟其他三個不一樣？',o:['虱目魚','吳郭魚','黑面琵鷺','石斑魚'],a:2,h:'哪一個不是魚？'},
 {q:'小明比小華高，小華比小美高。誰最矮？',o:['小明','小華','小美','一樣高'],a:2,h:'把三個人從高排到矮。'},
 {q:'帶 50 元，買 3 枝 12 元的筆，找回多少？',o:['14 元','16 元','24 元','36 元'],a:0,h:'先算 3 × 12。'},
 {q:'一個正方形邊長 6 公分，周長是多少？',o:['12 公分','24 公分','36 公分','18 公分'],a:1,h:'正方形有 4 個邊。'}
];
var CFG={
 A:{name:'潛力高手',time:20,hint:true,retry:true,skip:false,start:'系統分析完成：你是「潛力高手」！這些題目對你來說應該不難。',
    right:['太厲害了！','果然是高手！','完全正確！'],wrong:'沒關係，高手也會失誤，再想一次！',timeup:'時間到了，下一題你一定可以！'},
 B:{name:'需要加強',time:10,hint:false,retry:false,skip:true,start:'系統分析完成：你是「需要加強」的玩家。題目可能有點難，覺得太難可以直接跳過。',
    right:['答對了。','答對了。','答對了。'],wrong:'答錯了。',timeup:'時間到了。'}
};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
if(location.hash==='#reset'){save(null)}
var st=load();
if(!st||!st.g){st={g:Math.random()<0.5?'A':'B'};save(st)}
var C=CFG[st.g];
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function intro(){
  app.innerHTML='';
  var h=el('h1',null,'標籤闖關');
  var c=el('div','card');
  c.append(el('p','lead','一共 10 題。每題都有時間限制，選出你覺得對的答案。'),el('p','lead','按下開始，系統會先分析你是哪一種玩家。'));
  var b=el('button','btn','開始');b.type='button';b.addEventListener('click',analyse);
  app.append(h,c,b);
}
function analyse(){
  app.innerHTML='';
  var h=el('h2',null,'系統分析中……');
  var t=el('div','timer');var i=el('i');i.style.width='0%';i.style.transition='width 1.8s linear';t.appendChild(i);
  app.append(h,t);
  requestAnimationFrame(function(){requestAnimationFrame(function(){i.style.width='100%'})});
  setTimeout(function(){
    app.innerHTML='';
    var bd=el('div','badge '+st.g,'你的玩家等級：'+C.name);
    var p=el('p','lead',C.start);
    var b=el('button','btn','開始闖關');b.type='button';b.addEventListener('click',function(){st.score=0;st.i=0;ask()});
    app.append(bd,p,b);
  },2000);
}
var timerId=0;
function ask(){
  clearInterval(timerId);
  var n=st.i, q=Q[n]; app.innerHTML='';
  var tries=0, done=false, left=C.time;
  var bd=el('div','badge '+st.g,C.name);
  var top=el('div','top');top.innerHTML='<span>第 <b>'+(n+1)+'</b> / 10 題</span><span>答對 <b>'+st.score+'</b> 題</span><span>剩 <b id="sec">'+left+'</b> 秒</span>';
  var tm=el('div','timer');var ti=el('i');tm.appendChild(ti);
  var card=el('div','card');card.appendChild(el('h2',null,q.q));
  var opts=el('div','opts');var btns=[];
  q.o.forEach(function(t,k){var b=el('button','btn opt',t);b.type='button';b.addEventListener('click',function(){pick(k,b)});btns.push(b);opts.appendChild(b)});
  card.appendChild(opts);
  var msg=el('p','msg');
  var tools=el('div','row');
  if(C.hint){var hb=el('button','btn ghost','需要提示');hb.type='button';var hp=el('p','hint');hb.addEventListener('click',function(){hp.textContent='提示：'+q.h;hb.disabled=true});tools.appendChild(hb);card.appendChild(hp)}
  if(C.skip){var sb=el('button','btn skip','這題太難，跳過');sb.type='button';sb.addEventListener('click',function(){if(!done)finishQ('跳過了。','')});tools.appendChild(sb)}
  app.append(bd,top,tm,card,tools,msg);
  function tick(){left--;var s=document.getElementById('sec');if(s)s.textContent=Math.max(left,0);ti.style.width=Math.max(left,0)/C.time*100+'%';tm.className='timer'+(left<=Math.ceil(C.time/3)?' low':'');if(left<=0&&!done)finishQ(C.timeup,st.g==='A'?'cheer':'no')}
  ti.style.width='100%';timerId=setInterval(tick,1000);
  function pick(k,b){
    if(done)return;
    if(k===q.a){st.score++;finishQ(C.right[n%3],'ok');return}
    tries++;b.disabled=true;
    if(C.retry&&tries<2){msg.textContent=C.wrong;msg.className='msg cheer';return}
    finishQ(C.wrong,'no');
  }
  function finishQ(t,cls){
    done=true;clearInterval(timerId);btns.forEach(function(x){x.disabled=true});
    msg.textContent=t;msg.className='msg '+cls;st.i++;save(st);
    setTimeout(function(){if(st.i>=Q.length){st.fin=true;save(st);end()}else ask()},1100);
  }
}
function end(){
  clearInterval(timerId);app.innerHTML='';
  var h=el('h2',null,'闖關結束！請停在這一頁，等其他同學。');
  var c=el('div','card');c.append(el('p','lead','你答對了'),el('p','big',st.score+' / 10'),el('div','badge '+st.g,'你的玩家等級：'+C.name));
  app.append(h,c,el('p','lead','先不要給別的同學看。'));
  if(window.LIVE)app.append(LIVE.box('labelquest',{g:st.g==='A'?'a':'b',rows:[st.score>=7,st.score<=4],v:st.score}));
}
if(st.fin)end();else if(st.i!=null&&st.i>0)ask();else intro();
})();
</script>
