<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="fresh.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>園遊會金幣王・全班連線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="live.js"></script>
<script src="room.js"></script>
<style>
:root{--gold:#B67A12;--wage:#205E86;--luck:#C8372D}
.huge{font-size:clamp(40px,5.4vw,80px);font-weight:900;line-height:1.15}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* 顧攤位 */
.stall{background:#FFF7EA;border:4px solid #E9A23B;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cust{display:flex;align-items:center;gap:14px;justify-content:center;min-height:140px}
.cust svg{width:80px;height:100px;flex:none}
.bub{background:#fff;border:3px solid #1E242B;border-radius:18px;padding:10px 18px;font-size:clamp(22px,4.8vw,30px);font-weight:900;line-height:1.35}
.drs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.drs .btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;font-size:clamp(19px,4vw,24px);min-height:56px}
.drs svg{width:54px;height:66px}
.miss{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog i{width:26px;height:26px;border-radius:50%;border:3px solid #E9A23B;background:#fff}
.prog i.on{background:#E9A23B}
/* 錢包 */
.wl{border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:3px solid #1E242B;background:#fff}
.wl .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.wl .nm{font-size:clamp(22px,4.6vw,28px);font-weight:900}
.wl .bal{font-size:clamp(26px,5.4vw,34px);font-weight:900;color:var(--gold)}
.wl .from{font-size:17px;font-weight:700;color:#475569}
.coins{display:flex;flex-wrap:wrap;gap:4px;min-height:26px}
.coins i{width:22px;height:22px;border-radius:50%;background:#F2B544;box-shadow:inset 0 0 0 2px #B67A12}
.coins i.out{background:#fff;box-shadow:inset 0 0 0 2px #CBD5E1}
/* 紅包 */
.env{align-self:center;width:200px;height:250px;border-radius:18px;background:#C8372D;border:0;cursor:pointer;position:relative;touch-action:manipulation;display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px}
.env .flap{position:absolute;left:0;right:0;top:0;height:88px;background:#B52A22;border-radius:18px 18px 100px 100px}
.env .seal{position:absolute;left:50%;top:56px;margin-left:-34px;width:68px;height:68px;border-radius:50%;background:#F2B544;color:#7A2A1F;font:900 34px/68px "Noto Sans TC",sans-serif;text-align:center}
.env .lb{color:#FFF4F1;font-size:22px;font-weight:900}
/* 攤位商品 */
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid #E3DED7;border-radius:18px;padding:10px 6px;font:inherit;cursor:pointer;min-height:56px;touch-action:manipulation}
.it svg{width:64px;height:64px}
.it .n{font-size:clamp(18px,3.8vw,22px);font-weight:900;color:#1E242B}
.it .p{font-size:clamp(18px,3.8vw,22px);font-weight:900;color:var(--gold)}
.it.got{border-color:#2A6F68;background:#F0F7F6}
.it.got .p{color:#2A6F68}
.it:disabled{opacity:.4;cursor:not-allowed}
.it:focus-visible,.env:focus-visible{outline:4px solid #205E86;outline-offset:3px}
.bag{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;align-items:center}
.bag svg{width:40px;height:40px}
/* 大螢幕 */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wall div{background:#fff;border:2px solid #E3DED7;border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.wall b{font-size:22px}.wall .g{display:flex;flex-wrap:wrap;gap:2px;min-height:30px}.wall .g svg{width:28px;height:28px}
.wall small{font-size:17px;color:#475569;font-weight:700}
.hb{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.hb .lb{font-size:26px;font-weight:900;display:flex;justify-content:space-between;gap:10px}
.hb .bw{background:#EEE9E1;border-radius:12px;height:52px;overflow:hidden}
.hb .bw i{display:block;height:100%;border-radius:10px}
.rk{display:flex;flex-direction:column;gap:6px}
.rk div{display:flex;gap:12px;align-items:center;font-size:24px;font-weight:900}
.rk i{font-style:normal;color:#64748B;width:76px}.rk span{margin-left:auto;color:var(--gold)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three .btn{font-size:clamp(19px,4vw,24px);padding:14px 4px;min-height:56px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tri div{background:#F3EEE7;border-radius:14px;padding:10px 4px;font-size:22px;font-weight:700}.tri b{display:block;font-size:48px;line-height:1.1}
@media (max-width:900px){.cmp{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.miss{animation:none}}
</style>
</head>
<body>
<script>
/* 園遊會金幣王（第 7 節・心理帳戶：錢的來源）
   每個人都顧攤位做 10 杯飲料，做的事完全一樣。
   依進場座號輪流分兩組（學生不知道）：工資組每做 1 杯拿 10 枚工資；紅包組當志工不拿錢，做完抽中 100 枚幸運紅包。
   兩組最後都是 100 枚，錢包長得一樣。接著逛園遊會 60 秒：買東西會出現在大螢幕的戰利品牆，剩下的金幣是金幣王的分數。
   公布：兩組平均花多少。再請每個人想：如果錢是另一種來的，會花得更多、一樣、還是更少。 */
var NEED=10,PER=10,SHOP=60;
var DR=[['milk','珍珠奶茶','#D9B38C'],['green','綠茶','#8DB86B'],['black','紅茶','#A6502E']];
var IT=[['cotton','棉花糖',20],['ice','冰淇淋',20],['soda','彈珠汽水',30],['gacha','扭蛋',30],['ball','氣球',40],['bear','大熊娃娃',80]];
var SRC={wage:{t:'工資組',f:'顧攤位賺的工資',c:'#205E86'},luck:{t:'紅包組',f:'抽中的幸運紅包',c:'#C8372D'}};
function ico(id){var s={cotton:'<circle cx="32" cy="24" r="18" fill="#F4A6C6"/><circle cx="22" cy="20" r="10" fill="#F8C3D9"/><path d="M32 40 V60" stroke="#8A6A4A" stroke-width="4" stroke-linecap="round"/>',
 ice:'<path d="M20 30 L32 60 L44 30 Z" fill="#D9A066"/><circle cx="32" cy="24" r="14" fill="#FFF1C9"/><circle cx="26" cy="18" r="6" fill="#F7B7C9"/>',
 soda:'<rect x="22" y="14" width="20" height="44" rx="8" fill="#9FD3E6"/><rect x="26" y="6" width="12" height="10" rx="3" fill="#5A8FA8"/><circle cx="32" cy="24" r="5" fill="#E6F4FA"/>',
 gacha:'<circle cx="32" cy="32" r="22" fill="#F2B544"/><path d="M10 32 H54" stroke="#1E242B" stroke-width="3"/><path d="M10 32 A22 22 0 0 0 54 32 Z" fill="#7C5CC4"/>',
 ball:'<ellipse cx="32" cy="24" rx="16" ry="19" fill="#D95D39"/><path d="M32 43 Q28 52 34 62" stroke="#475569" stroke-width="2" fill="none"/><path d="M29 43 H35 L32 47 Z" fill="#D95D39"/>',
 bear:'<circle cx="18" cy="16" r="8" fill="#A6714A"/><circle cx="46" cy="16" r="8" fill="#A6714A"/><circle cx="32" cy="34" r="22" fill="#B9845A"/><circle cx="24" cy="30" r="3" fill="#1E242B"/><circle cx="40" cy="30" r="3" fill="#1E242B"/><ellipse cx="32" cy="41" rx="8" ry="6" fill="#E8C9A6"/>'}[id];
 return '<svg viewBox="0 0 64 64" aria-hidden="true">'+s+'</svg>'}
function cup(c){return '<svg viewBox="0 0 54 66" aria-hidden="true"><path d="M30 2 L26 22" stroke="#1E242B" stroke-width="4" stroke-linecap="round"/><path d="M8 18 H46 L41 62 H13 Z" fill="#fff" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/><path d="M11 30 H43 L40.4 60 H13.6 Z" fill="'+c+'"/></svg>'}
function price(id){for(var i=0;i<IT.length;i++)if(IT[i][0]===id)return IT[i][2];return 0}
function spent(list){return (list||[]).reduce(function(s,id){return s+price(id)},0)}
function grp(g,seat){var i=(g.order||[]).indexOf(+seat);return (i<0?0:i)%2===0?'wage':'luck'}
function coins(n,out){var h='';for(var i=0;i<Math.round(n/10);i++)h+='<i></i>';for(i=0;i<Math.round((out||0)/10);i++)h+='<i class="out"></i>';return '<div class="coins">'+h+'</div>'}
function players(H){return Object.keys(H.seats).length}
function hbar(lab,v,mx,col,note){var p=mx?Math.round(v/mx*100):0;return '<div class="hb"><span class="lb"><span>'+lab+'</span><span style="color:'+col+'">'+note+'</span></span><div class="bw"><i style="width:'+p+'%;background:'+col+'"></i></div></div>'}
function stats(g){var o={wage:{s:0,n:0,big:0},luck:{s:0,n:0,big:0}};Object.keys(g.rd||{}).forEach(function(k){var G=o[grp(g,k)],v=spent((g.buy||{})[k]);G.n++;G.s+=v;if(v>=50)G.big++});
 ['wage','luck'].forEach(function(x){o[x].avg=o[x].n?Math.round(o[x].s/o[x].n):0});return o}
ROOM.start({
 key:'coinfair',title:'園遊會金幣王',kick:'第 7 節・全班連線',studentUrl:'coinfair.html',
 rules:'<p>園遊會開始了！先<b>顧攤位做 10 杯飲料</b>，再<b>逛園遊會 60 秒</b>。</p><p>買到的東西會出現在大螢幕的<b>戰利品牆</b>；最後<b>剩下最多金幣</b>的人是金幣王。</p>',
 init:function(H){H.g={rd:{},buy:{},th:{}}},
 onStart:function(H){H.g={t0:Date.now(),order:Object.keys(H.seats).map(Number).sort(function(a,b){return a-b}),rd:{},buy:{},th:{}};H.ph='work'},
 pub:function(H){var g=H.g;return {g:{t0:g.t0,order:g.order,ts:g.ts,buy:H.ph==='reveal'?g.buy:null}}},
 onMsg:function(H,d,seat){var g=H.g;
  if(d.t==='ready'&&!g.rd[seat]){g.rd[seat]=1;return true}
  if(d.t==='buy'&&H.ph==='shop'&&g.rd[seat]&&Array.isArray(d.v)){var v=d.v.filter(function(id,i,a){return price(id)&&a.indexOf(id)===i});if(spent(v)<=100){g.buy[seat]=v;return true}return}
  if(d.t==='th'&&H.ph==='reveal'&&['more','same','less'].indexOf(d.v)>=0){g.th[seat]=d.v;return true}},
 tick:function(H){if(H.ph==='shop'&&Date.now()-H.g.ts>=SHOP*1000){H.ph='over';return true}},
 tickText:function(H){if(H.ph==='shop')return '還剩 '+Math.max(0,Math.ceil(SHOP-(Date.now()-H.g.ts)/1000))+' 秒';return ''},
 act:{shop:function(H){H.g.ts=Date.now();H.ph='shop'},close:function(H){H.ph='over'},reveal:function(H){H.ph='reveal'}},
 bar:function(H){if(H.ph==='work')return '<button class="btn" data-act="shop">大家都拿到 100 枚了：開始逛園遊會（60 秒）</button>';
  if(H.ph==='shop')return '<button class="btn gh" data-act="close">提早結束</button>';
  if(H.ph==='over')return '<button class="btn" data-act="reveal">公布：大家的 100 枚，是怎麼來的？</button>';return ''},
 hostView:function(H){var g=H.g,N=players(H),h='';
  function wall(){return '<div class="wall">'+(g.order||[]).filter(function(s){return H.seats[s]}).map(function(s){var b=(g.buy||{})[s]||[];return '<div><b>'+s+' 號</b><span class="g">'+b.map(ico).join('')+'</span><small>剩 '+(100-spent(b))+' 枚</small></div>'}).join('')+'</div>'}
  if(H.ph==='work')h+='<div class="card dark"><p class="huge">園遊會開始了！</p><p class="stat">每個人先顧攤位：客人點什麼飲料，就做什麼，做滿 10 杯。</p></div><div class="card"><p class="stat">做完、拿到 100 枚金幣的人：'+Object.keys(g.rd).length+' / '+N+'</p></div>';
  else if(H.ph==='shop'||H.ph==='over')h+='<div class="card dark"><p class="huge">'+(H.ph==='shop'?'逛園遊會！':'時間到！')+'</p><p class="stat">'+(H.ph==='shop'?'<span id="hdtick" style="color:#F2B544"></span>　買的東西會出現在戰利品牆；剩下的金幣是金幣王的分數。':'等老師公布。')+'</p></div><div class="card"><h2>戰利品牆</h2>'+wall()+'</div>';
  else{var S=stats(g),mx=Math.max(1,S.wage.avg,S.luck.avg,50),R=Object.keys(g.rd).map(Number).map(function(s){return [s,100-spent(g.buy[s])]}).sort(function(a,b){return b[1]-a[1]||a[0]-b[0]}),T={more:0,same:0,less:0};Object.keys(g.th).forEach(function(k){T[g.th[k]]++});
   h+='<div class="card warm"><p class="huge" style="font-size:clamp(32px,4.2vw,58px)">其實大家的 100 枚，來的方法不一樣！</p><p class="stat">做的事一模一樣：都做了 10 杯飲料。一半的人每杯拿 <b>10 枚工資</b>；一半的人當<b>志工</b>不拿錢，做完<b>抽中 100 枚紅包</b>。</p></div>'+
    '<div class="cmp"><div class="card"><h2>逛園遊會，平均花了多少枚？</h2>'+hbar('工資組（'+S.wage.n+' 人）',S.wage.avg,mx,SRC.wage.c,'平均花 '+S.wage.avg+' 枚')+hbar('紅包組（'+S.luck.n+' 人）',S.luck.avg,mx,SRC.luck.c,'平均花 '+S.luck.avg+' 枚')+
    '<p class="stat" style="margin-top:8px">花 50 枚以上：工資組 '+S.wage.big+' 人、紅包組 '+S.luck.big+' 人</p></div>'+
    '<div class="card"><h2>金幣王（剩最多）</h2><div class="rk">'+R.slice(0,5).map(function(x,i){return '<div><i>第 '+(i+1)+' 名</i>'+x[0]+' 號<span>'+x[1]+' 枚</span></div>'}).join('')+'</div></div></div>'+
    '<div class="card"><h2>如果錢是另一種來的，你會……（'+(T.more+T.same+T.less)+' 人回答）</h2><div class="tri"><div><b>'+T.more+'</b>花得更多</div><div><b>'+T.same+'</b>花得一樣</div><div><b>'+T.less+'</b>花得更少</div></div></div>'+
    '<div class="card dark"><p class="stat">每一枚金幣都一樣能買東西。可是心裡給它貼的標籤不一樣：「辛苦賺的」和「天上掉下來的」。</p><p style="font-size:22px">這是我們班一次的結果，不一定每一班都一樣。</p></div>'}
  return h},
 studentView:function(ST,me,api){var g=ST.g||{},k='c'+g.t0,L=api.local[k]||{},G=grp(g,me),h='',b=L.b||[],left=100-spent(b);
  function wallet(n,out){return '<div class="wl"><div class="hd"><span class="nm">我的錢包</span><span class="bal">'+n+' 枚</span></div>'+(L.got?'<span class="from">'+SRC[G].f+'</span>':'')+coins(n,out)+'</div>'}
  if(ST.ph==='work'){var sv=L.sv||0;
   if(sv<NEED){var o=DR[L.o==null?0:L.o];
    h+='<h1>'+(G==='wage'?'顧攤位打工：每做好 1 杯，拿 10 枚工資':'當園遊會志工：幫忙做 10 杯飲料')+'</h1><div class="stall"><div class="cust'+(L.ms?' miss':'')+'">'+ROOM.person(['#7C5CC4','#2A6F68','#D95D39','#205E86'][sv%4],'')+'<div class="bub">'+(L.ms?'不是這個啦！<br>':'')+'我要一杯<br><span style="color:#D95D39">'+o[1]+'</span>！</div></div>'+
     '<div class="drs">'+DR.map(function(d,i){return '<button class="btn gh" data-act="serve" data-arg="'+i+'">'+cup(d[2])+d[1]+'</button>'}).join('')+'</div><div class="prog" aria-label="已經做了 '+sv+' 杯">'+new Array(NEED+1).join('.').split('').map(function(x,i){return '<i class="'+(i<sv?'on':'')+'"></i>'}).join('')+'</div></div>'+
     (G==='wage'?wallet(sv*PER,(NEED-sv)*PER):'<p class="lead">已經幫忙做了 <b>'+sv+'</b> 杯，還差 '+(NEED-sv)+' 杯。</p>')}
   else if(!L.got&&G==='luck')h+='<h1>謝謝你幫忙！</h1><p class="lead">主辦人說：志工可以抽一個紅包。你抽到了！點一下打開。</p><button class="env" data-act="open" aria-label="打開紅包"><span class="flap"></span><span class="seal">開</span><span class="lb">幸運紅包</span></button>';
   else if(!L.got)h+='<h1>做滿 10 杯了！</h1><p class="lead">你靠自己顧攤位，賺到了 100 枚工資。</p><button class="btn" data-act="open">把工資收進錢包</button>';
   else h+='<h1>錢包準備好了</h1>'+wallet(100)+'<p class="lead">看大螢幕，等老師說開始逛園遊會。</p>'}
  else if(ST.ph==='shop'){if(!L.got)h+='<h1>你還沒拿到金幣</h1><p class="lead">這一輪看大螢幕就好。</p>';
   else h+='<h1>逛園遊會</h1><p class="lead">點一下買，再點一下退回。買的東西會出現在大螢幕的戰利品牆；<b>剩下的金幣</b>是金幣王的分數。</p>'+wallet(left,100-left)+
    '<div class="shop">'+IT.map(function(x){var got=b.indexOf(x[0])>=0;return '<button class="it'+(got?' got':'')+'" data-act="buy" data-arg="'+x[0]+'" '+(!got&&x[2]>left?'disabled':'')+' aria-pressed="'+got+'">'+ico(x[0])+'<span class="n">'+x[1]+'</span><span class="p">'+(got?'買了・點我退回':x[2]+' 枚')+'</span></button>'}).join('')+'</div>'}
  else if(ST.ph==='over')h+='<h1>時間到！</h1><div class="card"><p class="lead">你買了：'+(b.length?b.map(function(id){return IT.filter(function(x){return x[0]===id})[0][1]}).join('、'):'什麼都沒買')+'。<br>剩下 <b>'+left+' 枚</b>。</p><div class="bag">'+b.map(ico).join('')+'</div></div><p class="lead">看大螢幕。</p>';
  else if(ST.ph==='reveal'){var O=G==='wage'?'luck':'wage';
   h+='<h1>看大螢幕！</h1><div class="card"><p class="lead">你的 100 枚是<b style="color:'+SRC[G].c+'">'+SRC[G].f+'</b>，你花了 <b>'+spent(b)+' 枚</b>。</p></div>'+
    (L.th?'<div class="card"><p class="lead">你選了：如果是'+SRC[O].f+'，我會'+{more:'花得更多',same:'花得一樣',less:'花得更少'}[L.th]+'。等一下說說為什麼。</p></div>':
    '<h2>想一想：如果你的 100 枚是「'+SRC[O].f+'」，你會……</h2><div class="three"><button class="btn gh" data-act="th" data-arg="more">花得更多</button><button class="btn gh" data-act="th" data-arg="same">花得一樣</button><button class="btn gh" data-act="th" data-arg="less">花得更少</button></div>')}
  else h+='<h1>等老師開始</h1>';
  return h},
 sact:(function(){function upd(ST,api,f){var k='c'+(ST.g||{}).t0,L=api.local[k]||{};f(L);var o={};o[k]=L;api.local=o;api.save()}
  return {
   serve:function(ST,me,api,a){if(ST.ph!=='work')return;upd(ST,api,function(L){var cur=L.o==null?0:L.o;if((L.sv||0)>=NEED)return;if(+a===cur){L.sv=(L.sv||0)+1;L.ms=0;var n;do{n=Math.floor(Math.random()*DR.length)}while(n===cur);L.o=n}else L.ms=Date.now()})},
