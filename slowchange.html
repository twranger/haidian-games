<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="fresh.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>慢慢變・全班連線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="live.js"></script>
<script src="room.js"></script>
<style>
.pic{display:block;width:100%;height:auto;border-radius:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts .btn{font-size:clamp(20px,4vw,26px);padding:14px 6px}
.found{font-size:clamp(34px,8vw,56px)!important;padding:30px 0!important;width:100%}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-weight:900}
.bars .c span.b{display:block;width:100%;border-radius:8px 8px 0 0;background:#2A6F68}
.huge{font-size:clamp(56px,8vw,110px);font-weight:900;line-height:1.1}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
</style>
</head>
<body>
<script>
var DUR=40;
var OPTS=[['roof','屋頂的顏色'],['tree','少了一棵樹'],['boat','竹筏不見了'],['sun','太陽變大了'],['bird','鳥變多了'],['none','沒發現哪裡變了']];
function players(H){return Object.keys(H.seats).length}
function mix(a,b,u){var p=function(h,i){return parseInt(h.substr(1+i*2,2),16)};var o='#';for(var i=0;i<3;i++){var v=Math.round(p(a,i)+(p(b,i)-p(a,i))*u);o+=('0'+v.toString(16)).slice(-2)}return o}
// u：0＝一開始，1＝改變完成。改變的是三合院屋頂：紅色 → 藍綠色
function pic(u,label){var roof=mix('#C0392B','#3E8E87',Math.max(0,Math.min(1,u)));
 return '<svg class="pic" id="scpic" viewBox="0 0 1000 560" role="img" aria-label="臺江海邊的風景'+(label?'：'+label:'')+'">'+
 '<rect width="1000" height="300" fill="#BFE3F2"/><circle cx="830" cy="90" r="48" fill="#F2C14E"/>'+
 '<path d="M120 80 q20 -16 40 0 q20 -16 40 0" stroke="#1E242B" stroke-width="4" fill="none"/><path d="M300 120 q16 -12 32 0 q16 -12 32 0" stroke="#1E242B" stroke-width="4" fill="none"/>'+
 '<ellipse cx="560" cy="70" rx="80" ry="26" fill="#FFFFFF"/><ellipse cx="610" cy="60" rx="60" ry="24" fill="#FFFFFF"/>'+
 '<rect y="300" width="1000" height="90" fill="#6FB1C9"/><path d="M0 330 q60 -10 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".6"/>'+
 '<g><rect x="150" y="330" width="170" height="16" rx="6" fill="#A0703C"/><path d="M230 330 v-70" stroke="#5B4026" stroke-width="5"/><path d="M234 262 l50 50 h-50 z" fill="#F6F5F0" stroke="#94A3B8" stroke-width="2"/></g>'+
 '<rect y="390" width="1000" height="170" fill="#D9C79E"/>'+
 '<g><rect x="520" y="340" width="300" height="130" fill="#EADFCF" stroke="#8C6B4A" stroke-width="4"/><path d="M500 345 L670 270 L840 345 Z" fill="'+roof+'" stroke="#5B4026" stroke-width="4"/><rect x="645" y="400" width="50" height="70" fill="#8C6B4A"/><rect x="560" y="380" width="50" height="40" fill="#BFE3F2" stroke="#8C6B4A" stroke-width="3"/><rect x="730" y="380" width="50" height="40" fill="#BFE3F2" stroke="#8C6B4A" stroke-width="3"/></g>'+
 '<g><rect x="96" y="420" width="16" height="80" fill="#6B4E2E"/><circle cx="104" cy="400" r="48" fill="#3E7D4F"/><rect x="226" y="430" width="16" height="70" fill="#6B4E2E"/><circle cx="234" cy="410" r="42" fill="#4E8F5C"/><rect x="900" y="420" width="16" height="80" fill="#6B4E2E"/><circle cx="908" cy="398" r="46" fill="#3E7D4F"/></g>'+
 '<g fill="#475569"><ellipse cx="420" cy="500" rx="14" ry="8"/><ellipse cx="460" cy="520" rx="14" ry="8"/></g>'+
 (label?'<rect x="20" y="20" width="'+(label.length*30+40)+'" height="56" rx="12" fill="#1E242B"/><text x="40" y="60" font-size="30" font-weight="900" fill="#FAF7F2" font-family="Noto Sans TC,sans-serif">'+label+'</text>':'')+'</svg>'}
var anim=null;
function loop(){var H=window._H,el=document.getElementById('scwrap');if(H&&el&&H.ph==='play'){var t=(Date.now()-H.g.t0)/1000;el.innerHTML=pic(t/DUR*1.05);var tt=document.getElementById('sctime');if(tt)tt.textContent='還剩 '+Math.max(0,Math.ceil(DUR-t))+' 秒'}anim=requestAnimationFrame(loop)}
ROOM.start({
 key:'slowchange',title:'慢慢變',kick:'第 1 節・注意力　全班連線',studentUrl:'slowchange.html',
 rules:'<p>等一下大螢幕上會出現一張臺江海邊的畫，一共 40 秒。</p><p><b>畫裡有一個地方會慢慢改變。</b>你一發現，就在平板上按「我發現了！」，再選是哪裡變了。</p>',
 init:function(H){H.g={}},
 onStart:function(H){H.g={f:{}};H.ph='ready'},
 pub:function(H){var g=H.g;return {g:{t0:g.t0,n:Object.keys(g.f||{}).length,f:H.ph==='reveal'?g.f:null}}},
 onMsg:function(H,d,seat){var g=H.g;if(d.t==='found'&&H.ph==='play'&&!g.f[seat]){g.f[seat]={s:Math.round((Date.now()-g.t0)/100)/10,w:''};return true}
  if(d.t==='what'&&(H.ph==='play'||H.ph==='answer')){g.f[seat]=g.f[seat]||{s:null,w:''};g.f[seat].w=d.v;return true}},
 tick:function(H){window._H=H;if(H.ph==='play'&&Date.now()-H.g.t0>=DUR*1000){H.ph='answer';return true}},
 act:{go:function(H){H.g.t0=Date.now();H.ph='play'},reveal:function(H){H.ph='reveal'}},
 bar:function(H){if(H.ph==='ready')return '<button class="btn" data-act="go">開始（40 秒）</button>';if(H.ph==='answer')return '<button class="btn" data-act="reveal">公布答案</button>';return ''},
 hostView:function(H){var g=H.g,N=players(H),F=g.f||{},ks=Object.keys(F),h='';window._H=H;if(!anim)loop();
  if(H.ph==='ready')h+='<div class="card dark"><p class="stat">畫裡有一個地方會<span style="color:#F2A65A">慢慢改變</span>。一發現，就按平板上的「我發現了！」</p></div>'+pic(0);
  else if(H.ph==='play')h+='<div class="card dark"><p class="stat">一發現，就按「我發現了！」　<span id="sctime" style="color:#F2A65A"></span>　已經有 '+ks.filter(function(k){return F[k].s!=null}).length+' 人按了</p></div><div id="scwrap">'+pic((Date.now()-g.t0)/1000/DUR*1.05)+'</div>';
  else if(H.ph==='answer')h+='<div class="card dark"><p class="huge">時間到！</p><p class="stat">還沒選的同學：你覺得是哪裡變了？</p></div><div class="card"><p class="stat">已經選好：'+ks.filter(function(k){return F[k].w}).length+' / '+N+' 人</p></div>';
  else{var ok=ks.filter(function(k){return F[k].w==='roof'}),times=ok.map(function(k){return F[k].s}).filter(function(x){return x!=null});
   var bins=[0,0,0,0,0];times.forEach(function(s){bins[Math.min(4,Math.floor(s/10))]++});var mx=Math.max(1,Math.max.apply(null,bins));
   h+='<div class="cmp"><div class="card">'+pic(0,'一開始')+'</div><div class="card">'+pic(1,'40 秒後')+'</div></div>'+
    '<div class="card dark"><p class="stat">變的是：<span style="color:#F2A65A">三合院的屋頂，從紅色慢慢變成藍綠色</span>。</p><p style="font-size:26px">全班 '+N+' 人，答對的有 <b style="color:#F2A65A">'+ok.length+'</b> 人；沒發現或猜錯的有 <b style="color:#F2A65A">'+(N-ok.length)+'</b> 人。</p></div>'+
    '<div class="card"><h2>答對的人，是在第幾秒發現的？</h2><div class="bars">'+bins.map(function(v,i){return '<div class="c"><span>'+(v||'')+'</span><span class="b" style="height:'+(v/mx*130)+'px"></span><small>'+(i===4?'40 秒後':(i*10)+'～'+(i*10+10)+' 秒')+'</small></div>'}).join('')+'</div></div>'+
    '<div class="card warm"><p style="font-size:24px">屋頂很大，又一直在你眼前，可是它變得很慢，大腦就沒有「注意到」。<b>天天看到的東西，慢慢改變，最難發現。</b></p></div>'}
  return h},
 studentView:function(ST,me,api){var g=ST.g||{},h='',L=api.local['c'+g.t0]||{};
  if(ST.ph==='play'){var m=window._lt||(window._lt={});if(!m[g.t0])m[g.t0]=Date.now()}
  if(ST.ph==='ready')h+='<h1>看大螢幕！</h1><p class="lead">等老師按開始。一發現哪裡在變，就按「我發現了！」</p>';
  else if(ST.ph==='play'||ST.ph==='answer'){
   if(ST.ph==='play'&&!L.found)h+='<p class="lead">看大螢幕，一發現就按：</p><button class="btn found" data-act="found">我發現了！</button>';
   else{h+=(L.found?'<div class="card cool"><p class="stat">你在大約第 '+L.s+' 秒按了！</p></div>':'<h1>時間到！</h1>')+'<h2>是哪裡變了？</h2><div class="opts">'+OPTS.map(function(o){return '<button class="btn '+(L.w===o[0]?'te on':'gh')+'" data-act="what" data-arg="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div>'+(L.w?'<p class="lead">選好了，可以再改。看大螢幕。</p>':'')}}
  else h+='<h1>看大螢幕！</h1><p class="lead">'+(L.w==='roof'?'你答對了！':'變的是三合院的屋頂。')+'</p>';
  return h},
 sact:{found:function(ST,me,api){var g=ST.g,k='c'+g.t0,L=api.local[k]||{};L.found=1;var m=window._lt||{};L.s=Math.round((Date.now()-(m[g.t0]||Date.now()))/1000);api.local={};api.local[k]=L;api.send({t:'found'});api.save()},
  what:function(ST,me,api,v){var g=ST.g,k='c'+g.t0,L=api.local[k]||{};L.w=v;api.local={};api.local[k]=L;api.send({t:'what',v:v});api.save()}}
});
</script>
</body>
</html>
