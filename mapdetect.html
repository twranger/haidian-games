<meta charset="utf-8">
<script src="fresh.js"></script>
<title>老地圖偵探</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: case story (temple bell + hand-drawn coast map with four candidate places) / place 10 pebbles before any evidence / five rounds: tap a document folder, it opens and a different-looking document slides out (interview note / ledger / old photo / pile of 30 deeds / stone tablet) with a neutral detective note, then move pebbles with + / − so the four confidence bubbles on the map grow or shrink (total always 10) / change table (yours beside a reference split) / one open question with effect/cost only / summary for a show of hands. No scoring, no randomness. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --p0:#205E86; --p1:#8A6418; --p2:#2F7D4F; --p3:#A8441A;
  --f0:#CFE0EC; --f1:#F3E3BE; --f2:#CFE3C4; --f3:#F2C9B5;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:22px 36px;display:flex;flex-direction:column;gap:14px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.6vw,32px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.8vw,25px);font-weight:900;margin:0;line-height:1.4;display:flex;align-items:center;gap:8px}
.lead{font-size:clamp(19px,2.5vw,23px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.3vw,22px);font-weight:700;color:var(--sea);letter-spacing:1px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,2.6vw,22px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.7vw,24px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn:focus-visible,.pb:focus-visible,.env:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.4vw,22px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
.hint{margin:0;font-size:clamp(19px,2.2vw,21px);color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn.alt svg.i{width:1.7em;height:1.7em}
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;border-radius:50%;color:#fff;font-weight:900;font-size:.9em;flex:none;line-height:1;background:var(--sea)}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;flex:none;border:3px solid}
.c0{color:var(--p0)}.c1{color:var(--p1)}.c2{color:var(--p2)}.c3{color:var(--p3)}
.dot.c0{background:var(--f0);border-color:var(--p0)}.dot.c1{background:var(--f1);border-color:var(--p1)}.dot.c2{background:var(--f2);border-color:var(--p2)}.dot.c3{background:var(--f3);border-color:var(--p3)}

/* intro */
.intro{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.bellpic{width:150px;height:auto;display:block}
@media (max-width:560px){.intro{grid-template-columns:96px minmax(0,1fr);gap:12px}.bellpic{width:96px}}

/* progress */
.prog{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prog span{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--card);border:3px solid var(--line);color:#9AA19C}
.prog span svg.i{width:28px;height:28px}
.prog span.done{color:var(--ink)}
.prog span.now{border-color:var(--gold);background:var(--warm);color:var(--ink)}

/* round layout */
.round{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.round{grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
.right{display:flex;flex-direction:column;gap:10px;min-width:0}

/* desk + envelope + documents */
.desk{position:relative;min-height:300px;border-radius:20px;background:#E4D7BC;background-image:repeating-linear-gradient(100deg,rgba(140,106,62,.07) 0 3px,transparent 3px 26px);border:3px solid #CDBB98;display:flex;align-items:center;justify-content:center;padding:16px 12px;overflow:hidden}
.env{position:absolute;left:50%;top:50%;width:250px;height:190px;margin:-95px 0 0 -125px;z-index:2;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
.env svg{width:100%;height:100%;display:block;overflow:visible}
.env .flap{transform-box:fill-box;transform-origin:50% 0;transition:transform .35s ease-in}
.env .str{transition:opacity .2s}
.desk.closed .doc{opacity:0}
.desk.opening .env .flap{transform:scaleY(-1)}
.desk.opening .env .str{opacity:0}
.desk.opening .env{animation:drop .55s .5s both}
.desk.opening .doc{animation:rise .95s .3s both}
@keyframes drop{to{opacity:0;transform:translateY(90px) scale(.92)}}
@keyframes rise{0%{opacity:0;transform:translateY(60px) scale(.55)}45%{opacity:1;transform:translateY(-36px) scale(.8)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.desk.opening .env,.desk.opening .doc{animation-duration:.01s;animation-delay:0s}.env .flap{transition:none}}
.tap{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-weight:900;color:#6B5233;font-size:19px;z-index:3;pointer-events:none}
.desk.opening .tap{opacity:0}
.doc{width:100%;max-width:330px;position:relative;z-index:1}
.doc .cap2{margin:8px 0 0;text-align:center;font-size:19px;font-weight:700;color:#6B5233;line-height:1.4}
/* 1 interview paper */
.d1 .pp{background:#FFFDF6;border-radius:6px;box-shadow:0 6px 14px rgba(60,40,10,.18);padding:14px 16px 16px 30px;position:relative;background-image:repeating-linear-gradient(transparent 0 35px,#C9DCE8 35px 37px);background-position:0 8px;transform:rotate(-1.5deg)}
.d1 .pp::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:#E9A3A3}
.d1 .dh{display:flex;gap:10px;align-items:center;line-height:1.35}
.d1 .dh .av{width:58px;height:58px;flex:none}
.d1 .dh b{display:block;font-size:21px}
.d1 .dh span{font-size:19px;color:var(--muted)}
.d1 .q1{margin:10px 0 0;font-size:clamp(21px,2.6vw,24px);font-weight:900;line-height:1.55}
/* 2 ledger */
.d2 .lg{margin:0 auto;width:260px;height:236px;background:#F1E4C4;border:3px solid #8C6A3E;border-radius:4px 10px 10px 4px;box-shadow:0 6px 14px rgba(60,40,10,.2);display:flex;flex-direction:row-reverse;justify-content:flex-start;padding:12px 16px 12px 12px;position:relative;transform:rotate(1deg)}
.d2 .lg::after{content:"";position:absolute;right:-3px;top:-3px;bottom:-3px;width:16px;border-left:3px dashed #8C6A3E;background:#E6D3AB;border-radius:0 10px 10px 0}
.vc{display:flex;flex-direction:column;align-items:center}.vc i{font-style:normal;display:block;line-height:1.12}
.d2 .c{font-size:25px;font-weight:900;padding:2px 9px;border-left:2px solid #C0532C;color:#2E241A}
.d2 .c.h{color:#A8441A;font-size:21px;margin-right:12px}
/* 3 photo */
.d3 .ph{background:#FBF8F0;padding:10px 10px 6px;box-shadow:0 6px 14px rgba(60,40,10,.22);transform:rotate(-2deg);position:relative}
.d3 .ph svg{width:100%;height:auto;display:block;filter:sepia(.25)}
.d3 .ph p{margin:6px 0 0;text-align:center;font-weight:900;font-size:20px;color:#5E4A2C;line-height:1.4}
.d3 .ph::before,.d3 .ph::after{content:"";position:absolute;width:30px;height:30px;background:#3A3027;opacity:.75}
.d3 .ph::before{left:-4px;top:-4px;clip-path:polygon(0 0,100% 0,0 100%)}
.d3 .ph::after{right:-4px;bottom:-4px;clip-path:polygon(100% 0,100% 100%,0 100%)}
/* 4 deeds */
.d4 .stk{position:relative;width:180px;height:190px;margin:0 auto}
.d4 .sh{position:absolute;width:150px;height:170px;background:#FBF4E2;border:2px solid #B9A27A;border-radius:4px}
.d4 .dd{position:absolute;left:0;top:18px;width:150px;height:170px;background:#F6E7C6;border:3px solid #8C6A3E;border-radius:4px;display:flex;flex-direction:row-reverse;gap:10px;padding:12px;box-shadow:0 6px 12px rgba(60,40,10,.2)}
.d4 .dd .vc{font-size:22px;font-weight:900;color:#2E241A}
.d4 .seal{position:absolute;left:12px;bottom:12px;width:40px;height:40px;border:3px solid #C0532C;border-radius:6px;color:#C0532C;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);line-height:1}
.d4 .cnt{margin-top:10px;background:#FBFCF9;border:3px solid #CDBB98;border-radius:14px;padding:8px 12px;font-size:20px;font-weight:700;line-height:1.5}
.d4 .cnt b{font-size:26px;font-variant-numeric:tabular-nums}
.d4 .cnt .zero{color:var(--rust)}
/* 5 stele */
.d5 .st{margin:0 auto;width:170px;height:220px;background:#C9CCC6;background-image:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35) 0 10%,transparent 11%),radial-gradient(circle at 70% 75%,rgba(80,90,80,.12) 0 14%,transparent 15%);border:3px solid #6E7570;border-radius:80px 80px 6px 6px;display:flex;flex-direction:row-reverse;justify-content:center;gap:14px;padding-top:44px;position:relative}
.d5 .st .vc{font-size:28px;font-weight:900;color:#4A514D;text-shadow:1px 1px 0 rgba(255,255,255,.6),-1px -1px 0 rgba(0,0,0,.25)}
.d5 .st::after{content:"";position:absolute;left:16px;bottom:10px;width:34px;height:20px;border-radius:50%;background:#A9C27D;opacity:.7}
.d5 .sb{margin:0 auto;width:220px;height:26px;background:#B5B9B2;border:3px solid #6E7570;border-radius:6px}

/* detective note */
.dn{background:var(--warm);border:3px solid #E6D3AB;border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.dn h3 svg.i{width:34px;height:34px}
.dn .wt{display:flex;align-items:center;gap:6px;font-weight:900;font-size:19px;color:var(--muted);flex-wrap:wrap}
.dn .wt svg.i{width:26px;height:26px;color:var(--ink)}
.dn .wt b{color:var(--ink);font-size:21px}
.dn dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0;font-size:clamp(19px,2.2vw,21px);line-height:1.65}
.dn dt{font-weight:900;white-space:nowrap}
.dn dd{margin:0 0 6px}

/* map */
.mapbox{background:#F4EBD6;border:3px solid #CDBB98;border-radius:20px;overflow:hidden}
.map{width:100%;height:auto;display:block}
.mapbox.small{width:100%;max-width:600px;margin:0 auto}
.map .bub,.map .ring{transition:transform .3s ease}
.map .lbl{transition:transform .3s ease}
@media (prefers-reduced-motion:reduce){.map .bub,.map .ring,.map .lbl{transition:none}}
.pool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900;font-size:clamp(19px,2.3vw,21px);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;line-height:1.4}
.pool svg.i{width:32px;height:32px}
.pool.full{border-color:var(--gold);background:var(--warm)}
.pool .pebs{display:inline-flex;gap:3px;flex-wrap:wrap}
.peb{display:inline-block;width:14px;height:11px;border-radius:50%;background:#D3CCBF;border:2px solid #6E6658}
.pcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.pcs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc{background:var(--card);border:3px solid var(--line);border-top-width:8px;border-radius:16px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pc.c0{border-top-color:var(--p0)}.pc.c1{border-top-color:var(--p1)}.pc.c2{border-top-color:var(--p2)}.pc.c3{border-top-color:var(--p3)}
.pc .pn{font-weight:900;font-size:clamp(21px,2.4vw,23px);line-height:1.3;color:var(--ink);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pc .pn small{font-size:19px;color:var(--muted);font-weight:700}
.pc .pr{display:flex;align-items:center;justify-content:space-between;gap:4px}
.pb{font:inherit;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;-webkit-tap-highlight-color:transparent}
.pb svg.i{width:26px;height:26px}
.pb.pl{border-color:currentColor}
.pb[disabled]{opacity:.35;cursor:default}
.pb.dim{opacity:.45}
.pc .pv{font-size:clamp(26px,3vw,30px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.pc .pv{white-space:nowrap}
.pc .pebs{display:flex;gap:2px;flex-wrap:wrap;min-height:13px}
.pc .peb{width:12px;height:10px}
.pcs.off .pb{pointer-events:none;opacity:.3}
.msg{min-height:0;margin:0;font-size:19px;font-weight:700;color:var(--rust)}
.msg:empty{display:none}

/* tables */
.tabs{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.3vw,22px)}
th,td{padding:7px 4px;border-bottom:2px solid var(--line);text-align:center;vertical-align:middle;line-height:1.35}
th{font-size:19px}
th .dot{margin-right:3px;vertical-align:-1px}
.ct td:first-child,.ct th:first-child{text-align:left;color:var(--muted);font-weight:700;white-space:nowrap}
.ct td.n{font-weight:900;font-variant-numeric:tabular-nums;font-size:clamp(21px,2.5vw,24px)}
.ct td.up{background:#DCEBD5}
.ct td.down{background:#F6DCCF}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:19px;color:var(--muted);font-weight:700;margin:0}
.legend i{display:inline-block;width:22px;height:16px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.sum td{text-align:left;vertical-align:top}
.sum td:first-child{color:var(--muted);font-weight:700;width:48%}
.sum td b{font-size:1.1em}
.ec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.3vw,22px);line-height:1.6}
.ec dt{font-weight:900;white-space:nowrap}
.ec dd{margin:0}
.ec dt.e{color:var(--good)}.ec dt.c{color:var(--rust)}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .sum,.sum tbody,.sum tr,.sum td{display:block}
  .sum td{border:0;padding:2px 0}
  .sum td:first-child{width:auto}
  .sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ec{grid-template-columns:1fr;gap:0}
  .ec dd{margin-bottom:6px}
  .desk{min-height:280px}
  th,td{padding:6px 2px}
}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

function paintMap(svg,al,prev,blank){
  P.forEach(function(p,i){

    b.style.transform='scale('+r+')';
    b.setAttribute('fill-opacity',blank||n===0?'0':'.62');
    b.setAttribute('stroke-dasharray',blank||n===0?'5 6':'none');
    var t=svg.querySelector('.num[data-i="'+i+'"]');t.textContent=blank?'':n;t.setAttribute('font-size',n>0?36:26);t.setAttribute('y',n>0?13:9);
    var rg=svg.querySelector('.ring[data-i="'+i+'"]');
    if(prev&&prev[i]!==n&&!blank){rg.style.transform='scale('+R(prev[i])+')';rg.setAttribute('opacity','1')}else{rg.setAttribute('opacity','0')}
    svg.querySelector('.lbl[data-i="'+i+'"]').style.transform='translate(0px,'+(-(r+12))+'px)';
  });
}

  s+='<rect x="60" y="54" width="30" height="138" rx="3" fill="#E6CF9E" stroke="#5E4A2C" stroke-width="2.5"/>';
  for(var i=0;i<t.length;i++)s+='<text x="75" y="'+(72+i*16.5)+'" text-anchor="middle" font-size="15" font-weight="900" fill="#3A2A1C" font-family="Noto Sans TC,sans-serif">'+t[i]+'</text>';
  s+='<circle cx="44" cy="186" r="6" fill="#B48A50" stroke="#5E4A2C" stroke-width="2.5"/><circle cx="106" cy="186" r="6" fill="#B48A50" stroke="#5E4A2C" stroke-width="2.5"/>';
  return s+'</svg>';
}
function intro(){
  app.append(el('h1',null,'老地圖偵探'));
  app.append(el('p','case',ic('mapdet_bell')+'一個虛構的案子：大鐘上的庄名'));
  var c=el('div','card');var g=el('div','intro');g.innerHTML=bellSVG();
  var tx=el('div');tx.style.display='flex';tx.style.flexDirection='column';tx.style.gap='10px';
  tx.append(el('p','lead','我們庄裡的廟，掛著一口很舊的大鐘。鐘上只刻了一行字：<b>「渡口庄眾弟子敬獻」</b>，意思是「渡口庄的信徒一起送給廟的」。'),
    el('p','lead','可是今天的地圖上，已經沒有一個叫「渡口庄」的地方了。<b>它到底是現在的哪一個地方呢？</b>'));
  g.append(tx);c.append(g);app.append(c);
  var mb=el('div','mapbox');mb.innerHTML=mapSVG();paintMap(mb.querySelector('svg'),[0,0,0,0],null,true);app.append(mb);
  app.append(el('p','note','地圖上有四個可能的地方：溪口的<b>頂寮</b>、海邊的<b>鹽埕</b>、河中間的<b>中洲</b>、內陸的<b>田寮</b>。<br>你手上有 <b>10 顆小石子</b>，代表你的把握：你覺得哪裡越可能，就放越多顆，那裡的泡泡就越大。接下來會一份一份打開 <b>5 個文件袋</b>，每看完一份，就重新分一次石子。怎麼分都不會扣分。'));
  app.append(button('開始分石子','btn',function(){go('r0')}));
}

/* ---------- a round: open one folder, then move pebbles ---------- */
function progress(i){
  var d=el('div','prog');
  for(var k=1;k<=5;k++){var cls=k<i||(k===i&&st.opened[k])?'done':'';if(k===i)cls+=' now';
    var sp=el('span',cls,ic(k<i||(k===i&&st.opened[k])?EV[k].k:'mapdet_folder'));sp.setAttribute('aria-label','第 '+k+' 份資料');d.appendChild(sp)}
  return d;
}
function roundPage(i){
  var opened=i===0||!!st.opened[i];
  var prev=i>0?st.hist[i-1]:null;
  if(i===0){
    app.append(el('p','case',ic('mapdet_stone')+'開始：還沒看任何資料'));
    app.append(el('h2',null,'先把 10 顆石子分給四個地方。'));
  }else{
    var top=el('div','prog-row');top.style.display='flex';top.style.flexDirection='column';top.style.gap='8px';
    top.append(el('p','case','第 '+i+' 份資料（共 5 份）'),progress(i));app.append(top);
    app.append(el('h2',null,opened?'第 '+i+' 份：'+EV[i].t:'打開第 '+i+' 個文件袋，看看裡面是什麼。'));
  }
  var rd=el('div','round');var L=el('div','left');var Rt=el('div','right');rd.append(L,Rt);app.append(rd);

  if(i===0){
    var c=el('div','card');
    c.append(el('h3',null,ic('mapdet_bell')+'現在只知道鐘上的字'));
    c.append(el('p','lead','一份資料都還沒看，四個地方都有可能。你可以差不多平均分，也可以照你的感覺分。'));
    c.append(el('p','hint',ic('plus')+'按加號放一顆石子，按減號拿回一顆。'));
    L.append(c);
  }else{
    var desk=el('div','desk'+(opened?'':' closed'));
    desk.innerHTML=docHTML(i);
    L.append(desk);
    if(!opened){
      var env=el('button','env',envSVG(i));env.type='button';env.setAttribute('aria-label','打開第 '+i+' 個文件袋');
      desk.append(env,el('div','tap','點文件袋，把它打開'));
      env.addEventListener('click',function(){
        if(desk.classList.contains('opening'))return;
        desk.classList.add('opening');desk.classList.remove('closed');
        setTimeout(function(){st.opened[i]=true;save(st);render();if(i===4)countUp()},1150);
      });
    }else{
      var dn=el('div','dn');
      var w='';for(var k=0;k<EV[i].w;k++)w+=ic('mapdet_weight');
      dn.append(el('h3',null,ic('magnify')+'偵探筆記'));
      dn.append(el('div','wt','這份資料的份量：'+w+'<b>'+EV[i].wl+'</b>'));
      dn.append(el('dl',null,'<dt>可靠嗎？</dt><dd>'+EV[i].r+'</dd><dt>哪裡變了？</dt><dd>'+EV[i].e+'</dd>'));
      L.append(dn);
    }
  }

  // map + controls
  var mb=el('div','mapbox');mb.innerHTML=mapSVG();var svg=mb.querySelector('svg');Rt.append(mb);
  var pool=el('div','pool');Rt.append(pool);
  var pcs=el('div','pcs'+(opened?'':' off'));var refs=[];
  P.forEach(function(p,k){
    var d=el('div','pc c'+k);
    d.append(el('div','pn','<span>'+p.n+'</span><small>'+p.s+'</small>'));
    var row=el('div','pr');
    var mi=el('button','pb mi',ic('minus'));mi.type='button';mi.setAttribute('aria-label',p.n+' 拿回一顆石子');
    var v=el('span','pv c'+k);
    var pl=el('button','pb pl c'+k,ic('plus'));pl.type='button';pl.setAttribute('aria-label',p.n+' 放一顆石子');
    row.append(mi,v,pl);d.append(row);var pe=el('div','pebs');d.append(pe);
    mi.addEventListener('click',function(){if(!opened)return;if(st.al[k]<=0){say(p.n+'已經是 0 顆了。');return}st.al[k]--;save(st);upd();say('')});
    pl.addEventListener('click',function(){if(!opened)return;if(sum(st.al)>=TOTAL){say('10 顆石子都放完了。想讓'+p.n+'變大，先從別的地方按減號拿一顆回來。');return}st.al[k]++;save(st);upd();say('')});
    refs.push({mi:mi,pl:pl,v:v,pe:pe});pcs.appendChild(d);
  });
  Rt.append(pcs);
  var msg=el('p','msg');Rt.append(msg);
  if(!opened)Rt.append(el('p','hint',ic('mapdet_folder')+'先打開文件袋，才能調石子。泡泡現在是你上一次的分法。'));
  function say(t){msg.textContent=t}

  var lab=i===0?'分好了，打開第 1 份資料':i<5?'調好了，打開第 '+(i+1)+' 份資料':'調好了，看看泡泡變化表';
  var nx=button(lab,'btn',function(){
    if(!opened||sum(st.al)!==TOTAL)return;
    st.hist[i]=st.al.slice();st.hist.length=i+1;
    go(i<5?'r'+(i+1):'table');
  });
  app.append(nx);
  var nh=el('p','hint');app.append(nh);

  function upd(){
    var left=TOTAL-sum(st.al);
    paintMap(svg,st.al,prev,false);
    pool.className='pool'+(left===0?' full':'');
    pool.innerHTML=ic('mapdet_stone')+(left>0?'<span>還沒放的石子：</span><span class="pebs">'+pebs(left)+'</span><span>'+left+' 顆</span>':'<span>10 顆石子都放好了。</span>');
    refs.forEach(function(r,k){r.v.textContent=st.al[k];r.pe.innerHTML=pebs(st.al[k]);
      r.mi.classList.toggle('dim',st.al[k]===0);r.pl.classList.toggle('dim',left===0)});
    var ok=opened&&left===0;nx.disabled=!ok;
    nh.style.display=ok||!opened?'none':'';
    nh.innerHTML=ic('mapdet_stone')+'還有 '+left+' 顆石子沒放，10 顆都放好才能往下。';
  }
  upd();
  if(i>0&&opened&&prev)Rt.insertBefore(el('p','hint',ic('mapdet_bubble')+'虛線圈是你上一次的泡泡大小。不想改也可以直接往下。'),msg);
}
function countUp(){
  var b=app.querySelector('.d4 .c4');if(!b)return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var n=0;b.textContent='0';var t=setInterval(function(){n++;b.textContent=n;if(n>=30)clearInterval(t)},40);
}

/* ---------- change table ---------- */
function changeTable(rows,cap){
  var h='<table class="ct"><caption style="caption-side:top;text-align:left;font-weight:900;font-size:clamp(21px,2.6vw,24px);padding-bottom:6px">'+cap+'</caption><thead><tr><th>資料</th>';
  P.forEach(function(p,k){h+='<th><span class="dot c'+k+'"></span>'+p.n+'</th>'});
  h+='</tr></thead><tbody>';
  rows.forEach(function(r,ri){
    h+='<tr><td>'+RL[ri]+'</td>';
    r.forEach(function(n,k){var cls='n';if(ri>0){if(n>rows[ri-1][k])cls+=' up';else if(n<rows[ri-1][k])cls+=' down'}h+='<td class="'+cls+'">'+n+'</td>'});
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
function tablePage(){
  app.append(el('p','case',ic('mapdet_bubble')+'看完 5 份資料了'));
  app.append(el('h2',null,'你的泡泡是怎麼變的？'));
  var mb=el('div','mapbox small');mb.innerHTML=mapSVG();paintMap(mb.querySelector('svg'),st.hist[5],st.hist[0],false);
  var tabs=el('div','tabs');
  var a=el('div','card');a.innerHTML=changeTable(st.hist,'你的泡泡變化表');
  var b=el('div','card');b.innerHTML=changeTable(REF,'一位偵探的參考分法');
  tabs.append(a,b);app.append(tabs);
  app.append(el('p','legend','<span><i style="background:#DCEBD5"></i>比上一次多</span><span><i style="background:#F6DCCF"></i>比上一次少</span><span>數字是石子的顆數，加起來都是 10。</span>'));
  app.append(el('p','note','參考分法不是標準答案，只是一位偵探的想法。看看你和它：<b>在哪一份資料之後，調得最不一樣？</b>為什麼？<br>還有，參考分法最後還留了 1 顆給鹽埕，沒有全部給頂寮。你覺得為什麼？'));
  var cap=el('p','hint',ic('mapdet_bubble')+'下面的地圖是你最後的泡泡；虛線圈是你一開始的泡泡。');
  app.append(cap,mb);
  app.append(button('下一步','btn',function(){go('q')}));
}

/* ---------- open question (no right answer) ---------- */
var QO={
  A:{n:'馬上全部改成鹽埕',e:'跟上最新的資料，反應很快；如果這份新資料真的很可靠，你一下子就改過來了。',c:'帳本、照片、契約、舊碑這些前面的證據，全部被一份新資料蓋掉；如果它只是聽說，或是寫錯了，你就整個跑錯方向。'},
  B:{n:'先看這份資料可不可靠，再調一點',e:'新資料有被認真看，舊的證據也沒有丟掉；查清楚它很可靠以後，還可以再多調一些。',c:'要多花時間去查：是誰寫的、什麼時候寫的、為什麼這樣寫；查清楚以前，答案不能說得那麼肯定。'},
  C:{n:'不理它，因為已經確定是頂寮',e:'不會被一份資料牽著走，想法很穩定，也不用再花時間查。',c:'如果這份資料其實很可靠（例如又找到另一塊碑），你就錯過了改正的機會；覺得「已經確定」，會讓人不再看新的證據。'}
};
function qPage(){
  app.append(el('p','case','最後一題'));
  app.append(el('h2',null,'如果明天又找到一份資料，說渡口庄在鹽埕，你會怎麼做？'));
  app.append(el('p','lead','這一題<b>沒有標準答案</b>。選好以後，會看到這個做法的作用和代價，等一下全班一起討論。'));
  var o=el('div','opts');var bs={};var fb=el('div');
  ['A','B','C'].forEach(function(k){var b=button('<span class="lt '+k+'">'+k+'</span><span>'+QO[k].n+'</span>','btn alt',function(){st.q=k;save(st);upd()});bs[k]=b;o.appendChild(b)});
  var nx=button('下一步','btn',function(){if(st.q)go('end')});
  app.append(o,fb,nx);
  function upd(){
    Object.keys(bs).forEach(function(k){bs[k].classList.toggle('pick',st.q===k);bs[k].setAttribute('aria-pressed',st.q===k?'true':'false')});
    fb.innerHTML='';nx.disabled=!st.q;
    if(st.q){var m=QO[st.q];var c=el('div','card');c.append(el('h3',null,'<span class="lt '+st.q+'">'+st.q+'</span>'+m.n));c.append(el('dl','ec','<dt class="e">作用</dt><dd>'+m.e+'</dd><dt class="c">代價</dt><dd>'+m.c+'</dd>'));fb.appendChild(c)}
  }
  upd();
}

/* ---------- end ---------- */
function endPage(){
  app.append(el('h1',null,'做完了！請停在這一頁，等其他同學。'));
  var h=st.hist,a=h[3][3],b=h[4][3],tian;
  if(a===0)tian='沒辦法再調小：看第 4 份以前，田寮就已經是 0 顆了';
  else if(b<a)tian='有：從 '+a+' 顆調成 '+b+' 顆';
  else if(b===a)tian='沒有：還是 '+a+' 顆';
  else tian='沒有，反而從 '+a+' 顆調成 '+b+' 顆';
  var rows=[
    ['看完第 1 份（阿公說）以後，你給鹽埕幾顆？',h[1][1]+' 顆'],
    ['最後，你給頂寮幾顆？',h[5][0]+' 顆'],
    ['看到第 4 份（三十份契約都沒有「渡口」），你有沒有把田寮調小？',tian],
    ['最後一題你選了',st.q+'　'+QO[st.q].n]
  ];
  var c=el('div','card');var tb=el('table','sum');
  tb.innerHTML='<tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>'}).join('')+'</tbody>';
  c.append(tb);app.append(c);
  var mb=el('div','mapbox small');mb.innerHTML=mapSVG();paintMap(mb.querySelector('svg'),h[5],null,false);app.append(mb);
  app.append(el('p','note warm',ic('hand')+' 老師等一下會請大家舉手：看完阿公的話，鹽埕給 5 顆以上的有幾個人？最後頂寮給 10 顆的有幾個人？最後一題選 A、B、C 的各有幾個人？'));
}

function render(){
  app.innerHTML='';
  var s=st.step,m=/^r([0-5])$/.exec(s);
  if(s==='intro')intro();
  else if(m&&st.hist.length>=+m[1])roundPage(+m[1]);
  else if(s==='table'&&st.hist.length===6)tablePage();
  else if(s==='q'&&st.hist.length===6)qPage();
  else if(s==='end'&&st.hist.length===6&&st.q)endPage();
  else{st=fresh();save(st);intro()}
}
render();
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}st=fresh();save(st);render();try{window.scrollTo(0,0)}catch(e){}}});
})();
</script>
