<meta charset="utf-8">
<script src="fresh.js"></script>
<title>市場攤位變變變</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: intro with the market stall picture → six situation cards; on each card the student sets "people in line: more / same / fewer" and "goods on the stall: more / same / fewer" (the picture adds or removes people and goods live), then taps "看價格牌" and the sign on top of the stall turns (up / down / about the same / can't tell) with neutral feedback and the reference view → summary page for a show of hands. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:900px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.6vw,32px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.6vw,24px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:inline-flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:5px;border:3px solid var(--sea);display:inline-block}
.dots i.on{background:var(--sea)}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45;touch-action:manipulation}
.btn.go{background:var(--rust)}
.btn:focus-visible,.ch:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,23px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.pic{padding:8px;border-radius:22px;background:#F7F4EA;border:3px solid var(--line)}
.pic svg{display:block;width:100%;height:auto}
.ctl{display:flex;flex-direction:column;gap:12px}
.grp{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px}
.grp h3{margin:0;font-size:clamp(20px,2.6vw,24px);font-weight:900;display:flex;align-items:center;gap:8px}
.grp h3 svg.i{width:1.4em;height:1.4em}
.chs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ch{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 4px;min-height:84px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:clamp(19px,2.6vw,23px);font-weight:900;line-height:1.25;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.ch:active{transform:scale(.95)}
.ch svg.i{width:38px;height:38px}
.ch.pick{border-color:var(--gold);background:var(--warm);box-shadow:inset 0 0 0 2px var(--gold)}
.legend{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;font-size:clamp(19px,2.6vw,23px)}
.legend li{display:flex;gap:10px;align-items:flex-start}
.legend svg.i{width:1.6em;height:1.6em;margin-top:.05em}
/* result */
.res{display:flex;align-items:center;gap:14px;border-radius:20px;padding:14px 16px;border:3px solid var(--line);background:var(--card)}
.res svg.i{width:64px;height:64px}
.res .k{margin:0;font-size:clamp(19px,2.4vw,22px);color:var(--muted);font-weight:700}
.res .v{margin:0;font-size:clamp(34px,6vw,52px);font-weight:900;line-height:1.15}
.res.up .v{color:var(--rust)} .res.down .v{color:var(--sea)} .res.same .v{color:var(--muted)} .res.unsure .v{color:#8A6216}
.mine{margin:0;font-size:clamp(19px,2.6vw,23px);line-height:1.7}
.fb{display:flex;flex-direction:column;gap:12px;animation:fadein .5s .75s both}
.nw{white-space:nowrap}
.mine svg.i{margin-right:2px}
.tag{margin-left:6px;display:inline-block;font-weight:900;border-radius:10px;padding:0 8px;background:var(--warm);color:var(--ink);white-space:nowrap}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* end */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.6vw,23px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td.n{white-space:nowrap}
td small{display:block;color:var(--muted);font-weight:500;font-size:clamp(19px,2.3vw,20px)}
.same-y{font-weight:900;color:var(--good);white-space:nowrap}
.same-n{font-weight:900;color:var(--muted);white-space:nowrap}
.big{font-size:clamp(44px,9vw,76px);font-weight:900;text-align:center;color:var(--sea);margin:0;line-height:1.15;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);margin-left:6px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
/* svg scene animation */
.pop{animation:pop .38s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
.gone{animation:gone .3s ease-in forwards;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes gone{from{transform:none;opacity:1}to{transform:scale(.3);opacity:0}}
.needle{transition:transform 1s cubic-bezier(.3,1.35,.5,1),opacity .3s;transform-origin:398px 49px}
.needle.wob{animation:wob 1.7s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-42deg)}50%{transform:rotate(42deg)}}
.dial{transition:fill .4s}
@media (prefers-reduced-motion:reduce){.pop,.gone,.fb{animation:none}.gone{opacity:0}.needle{transition:none}.needle.wob{animation:none}}
@media (max-width:760px){
  .stage{grid-template-columns:1fr}
}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  th,td{padding:8px 4px}
  .ch{min-height:76px}
}
</style>

}
function scene(o){
  /* o: {p,g,prevP,prevG,kinds,label,ev,sign:null|'up'...} */
  var np=cnt(o.p),ng=cnt(o.g),pp=o.prevP==null?np:o.prevP,pg=o.prevG==null?ng:o.prevG;
  var h='<svg viewBox="0 0 640 400" role="img" aria-label="市場攤位：左邊排隊的人 '+np+' 位，右邊攤上的貨 '+ng+' 份" font-family="Noto Sans TC,PingFang TC,Microsoft JhengHei,sans-serif" fill="none" stroke="#1F2A2E" stroke-linecap="round" stroke-linejoin="round">';
  h+='<rect x="0" y="392" width="640" height="8" fill="#E3E6DF" stroke="none"/><path d="M0 392H640" stroke-width="3"/>';
  /* event badge */
  h+='<circle cx="80" cy="74" r="56" fill="#FBFCF9" stroke="#D4D9D2" stroke-width="3"/>';
  h+='<g transform="translate(44 38) scale(3)" stroke-width="1.2">'+ICI[o.ev]+'</g>';
  /* stall: posts, awning, counter */
  h+='<rect x="341" y="138" width="9" height="254" rx="3" fill="#E8C795" stroke-width="2.5"/><rect x="620" y="138" width="9" height="254" rx="3" fill="#E8C795" stroke-width="2.5"/>';
  h+='<path d="M400 94V102M570 94V102" stroke-width="2.5"/>';
  h+='<rect x="333" y="100" width="304" height="13" rx="5" fill="#A8441A" stroke-width="2.5"/>';
  for(var k=0;k<6;k++){var x=335+k*50;h+='<path d="M'+x+' 113h50v20a25 10 0 0 1-50 0z" fill="'+(k%2?'#FBFCF9':'#F2B8A0')+'" stroke-width="2.5"/>'}
  /* goods (drawn before the counter top so they sit on it) */
  var gm=Math.max(ng,pg);
  for(var i=0;i<gm;i++){var cls=i>=ng?'gone':(i>=pg?'pop':'');h+='<g class="'+cls+'">'+good(i,o.kinds)+'</g>'}
  h+='<rect x="352" y="314" width="266" height="12" rx="4" fill="#E8C795" stroke-width="2.5"/>';
  h+='<rect x="360" y="326" width="250" height="66" fill="#F3E3BE" stroke-width="2.5"/>';
  h+='<rect x="395" y="338" width="180" height="42" rx="10" fill="#FBFCF9" stroke-width="2"/>';
  h+='<text x="485" y="367" text-anchor="middle" font-size="22" font-weight="900" fill="#1F2A2E" stroke="none">'+o.label+'</text>';
  /* people: back row first, then front row */
  var pm=Math.max(np,pp),order=[];
  for(var j=0;j<pm;j++)order.push(j);
  order.sort(function(a,b){return PSLOT[b][1]-PSLOT[a][1]});
  order.forEach(function(j){var cls=j>=np?'gone':(j>=pp?'pop':'');h+='<g class="'+cls+'">'+person(j)+'</g>'});
  /* price sign */
  var S=o.sign?SIGN[o.sign]:null;
  h+='<rect x="346" y="3" width="278" height="92" rx="14" fill="#FBFCF9" stroke-width="3"/>';
  h+='<circle class="dial" cx="398" cy="49" r="37" fill="#EEF0EC" stroke-width="2.5"/>';
  h+='<text class="qm" x="398" y="62" text-anchor="middle" font-size="38" font-weight="900" fill="#56605C" stroke="none">?</text>';
  h+='<g class="needle" style="opacity:0;transform:rotate(0deg)" stroke-width="6"><path d="M374 49H422M409 36L422 49 409 62"/></g>';
  h+='<text x="446" y="38" font-size="23" font-weight="700" fill="#56605C" stroke="none">價格可能</text>';
  h+='<text class="lab" x="446" y="83" font-size="42" font-weight="900" fill="#56605C" stroke="none">'+(S?'':'？')+'</text>';
  h+='</svg>';
  return h;
}
function turnSign(box,key,instant){
  var S=SIGN[key],nd=box.querySelector('.needle'),dial=box.querySelector('.dial'),lab=box.querySelector('.lab'),qm=box.querySelector('.qm');
  function fin(){lab.textContent=S.t;lab.setAttribute('fill',S.c);dial.setAttribute('fill',S.l)}
  qm.style.display='none';nd.setAttribute('stroke',S.c);
  if(instant){nd.style.transition='none'}
  nd.style.opacity=1;
  if(key==='unsure'){nd.classList.add('wob')}else{nd.style.transform='rotate('+S.a+'deg)'}
  if(instant)fin();else{lab.textContent='…';setTimeout(fin,650)}
}

/* ---------- step 0: intro ---------- */
function intro(){
  app.innerHTML='';
  var pic=el('div','pic',scene({p:0,g:0,kinds:['crate'],label:'安南市場',ev:'market'}));
  var c=el('div','card');
  c.append(el('p','lead','安南區的市場裡，同一樣東西，有時候變貴，有時候變便宜。價格為什麼會變呢？我們來看一個攤位。'));
  var ul=el('ul','legend');
  ul.append(el('li',null,ic('person')+'<span>左邊：排隊、想買東西的人。</span>'),
            el('li',null,ic('crate')+'<span>右邊：攤子上要賣的貨。</span>'),
            el('li',null,ic('tag')+'<span>上面：價格牌。它會告訴你，價格可能上漲、下跌、差不多，還是說不準。</span>'));
  c.appendChild(ul);
  var n=el('p','note','等一下有 6 張情境卡。每一張都請你想一想：這件事讓「排隊的人」變了，還是讓「攤上的貨」變了？也可能兩邊都變，或兩邊都沒變。用按鈕調整好，再按「看價格牌」。<br>按下「看價格牌」以後就會換下一張，所以先想清楚再按。');
  app.append(el('h1',null,'市場攤位變變變'),pic,c,n,button('開始','btn',function(){go(1)}));
}

/* ---------- steps 1–6: cards ---------- */
function dots(i){var h='<span class="dots" aria-hidden="true">';for(var k=0;k<6;k++)h+='<i class="'+(k<=i?'on':'')+'"></i>';return h+'</span>'}
function cardStep(i){
  var C=CARDS[i],s=st.cards[i];
  app.innerHTML='';
  app.append(el('p','case','情境卡 '+(i+1)+'／6 '+dots(i)),el('h2',null,C.story),el('p','lead','<b>'+C.q+'</b>'));
  var stage=el('div','stage');
  var pic=el('div','pic');
  var prev={p:s.p,g:s.g};
  function draw(){pic.innerHTML=scene({p:s.p,g:s.g,prevP:cnt(prev.p),prevG:cnt(prev.g),kinds:C.goods,label:C.label,ev:C.ev,sign:s.seen?sign(s.p,s.g):null});prev={p:s.p,g:s.g}}
  draw();
  stage.appendChild(pic);
  if(!s.seen){
    var ctl=el('div','ctl');
    function group(key,title,icon){
      var g=el('div','grp');g.setAttribute('role','group');g.setAttribute('aria-label',title);
      g.appendChild(el('h3',null,ic(icon)+title));
      var row=el('div','chs');
      [[1,'up','變多'],[0,'same','不變'],[-1,'down','變少']].forEach(function(o){
        var b=button(ic(o[1])+'<span>'+o[2]+'</span>','ch'+(s[key]===o[0]?' pick':''),function(){
          s[key]=o[0];save(st);
          Array.prototype.forEach.call(row.children,function(x){x.classList.remove('pick');x.setAttribute('aria-pressed','false')});
          b.classList.add('pick');b.setAttribute('aria-pressed','true');draw();
        });
        b.setAttribute('aria-pressed',s[key]===o[0]?'true':'false');
        b.setAttribute('aria-label',title+o[2]);
        row.appendChild(b);
      });
      g.appendChild(row);return g;
    }
    ctl.append(group('p','排隊的人','person'),group('g','攤上的貨','crate'),
      button(ic('tag')+' 看價格牌','btn go',function(){s.seen=true;save(st);cardStep(i);try{window.scrollTo(0,0)}catch(e){}}));
    stage.appendChild(ctl);
    app.appendChild(stage);
    return;
  }
  /* result */
  var key=sign(s.p,s.g),S=SIGN[key],R=CARDS[i].ref,rk=sign(R[0],R[1]);
  var match=s.p===R[0]&&s.g===R[1];
  var side=el('div','ctl');
  var res=el('div','res '+key);res.innerHTML=ic(key)+'<div><p class="k">價格牌轉到</p><p class="v">'+S.t+'</p></div>';
  side.append(res,el('p','mine','你調的是：<br>'+ic('person')+' 排隊的人<span class="tag">'+WORD[s.p]+'</span><br>'+ic('crate')+' 攤上的貨<span class="tag">'+WORD[s.g]+'</span>'));
  stage.appendChild(side);
  app.appendChild(stage);
  var fb=el('div','fb');
  fb.appendChild(el('p','note','<b>價格牌為什麼轉到「'+S.t+'」？</b>'+S.why));
  var r=el('div','card');
  if(match){
    r.append(el('p','lead','<b>你調的和參考看法一樣。</b>'),el('p','lead',C.why));
  }else{
    r.append(el('p','lead','<b>參考看法和你調的不太一樣。</b>參考看法是：<span class="nw">排隊的人<span class="tag">'+WORD[R[0]]+'</span>，</span><span class="nw">攤上的貨<span class="tag">'+WORD[R[1]]+'</span>，</span>價格牌會轉到「'+SIGN[rk].t+'」。'),
             el('p','lead',C.why),
             el('p','lead','你為什麼這樣調呢？想一想你的理由，等一下老師可能會請你說說看。'));
  }
  fb.appendChild(r);
  if(i===5)fb.appendChild(el('p','note warm','<b>記住這一張：</b>只有一邊變的時候，價格的方向比較好猜；兩邊一起變的時候，價格說不準，要看哪一邊變得比較多。'));
  fb.appendChild(button(i<5?'下一張情境卡':'看我的整理','btn',function(){go(i+2)}));
  app.appendChild(fb);
  /* turn the sign */
  var fresh=!s.shown;
  if(fresh){s.shown=true;save(st)}
  if(fresh){requestAnimationFrame(function(){requestAnimationFrame(function(){turnSign(pic,key,false)})})}
  else turnSign(pic,key,true);
}

/* ---------- step 7: end ---------- */
function end(){
  app.innerHTML='';
  var t=el('table'),n=0;
  t.innerHTML='<thead><tr><th>情境卡</th><th>你調的</th><th>和參考看法</th></tr></thead>';
  var tb=el('tbody');
  CARDS.forEach(function(C,i){
    var s=st.cards[i],m=s.p===C.ref[0]&&s.g===C.ref[1];if(m)n++;
    var tr=el('tr');
    tr.append(el('td',null,'<b>'+(i+1)+'</b>　'+C.short),
      el('td','n','人：'+WORD[s.p]+'<br>貨：'+WORD[s.g]+'<small>價格牌：'+SIGN[sign(s.p,s.g)].t+'</small>'),
      el('td',null,m?'<span class="same-y">一樣</span>':'<span class="same-n">不一樣</span>'));
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  var c=el('div','card');c.appendChild(t);
  var c2=el('div','card');
  c2.append(el('p','lead','6 張裡，「人」和「貨」都和參考看法一樣的有：'),el('p','big',n+'<small>張</small>'));
  var s6=st.cards[5];
  var c3=el('div','card');
  c3.append(el('p','lead','第 6 張「流行的新零食」，你的價格牌轉到：'),el('p','big',SIGN[sign(s6.p,s6.g)].t));
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c2,c3,c);
}

function render(){
  var n=st.step|0;
  for(var k=1;k<n&&k<=6;k++){if(!st.cards[k-1].seen){n=k;break}}
  if(n>=1&&n<=6)cardStep(n-1);else if(n>=7)end();else intro();
}
render();
})();
</script>
