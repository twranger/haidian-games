<meta charset="utf-8">
<script src="fresh.js"></script>
<title>重開一次班會</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: story of last week's class meeting (leader spoke first, nobody objected) → agenda timeline (4 slots: 開始 / 討論 / 討論 / 決定) + tray of 8 rule cards; drag or tap cards onto the timeline, arrows reorder → 開會模擬: chat bubbles play out + three meter bars (不同意見 / 獨有資訊 / 時間) + per-card effect table + record of runs → up to 3 runs → "which rule would you try in our class" (all 8 selectable, effect and cost only) → summary for a show of hands. Same light classroom look as shift.html. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn:disabled{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.alt svg.i{width:1.7em;height:1.7em}
.btn.small{font-size:clamp(19px,2.4vw,21px);padding:10px 14px;text-align:center;justify-content:center}
.btn.go{background:var(--rust)}
.btn:focus-visible,.tok:focus-visible,.mv:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 240px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.hint{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;align-items:flex-start;gap:10px}
.msg svg.av{width:52px;height:52px;flex:none}
.msg .bb{background:var(--card);border:3px solid var(--line);border-radius:6px 18px 18px 18px;padding:8px 14px;font-size:clamp(19px,2.5vw,23px);line-height:1.6;min-width:0}
.msg .who{display:block;font-size:clamp(19px,2.1vw,19px);font-weight:900;color:var(--muted);line-height:1.4}
.msg.lead1 .bb{border-color:#9DB7CA;background:#F2F7FA}
.msg.d .bb{border-color:#E1A98F;background:#FDF3EE}
.msg.h .bb{border-color:#D8BC77;background:#FBF6E8}
.msg.th .bb{border-style:dashed;background:transparent;color:var(--muted)}
.msg.th svg.av{opacity:.55}
.msg.th .who{font-weight:700}
.tagd,.tagh{display:inline-flex;align-items:center;gap:4px;font-size:clamp(19px,2vw,19px);font-weight:900;border-radius:999px;padding:0 10px;margin-left:6px;vertical-align:1px}
.tagd{background:#F6DCCF;color:#8A3A16}
.tagh{background:#F3E3BE;color:#6E5114}
.nar{align-self:center;max-width:100%;display:flex;align-items:center;gap:10px;background:#E4E8E2;border-radius:16px;padding:8px 16px;font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--ink)}
.nar svg.i{width:1.7em;height:1.7em}
.nar.rule{background:#E8EEF2}
.sep{align-self:stretch;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:900;font-size:clamp(19px,2.2vw,21px)}
.sep::before,.sep::after{content:"";flex:1;border-top:2px dashed var(--line)}
.pop{opacity:0;transform:translateY(10px);animation:pop .35s ease-out forwards}
@keyframes pop{to{opacity:1;transform:none}}
/* timeline */
.tl{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:4px}
.tl::before{content:"";position:absolute;left:18px;right:18px;top:24px;height:6px;border-radius:3px;background:linear-gradient(90deg,#205E86,#B7862B 50%,#A8441A)}
.tl::after{content:"";position:absolute;right:4px;top:15px;border:12px solid transparent;border-left:16px solid #A8441A;border-right:0}
.seg{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{align-self:center;z-index:1;display:inline-flex;align-items:center;gap:6px;background:var(--pc);color:#fff;font-weight:900;border-radius:999px;padding:2px 14px;font-size:clamp(19px,2.3vw,21px);line-height:1.6;white-space:nowrap;border:3px solid var(--bg)}
.ph b{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;background:#fff;color:var(--pc);font-size:19px;line-height:1}
.p0{--pc:#205E86}.p1{--pc:#8A6216}.p2{--pc:#A8441A}
.slot{flex:1;min-height:170px;border:3px dashed #B9A777;border-radius:16px;background:#FBF7EC;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:6px;padding:6px;color:#8C7A4C;font-weight:700;font-size:clamp(19px,2.2vw,20px);text-align:center;transition:background .12s,border-color .12s}
.slot.full{border-style:solid;border-color:#CDB98A;background:#F4ECD8;justify-content:space-between}
.slot.over{background:var(--warm);border-color:var(--gold);border-style:solid}
.mvs{display:flex;justify-content:space-between;gap:6px}
.mv{font:inherit;border:2px solid #CDB98A;background:#FBF7EC;border-radius:12px;min-width:48px;min-height:44px;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.mv:disabled{opacity:.3;cursor:default}
.mv svg.i{width:1.3em;height:1.3em}
.mv.l svg.i{transform:rotate(180deg)}
.tok{font:inherit;font-size:clamp(19px,2.2vw,21px);font-weight:700;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;min-height:56px;line-height:1.4;text-align:center;width:100%}
.tok svg.i{width:2em;height:2em}
.tok .grip{width:.9em;height:.9em;color:var(--muted);opacity:.6;position:absolute;top:6px;left:6px}
.tok{position:relative}
.tok.dragging{opacity:.3}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.22);transform:translate(-50%,-50%) rotate(-3deg);cursor:grabbing}
.tray{border:3px dashed var(--line);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-height:96px;transition:background .12s}
.tray.over{background:var(--note)}
.tray .empty{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);font-size:clamp(19px,2.4vw,21px)}
.tray .tok{min-height:130px}
.cnt{margin:0;font-weight:900;font-size:clamp(19px,2.4vw,22px)}
/* meters */
.meters{display:flex;flex-direction:column;gap:14px}
.mt{display:grid;grid-template-columns:minmax(0,15em) 1fr auto;gap:6px 14px;align-items:center}
.mt .k{font-weight:900;font-size:clamp(19px,2.4vw,22px);display:flex;align-items:center;gap:8px;margin:0}
.mt .k svg.i{width:1.6em;height:1.6em}
.trk{height:26px;border-radius:13px;background:#E4E8E2;overflow:hidden;position:relative}
.trk .f{position:absolute;left:0;top:0;bottom:0;border-radius:13px;width:0;transition:width .9s ease-out}
.trk .tick{position:absolute;top:0;bottom:0;width:3px;background:var(--card);opacity:.9}
.mt .v{font-weight:900;font-size:clamp(22px,3vw,28px);font-variant-numeric:tabular-nums;white-space:nowrap;margin:0;min-width:4.6em;text-align:right}
.mt .v small{font-size:19px;color:var(--muted);font-weight:700}
.mt.d .f{background:#C0532C}.mt.h .f{background:#B7862B}.mt.t .f{background:#205E86}
/* effects list */
.efl{display:flex;flex-direction:column}
.er{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,6.4em);gap:4px 8px;align-items:center;padding:8px 4px;border-bottom:2px solid var(--line);font-size:clamp(19px,2.5vw,23px)}
.er.hd{color:var(--muted);font-weight:700}
.er .nm{display:flex;align-items:center;gap:8px;min-width:0}
.er .nm svg.i{width:1.6em;height:1.6em}
.er .vc{text-align:center;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.er.hd .vc{font-weight:700}
.er .vc .lb{display:none}
.vc.pos{color:var(--good)}.vc.neg{color:var(--rust)}.vc.zero{color:var(--muted)}.vc.tm{color:var(--sea)}
/* tables */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:700}
th.n,td.n{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
td.n{font-weight:900}
td.pos{color:var(--good)}td.neg{color:var(--rust)}td.zero{color:var(--muted)}
td.cn{display:flex;align-items:center;gap:8px}
td.cn svg.i{width:1.6em;height:1.6em}
.eff{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.6vw,24px);line-height:1.65}
.eff dt{font-weight:900;white-space:nowrap}
.eff dt.a{color:var(--good)}.eff dt.c{color:var(--rust)}
.eff dd{margin:0}
.sum td:first-child{color:var(--muted);font-weight:700;width:36%}
ol.rl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ol.rl li{display:flex;align-items:center;gap:8px}
ol.rl li .pt{font-size:19px;color:var(--muted);white-space:nowrap}
ol.rl svg.i{width:1.4em;height:1.4em}
.reveal{opacity:0;animation:pop .4s ease-out forwards}
@media (max-width:760px){
  .tray{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tray .tok{min-height:110px}
}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .tl{grid-template-columns:1fr;gap:10px;padding-top:0;padding-left:0}
  .tl::before{left:26px;right:auto;top:10px;bottom:22px;width:6px;height:auto;background:linear-gradient(180deg,#205E86,#B7862B 50%,#A8441A)}
  .tl::after{right:auto;left:17px;top:auto;bottom:4px;border:12px solid transparent;border-top:16px solid #A8441A;border-bottom:0}
  .seg{flex-direction:row;align-items:stretch;gap:8px}
  .ph{flex:none;flex-direction:column;align-self:flex-start;padding:6px 0;border-radius:16px;width:58px;font-size:19px;line-height:1.3;gap:2px;text-align:center;margin-top:6px}
  .slot{min-height:84px;flex-direction:row;align-items:center}
  .slot.full{justify-content:space-between}
  .slot .tok{flex-direction:row;justify-content:flex-start;text-align:left;flex:1;min-width:0}
  .slot .tok svg.i{width:1.8em;height:1.8em}
  .slot .tok .grip{display:none}
  .mvs{flex-direction:column}
  .mv{min-width:44px;min-height:38px}
  .mv svg.i{transform:rotate(90deg)}
  .mv.l svg.i{transform:rotate(-90deg)}
  .tok .grip{display:none}
  .mt{grid-template-columns:1fr auto}
  .er{grid-template-columns:repeat(3,minmax(0,1fr))}
  .er.hd{display:none}
  .er .nm{grid-column:1/-1;font-weight:700}
  .er .vc{display:flex;flex-direction:column;align-items:center;background:#F1F3EF;border-radius:12px;padding:2px 0;line-height:1.35}
  .er .vc .lb{display:block;font-size:19px;font-weight:700;color:var(--muted)}
  .mt .trk{grid-column:1/-1;grid-row:2}
  .msg svg.av{width:42px;height:42px}
  th,td{padding:8px 4px}
  .sum td:first-child{width:34%}
}
@media (prefers-reduced-motion:reduce){.pop,.reveal{animation:none;opacity:1;transform:none}.trk .f{transition:none}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

var app=document.getElementById('app');

function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function button(txt,cls,fn){var b=el('button',cls||'btn',txt);b.type='button';b.addEventListener('click',fn);return b}
function go(n){st.step=n;save(st);render();try{window.scrollTo(0,0)}catch(e){}}

/* ---------- scoring ---------- */
function calc(bd){
  var d=BASE.d,h=BASE.h,t=BASE.t,rows=[],notes=[];
  var hasFirst=bd.indexOf('first')>=0;
  bd.forEach(function(k,i){
    if(!k)return;
    var c=C[k],e={k:k,i:i,d:c.d,h:c.h,t:c.t,why:''};
    if(k==='vote'&&i!==3){e.d=0;e.why='early'}
    if(k==='last'&&hasFirst){e.d=0;e.h=0;e.why='clash'}
    d+=e.d;h+=e.h;t+=e.t;rows.push(e);
  });
  var rawD=d,rawH=h;
  d=Math.max(0,Math.min(MAXD,d));h=Math.max(0,Math.min(MAXH,h));t=Math.max(TMIN,t);
  return {d:d,h:h,t:t,rawD:rawD,rawH:rawH,rows:rows};
}
window.remeetCalc=calc;

function build(){
  app.innerHTML='';
  var n=st.runs.length+1;
  app.append(el('p','case','第 '+n+' 次排規則（最多 3 次）'),
    el('h2',null,'把規則卡放上班會時間軸，再按「開會模擬」'),
    el('p','lead','時間軸有 4 格：第 1 格是<b>開始</b>，第 2、3 格是<b>討論</b>，第 4 格是<b>決定</b>。最多放 4 張，不一定要放滿。'));
  var bd=st.board;
  var tl=el('div','tl');tl.setAttribute('role','group');tl.setAttribute('aria-label','班會時間軸');
  var tray=el('div','tray');tray.setAttribute('aria-label','規則卡庫');
  var cnt=el('p','cnt');
  var warn=el('p','note warm');warn.style.display='none';
  var simBtn=button('開會模擬','btn go',function(){
    if(!bd.some(Boolean))return;
    var r=calc(bd);
    st.runs.push({cards:bd.slice(),d:r.d,h:r.h,t:r.t});
    st.fresh=true;go(2);
  });
  function tokEl(k,inSlot){
    var b=el('button','tok',ic('grip','grip')+ic(C[k].ic)+'<span>'+C[k].n+'</span>');b.type='button';b.dataset.k=k;
    b.setAttribute('aria-label',C[k].n+(inSlot?'：點一下拿回卡庫':'：點一下放進時間軸'));
    attachDrag(b,k);return b;
  }
  function draw(){
    tl.innerHTML='';
    PH.forEach(function(ph,i){
      var seg=el('div','seg');
      seg.appendChild(el('span','ph '+ph[1],'<b>'+(i+1)+'</b><span>'+ph[0]+'</span>'));
      var s=el('div','slot'+(bd[i]?' full':''));s.dataset.i=i;
      if(bd[i]){
        s.appendChild(tokEl(bd[i],true));
        var mvs=el('div','mvs');
        var l=button(ic('chev'),'mv l',function(){swap(i,i-1)});l.setAttribute('aria-label','往前移一格');if(i===0)l.disabled=true;
        var r=button(ic('chev'),'mv r',function(){swap(i,i+1)});r.setAttribute('aria-label','往後移一格');if(i===3)r.disabled=true;
        mvs.append(l,r);s.appendChild(mvs);
      }else s.appendChild(el('span',null,'放一張卡'));
      seg.appendChild(s);tl.appendChild(seg);
    });
    tray.innerHTML='';
    var left=KEYS.filter(function(k){return bd.indexOf(k)<0});
    left.forEach(function(k){tray.appendChild(tokEl(k,false))});
    if(!left.length)tray.appendChild(el('span','empty','卡片都拿完了'));
    var m=bd.filter(Boolean).length;
    cnt.innerHTML=ic('clipboard')+' 時間軸上有 '+m+' 張卡（最多 4 張）';
    simBtn.disabled=m===0;
  }
  function changed(){warn.style.display='none';save(st);draw()}
  function swap(i,j){if(j<0||j>3)return;var t=bd[i];bd[i]=bd[j];bd[j]=t;changed()}
  function place(k,i){
    var from=bd.indexOf(k);
    if(i<0){if(from>=0)bd[from]=null}
    else{
      var occ=bd[i];
      if(from>=0)bd[from]=null;
      if(occ&&occ!==k&&from>=0)bd[from]=occ;
      bd[i]=k;
    }
    changed();
  }
  function tap(k){
    var from=bd.indexOf(k);
    if(from>=0){place(k,-1);return}
    var e=bd.indexOf(null);
    if(e<0){warn.innerHTML='時間軸已經放滿 4 張了。想換卡的話，先點一張時間軸上的卡，把它拿回卡庫。';warn.style.display='';return}
    place(k,e);
  }
  var suppress=null;
  function attachDrag(b,k){
    var sx=0,sy=0,dragging=false,ghost=null,pid=null,over=null,lx=0,ly=0,raf=null;
    function auto(){
      if(!dragging){raf=null;return}
      var vh=window.innerHeight,edge=Math.min(110,vh*0.16),v=0;
      if(ly<edge)v=-Math.ceil((edge-ly)/6);else if(ly>vh-edge)v=Math.ceil((ly-(vh-edge))/6);
      if(v){window.scrollBy(0,v);var t=target(lx,ly);if(over&&over!==t)over.classList.remove('over');if(t)t.classList.add('over');over=t}
      raf=requestAnimationFrame(auto);
    }
    b.addEventListener('pointerdown',function(ev){
      if(ev.button!==undefined&&ev.button!==0)return;
      pid=ev.pointerId;sx=ev.clientX;sy=ev.clientY;dragging=false;
      try{b.setPointerCapture(pid)}catch(e){}
    });
    b.addEventListener('pointermove',function(ev){
      if(pid!==ev.pointerId)return;
      var dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!dragging&&dx*dx+dy*dy>36){
        dragging=true;
        ghost=b.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=Math.min(b.offsetWidth,260)+'px';document.body.appendChild(ghost);
        b.classList.add('dragging');
      }
      if(dragging){
        lx=ev.clientX;ly=ev.clientY;if(!raf)raf=requestAnimationFrame(auto);
        ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
        var t=target(ev.clientX,ev.clientY);
        if(over&&over!==t)over.classList.remove('over');
        if(t)t.classList.add('over');over=t;
        ev.preventDefault();
      }
    });
    function end(ev,cancel){
      if(pid!==ev.pointerId)return;
      pid=null;
      if(!dragging)return;
      dragging=false;suppress=k;setTimeout(function(){if(suppress===k)suppress=null},350);
      if(ghost){ghost.remove();ghost=null}
      b.classList.remove('dragging');
      if(over)over.classList.remove('over');
      var t=cancel?null:target(ev.clientX,ev.clientY);over=null;
      if(!t){draw();return}
      if(t===tray)place(k,-1);else place(k,+t.dataset.i);
    }
    b.addEventListener('pointerup',function(ev){end(ev,false)});
    b.addEventListener('pointercancel',function(ev){end(ev,true)});
    b.addEventListener('click',function(){if(suppress===k)return;tap(k)});
  }
  function target(x,y){
    var e=document.elementFromPoint(x,y);if(!e)return null;
    var s=e.closest('.slot');if(s)return s;
    if(e.closest('.tray'))return tray;
    return null;
  }
  draw();
  app.append(tl,cnt,el('p','case','規則卡庫'),tray,
    el('p','hint','用手指或滑鼠把卡片拖到時間軸的格子裡；也可以用點的：點卡庫的卡，會放進第一個空格。格子裡的箭頭可以調順序，點時間軸上的卡可以拿回來。'),

}

    if(e.why==='early')tips.push('「用匿名方式投票」要放在第 4 格「決定」才算數。放在前面，等於還沒討論就先投票，大家只能照第一印象投，所以這次它沒有讓不同意見變多。');
    if(e.why==='clash')tips.push('時間軸上同時有「主持人先說結論」，大家早就知道主持人的想法，所以「主持人最後才說」這次沒有作用。');
  });
  var over=[];if(r.rawD>MAXD)over.push('4 個不同意見');if(r.rawH>MAXH)over.push('4 件獨有資訊');
  if(over.length)tips.push('加起來超過 4 的部分不算：班上一共只藏著'+over.join('、')+'，已經全部說出來了。');
  if(r.rawD<0||r.rawH<0)tips.push('減到 0 就不會再少了。');
  tips.forEach(function(t){ec.appendChild(el('p','note warm',t))});

  // record
  var rc=null;
  if(st.runs.length>1){
    rc=el('div','card');rc.appendChild(el('p','case','每一次的紀錄'));
    var t2=el('table');var h2='<thead><tr><th></th><th class="n">不同意見</th><th class="n">獨有資訊</th><th class="n">時間</th></tr></thead><tbody>';
    st.runs.forEach(function(x,q){h2+='<tr><td>第 '+(q+1)+' 次</td><td class="n">'+x.d+' 個</td><td class="n">'+x.h+' 件</td><td class="n">'+x.t+' 分</td></tr>'});
    t2.innerHTML=h2+'</tbody>';rc.appendChild(t2);
  }
  var btns=el('div','row-btns');
  var leftN=3-st.runs.length;
  if(leftN>0)btns.appendChild(button('重排再模擬一次（還可以 '+leftN+' 次）','btn alt small',function(){go(1)}));
  btns.appendChild(button(leftN>0?'不用了，下一步':'下一步','btn',function(){go(3)}));
  var tail=[mc,ec];if(rc)tail.push(rc);tail.push(btns);
  tail.forEach(function(x){if(anim){x.classList.add('reveal');x.style.animationDelay=after+'s'}});
  app.append(c);tail.forEach(function(x){app.appendChild(x)});
  app.dataset.done='0';
  setTimeout(function(){app.dataset.done='1'},anim?after*1000+1100:0);
}

/* ---------- step 3: which rule would you try ---------- */
function pickQ(){
  app.innerHTML='';
  app.append(el('p','case','最後一題'),el('h2',null,'這些規則裡，你最想在我們班試試看的是哪一張？'),
    el('p','lead','每一張都可以選。選了以後，會告訴你這張卡的作用和代價。'));
  var o=el('div','opts');var box=el('div','opts');
  var nx=button('下一步','btn',function(){if(st.pick)go(4)});
  function show(){
    box.innerHTML='';nx.disabled=!st.pick;
    if(!st.pick)return;
    var c=C[st.pick];
    var dl=el('dl','eff');
    dl.innerHTML='<dt class="a">作用</dt><dd>'+c.a+'</dd><dt class="c">代價</dt><dd>'+c.c+'</dd>';
    var n=el('div','note');n.append(el('p',null,'你選的是：<b>'+c.n+'</b>'));n.firstChild.style.margin='0 0 6px';n.appendChild(dl);
    box.append(n,el('p','hint','等一下老師會請大家舉手，也可以說說你為什麼選這一張。'));
  }
  KEYS.forEach(function(k){
    var b=button(ic(C[k].ic)+'<span>'+C[k].n+'</span>','btn alt'+(st.pick===k?' pick':''),function(){
      st.pick=k;save(st);Array.prototype.forEach.call(o.children,function(x){x.classList.remove('pick')});b.classList.add('pick');show();
    });
    o.appendChild(b);
  });
  show();
  app.append(o,box,nx);
}

/* ---------- step 4: end ---------- */
function end(){
  app.innerHTML='';
  var last=st.runs[st.runs.length-1]||{cards:[],d:0,h:0,t:0};
  var ol='<ol class="rl">';
  last.cards.forEach(function(k,i){if(k)ol+='<li>'+ic(C[k].ic)+'<span><span class="pt">第 '+(i+1)+' 格・'+PH[i][0]+'</span><br>'+C[k].n+'</span></li>'});
  ol+='</ol>';
  var t=el('table','sum');
  [['最後一次放的規則卡',ol],
   ['說出來的不同意見','<b>'+last.d+'</b> 個（班上共 4 個）'],
   ['說出來的獨有資訊','<b>'+last.h+'</b> 件（班上共 4 件）'],
   ['花的時間','<b>'+last.t+'</b> 分鐘'],
   ['一共模擬了','<b>'+st.runs.length+'</b> 次'],
   ['最想在我們班試試看',st.pick?'<span style="display:inline-flex;align-items:center;gap:8px">'+ic(C[st.pick].ic)+'<b>'+C[st.pick].n+'</b></span>':'—']].forEach(function(r){
    var tr=el('tr');tr.append(el('td',null,r[0]),el('td',null,r[1]));t.appendChild(tr);
  });
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}

function render(){
  if(st.step>=2&&!st.runs.length)st.step=1;
  if(st.step>=4&&!st.pick)st.step=3;
  var S=[intro,build,sim,pickQ,end];
  (S[st.step]||intro)();
}
render();
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}st={step:0,board:[null,null,null,null],runs:[],fresh:false,pick:null};render()}});
})();
</script>
