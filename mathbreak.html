<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="fresh.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>被打斷的心算・全班連線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="live.js"></script>
<script src="room.js"></script>
<style>
.step{font-size:clamp(90px,24vw,180px);font-weight:900;text-align:center;line-height:1.1;color:#1E242B}
.pop{position:fixed;inset:0;background:rgba(30,36,43,.55);display:flex;align-items:flex-start;justify-content:center;padding-top:60px;z-index:20}
.msg{width:min(92vw,560px);background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:20px;display:flex;flex-direction:column;gap:12px}
.msg .hd{display:flex;align-items:center;gap:10px;font-weight:900;color:#06C755}
.msg .hd i{display:block;width:34px;height:34px;border-radius:9px;background:#06C755}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad .btn{font-size:32px;padding:14px 0}
.show{font-size:56px;font-weight:900;text-align:center;border:3px solid #E3DED7;border-radius:16px;padding:6px;background:#fff;min-height:90px}
.huge{font-size:clamp(56px,8vw,110px);font-weight:900;line-height:1.1}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
</style>
</head>
<body>
<script>
window.HDundoOK=function(){return !document.querySelector('.pop')&&!document.querySelector('.step')};
// 每一步 3.5 秒；第 4 步之前停 6 秒（被打斷的組會跳出訊息）
var STEPS=['12','＋ 7','－ 5','＋ 9','－ 6','＋ 8'],ANS=25,SEC=3.5,GAP=6,BREAK=4;
function tl(){var t=[],x=1.5;for(var i=0;i<STEPS.length;i++){if(i===BREAK)x+=GAP;t.push(x);x+=SEC}return {at:t,end:x}}
var TL=tl();
function stepAt(e){var k=-1;for(var i=0;i<TL.at.length;i++)if(e>=TL.at[i])k=i;if(k===BREAK-1&&e>=TL.at[k]+SEC)return 'gap';return k}
function lt(g){var m=window._lt||(window._lt={});if(!m[g.t0])m[g.t0]=Date.now();return m[g.t0]}
function players(H){return Object.keys(H.seats).length}
function groupOf(g,seat){var i=(g.order||[]).indexOf(+seat);return i<0?'A':(i%2===0?'B':'A')}
function rate(g,grp){var A=g.ans||{},ks=Object.keys(A).filter(function(k){return groupOf(g,k)===grp});var ok=ks.filter(function(k){return A[k]===ANS}).length;return {ok:ok,n:ks.length,p:ks.length?Math.round(ok/ks.length*100):0}}
ROOM.start({
 key:'mathbreak',title:'被打斷的心算',kick:'第 1 節・注意力　全班連線',studentUrl:'mathbreak.html',
 rules:'<p>等一下，平板上會一個一個出現數字，請你<b>在心裡算</b>，不能用筆、不能說出來。算完輸入答案。</p><p>算的途中，可能會跳出一則訊息，看完再接著算。</p>',
 init:function(H){H.g={}},
 onStart:function(H){H.g={ans:{},order:Object.keys(H.seats).map(Number).sort(function(a,b){return a-b})};H.ph='ready'},
 pub:function(H){var g=H.g;return {g:{t0:g.t0,order:g.order,n:Object.keys(g.ans||{}).length,ans:H.ph==='reveal'?g.ans:null}}},
 onMsg:function(H,d,seat){if(d.t==='ans'&&(H.ph==='play'||H.ph==='answer')){H.g.ans[seat]=+d.v;return true}},
 tick:function(H){if(H.ph==='play'&&Date.now()-H.g.t0>=TL.end*1000){H.ph='answer';return true}},
 tickText:function(H){var e=(Date.now()-H.g.t0)/1000,k=stepAt(e);return k==='gap'?'中間停一下……':k<0?'準備……':'第 '+(k+1)+' / '+STEPS.length+' 步'},
 act:{go:function(H){H.g.t0=Date.now();H.ph='play'},reveal:function(H){H.ph='reveal'}},
 bar:function(H){if(H.ph==='ready')return '<button class="btn" data-act="go">開始心算</button>';if(H.ph==='answer')return '<button class="btn" data-act="reveal">公布結果</button>';return ''},
 hostView:function(H){var g=H.g,N=players(H),h='';
  if(H.ph==='ready')h+='<div class="card dark"><p class="huge">看平板，在心裡算</p><p class="stat">不能用筆，不能說出來。</p></div>';
  else if(H.ph==='play')h+='<div class="card dark"><p class="huge">大家正在心算……</p><p class="stat" id="hdtick" style="color:#F2A65A"></p></div><div class="card"><p class="stat">已經送出答案：'+Object.keys(g.ans).length+' / '+N+' 人</p></div>';
  else if(H.ph==='answer')h+='<div class="card dark"><p class="huge">算完了！</p><p class="stat">請在平板上輸入答案。</p></div><div class="card"><p class="stat">已經送出：'+Object.keys(g.ans).length+' / '+N+' 人</p></div>';
  else{var a=rate(g,'A'),b=rate(g,'B');
   h+='<div class="card dark"><p class="stat">答案是 <span style="color:#F2A65A;font-size:64px">'+ANS+'</span>　（12 ＋ 7 － 5 ＋ 9 － 6 ＋ 8）</p><p style="font-size:24px">其實全班分成兩組：一半的人算到一半，跳出了一則群組訊息；另一半的人只是停一下，沒有訊息。</p></div>'+
    '<div class="cmp"><div class="card cool"><h2>沒被打斷的組</h2><p class="huge" style="color:#2A6F68">'+a.p+'%</p><p class="stat">答對 '+a.ok+' / '+a.n+' 人</p></div><div class="card warm"><h2>被訊息打斷的組</h2><p class="huge" style="color:#D95D39">'+b.p+'%</p><p class="stat">答對 '+b.ok+' / '+b.n+' 人</p></div></div>'+
    '<div class="card"><p style="font-size:24px">心算的時候，大腦要一直記著「現在算到 23」。這個暫時記東西的地方很小，一則訊息擠進來，剛剛記的數字就可能被擠掉。</p></div>'}
  return h},
 studentView:function(ST,me,api){var g=ST.g||{},h='',grp=groupOf(g,me),k='m'+g.t0,L=api.local[k]||{};
  if(ST.ph==='ready')h+='<h1>準備心算</h1><p class="lead">等一下數字會一個一個出現，請在心裡算，不能用筆。</p>';
  else if(ST.ph==='play'&&!L.sent){var e=(Date.now()-lt(g))/1000,s=stepAt(e);
   if(s==='gap'){
    h+='<div class="step" style="font-size:60px;color:#94A3B8">記住你算到多少……</div>';
    if(grp==='B'&&!L.read)h+='<div class="pop"><div class="msg"><div class="hd"><i></i>班級群組（3 則新訊息）</div><p style="font-size:22px"><b>小美：</b>明天體育課要換運動服嗎？</p><p style="font-size:22px"><b>阿哲：</b>好像要，老師上禮拜說的</p><p style="font-size:22px"><b>小美：</b>那你覺得要不要帶水壺？</p><p class="lead">請回覆小美：</p><div class="two"><button class="btn te" data-act="read" data-arg="y">要帶</button><button class="btn gh" data-act="read" data-arg="n">不用帶</button></div></div></div>'}
   else if(s<0)h+='<div class="step" style="font-size:60px;color:#94A3B8">準備……</div>';
   else if(e<TL.end)h+='<p class="lead" style="text-align:center;font-size:28px;font-weight:900">'+(s===0?'從這個數字開始':'第 '+(s+1)+' / '+STEPS.length+' 步')+'</p><div class="step">'+STEPS[s]+'</div>';
   else h+=pad(L);}
  else if((ST.ph==='play'||ST.ph==='answer')&&!L.sent)h+=pad(L);
  else if(ST.ph==='reveal')h+='<h1>看大螢幕！</h1><p class="lead">你的答案：'+(L.v!=null?L.v:'—')+'。'+(grp==='B'?'你是「被訊息打斷」的那一組。':'你是「沒被打斷」的那一組。')+'</p>';
  else h+='<h1>送出了！</h1><p class="lead">看大螢幕，等老師公布。</p>';
  return h},
 sact:{read:function(ST,me,api){var g=ST.g,k='m'+g.t0,L=api.local[k]||{};L.read=1;api.local={};api.local[k]=L;api.save()},
  key:function(ST,me,api,v){var g=ST.g,k='m'+g.t0,L=api.local[k]||{};var s=L.typed||'';if(v==='del')s=s.slice(0,-1);else if(s.length<3)s+=v;L.typed=s;api.local={};api.local[k]=L;api.save()},
  send:function(ST,me,api){var g=ST.g,k='m'+g.t0,L=api.local[k]||{};if(!L.typed)return;L.v=+L.typed;L.sent=1;api.send({t:'ans',v:L.v});api.save()}}
});
function pad(L){var h='<h1>算完了！答案是多少？</h1><div class="show">'+(L.typed||'')+'</div><div class="pad">';['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(function(x){h+=x==='del'?'<button class="btn gh" data-act="key" data-arg="del">⌫</button>':x==='ok'?'<button class="btn te" data-act="send" '+(L.typed?'':'disabled')+'>送出</button>':'<button class="btn gh" data-act="key" data-arg="'+x+'">'+x+'</button>'});return h+'</div>'}
var _k='';setInterval(function(){if(location.hash.indexOf('host')>=0||!window.ROOM||!ROOM.redraw||!window._lt)return;var t0=Object.keys(window._lt).pop();if(!t0)return;var e=(Date.now()-window._lt[t0])/1000,k=String(stepAt(e))+(e>=TL.end?'end':'');if(k!==_k){_k=k;ROOM.redraw()}},200);
</script>
</body>
</html>
