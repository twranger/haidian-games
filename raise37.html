<title>墊高我家</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a low village by the Taijiang shore (12 households, a lane, a temple yard, a school playground, a drain ditch to the sea) drawn as an oblique SVG map. Five rains of the same size: tap the cloud, water fills the lowest plots first and spreads (flat water level, fixed volume, fixed drain). Round 2 you shovel soil onto your own plot; rounds 3-4 the computer neighbours follow; round 5 choose: knock on doors to dig the ditch wider, or keep raising your own plot. Record table in the corner, one value question, summary page. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --water:#2F78B8;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:980px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4;display:flex;align-items:center;gap:8px}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.go{background:var(--rust)}
.btn.good{background:var(--good)}
.btn:focus-visible,.cloud:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
.note + .note{margin-top:-4px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn.alt svg.i{width:1.7em;height:1.7em}
.opt-t{display:block;font-weight:900}
.opt-d{display:block;font-size:clamp(19px,2.3vw,21px);color:var(--muted);font-weight:500;line-height:1.55}
/* board */
.board{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:14px;align-items:start}
.mapcard{padding:12px;gap:10px}
.mapbox{position:relative;border-radius:14px;overflow:hidden;background:#F4EFE2}
.mapbox svg.map{width:100%;height:auto;display:block;touch-action:manipulation}
svg.map text{font-family:var(--font);font-weight:900}
svg.map .hit{cursor:pointer}
svg.map .hit:focus{outline:none}
svg.map .hit:focus-visible .ring{stroke:var(--sea)}
.ring.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.25}}
.flow{stroke-dasharray:7 6;animation:dash .7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.rainfx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
.rainfx.on{opacity:1}
.rainfx i{position:absolute;top:-8%;width:3px;height:22px;border-radius:2px;background:#5B98CF;opacity:.75;animation:fall .62s linear infinite}
@keyframes fall{to{top:104%}}
.cloud{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;font:inherit;font-size:clamp(20px,2.8vw,25px);font-weight:900;color:var(--sea);background:#E4EEF5;border:3px solid #BFD3E2;border-radius:999px;padding:6px 18px;cursor:pointer;line-height:1.4}
.cloud svg.i{width:60px;height:60px}
.cloud:disabled{opacity:.42;cursor:default}
.cloud.ready{border-color:var(--sea);background:#D9E8F3}
.cloud.ready svg.i{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.meter{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:clamp(19px,2.2vw,21px);font-weight:700;color:var(--muted);margin:0;line-height:1.5}
.meter span{display:inline-flex;align-items:center;gap:6px}
.meter b{color:var(--ink);font-size:1.08em}
.meter .wd svg.i{color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;font-size:19px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:20px;height:20px;border-radius:5px;border:1.5px solid #8C7A5C}
/* record */
.rec{padding:14px;gap:8px}
.rec table{border-collapse:collapse;width:100%;font-size:19px;line-height:1.35;font-variant-numeric:tabular-nums}
.rec th{font-size:19px;color:var(--muted);font-weight:700;text-align:left;padding:4px 3px;border-bottom:2px solid var(--line)}
.rec td{padding:6px 3px;border-bottom:2px solid var(--line);font-weight:700;white-space:nowrap}
.rec tr.later td{color:#9AA19D;font-weight:500}
.rec tr.now td{background:var(--warm)}
.rec .wet{color:var(--water)}
.rec .dry{color:var(--good)}
.rec small{font-size:19px;color:var(--muted);line-height:1.5}
/* speech */
.say{display:flex;flex-direction:column;gap:10px}
.bub{display:flex;gap:12px;align-items:flex-start;background:var(--warm);border-radius:16px;padding:10px 14px;font-size:clamp(19px,2.4vw,22px);line-height:1.55;margin:0}
.bub.new{animation:pop .35s ease-out}
.bub svg.av{width:52px;height:52px;flex:none}
.bub b{display:block;font-size:19px;color:var(--muted)}
.bub.yes{background:#E3F0E6}
.bub.no{background:#F6E2D9}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.tally{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.tally .homes{display:flex;flex-wrap:wrap;gap:4px}
.tally .homes svg.i{width:30px;height:30px}
.tally .homes .y{color:var(--good)} .tally .homes .n{color:var(--rust)} .tally .homes .u{color:#B4BAB6}
.tally p{margin:0;font-size:clamp(21px,2.8vw,26px);font-weight:900}
.basket{display:flex;align-items:center;gap:10px;margin:0;font-size:clamp(19px,2.5vw,23px);font-weight:900;color:#7A5A16;background:var(--warm);border-radius:14px;padding:8px 14px}
.basket svg.i{width:44px;height:44px}
table.sum{border-collapse:collapse;width:100%;font-size:clamp(19px,2.4vw,23px)}
table.sum td{padding:10px 8px;border-bottom:2px solid var(--line);vertical-align:top}
table.sum td.k{color:var(--muted);font-weight:700}
table.sum td.v{font-weight:900}
@media (max-width:760px){.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.wrap{padding-inline:12px}.mapcard{padding:8px}.card{border-radius:18px}}
@media (prefers-reduced-motion:reduce){.cloud.ready svg.i,.ring.pulse,.flow,.bub.new{animation:none}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

  if(i===ROAD)return{x:206,y:36,w:42,h:286};
  if(i===TEMPLE)return{x:4,y:36,w:196,h:58};
  return{x:270,y:36,w:196,h:58}}
function adj(i){var a=[];if(i<12){var r=Math.floor(i/4),c=i%4;
  if(c===1||c===3)a.push(i-1);if(c===0||c===2)a.push(i+1);
  if(r>0)a.push(i-4);if(r<2)a.push(i+4);
  if(r===0)a.push(c<2?TEMPLE:SCHOOL);if(c===1||c===2)a.push(ROAD);}
  else if(i===ROAD)a=[TEMPLE,SCHOOL,1,5,9,2,6,10];else if(i===TEMPLE)a=[ROAD,0,1];else a=[ROAD,2,3];return a}
var TOPC=['#F1E8D4','#E3CFA6','#D2B27E','#BF975C'];
function n1(v){return Math.round(v*10)/10}
function block(r,h,top){var s='',hh=h*K;
  for(var l=0;l<Math.ceil(h-1e-6);l++){var lh=Math.min(K,(h-l)*K);s+='<rect x="'+r.x+'" y="'+n1(r.y+r.h-l*K-lh)+'" width="'+r.w+'" height="'+n1(lh)+'" fill="'+(l%2?'#93633C':'#AD7A4B')+'"/>'}
  s+='<rect x="'+r.x+'" y="'+n1(r.y-hh)+'" width="'+r.w+'" height="'+r.h+'" rx="7" fill="'+top+'" stroke="#8C7A5C" stroke-width="1.5"/>';return s}
function house(cx,ty,me){return '<path d="M'+(cx-23)+' '+n1(ty+27)+'L'+cx+' '+n1(ty+9)+'L'+(cx+23)+' '+n1(ty+27)+'Z" fill="'+(me?'#E0A030':'#C2603A')+'" stroke="#1F2A2E" stroke-width="2" stroke-linejoin="round"/>'+
  '<rect x="'+(cx-16)+'" y="'+n1(ty+27)+'" width="32" height="23" fill="#FBFCF9" stroke="#1F2A2E" stroke-width="2"/><rect x="'+(cx-5)+'" y="'+n1(ty+36)+'" width="10" height="14" fill="#8C6A44"/>'}
function icon(k,x,y,s,color){return '<svg x="'+x+'" y="'+n1(y)+'" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+(color||'#1F2A2E')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICI[k]+'</svg>'}
function water(r,h,L,i){if(L==null||L-h<0.004)return '';var top=r.y-L*K,ht=r.h+(L-h)*K,s='<rect x="'+r.x+'" y="'+n1(top)+'" width="'+r.w+'" height="'+n1(ht)+'" rx="7" fill="#3A86C8" fill-opacity=".5" stroke="#2F78B8" stroke-width="1.5"/>';
  var d=Math.round((L-h)*CM);if(d>=1){var cx=i===ROAD?r.x+r.w/2:(i>=12?r.x+r.w-38:(i===YOU?r.x+r.w-38:r.x+40)),cy=i===ROAD?0:(i>=12?top+r.h-15:top+r.h-2),w=i>=12?70:76;
    // road label sits in the gap between the row-2 and row-3 flow arrows (y 209-253)
    if(i===ROAD){s+='<rect x="'+(cx-20)+'" y="209" width="40" height="44" rx="8" fill="#1F5C8A"/><text x="'+cx+'" y="229" font-size="18" fill="#fff" text-anchor="middle">'+d+'</text><text x="'+cx+'" y="247" font-size="13" fill="#fff" text-anchor="middle">公分</text>'}
    else s+='<rect x="'+(cx-w/2)+'" y="'+n1(cy-17)+'" width="'+w+'" height="26" rx="8" fill="#1F5C8A"/><text x="'+cx+'" y="'+n1(cy+3)+'" font-size="18" fill="#fff" text-anchor="middle">'+d+' 公分</text>'}
  return s}
function center(i,h){var r=rc(i);return{x:r.x+r.w/2,y:r.y-h[i]*K+r.h/2}}
function arrowsFor(h,L,src){var out=[];if(L==null)return out;src.forEach(function(s){adj(s).forEach(function(t){if(h[t]<h[s]&&L-h[t]>0.004&&L<h[s]+0.004)out.push([s,t])})});return out}
function arrowSvg(a,h){var s=center(a[0],h),r=rc(a[1]),ty=r.y-h[a[1]]*K,ix=14,iy=12;
  var tx=Math.max(r.x+ix,Math.min(r.x+r.w-ix,s.x)),tyy=Math.max(ty+iy,Math.min(ty+r.h-iy,s.y));
  var dx=tx-s.x,dy=tyy-s.y,len=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/len,uy=dy/len;
  var x1=s.x+ux*18,y1=s.y+uy*14,x2=tx-ux*4,y2=tyy-uy*4;
  return '<path class="flow" d="M'+n1(x1)+' '+n1(y1)+'L'+n1(x2)+' '+n1(y2)+'" stroke="#174F7A" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#ah)"/>'}
function drawMap(o){
  var h=o.h,L=o.L,s='<svg class="map" viewBox="0 0 470 386" role="img" aria-label="庄裡的地圖：12 戶人家、小路、廟埕、學校操場和通到海的排水溝">';
  s+='<defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#174F7A"/></marker></defs>';
  // sea
  s+='<rect x="0" y="334" width="470" height="52" fill="#CFE2EF"/><path d="M0 346q15-7 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0" fill="none" stroke="#8DB6D3" stroke-width="2"/><path d="M0 366q15-7 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0" fill="none" stroke="#8DB6D3" stroke-width="2"/>';
  s+='<text x="460" y="378" font-size="17" fill="#205E86" text-anchor="end">臺江的海</text>';
  // ditch
  var dw=o.ditch!=null?o.ditch:(st.wide?1:0),dx=250-6*dw,dwid=14+12*dw;
  s+='<rect x="'+n1(dx)+'" y="30" width="'+n1(dwid)+'" height="314" rx="4" fill="'+(dw>0.5?'#4C8DC4':'#7FA9C9')+'" stroke="#2F6B96" stroke-width="1.5"/>';
  s+='<text x="12" y="378" font-size="17" fill="#205E86">排水溝通到海</text>';
  if(o.out)s+='<path class="flow" d="M257 250L257 366" stroke="#174F7A" stroke-width="6" stroke-linecap="round" fill="none" marker-end="url(#ah)"/>';
  // public places
  [TEMPLE,SCHOOL,ROAD].forEach(function(i){var r=rc(i),ty=r.y-h[i]*K;
    s+=block(r,h[i],i===TEMPLE?'#EBD7C6':i===SCHOOL?'#D6E5C8':'#DCD8CE');
    if(i===TEMPLE){s+=icon('raise_temple',r.x+6,ty+10,38,'#7A3A1E')+'<text x="'+(r.x+48)+'" y="'+n1(ty+28)+'" font-size="20" fill="#1F2A2E">廟埕</text><text x="'+(r.x+48)+'" y="'+n1(ty+50)+'" font-size="16" fill="#56605C">沒有人墊</text>'}
    else if(i===SCHOOL){s+='<ellipse cx="'+(r.x+150)+'" cy="'+n1(ty+29)+'" rx="38" ry="20" fill="none" stroke="#FBFCF9" stroke-width="4"/>'+'<text x="'+(r.x+12)+'" y="'+n1(ty+28)+'" font-size="20" fill="#1F2A2E">學校操場</text><text x="'+(r.x+12)+'" y="'+n1(ty+50)+'" font-size="16" fill="#56605C">沒有人墊</text>'}
    else{s+='<path d="M'+(r.x+r.w/2)+' '+n1(ty+70)+'V'+n1(ty+r.h-8)+'" stroke="#FBFCF9" stroke-width="3" stroke-dasharray="10 10"/><text x="'+(r.x+r.w/2)+'" y="'+n1(ty+26)+'" font-size="19" fill="#1F2A2E" text-anchor="middle">小</text><text x="'+(r.x+r.w/2)+'" y="'+n1(ty+48)+'" font-size="19" fill="#1F2A2E" text-anchor="middle">路</text>'}
    s+=water(r,h[i],L,i)});
  // houses, back row first
  for(var i=0;i<12;i++){var r=rc(i),hv=h[i],ty=r.y-hv*K,me=i===YOU,top=TOPC[Math.max(0,Math.min(3,Math.round(hv)))];
    var g='',hit=o.mode==='shovel'&&me||o.mode==='knock'&&!me&&st.knock.indexOf(i)<0;
    g+=block(r,hv,top)+house(r.x+r.w-30,ty,me);
    g+='<text x="'+(r.x+8)+'" y="'+n1(ty+24)+'" font-size="18" fill="#5A4022">'+Math.round(hv)+' 層</text>';
    if(me)g+='<text x="'+(r.x+8)+'" y="'+n1(ty+48)+'" font-size="20" fill="#9A5A00">你家</text>';
    g+=water(r,hv,L,i);
    if(o.mode==='knock'&&st.knock.indexOf(i)>=0){var ok=KN[i][0];g+='<circle cx="'+(r.x+22)+'" cy="'+n1(ty+43)+'" r="14" fill="#FBFCF9" stroke="'+(ok?'#2F7D4F':'#A8441A')+'" stroke-width="2.5"/>'+icon(ok?'check':'x',r.x+11,ty+32,22,ok?'#2F7D4F':'#A8441A')}
    if(o.hl&&o.hl.indexOf(i)>=0)g+='<rect x="'+(r.x-2)+'" y="'+n1(ty-2)+'" width="'+(r.w+4)+'" height="'+(r.h+4)+'" rx="9" fill="none" stroke="#B7862B" stroke-width="4"/>';
    if(hit){g+='<rect class="ring'+(me||o.mode==='knock'?' pulse':'')+'" x="'+(r.x-2)+'" y="'+n1(ty-2)+'" width="'+(r.w+4)+'" height="'+n1(r.h+4+hv*K)+'" rx="9" fill="#FFFFFF" fill-opacity=".01" stroke="'+(me?'#B7862B':'#205E86')+'" stroke-width="4"/>';
      if(!me)g+=icon('door',r.x+10,ty+31,24,'#205E86');
      s+='<g class="hit" data-i="'+i+'" tabindex="0" role="button" aria-label="'+(me?'你家，點一下墊高一層':PP[i][0]+'家，點一下去敲門')+'">'+g+'</g>'}
    else s+=g}
  (o.arrows||[]).forEach(function(a){s+=arrowSvg(a,h)});
  return s+'</svg>'}

/* ---------- helpers ---------- */
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function button(cls,html,fn){var b=el('button',cls,html);b.type='button';b.addEventListener('click',fn);return b}
function tween(ms,fn,done){if(RM){fn(1);if(done)done();return}var t0=null;function f(t){if(t0===null)t0=t;var p=Math.min(1,(t-t0)/ms);fn(p);if(p<1)requestAnimationFrame(f);else if(done)done()}requestAnimationFrame(f)}
function ease(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2}
function wait(ms,fn){setTimeout(fn,RM?0:ms)}
function bubble(i,text,cls,isNew){var b=el('p','bub'+(cls?' '+cls:'')+(isNew?' new':''));b.innerHTML=av(PP[i][1])+'<span><b>'+PP[i][0]+'</b>「'+text+'」</span>';return b}
var mapHolder=null,rainfx=null;
function paint(o){if(mapHolder)mapHolder.innerHTML=drawMap(o)}
function viewNow(){var arr=st.p==='done'?arrowsFor(st.h,st.L,st.src):[];
  var hl=[];return{h:st.h,L:st.p==='done'?st.L:null,arrows:arr,out:st.p==='done'&&st.s===5&&st.wide,mode:mode(),hl:hl}}
function mode(){if(st.s===2&&st.p==='pre'||st.s===4&&st.p==='shovel'||st.s===5&&st.p==='self')return 'shovel';if(st.s===5&&st.p==='dig')return 'knock';return ''}
function cm(v){return v>0?v+' 公分':'沒淹'}

/* ---------- pieces of the round screen ---------- */
function mapCard(){
  var c=el('div','card mapcard');
  var ready=st.p==='ready';
  var cl=button('cloud'+(ready?' ready':''),ic('rain')+'<span>'+(st.p==='done'?'這一場雨下完了':'按雲朵，下第 '+st.s+' 場大雨')+'</span>',function(){if(!busy&&st.p==='ready')doRain()});
  cl.disabled=!ready;cl.id='cloud';
  var box=el('div','mapbox');mapHolder=el('div');rainfx=el('div','rainfx');
  for(var k=0;k<46;k++){var d=el('i');d.style.left=((k*37)%100+((k*13)%7)/10)+'%';d.style.animationDelay=(-((k*29)%62)/100)+'s';rainfx.appendChild(d)}
  box.append(mapHolder,rainfx);
  box.addEventListener('click',function(e){var g=e.target.closest&&e.target.closest('[data-i]');if(g)tapCell(+g.getAttribute('data-i'))});
  box.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var g=e.target.closest&&e.target.closest('[data-i]');if(g){e.preventDefault();tapCell(+g.getAttribute('data-i'))}});
  var left=volume()*10;
  var m=el('p','meter','<span>'+ic('rain')+'這場雨 <b>'+RAIN+'</b> 桶</span><span class="'+(st.wide?'wd':'')+'">'+ic('canal')+'排水溝排走 <b>'+(st.wide?WIDE:DRAIN)+'</b> 桶</span><span>'+ic('raise_bucket')+'留在庄裡 <b>'+left+'</b> 桶</span>');
  var lg=el('p','legend','<span><i class="sw" style="background:'+TOPC[0]+'"></i>0 層</span><span><i class="sw" style="background:'+TOPC[1]+'"></i>1 層</span><span><i class="sw" style="background:'+TOPC[2]+'"></i>2 層</span><span><i class="sw" style="background:'+TOPC[3]+'"></i>3 層（顏色越深，墊得越高）</span>');
  c.append(cl,box,m,lg);paint(viewNow());return c}
function recCard(){

function board(){var b=el('div','board');b.append(mapCard(),recCard());return b}

 5:{pre:'第 5 場雨快來了。這一次，你想怎麼做？',dig:'點鄰居的家，去敲門拜託大家一起挖溝。',self:'點地圖上的「你家」，再墊一層。',ready:'準備好了。按雲朵，下第 5 場雨。',done:'第 5 場雨的結果'}};

function story(r){var g=st.log[r-1]||{};var a=[];
  if(r===1)a.push('大雨一來，水先往最低的地方跑。你家、阿福伯家和秀琴姨家都在庄裡最低的角落，這 '+g.n+' 戶都淹了 '+g.you+' 公分。其他地方比較高，水上不去。');
  if(r===2){var d=dep(st.h,st.L,8);a.push('你家墊高一層，水進不來了。可是這場雨一樣是 30 桶，排水溝一樣只排走 10 桶，剩下的 20 桶總要找個地方去。藍色箭頭就是水的去向：它們流進隔壁阿福伯家和秀琴姨家，兩戶各淹了 '+d+' 公分，比上一場還深。')}
  if(r===3)a.push('阿福伯和秀琴姨都墊了 2 層，比你家還高。水又去找下一個低的地方：這一場淹了 '+g.n+' 戶人家，你家也又淹了 '+g.you+' 公分，連小路、廟埕和操場都開始積水。每一戶淹得比較淺，可是淹水的人家變多了。');
  if(r===4){a.push('現在每一戶都墊高了，全庄最低的地方，變成沒有人墊的小路、廟埕和學校操場。雨還是 30 桶，排水溝還是只排走 10 桶，留下來的 20 桶全擠到這三個地方，淹了 '+g.pub+' 公分，和第 1 場雨你家淹的一樣深。人家裡都沒淹，可是要上學、去廟裡、走小路出門的每一個人，都得踩水。');
    var p=PRED.filter(function(x){return x[0]===st.pred})[0];
    if(p)a.push('你剛剛猜的是「'+p[2]+'」。'+(st.pred==='pub'?'猜對了。':'')+'雨水的量並沒有變少；只要庄裡還有比較低的地方，水就會流過去。大家都墊高以後，最低的就只剩下沒有人墊的公共地方。')}
  if(r===5){if(st.choice==='dig'){var no=st.knock.filter(function(i){return !KN[i][0]}).length;
      a.push('這場雨一樣是 30 桶。排水溝挖寬以後，一次可以排走 25 桶，留在庄裡的只剩 5 桶，小路、廟埕和操場只積了 '+g.pub+' 公分的水，沒有一戶人家淹水。');
      a.push('代價：你敲了 '+st.knock.length+' 戶的門，其中 '+no+' 戶不肯幫忙；而且要等到大家都有空的那個禮拜六，'+agreeN()+' 戶人家各出一個人，挖了一整天。')}
    else{a.push('你家墊到 '+st.h[YOU]+' 層，水更淹不到你了。可是這場雨一樣是 30 桶，排水溝一樣只排走 10 桶，留下的 20 桶還是全擠在小路、廟埕和操場，淹了 '+g.pub+' 公分。');
      a.push((st.knock.length?'你敲了 '+st.knock.length+' 戶的門，後來決定不等了。':'')+'自己墊的好處是很快、不用拜託別人；代價是水沒有變少，只是換個地方待著。隔壁阿土伯看到了，說：「你家又墊了？那我下禮拜也再加一層。」')}}
  return a}

/* ---------- actions ---------- */
function tapCell(i){if(busy)return;var m=mode();
  if(m==='shovel'&&i===YOU){busy=true;var from=st.h[YOU];st.h[YOU]=from+1;st.raised++;if(st.src.indexOf(YOU)<0)st.src.push(YOU);
    st.p=st.s===4?'pred':'ready';save(st);
    var hv=st.h.slice();tween(500,function(p){hv[YOU]=from+ease(p);paint({h:hv,L:null})},function(){busy=false;render()});return}
  if(m==='knock'&&i!==YOU&&st.knock.indexOf(i)<0){st.knock.push(i);save(st);render()}}
function neighbours(r,btn){busy=true;btn.disabled=true;var list=r===3?R3:R4,hv=st.h.slice();
  list.forEach(function(x){st.h[x.i]=x.to});st.src=list.map(function(x){return x.i});st.p=r===3?'ready':'shovel';save(st);
  var say=app.querySelector('.say'),k=0,dt=r===3?1300:520;
  function next(){if(k>=list.length){wait(r===3?500:700,function(){busy=false;render()});return}
    var x=list[k++],from=hv[x.i];if(x.t)say.appendChild(bubble(x.i,x.t,'',true));
    tween(r===3?600:320,function(p){hv[x.i]=from+(x.to-from)*ease(p);paint({h:hv,L:null,hl:[x.i]})},function(){wait(dt-(r===3?600:320),next)})}
  next()}
function dig(){busy=true;st.wide=true;st.p='ready';save(st);
  tween(900,function(p){paint({h:st.h,L:null,ditch:ease(p)})},function(){busy=false;render()})}
function doRain(){busy=true;var cl=document.getElementById('cloud');if(cl){cl.disabled=true;cl.classList.remove('ready')}
  var L=level(st.h,volume()),L0=Math.min.apply(null,st.h);
  rainfx.classList.add('on');
  wait(900,function(){tween(1900,function(p){paint({h:st.h,L:L0+(L-L0)*ease(p)})},function(){
    wait(300,function(){rainfx.classList.remove('on');
      st.L=L;st.p='done';var n=0;for(var i=0;i<12;i++)if(dep(st.h,L,i)>0)n++;
      st.log[st.s-1]={you:dep(st.h,L,YOU),n:n,pub:Math.max(dep(st.h,L,ROAD),dep(st.h,L,TEMPLE),dep(st.h,L,SCHOOL))};
      save(st);busy=false;render();
      var nt=app.querySelector('.note');if(nt)nt.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})})})})}

/* ---------- other screens ---------- */
function intro(){app.innerHTML='';
  app.appendChild(el('h1',null,'墊高我家'));
  app.appendChild(el('p','lead','你住在臺江邊一個地勢很低的小庄，全庄一共 <b>12 戶</b>人家。你家在最靠海的那一排，地圖上標著「你家」。'));
  var b=el('div','board');var c=el('div','card mapcard');var box=el('div','mapbox');box.innerHTML=drawMap({h:st.h,L:null});c.appendChild(box);
  c.appendChild(el('p','legend','<span><i class="sw" style="background:'+TOPC[0]+'"></i>0 層</span><span><i class="sw" style="background:'+TOPC[1]+'"></i>1 層</span><span><i class="sw" style="background:'+TOPC[2]+'"></i>2 層（顏色越深，地越高）</span>'));
  var r=el('div','card');r.appendChild(el('h3',null,ic('rain')+'下大雨的時候'));
  r.appendChild(el('p','lead','每一場雨都一樣大：<b>30 桶</b>水。排水溝每次可以把 <b>10 桶</b>排到海裡，剩下的水會先流進<b>最低</b>的地方，再往旁邊的低處漫開。'));
  r.appendChild(el('p','lead','每戶的地有 0～3 層土，一層大約 30 公分。'));
  b.append(c,r);app.appendChild(b);
  app.appendChild(el('p','note','接下來會下 <b>5 場</b>雨。每一場雨下完，你都可以看看水跑去哪裡、誰家淹了。'));
  app.appendChild(button('btn',ic('chev')+' 開始',function(){st.s=1;st.p='ready';save(st);render();window.scrollTo(0,0)}))}
var VAL=[['self','shovel','先墊高自己家','作用：很快，自己就能決定，不用等別人。代價：水不會變少，只是流到別人家或公共地方；別人看到了，也可能跟著再墊。'],
         ['dig','people','先去找大家一起挖溝','作用：留在庄裡的水真的變少，全庄的人都受益。代價：要花力氣一戶一戶拜託、要等大家有空，也可能有人不肯出力。'],
         ['both','raise_soil','一邊先墊一點，一邊去找大家','作用：先保護自己，也去處理大家的問題。代價：土和力氣都要花兩份；而且你墊高的那一層，還是會把一點水推到別人那裡。']];
function value(){app.innerHTML='';
  app.appendChild(el('p','case',ic('talk')+'最後一題'));
  app.appendChild(el('h2',null,'如果你是這一戶，下一次大雨之前，你會先墊高自己家，還是先去找大家挖溝？'));
  app.appendChild(el('p','lead','這一題沒有標準答案。選好以後，看看這個選擇的作用和代價。'));
  var g=el('div','opts'),fb=el('div');
  VAL.forEach(function(v){g.appendChild(button('btn alt'+(st.val===v[0]?' pick':''),ic(v[1])+'<span>'+v[2]+'</span>',function(){st.val=v[0];save(st);value();var f=document.getElementById('next');if(f)f.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})}))});
  app.appendChild(g);
  if(st.val){var v=VAL.filter(function(x){return x[0]===st.val})[0];app.appendChild(el('p','note',v[3]));app.appendChild(el('p','note warm','每一種選擇都有人會選。等一下全班一起聊聊：你為什麼這樣選？'));
    var b=button('btn',ic('chev')+' 看我的紀錄',function(){st.s=7;save(st);render();window.scrollTo(0,0)});b.id='next';app.appendChild(b)}}
function end(){app.innerHTML='';
  app.appendChild(el('h1',null,'做完了！請停在這一頁，等其他同學。'));
  var wet=st.log.filter(function(g){return g&&g.you>0}).length,last=st.log[4]||{n:0,pub:0},v=VAL.filter(function(x){return x[0]===st.val})[0];
  var ch=st.choice==='dig'?'大家一起出工，把排水溝挖寬（敲了 '+st.knock.length+' 戶的門，連你一共 '+agreeN()+' 戶同意）':'繼續墊高自己家'+(st.knock.length?'（敲了 '+st.knock.length+' 戶的門後放棄）':'');
  var c=el('div','card');c.appendChild(el('h3',null,ic('clipboard')+'老師會請大家舉手'));
  c.appendChild(el('div',null,'<table class="sum"><tr><td class="k">你家一共墊高了幾層</td><td class="v">'+st.raised+' 層</td></tr>'+
   '<tr><td class="k">5 場雨裡，你家淹了幾次</td><td class="v">'+wet+' 次</td></tr>'+
   '<tr><td class="k">最後一場雨，全庄淹了幾戶人家</td><td class="v">'+last.n+' 戶（公共地方淹 '+last.pub+' 公分）</td></tr>'+
   '<tr><td class="k">第 5 場雨前，你選了</td><td class="v">'+ch+'</td></tr>'+
   '<tr><td class="k">最後一題，你選了</td><td class="v">'+(v?v[2]:'')+'</td></tr></table>'));
  app.appendChild(c);
  app.appendChild(recCard());
  app.appendChild(el('p','note','想一想：5 場雨都一樣大。墊高讓誰的淹水變少了？那些水最後跑到哪裡去了？'))}
function render(){if(st.s===0)intro();else if(st.s<=5)round();else if(st.s===6)value();else end()}
render();
})();
</script>
