<meta charset="utf-8">
<script src="fresh.js"></script>
<title>四草夏令營</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Flow: intro → day 1 own team (teammates, cheer, pick flag colour) → day 2 three matches (fixed: own team wins 1, loses 2; taunt + complaint bubbles) → gauge 1 → day 3 morning breakfast + show (still silent) → gauge 2 → water tower + stuck truck story → pull the rope together (alternate left/right) → gauge 3 → line chart of 3 gauges → what changed your mind (all choices ok) → summary. Team (招潮蟹隊／彈塗魚隊) is drawn with crypto and saved. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --crab:#B4531F; --crabL:#F7E1D2; --mud:#22707E; --mudL:#DCEEF0;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.go{background:var(--rust)}
.btn:focus-visible,.gauge svg:focus-visible,.sw:focus-visible,.pullbtn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn.alt svg.i{width:1.6em;height:1.6em;color:var(--sea)}
/* team chip */
.tchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 14px 4px 8px;font-weight:900;font-size:clamp(19px,2.4vw,22px);letter-spacing:0;line-height:1.4}
.tchip.t0{background:var(--crabL);color:var(--crab)}
.tchip.t1{background:var(--mudL);color:var(--mud)}
.tchip .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* intro badges */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{border-radius:20px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:clamp(21px,3vw,28px)}
.badge svg.i{width:72px;height:72px}
.badge.t0{background:var(--crabL);color:var(--crab)}
.badge.t1{background:var(--mudL);color:var(--mud)}
.badge.t0 svg.i,.badge.t1 svg.i{color:var(--ink)}
.days{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:clamp(19px,2.6vw,24px)}
.days li{display:flex;gap:10px;align-items:center}
.days b{white-space:nowrap}
/* teammates */
.mates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mate{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px}
.mate svg.av{width:68px;height:68px;flex:none}
.mate h3{margin:0;font-size:clamp(21px,2.8vw,25px)}
.mate p{margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.55}
.cheer{font-size:clamp(23px,3.6vw,32px);font-weight:900;margin:0;line-height:1.5;text-wrap:balance}
.cheer.t0{color:var(--crab)} .cheer.t1{color:var(--mud)}
/* flag */
.flagbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:center}
.flagbox svg.flag{width:100%;height:auto;max-width:300px;justify-self:center}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sw{font:inherit;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-weight:700;font-size:19px;color:var(--ink);touch-action:manipulation}
.sw span.c{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink)}
.sw.pick{border-color:var(--gold);background:var(--warm)}
/* matches */
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{border:3px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;font-size:clamp(17px,2.2vw,20px);font-weight:700;color:var(--muted);background:var(--card);line-height:1.35}
.slot svg.i{width:1.5em;height:1.5em;display:block;margin:0 auto 2px;color:var(--ink)}
.slot.now{border-color:var(--sea)}
.slot.w0{background:var(--crabL);border-color:var(--crab);color:var(--crab)}
.slot.w1{background:var(--mudL);border-color:var(--mud);color:var(--mud)}
.scene{width:100%;height:auto;display:block;border-radius:16px}
.tugg{transform-box:view-box}
.tugg.runL{animation:tugL 2.4s ease-in-out forwards}
.tugg.runR{animation:tugR 2.4s ease-in-out forwards}
.tugg.endL{transform:translateX(-36px)} .tugg.endR{transform:translateX(36px)}
@keyframes tugL{0%{transform:translateX(0)}15%{transform:translateX(-10px)}30%{transform:translateX(9px)}45%{transform:translateX(-14px)}60%{transform:translateX(10px)}100%{transform:translateX(-36px)}}
@keyframes tugR{0%{transform:translateX(0)}15%{transform:translateX(10px)}30%{transform:translateX(-9px)}45%{transform:translateX(14px)}60%{transform:translateX(-10px)}100%{transform:translateX(36px)}}
.lanes{display:flex;flex-direction:column;gap:12px;background:#F3EAD3;border-radius:16px;padding:12px}
.lane{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.lane .nm{font-weight:900;font-size:clamp(17px,2.4vw,21px);white-space:nowrap}
.lane .nm.t0{color:var(--crab)} .lane .nm.t1{color:var(--mud)}
.track{position:relative;height:56px;border-bottom:3px dashed #C9B98F}
.runner{position:absolute;left:0;top:2px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);transition:left 2.2s cubic-bezier(.4,.1,.5,1)}
.runner.t0{background:var(--crabL)} .runner.t1{background:var(--mudL)}
.runner svg.i{width:34px;height:34px}
.lane .goal svg.i{width:44px;height:44px}
.tent{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.12)}
.tents.run .tent{transition:transform 2.2s ease-in-out}
.tents.run .tent.w,.tents.end .tent.w{transform:scaleY(1)}
.tents.run .tent.l,.tents.end .tent.l{transform:scaleY(.58) skewX(-10deg)}
.result{font-size:clamp(25px,4.2vw,36px);font-weight:900;margin:0;text-align:center}
.result.t0{color:var(--crab)} .result.t1{color:var(--mud)}
.prize{display:flex;gap:10px;align-items:center;justify-content:center;font-size:clamp(19px,2.6vw,23px);font-weight:700;margin:0;text-align:left}
.prize svg.i{width:1.6em;height:1.6em}
.say{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.say svg.av{width:64px;height:64px}
.say .who{font-size:clamp(17px,2.2vw,19px);font-weight:900;margin:0 0 4px}
.say .who.t0{color:var(--crab)} .say .who.t1{color:var(--mud)}
.bub{position:relative;border-radius:18px;padding:12px 16px;font-size:clamp(19px,2.6vw,24px);line-height:1.6;margin:0;border:3px solid var(--line);background:var(--card)}
.bub.t0{border-color:#E8BFA4;background:#FDF4EE}
.bub.t1{border-color:#A9D0D6;background:#F1F8F9}
/* gauge */
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge svg{width:100%;max-width:520px;height:auto;touch-action:none;cursor:pointer;border-radius:12px}
.gauge .ends{width:100%;max-width:520px;display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:clamp(19px,2.4vw,22px);margin-top:-6px}
.readout{font-size:clamp(26px,4.6vw,40px);font-weight:900;margin:0;text-align:center;color:var(--ink)}
.readout.none{color:var(--muted);font-size:clamp(19px,2.8vw,25px);font-weight:700}
#needle{transform-origin:160px 172px;transition:transform .25s ease-out}
/* breakfast */
.tablescene{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;align-items:end}
.tablescene svg.av{width:100%;height:auto;display:block}
.tablescene .seat{aspect-ratio:1;border-radius:50%;border:3px dashed var(--line)}
.tablescene .tab{grid-column:1/-1;height:20px;border-radius:8px;background:#C9A574;border:3px solid var(--ink)}
.tablescene .q{grid-column:span 4;display:flex;justify-content:center;color:var(--muted)}
.tablescene .q svg.i{width:40px;height:40px}
.tablescene .gap{grid-column:span 2}
.icrow{display:flex;gap:14px;align-items:flex-start}
.icrow > svg.i{width:56px;height:56px;flex:none;margin-top:2px}
/* rope */
.pullrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pullbtn{font:inherit;border:3px solid var(--ink);border-radius:20px;min-height:132px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-weight:900;font-size:clamp(20px,2.8vw,25px);color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s;user-select:none;-webkit-user-select:none}
.pullbtn:active{transform:scale(.95)}
.pullbtn.t0{background:var(--crabL)} .pullbtn.t1{background:var(--mudL)}
.pullbtn svg.i{width:60px;height:60px}
.pullbtn small{font-size:clamp(17px,2.2vw,19px);font-weight:700;color:var(--muted)}
.pullbtn:disabled{opacity:.5;cursor:default}
.bar{height:30px;border-radius:999px;background:#E3E6E0;border:3px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--crab),var(--gold),var(--mud));transition:width .2s}
.barlbl{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:clamp(19px,2.4vw,22px);margin:0}
.fig{transform-box:fill-box;transform-origin:50% 100%;transition:transform .18s}
.fig.lean{transform:rotate(14deg)}
#truck{transition:transform .25s}
/* chart */
.chart{width:100%;max-width:560px;height:auto;align-self:center}
.legend{font-size:clamp(19px,2.4vw,22px);color:var(--muted);font-weight:700;margin:0;text-align:center}
ul.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:clamp(19px,2.6vw,24px);line-height:1.65}
ul.why li{display:flex;gap:12px;align-items:flex-start}
ul.why li svg.i{width:1.7em;height:1.7em;flex:none;margin-top:.1em;color:var(--sea)}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.6vw,24px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
td:first-child{color:var(--muted);font-weight:700}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .mates{grid-template-columns:1fr}
  .flagbox{grid-template-columns:1fr}
  th,td{padding:8px 4px}
  .say svg.av{width:52px;height:52px}
  .runner{width:44px;height:44px} .runner svg.i{width:28px;height:28px}
  .lane .goal svg.i{width:36px;height:36px}
  .pullbtn{min-height:120px}
}
@media (prefers-reduced-motion:reduce){.tugg.runL,.tugg.runR{animation-duration:.01s}.runner,.tents.run .tent{transition-duration:.01s}}
</style>

function day1(){

  app.appendChild(el('h2',null,'你抽到的是：<span style="color:'+T.c+'">'+T.name+'</span>！'));
  app.appendChild(el('p','lead','這是你的四位隊友，他們先來介紹自己：'));

  });

  var c=el('div','card');
  c.append(el('p','lead',ic('mega')+' '+T.kids[st.team===0?3:0].n+'教大家喊隊呼，全隊一起大聲喊：'),el('p','cheer t'+st.team,'「'+T.cheer+'」'));

  fc.appendChild(el('p','lead','最後，隊旗還沒有顏色。<b>你來替隊旗選一個顏色</b>：'));

var CX=160,CY=172,R=150,RI=62;
function pol(r,a){var t=a*Math.PI/180;return [(CX+r*Math.cos(t)).toFixed(1),(CY-r*Math.sin(t)).toFixed(1)]}
function sector(i){
  var a0=180-36*i,a1=180-36*(i+1),p0=pol(R,a0),p1=pol(R,a1),q1=pol(RI,a1),q0=pol(RI,a0);

  var ul=el('ul','why');
  ul.innerHTML='<li>'+ic('tug')+'<span><b>比賽的時候</b>，兩隊搶同一份獎品，一隊贏、另一隊就輸，再加上你一句、我一句，很容易覺得對方隊的人不好。</span></li>'+
   '<li>'+ic('bowl')+'<span><b>只是一起吃飯、看表演</b>，大家還是各坐各的，不一定會變好。</span></li>'+
   '<li>'+ic('pull')+'<span><b>遇到兩隊都需要、一隊又做不到的事</b>，大家只好一起出力。一起完成以後，比較容易覺得對方隊也不錯。</span></li>';
  c2.appendChild(ul);
  app.append(c2,button('下一步','btn',function(){go(10)}));
}

/* ---------- step 10: what changed your mind ---------- */
var FEEL=[
 ['bowl','一起吃飯','坐在同一張桌子、看同一場表演，讓兩隊有機會看見對方。有人會因此改觀；也有人覺得，光是坐在一起還不夠。'],
 ['pull','一起修水管、拉車','這件事兩隊都需要，一隊又做不到，大家只好一起出力。有人覺得，一起完成一件事以後，對方就像「自己人」了。'],
 ['talk','認識對方隊的一個人','認識了一個人以後，對方隊就不再只是「那一隊」，而是有名字、有個性的人。'],
 ['minus','都沒有改變','想法不一定要改變。有人對另一隊的感覺一直差不多；也有人覺得，比賽時的不開心需要更久才會淡掉。']
];
function feel(){
  app.innerHTML='';
  app.appendChild(topbar(ic('talk')+' 最後一題'));
  app.appendChild(el('h2',null,'什麼事最讓你改變對另一隊的想法？'));
  app.appendChild(el('p','lead','每個選項都可以選，選你心裡最接近的那一個。'));
  var o=el('div','opts');var note=el('p','note warm');note.hidden=st.feel==null;
  var nx=button('選好了，下一步','btn',function(){if(st.feel==null)return;go(11)});nx.disabled=st.feel==null;
  FEEL.forEach(function(f,k){
    var b=button(ic(f[0])+'<span>'+f[1]+'</span>','btn alt'+(st.feel===k?' pick':''),function(){
      st.feel=k;save(st);Array.prototype.forEach.call(o.children,function(x){x.classList.remove('pick');x.setAttribute('aria-pressed','false')});b.classList.add('pick');b.setAttribute('aria-pressed','true');
      note.hidden=false;note.textContent=f[2];nx.disabled=false;
    });
    b.setAttribute('aria-pressed',st.feel===k?'true':'false');
    o.appendChild(b);
  });
  if(st.feel!=null)note.textContent=FEEL[st.feel][2];
  app.append(o,note,nx);
}

/* ---------- step 11: end ---------- */
function end(){
  app.innerHTML='';
  var g=st.g,t=el('table');
  var d=g[2]-g[0],dt=d>0?'高了 '+d+' 格':(d<0?'低了 '+(-d)+' 格':'一樣');
  [['我的隊',me().name],
   ['好感：比賽完',g[0]+' 分（'+GL[g[0]-1]+'）'],
   ['好感：一起吃飯後',g[1]+' 分（'+GL[g[1]-1]+'）'],
   ['好感：一起拉車後',g[2]+' 分（'+GL[g[2]-1]+'）'],
   ['第 3 次比第 1 次',dt],
   ['最讓我改變想法的事',FEEL[st.feel][1]]].forEach(function(r){
    var tr=el('tr');tr.append(el('td',null,r[0]),el('td',null,'<b>'+r[1]+'</b>'));t.appendChild(tr);
  });
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}

function render(){
  var S=[intro,day1,matches,function(){gaugePage(0,4)},breakfast,function(){gaugePage(1,6)},trouble,rope,function(){gaugePage(2,9)},chart,feel,end];
  if(st.step>=2&&st.flag==null)st.step=1;
  if(st.step>=3&&!(st.evs[0]&&st.evs[1]&&st.evs[2]))st.step=2;
  if(st.step>=4&&st.g[0]==null)st.step=3;
  if(st.step>=6&&st.g[1]==null)st.step=5;
  if(st.step>=8&&!(st.pull.p>=100))st.step=7;
  if(st.step>=9&&st.g[2]==null)st.step=8;
  if(st.step>=11&&st.feel==null)st.step=10;
  (S[st.step]||intro)();
}
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){save(null);location.replace(location.pathname+location.search);location.reload()}});
render();
})();
</script>
