<meta charset="utf-8">
<script src="fresh.js"></script>
<title>閱讀集點卡</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: story + book list → three rounds (rule A stamps / rule B pages / rule C one sentence per book + random check). Each round: drag book spines from the shelf into the schoolbag (10 time slots), tap works too → result with score, whether the favourite novel was read, neutral note on how the rule moved the choice → which rule helps you read what you really want (all options OK, effect and cost) → summary for a show of hands. Same light classroom look as shift.html. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --wood:#B98A5A; --wood2:#8E6338;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.go{background:var(--rust)}
.btn:focus-visible,.spine:focus-visible,.chip:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.letter{display:inline-block;min-width:1.6em;font-weight:900;color:var(--sea)}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note p{margin:0}
.note p+p{margin-top:8px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
/* book list */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.6vw,24px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:700}
td.n,th.n{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
td.n{font-weight:900}
.bk{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:34px;border-radius:4px;border:2px solid var(--ink);flex:none}
.bk small{display:block;color:var(--muted);font-weight:500;font-size:.85em;line-height:1.3}
.bk b{line-height:1.35}
.fav{color:var(--rust)}
/* rule card */
.rule{border-color:var(--sea);background:#F4F8FA}
.rule .rh{display:flex;align-items:center;gap:12px}
.rule .rh svg.i{width:52px;height:52px;color:var(--sea)}
.rule .rk{font-size:clamp(19px,2.4vw,22px);font-weight:900;color:var(--sea);margin:0}
.rule .rt{font-size:clamp(24px,3.8vw,34px);font-weight:900;margin:0;line-height:1.35}
.rule .rd{margin:0;font-size:clamp(19px,2.5vw,23px);color:var(--muted)}
.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:700;font-size:clamp(19px,2.6vw,24px)}
.live .v{font-size:clamp(30px,5vw,42px);font-weight:900;color:var(--rust);font-variant-numeric:tabular-nums;line-height:1.1}
.live .stamps{display:flex;gap:2px;color:#A8441A}
.live .stamps svg.i{width:30px;height:30px}
/* shelf */
.play{display:flex;flex-direction:column;gap:16px}
.shelfcard{gap:6px}
.shelf{--k:1;display:flex;justify-content:space-evenly;align-items:flex-end;gap:4px;padding:6px 4px 0;min-height:calc(240px*var(--k))}
.plank{height:16px;border-radius:6px;background:var(--wood);border:2.5px solid var(--wood2);margin-top:-2px}
.hint{font-size:clamp(19px,2.4vw,22px);color:var(--muted);margin:0;font-weight:500}
.spine{position:relative;width:calc(var(--w)*1px*var(--k,1));height:calc(var(--h)*1px*var(--k,1));border:0;padding:0;margin:0;background:none;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;font:inherit;flex:none;transition:transform .12s}
.spine:hover{transform:translateY(-4px)}
.spine svg.sp{position:absolute;inset:0;width:100%;height:100%;display:block}
.spine .st{position:absolute;top:calc(14px*var(--k,1));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;color:#fff;font-weight:900;font-size:calc(19px*var(--k,1));pointer-events:none}
.spine .st i{font-style:normal;display:block;line-height:1.08}
.spine.big .st{font-size:calc(23px*var(--k,1))}
.spine .sg{position:absolute;left:50%;bottom:calc(9px*var(--k,1));transform:translateX(-50%);width:calc(30px*var(--k,1));height:calc(30px*var(--k,1));border-radius:50%;background:#FBFCF9;border:2px solid var(--ink);color:var(--ink);font-weight:900;font-size:calc(19px*var(--k,1));line-height:1;display:flex;align-items:center;justify-content:center;pointer-events:none;font-variant-numeric:tabular-nums}
.spine.gone{cursor:default;pointer-events:none}
.spine.gone svg.sp,.spine.gone .st,.spine.gone .sg{visibility:hidden}
.spine.gone::after{content:"";position:absolute;inset:0;border:2.5px dashed #B5BDB4;border-radius:6px}
.spine.lift{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;transform-origin:50% 20%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.ghost .spine{cursor:grabbing}
/* bag */
.bag{border-style:dashed;border-color:#AEB8AE;transition:border-color .12s,background .12s}
.bag.over{border-color:var(--good);border-style:solid;background:#F1F7F2}
.bag.full{border-color:var(--rust);border-style:solid;background:#FBF0EA}
.bag.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.baghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.baghead svg.i{width:48px;height:48px;color:var(--ink)}
.baghead .bt{font-size:clamp(22px,3.2vw,28px);font-weight:900;margin:0}
.baghead .used{margin:0 0 0 auto;font-weight:700;font-size:clamp(19px,2.5vw,23px);color:var(--muted)}
.baghead .used b{color:var(--ink);font-size:1.2em;font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.slot{height:34px;border-radius:8px;border:2.5px solid #C9D0C8;background:#FFFFFF}
.slot.on{border-color:var(--ink)}
.slotcap{display:flex;justify-content:space-between;font-size:clamp(19px,2.2vw,20px);color:var(--muted);margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;align-items:flex-start}
.chips .empty{color:var(--muted);margin:auto 0;font-size:clamp(19px,2.5vw,22px)}
.chip{font:inherit;display:inline-flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:10px;padding:6px 10px;color:#fff;font-weight:900;font-size:clamp(19px,2.5vw,22px);cursor:pointer;touch-action:none;line-height:1.3;max-width:100%;text-align:left}
.chip .g{background:#FBFCF9;color:var(--ink);border-radius:8px;padding:0 7px;font-size:.9em;white-space:nowrap}
.chip .out{display:inline-flex;width:24px;height:24px;flex:none}
.chip .out svg{width:24px;height:24px}
.chip.static{cursor:default;touch-action:auto}
.msg{min-height:0}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 220px}
/* results */
.big{font-size:clamp(46px,9vw,80px);font-weight:900;text-align:center;color:var(--rust);margin:0;line-height:1.2;font-variant-numeric:tabular-nums}
.big small{font-size:.42em;margin-left:6px;color:var(--ink)}
.favline{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 16px;font-weight:700;font-size:clamp(19px,2.7vw,25px);line-height:1.5;margin:0;background:var(--warm)}
.favline svg.i{width:40px;height:40px;color:var(--rust)}
.favline.no{background:#EEF1EE}
.favline.no svg.i{color:var(--muted)}
.draw{display:flex;align-items:center;gap:12px}
.draw svg.i{width:48px;height:48px;color:var(--ink)}
.sum td:first-child{color:var(--muted);font-weight:700;width:34%}
.sum tr.hd td{color:var(--sea);font-weight:900;padding-top:16px;border-bottom:2px solid var(--sea)}
.choice-note{display:flex;flex-direction:column;gap:8px}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  th,td{padding:8px 4px}
  .card.shelfcard,.card.bag{padding:12px 10px}
  .slots{gap:3px}
  .slot{height:30px;border-radius:6px}
}
@media (min-width:700px){.shelf{--k:1.25}}
@media (min-width:860px){.play{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.shelf{--k:1}.rule{padding:16px 22px;gap:8px}.rule .rh svg.i{width:46px;height:46px}}
@media (prefers-reduced-motion:reduce){.bag.shake{animation:none}.spine{transition:none}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
var ICI={"schoolbag": "<path d=\"M5.6 9.6a6.4 6.4 0 0 1 12.8 0v10a2 2 0 0 1-2 2H7.6a2 2 0 0 1-2-2z\" fill=\"#F3E3BE\"/><path d=\"M9.4 4.4a2.6 2.6 0 0 1 5.2 0\"/><rect x=\"8.4\" y=\"13.6\" width=\"7.2\" height=\"4.8\" rx=\"1.2\" fill=\"#FBF4E2\"/>", "heart": "<path d=\"M12 20.2s-7.8-4.7-7.8-10.4A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.8 2.5c0 5.7-7.8 10.4-7.8 10.4z\" fill=\"#F2B8A0\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"8.8\" fill=\"#DCE8F0\"/><path d=\"M12 6.8v5.4l3.6 2.2\"/>", "lots": "<path d=\"M9.2 10.2L7.6 2.8M12 10.2V2.2M14.8 10.2l1.8-6.6\"/><path d=\"M5.6 10.2h12.8l-1.3 10.2a1.6 1.6 0 0 1-1.6 1.4H8.5a1.6 1.6 0 0 1-1.6-1.4z\" fill=\"#F3E3BE\"/><path d=\"M6.4 14.6h11.2\"/><path d=\"M7.6 2.8l.5 2.2M12 2.2v2.3M16.6 3.6L16 5.8\" stroke=\"#C0532C\" stroke-width=\"2.4\"/>", "notes": "<rect x=\"2.6\" y=\"4.4\" width=\"11.6\" height=\"11.6\" rx=\"1.6\" fill=\"#F3E3BE\" transform=\"rotate(-9 8.4 10.2)\"/><rect x=\"8.6\" y=\"8.4\" width=\"12.8\" height=\"12.8\" rx=\"1.6\" fill=\"#FBF4E2\"/><path d=\"M11.6 12.6h6.8M11.6 15.6h6.8M11.6 18.4h3.8\"/>", "bulb": "<path d=\"M9 16.6c0-1.6-3.2-3.3-3.2-7A6.2 6.2 0 0 1 18.2 9.6c0 3.7-3.2 5.4-3.2 7z\" fill=\"#F3D27A\"/><path d=\"M9.2 19.4h5.6M10.2 22h3.6\"/><path d=\"M10.4 12.6l1.6 1.6 1.6-1.6M12 14.2v2.4\"/>", "stamp": "<circle cx=\"12\" cy=\"4.6\" r=\"2.6\" fill=\"#F2B8A0\"/><path d=\"M10.4 7.1l-.6 4.4h4.4l-.6-4.4\"/><rect x=\"4.6\" y=\"11.5\" width=\"14.8\" height=\"4.6\" rx=\"1.4\" fill=\"#F2B8A0\"/><path d=\"M6.4 16.1v1.6h11.2v-1.6\"/><path d=\"M4 21h16\" stroke=\"#C0532C\" stroke-width=\"2.2\"/>", "openbook": "<path d=\"M12 6.4C9.6 4.6 6.4 4.1 2.8 4.6v13.8c3.6-.5 6.8 0 9.2 1.8 2.4-1.8 5.6-2.3 9.2-1.8V4.6c-3.6-.5-6.8 0-9.2 1.8z\" fill=\"#DCE8F0\"/><path d=\"M12 6.4v13.8\"/><path d=\"M5.8 8.6h3.4M5.8 11.6h3.4M5.8 14.6h2.2M14.8 8.6h3.4M14.8 11.6h3.4M14.8 14.6h2.2\"/>", "pencil": "<path d=\"M4 20l1-4.2L15.4 5.4a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.2 19z\" fill=\"#F3E3BE\"/><path d=\"M13.6 7.2l3.2 3.2\"/>"};
function ic(k,c){return '<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICI[k]+'</svg>'}
var app=document.getElementById('app');
var KEY='readcard-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function rnd(){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]}catch(e){return Math.floor(Math.random()*4294967296)}}

var TOTAL=10;

 {id:'egret',t:'白鷺鷥回家',k:'繪本',g:1,p:24,c:'#B5532F',a:'#F2C9A8',w:36,h:182},
 {id:'novel',t:'臺江尋寶記',k:'厚厚的小說',g:6,p:200,c:'#7A2F3A',a:'#E8C46A',w:74,h:214,fav:true},
 {id:'crab',t:'招潮蟹搬家',k:'繪本',g:1,p:24,c:'#3F6F99',a:'#BCD6E8',w:36,h:182},
 {id:'guide',t:'鹿耳門溪生態圖鑑',k:'圖鑑（圖多字少）',g:4,p:120,c:'#2E6A5E',a:'#BFE0C8',w:60,h:232},
 {id:'oyster',t:'蚵殼小帆船',k:'繪本',g:1,p:24,c:'#4F7F45',a:'#D6E6B8',w:36,h:182},
 {id:'raft',t:'竹筏上的夏天',k:'中篇故事',g:3,p:80,c:'#8A5A1E',a:'#F0D9A8',w:50,h:196}
];
var BY={};BOOKS.forEach(function(b){BY[b.id]=b});
var LIST_ORDER=['egret','crab','oyster','raft','novel','guide'];
var FAV=BY.novel;

var R=[
 {key:'A',ico:'stamp',title:'看完一本，蓋一個章',desc:'每看完一本書，不管厚的還是薄的，集點卡上就蓋一個章。',unit:'個章'},
 {key:'B',ico:'openbook',title:'看一頁，得一點',desc:'看完的書有幾頁，就得幾點。繪本 24 頁、中篇 80 頁、小說 200 頁、圖鑑 120 頁。',unit:'點'},
 {key:'C',ico:'notes',title:'每本書寫一句「我學到什麼」，老師隨機抽問一本',desc:'書包裡的每一本書，都要寫一句「我從這本書學到什麼」。老師會隨機抽一本來問你，你要說得出來。',unit:'本'}
];
var Q=[
 ['A','看完一本，蓋一個章'],

];

function spineSvg(b){
  var w=b.w,h=b.h;
  var s='<svg class="sp" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
   '<rect x="1.2" y="1.2" width="'+(w-2.4)+'" height="'+(h-2.4)+'" rx="4" fill="'+b.c+'" stroke="#1F2A2E" stroke-width="1.8"/>'+

  return s+'</svg>';
}
function spineEl(b,gone){
  var sp=el('button','spine'+(b.fav?' big':'')+(gone?' gone':''));sp.type='button';
  sp.style.setProperty('--w',b.w);sp.style.setProperty('--h',b.h);
  sp.innerHTML=spineSvg(b)+'<span class="st">'+b.t.split('').map(function(ch){return '<i>'+ch+'</i>'}).join('')+'</span><span class="sg">'+b.g+'</span>';

  if(gone){sp.tabIndex=-1;sp.setAttribute('aria-hidden','true')}
  return sp;
}

    h+='<tr><td><div class="bk"><span class="dot" style="background:'+b.c+'"></span><b'+(b.fav?' class="fav"':'')+'>《'+b.t+'》<small>'+b.k+(b.fav?'，你最想看的書':'')+'</small></b></div></td><td class="n">'+b.g+' 格</td><td class="n">'+b.p+' 頁</td></tr>';

  t.innerHTML=h+'</tbody>';return t;
}

/* ---------- step 0: story ---------- */
function intro(){
  app.innerHTML='';
  var c=el('div','card');
  c.append(el('p','lead','五年13班這個月辦「閱讀月」：看完書可以集點，集到的點可以換小獎品。老師在教室後面的書架上，放了 6 本書。'),
    el('p','lead','這一週，你每天放學後都有一點閱讀時間，加起來一共 <b>10 格</b>，每一格大約 20 分鐘。一本書要花幾格時間，就會佔掉幾格。'),
    el('p','lead','你一直很想看厚厚的小說<b class="fav">《臺江尋寶記》</b>。聽說它講的是一群小朋友拿著一張老地圖，在從前的臺江內海一帶找寶藏。'));
  var c2=el('div','card');c2.append(bookTable());
  var n=el('p','note','老師會換三種集點規則，每換一種，你都重新選一次這週要讀的書。把書從書架<b>拖進書包</b>就可以了，點一下書也能放進去。');
  app.append(el('h1',null,'閱讀集點卡'),c,c2,n,button('開始第一回合','btn',function(){go(1)}));
}

/* ---------- rounds (steps 1, 3, 5) ---------- */
function round(ri){
  var r=R[ri],bag=st.bags[r.key];
  app.innerHTML='';
  app.appendChild(el('p','case','第 '+(ri+1)+' 回合（共 3 回合）'));
  var rc=el('div','card rule');
  var rh=el('div','rh');rh.innerHTML=ic(r.ico);
  var rt=el('div');rt.append(el('p','rk','集點規則 '+r.key),el('p','rt',r.title));rh.appendChild(rt);
  var live=el('div','live');
  rc.append(rh,el('p','rd',r.desc),live);
  app.appendChild(rc);

  var shelfCard=el('div','card shelfcard');
  var shelf=el('div','shelf');shelf.setAttribute('role','group');shelf.setAttribute('aria-label','書架');
  shelfCard.append(el('p','hint','書脊上的數字，是要花的格數。'),shelf,el('div','plank'));
  var bagCard=el('div','card bag');bagCard.setAttribute('aria-label','我的書包');
  var head=el('div','baghead');
  var usedEl=el('p','used');
  head.innerHTML=ic('schoolbag');head.append(el('p','bt','我的書包'),usedEl);
  var slots=el('div','slots');slots.setAttribute('aria-hidden','true');
  var cap=el('div','slotcap','<span>這週的閱讀時間</span><span>10 格</span>');
  var chips=el('div','chips');
  var msg=el('div','msg');msg.setAttribute('role','status');
  bagCard.append(head,slots,cap,chips,msg);
  var done=button('這週讀完了，看結果','btn go',function(){
    if(!bag.length)return;
    if(r.key==='C'){var s=sorted(bag);st.draw=s[rnd()%s.length]}
    go(ri*2+2);
  });
  var play=el('div','play');play.append(shelfCard,bagCard);
  app.append(play,done);

  function liveHtml(){
    var v=score(r.key,bag);
    if(r.key==='A'){
      var s='<span>集點卡：</span><span class="v">'+v+'</span><span>個章</span><span class="stamps">';
      for(var i=0;i<v;i++)s+=ic('stamp');
      return s+'</span>';
    }
    if(r.key==='B')return '<span>集點卡：</span><span class="v">'+v+'</span><span>點</span>';
    return '<span>書包裡</span><span class="v">'+v+'</span><span>本，每本都要寫一句</span>';
  }
  function tryAdd(id){
    if(bag.indexOf(id)>=0)return;
    var b=BY[id],left=TOTAL-used(bag);
    if(b.g>left){
      msg.innerHTML='';
      msg.appendChild(el('p','note warm','放不進去了：《'+b.t+'》要花 '+b.g+' 格，書包只剩 '+left+' 格。可以先把書包裡的書拿出來，再換這本。'));
      bagCard.classList.remove('shake');void bagCard.offsetWidth;bagCard.classList.add('shake');
      return;
    }
    bag.push(id);save(st);msg.innerHTML='';update();
  }
  function removeBook(id){
    var k=bag.indexOf(id);if(k<0)return;bag.splice(k,1);save(st);msg.innerHTML='';update();
  }
  function update(){
    var u=used(bag);
    usedEl.innerHTML='已用 <b>'+u+'</b> 格，還剩 <b>'+(TOTAL-u)+'</b> 格';
    live.innerHTML=liveHtml();
    /* slots */
    slots.innerHTML='';var fill=[];
    sorted(bag).forEach(function(id){for(var i=0;i<BY[id].g;i++)fill.push(BY[id].c)});
    for(var i=0;i<TOTAL;i++){var s=el('div','slot'+(fill[i]?' on':''));if(fill[i])s.style.background=fill[i];slots.appendChild(s)}
    /* shelf */
    shelf.innerHTML='';
    BOOKS.forEach(function(b){
      var gone=bag.indexOf(b.id)>=0;var sp=spineEl(b,gone);
      if(!gone)dragify(sp,b,false);
      shelf.appendChild(sp);
    });
    /* chips */
    chips.innerHTML='';
    if(!bag.length)chips.appendChild(el('p','empty','把書拖到這裡，或點一下書架上的書。'));
    sorted(bag).forEach(function(id){
      var b=BY[id];
      var ch=el('button','chip','<span>《'+b.t+'》</span><span class="g">'+b.g+' 格</span><span class="out">'+xIcon()+'</span>');ch.type='button';
      ch.style.background=b.c;
      ch.setAttribute('aria-label','《'+b.t+'》在書包裡。點一下拿出來。');
      dragify(ch,b,true);
      chips.appendChild(ch);
    });
    done.disabled=!bag.length;
  }
  function overBag(x,y){var q=bagCard.getBoundingClientRect();return x>=q.left&&x<=q.right&&y>=q.top&&y<=q.bottom}
  function dragify(node,b,inBag){
    var start=null,pid=null,dragging=false,ghost=null,off=null,suppress=false;
    node.addEventListener('pointerdown',function(e){
      if(e.button>0)return;
      start={x:e.clientX,y:e.clientY};pid=e.pointerId;dragging=false;
      var q=node.getBoundingClientRect();off={x:e.clientX-q.left,y:e.clientY-q.top,w:q.width,h:q.height};
      try{node.setPointerCapture(pid)}catch(_){}
    });
    node.addEventListener('pointermove',function(e){
      if(!start||e.pointerId!==pid)return;
      var dx=e.clientX-start.x,dy=e.clientY-start.y;
      if(!dragging&&dx*dx+dy*dy>64){
        dragging=true;
        ghost=el('div','ghost');
        var g=spineEl(b,false);g.tabIndex=-1;g.style.setProperty('--k',getComputedStyle(shelf).getPropertyValue('--k')||1);
        ghost.appendChild(g);document.body.appendChild(ghost);
        if(inBag){off={x:b.w*.5,y:20,w:0,h:0}}
        node.classList.add('lift');
      }
      if(dragging){
        e.preventDefault();
        ghost.style.transform='translate('+(e.clientX-off.x)+'px,'+(e.clientY-off.y)+'px) rotate(-6deg)';
        var o=overBag(e.clientX,e.clientY);
        bagCard.classList.toggle('over',o&&!inBag&&b.g<=TOTAL-used(bag));
        bagCard.classList.toggle('full',o&&!inBag&&b.g>TOTAL-used(bag));
      }
    });
    function end(e,cancel){
      if(!start)return;
      try{node.releasePointerCapture(pid)}catch(_){}
      var wasDrag=dragging;start=null;dragging=false;
      if(ghost){ghost.remove();ghost=null}
      node.classList.remove('lift');bagCard.classList.remove('over','full');
      if(!wasDrag)return;
      suppress=true;setTimeout(function(){suppress=false},400);
      if(cancel)return;
      var o=overBag(e.clientX,e.clientY);
      if(!inBag&&o)tryAdd(b.id);
      else if(inBag&&!o)removeBook(b.id);
    }
    node.addEventListener('pointerup',function(e){end(e,false)});
    node.addEventListener('pointercancel',function(e){end(e,true)});
    node.addEventListener('click',function(e){
      if(suppress){suppress=false;e.preventDefault();return}
      if(inBag)removeBook(b.id);else tryAdd(b.id);
    });
  }
  update();
}
function xIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="rgba(255,255,255,.28)"/><path d="M8.6 8.6l6.8 6.8M15.4 8.6l-6.8 6.8"/></svg>'}

function chipsStatic(bag){
  var d=el('div','chips');
  sorted(bag).forEach(function(id){var b=BY[id];var c=el('span','chip static','<span>《'+b.t+'》</span><span class="g">'+b.g+' 格</span>');c.style.background=b.c;d.appendChild(c)});
  return d;
}
function favLine(bag){
  var y=hasFav(bag);
  return el('p','favline'+(y?'':' no'),ic('heart')+'<span>'+(y?'你有讀到最想看的《臺江尋寶記》。':'這一回合，你沒有讀到最想看的《臺江尋寶記》。')+'</span>');
}

/* ---------- results (steps 2, 4, 6) ---------- */
function result(ri){
  var r=R[ri],bag=st.bags[r.key],v=score(r.key,bag),fav=hasFav(bag);
  app.innerHTML='';
  var c=el('div','card');
  var heads={A:'這一週，你蓋了 '+v+' 個章',B:'這一週，你得了 '+v+' 點',C:'這一週，你真正讀懂了 '+v+' 本'};
  c.append(el('p','big',v+'<small>'+r.unit+'</small>'),el('p','lead','你放進書包的書：'),chipsStatic(bag));
  var parts=[el('p','case','規則 '+r.key+' 的結果：'+r.title),el('h2',null,heads[r.key])];
  if(r.key==='C'){
    var d=BY[st.draw]||BY[sorted(bag)[0]];
    var dr=el('div','card');
    var row=el('div','draw');row.innerHTML=ic('lots');
    row.appendChild(el('p','lead','老師從你的書包裡，隨機抽到<b>《'+d.t+'》</b>。這本你從頭讀完了，也寫好了一句「我學到什麼」，所以你說得出來。'));
    dr.appendChild(row);
    dr.appendChild(el('p','lead','書包裡的 '+bag.length+' 本，你每一本都讀完、都寫了一句，老師不管抽到哪一本，你都答得出來，所以你真正讀懂了 '+bag.length+' 本。'));
    parts.push(c,dr);
  }else parts.push(c);
  parts.push(favLine(bag));
  var n=el('div','note');
  if(r.key==='A'){
    n.append(el('p',null,'在規則 A，章只算「幾本」，不管書有多厚。三本繪本各花 1 格，就能換到 3 個章；《臺江尋寶記》要花 6 格，卻只換到 1 個章。所以在這個規則下，很多人會先把三本薄薄的繪本放進書包。'),
      el('p',null,'這個規則最多可以蓋 5 個章：三本繪本、《竹筏上的夏天》和圖鑑，剛好 10 格。可是這樣一來，書包就放不下《臺江尋寶記》了。'));
    n.appendChild(el('p',null,fav?'你這回合放了《臺江尋寶記》，蓋了 '+v+' 個章，比最多的 5 個少了 '+(5-v)+' 個。你用幾個章，換到了最想看的書。':(v===5?'你這回合蓋到 5 個章，是這個規則下最多的；同時，《臺江尋寶記》留在書架上。':'你這回合蓋了 '+v+' 個章，《臺江尋寶記》留在書架上。')));
  }else if(r.key==='B'){
    n.append(el('p',null,'在規則 B，點數看的是「頁數」。這時候大家會開始算：花 1 格時間，可以換到幾頁？《臺江尋寶記》每格大約 33 頁，圖鑑每格 30 頁，中篇每格大約 27 頁，繪本每格 24 頁。所以在這個規則下，很多人會改挑厚書和圖鑑，繪本反而沒人拿。'),
      el('p',null,'這個規則最多可以得 320 點：《臺江尋寶記》加上圖鑑，剛好 10 格。'),
      el('p',null,'不過，頁數多不一定代表讀得多。圖鑑圖多字少，一頁的字比小說一頁少很多，翻起來也快。如果真的這樣比賽，也會有人跳著翻、只看圖，點數照樣一直加上去。'));
    n.appendChild(el('p',null,'你這回合得了 '+v+' 點'+(fav?'，也讀到了《臺江尋寶記》。':'，《臺江尋寶記》留在書架上。')));
  }else{
    n.append(el('p',null,'在規則 C，老師只抽一本來問。多放幾本薄書，或是挑頁數多的書，都不會讓你比較容易過關；書包裡的每一本，都要真的讀進去、說得出學到什麼，才不怕被抽到。'),
      el('p',null,'規則 A 算本數，規則 B 算頁數，這兩個數字都看不出你有沒有讀懂。規則 C 想知道的，就是「讀懂」這件事。在這個規則下，大家比較不會只為了分數挑書，很多人會回去挑自己真的想讀、讀得下去的書。'));
  }
  parts.push(n);
  var nextTxt=ri<2?'開始第 '+(ri+2)+' 回合':'下一步';
  parts.push(button(nextTxt,'btn',function(){go(ri*2+3)}));
  parts.forEach(function(p){app.appendChild(p)});
}

/* ---------- step 7: which rule ---------- */
function compareTable(){
  var t=el('table');
  var h='<thead><tr><th>規則</th><th class="n">分數</th><th class="n">《臺江尋寶記》</th></tr></thead><tbody>';
  R.forEach(function(r){var bag=st.bags[r.key];
    h+='<tr><td><b>規則 '+r.key+'</b></td><td class="n">'+score(r.key,bag)+' '+r.unit+'</td><td class="n">'+(hasFav(bag)?'有讀到':'沒有讀到')+'</td></tr>';
  });
  t.innerHTML=h+'</tbody>';return t;
}
function ask(){
  app.innerHTML='';
  var c=el('div','card');c.append(el('p','lead','三回合比一比：'),compareTable());
  var g=el('div','opts');
  var fb=el('div','choice-note');
  var nx=button('完成','btn go',function(){if(st.choice)go(8)});
  nx.disabled=!st.choice;
  function show(){
    fb.innerHTML='';if(!st.choice)return;
    var f=QF[st.choice];
    var n=el('div','note warm');
    n.append(el('p',null,'<b>作用：</b>'+f[0]),el('p',null,'<b>代價：</b>'+f[1]));
    fb.append(n,el('p','lead','每一種選擇都有人選，也都有它的道理。等一下全班一起聊聊。'));
  }
  Q.forEach(function(o){
    var b=button('<span class="letter">'+o[0]+'</span>'+o[1],'btn alt'+(st.choice===o[0]?' pick':''),function(){
      st.choice=o[0];save(st);
      Array.prototype.forEach.call(g.children,function(x){x.classList.remove('pick')});b.classList.add('pick');
      nx.disabled=false;show();
    });
    g.appendChild(b);
  });
  show();
  app.append(el('p','case','最後一題'),c,el('h2',null,'哪一種規則，最能讓你讀到真正想讀的書？'),el('p','lead','每一個選項都可以選，選完會說明這個選擇的作用和代價。'),g,fb,nx);
}

/* ---------- step 8: end ---------- */
function end(){
  app.innerHTML='';
  var t=el('table','sum');var h='<tbody>';var favN=0;
  R.forEach(function(r){var bag=st.bags[r.key];if(hasFav(bag))favN++;
    h+='<tr class="hd"><td colspan="2">規則 '+r.key+'　'+r.title+'</td></tr>'+
      '<tr><td>放進書包</td><td>'+(bag.length?titles(bag):'沒有放書')+'</td></tr>'+
      '<tr><td>分數</td><td><b>'+score(r.key,bag)+'</b> '+r.unit+(r.key==='C'?'（真正讀懂）':'')+'</td></tr>'+
      '<tr><td>《臺江尋寶記》</td><td><b>'+(hasFav(bag)?'有讀到':'沒有讀到')+'</b></td></tr>';
  });
  var q=null;Q.forEach(function(o){if(o[0]===st.choice)q=o});
  h+='<tr class="hd"><td colspan="2">總結</td></tr>'+
    '<tr><td>讀到《臺江尋寶記》</td><td><b>'+favN+'</b> 個回合（共 3 個回合）</td></tr>'+
    '<tr><td>你選的規則</td><td>'+(q?'<b>'+q[0]+'</b>　'+q[1]:'還沒有選')+'</td></tr>';
  t.innerHTML=h+'</tbody>';
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}

function render(){
  var S=[intro,function(){round(0)},function(){result(0)},function(){round(1)},function(){result(1)},function(){round(2)},function(){result(2)},ask,end];
  if(st.step>=2&&!st.bags.A.length)st.step=1;
  if(st.step>=4&&!st.bags.B.length)st.step=3;
  if(st.step>=6&&!st.bags.C.length)st.step=5;
  if(st.step>=6&&(!st.draw||st.bags.C.indexOf(st.draw)<0)){var s=sorted(st.bags.C);st.draw=s[rnd()%s.length];save(st)}
  if(st.step>=8&&!st.choice)st.step=7;
  (S[st.step]||intro)();
}
render();
})();
</script>
