<style>
:root{
  --bg:#FAF7F2; --card:#FFFFFF; --ink:#1E242B; --muted:#475569; --line:#E3DED7;
  --coral:#D95D39; --teal:#2A6F68; --lc:#FFF5F2; --lt:#F0F7F6;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,48px);font-weight:900;margin:0;line-height:1.3}
h2{font-size:clamp(23px,3.8vw,32px);font-weight:900;margin:0;line-height:1.45}
.kick{font-size:clamp(17px,2.3vw,20px);font-weight:700;color:var(--coral);letter-spacing:2px;margin:0}
.lead{font-size:clamp(19px,2.7vw,24px);color:var(--muted);margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 24px rgba(30,36,43,.06);padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,24px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--coral);color:#fff;cursor:pointer;line-height:1.45}
.btn.teal{background:var(--teal)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;font-weight:700}
.btn.alt.pick{border-color:var(--coral);background:var(--lc)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.note{background:var(--lt);border-radius:16px;padding:14px 18px;font-size:clamp(18px,2.6vw,23px);line-height:1.7;margin:0}
.note.warm{background:var(--lc)}
.row{display:flex;gap:12px;align-items:center}
.ico{flex:none;display:flex}
table{border-collapse:collapse;width:100%;font-size:clamp(17px,2.4vw,21px)}
th,td{padding:9px 6px;border-bottom:2px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--muted);font-weight:700}
.big{font-size:clamp(40px,8vw,64px);font-weight:900;color:var(--coral);margin:0;line-height:1.1;font-variant-numeric:tabular-nums}
.drag-ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%);opacity:.9}
details{background:var(--lt);border-radius:16px;padding:12px 16px;font-size:clamp(18px,2.5vw,22px)}
summary{font-weight:900;cursor:pointer}
td:first-child{white-space:nowrap}
@media (max-width:480px){table{font-size:16px}th,td{padding:8px 4px}}

.do{display:flex;gap:12px;align-items:flex-start;background:var(--ink);color:#FAF7F2;border-radius:16px;padding:12px 16px;margin:0}
.do b.n{flex:none;background:var(--coral);color:#fff;border-radius:999px;padding:2px 12px;font-size:clamp(16px,2.2vw,19px);white-space:nowrap;line-height:1.6}
.do span{font-size:clamp(19px,2.7vw,23px);font-weight:700;line-height:1.55}
.story{font-size:clamp(20px,2.9vw,25px);font-weight:700;line-height:1.65;margin:0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{font:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 24px rgba(30,36,43,.06);padding:18px 10px;cursor:pointer;color:var(--ink)}
.pick:hover{border-color:var(--coral)}
.pick .nm{font-size:clamp(20px,2.9vw,26px);font-weight:900;line-height:1.4}
.pick .ds{font-size:clamp(17px,2.3vw,20px);color:var(--muted);line-height:1.5}
.pick .tap{font-size:clamp(16px,2.2vw,19px);font-weight:900;color:var(--coral)}
.duo{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:12px;align-items:start}
@media (max-width:640px){.duo{grid-template-columns:1fr}}
.mine{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--lc);border:3px solid var(--coral);border-radius:20px;padding:16px 10px}
.mine .tg{font-size:clamp(17px,2.3vw,20px);font-weight:900;color:var(--coral)}
.mine .nm{font-size:clamp(20px,2.9vw,25px);font-weight:900;line-height:1.4}
.back{background:var(--card);border:3px solid var(--teal);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.back h3{margin:0;font-size:clamp(20px,2.8vw,24px);font-weight:900;color:var(--teal);line-height:1.45}
.flipin{animation:flipin .55s ease-out both}
@keyframes flipin{from{transform:perspective(900px) rotateY(90deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flipin{animation:none}}
.gv{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:8px 10px;background:#FBF9F6}
.gv .t{flex:1;min-width:0;font-size:clamp(18px,2.5vw,21px);line-height:1.55;margin:0}
.gv .t b{color:var(--ink)}
.gv.none .t{color:var(--muted)}
.gv .tag{flex:none;font-size:clamp(15px,2vw,17px);font-weight:900;border-radius:999px;padding:2px 10px;white-space:nowrap;align-self:center}
.gv .tag.seen{background:var(--lt);color:var(--teal);border:2px solid var(--teal)}
.gv .tag.miss{background:var(--lc);color:var(--coral);border:2px dashed var(--coral)}
.gv.missed{border:2px dashed var(--coral);background:#fff}
@media (max-width:560px){.gv{flex-wrap:wrap}.gv .t{flex-basis:calc(100% - 50px)}.gv .tag{align-self:flex-start;margin-left:46px}}
.bot{display:flex;gap:14px;align-items:flex-start;background:var(--lt);border:2px solid var(--teal);border-radius:20px;padding:14px 16px}
.bot p{margin:0;font-size:clamp(19px,2.7vw,23px);font-weight:700;line-height:1.6}
.bot .who{color:var(--teal);font-weight:900;display:block}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 6px;font-size:clamp(18px,2.5vw,21px);font-weight:900;color:var(--ink);cursor:pointer;position:relative}
.chip.on{border-color:var(--coral);background:var(--lc)}
.chip .ck{position:absolute;top:6px;right:6px;display:none}
.chip.on .ck{display:flex}
.btn.wide{width:100%}
</style>

}

function intro(){
  app.innerHTML='';
  var c=el('div','card');
  var r=el('div','row');r.append(el('span','ico',ic('robot','#2A6F68','#F0F7F6',72)),el('p','lead','這是機器人阿算。阿算做決定的時候，只會看一件事：哪一個選擇比較省錢，或是比較能賺錢。'));
  c.append(r,
   el('p','lead','這個遊戲有 3 個小故事。每個故事裡都有兩件事，你只能選其中一件。'),
   el('p','lead','你選好以後，另一張卡片會翻過來，告訴你割愛了哪些東西。接著，你會看到阿算怎麼選。最後，請你點一點，說說自己做這個決定時最在意什麼。'),
   el('p','note','每一步都只要「點一下」。這個遊戲沒有標準答案，選哪一個都可以。'));
  app.append(el('p','kick','線上小遊戲・選了這個，就放棄了什麼'),el('h1',null,'我放棄了什麼？'),c,
   btn('開始第 1 個故事','wide',function(){st.s=0;go()}));
}

function render(){
  if(st.s<0){intro();return}
  if(st.s>=S.length){end();return}
  var i=st.s,q=S[i],stg=st.stage[i]||0,k=st.pick[i];
  app.innerHTML='';
  app.append(el('p','kick','第 '+(i+1)+' 個故事，一共有 3 個・'+q.tag),el('p','story',q.t));
  if(stg===0||k==null){
    app.append(doLine(1,'你會選哪一件事？請點一下你要選的那一張卡片。'));
    var pr=el('div','pair');
    q.o.forEach(function(o,n){
      var b=el('button','pick');b.type='button';
      b.append(el('span','ico',ic(o.i,'#1E242B','#FFF5F2',72)),el('span','nm',o.n),el('span','ds',o.d),el('span','tap','點一下，選這個'));
      b.addEventListener('click',function(){st.pick[i]=n;st.stage[i]=1;st.anim=true;go()});
      pr.appendChild(b)});
    app.append(pr);
    return;
  }
  var o=1-k;
  if(stg===1){
    app.append(doLine(2,'你選了「'+q.o[k].n+'」，另一張卡片就翻過來了。讀一讀：選了這個，你割愛了哪些東西？讀完以後，再點最下面的按鈕。'));
    var du=el('div','duo');
    var m=el('div','mine');m.append(el('span','tg','你選了'),el('span','ico',ic(q.o[k].i,'#D95D39','#FFFFFF',64)),el('span','nm',q.o[k].n));
    var bk=el('div','back'+(st.anim?' flipin':''));st.anim=false;save();
    bk.append(el('h3',null,'沒選「'+q.o[o].n+'」，你就割愛了：'));
    q.g[k].forEach(function(x){bk.appendChild(giveRow(x,''))});
    du.append(m,bk);
    var nm=q.g[k].filter(function(x){return x[0]!=='coin'}).map(function(x){return '「'+NAME[x[0]]+'」'}),
        paid=q.g[k].some(function(x){return x[0]==='coin'&&x[2]!==0}),msg;
    if(!nm.length)msg='這一次，你割愛的主要是錢。花一點錢，換來你更想要的東西，只要你覺得划算，也是一種選擇。';
    else if(!paid)msg='這個選擇沒花到錢，可是你還是割愛了'+nm.join('、')+'。省了錢，不代表什麼都沒割愛。';
    else msg='你割愛的不只是錢，還有'+nm.join('、')+'。';
    app.append(du,el('p','note',msg),
      btn('我讀完了，看看阿算怎麼選','teal wide',function(){st.stage[i]=2;go()}));
    return;
  }
  if(stg===2){
    var r=q.r;
    app.append(doLine(3,'這是只會算錢的機器人阿算。看看它選了什麼，又漏算了哪些東西。看完以後，再點最下面的按鈕。'));
    var b=el('div','bot');b.append(el('span','ico',ic('robot','#2A6F68','#FFFFFF',64)),el('p',null,'<span class="who">阿算說：</span>'+q.rs));
    var bk2=el('div','back');bk2.append(el('h3',null,'阿算選了「'+q.o[r].n+'」，其實它也割愛了：'));
    q.g[r].forEach(function(x){bk2.appendChild(giveRow(x,'robot'))});
    var same=(k===r),miss=q.g[r].filter(function(x){return x[0]!=='coin'}).length;
    app.append(b,bk2,
      el('p','note','阿算只看「錢」那一行，所以以為自己什麼都沒割愛。可是，標著「阿算沒算到」的'+(miss>1?'那幾行':'那一行')+'，也是它割愛的東西。'),
      el('p','note warm',same?'你和阿算選得一樣，都選了「'+q.o[r].n+'」。不過，阿算只看錢；你選這個的理由，可能和阿算不一樣。'
                             :'你和阿算選得不一樣。阿算選了「'+q.o[r].n+'」，你選了「'+q.o[k].n+'」。你除了錢以外，可能還算了別的東西。'),
      btn('下一步：說說我最在意什麼','teal wide',function(){st.stage[i]=3;go()}));
    return;
  }
  // stg 3：我最在意的是什麼（可複選）
  st.care[i]=st.care[i]||[];
  app.append(doLine(4,'你選「'+q.o[k].n+'」的時候，心裡最在意的是什麼？請點一下，可以點好幾個。這一題沒有標準答案。'));
  var ch=el('div','chips'),said=el('p','note'),nx=btn(i<S.length-1?'選好了，進入下一個故事':'選好了，看看我的結果','wide',function(){st.s++;go()});
  function paint(){
    Array.prototype.forEach.call(ch.children,function(b,n){var on=st.care[i].indexOf(CARE[n][0])>=0;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});
    var c=st.care[i].map(function(x){return '「'+NAME[x]+'」'});
    said.textContent=c.length?'你點了'+c.join('、')+'。只會算錢的阿算，只在意「錢」。':'你還沒有點。請至少點一個你在意的東西。';
    nx.disabled=c.length===0;
  }
  CARE.forEach(function(x){
    var b=el('button','chip');b.type='button';
    b.append(el('span','ck',ic('check','#FFFFFF','#D95D39',26)),el('span','ico',ic(x[0],'#1E242B','#FFF5F2',44)),el('span',null,x[1]));
    b.addEventListener('click',function(){var a=st.care[i],p=a.indexOf(x[0]);if(p>=0)a.splice(p,1);else a.push(x[0]);
      a.sort(function(u,v){return CARE.findIndex(function(c){return c[0]===u})-CARE.findIndex(function(c){return c[0]===v})});save();paint()});
    ch.appendChild(b)});
  paint();
  app.append(ch,said,nx);
}

function end(){
  app.innerHTML='';var diff=0,cnt={},money=false;
  var t=el('table');t.innerHTML='<tr><th>故事</th><th>我選了</th><th>阿算選了</th><th>我最在意的</th></tr>';
  S.forEach(function(q,i){var k=st.pick[i];if(k!==q.r)diff++;
    (st.care[i]||[]).forEach(function(c){cnt[c]=(cnt[c]||0)+1;if(c==='coin')money=true});
    var tr=el('tr');tr.innerHTML='<td>'+q.tag+'</td><td>'+(k==null?'—':q.o[k].n)+'</td><td>'+q.o[q.r].n+'</td><td>'+((st.care[i]||[]).map(function(c){return NAME[c]}).join('、')||'—')+'</td>';t.appendChild(tr)});
  var mx=0;Object.keys(cnt).forEach(function(c){if(cnt[c]>mx)mx=cnt[c]});
  var top=CARE.filter(function(c){return mx>0&&cnt[c[0]]===mx}).map(function(c){return '「'+c[1]+'」'});
  var sat=st.pick[0]==null?'—':S[0].o[st.pick[0]].n;
  var c=el('div','card');
  c.append(el('p','note','請記下這四件事，等一下老師會請大家舉手：<br>① 在 3 個故事裡，我有 <b>'+diff+'</b> 個和阿算選得不一樣。<br>② 星期六下午，我選了「<b>'+sat+'</b>」。<br>③ 我點得最多次的是<b>'+(top.length?top.join('、'):'—')+'</b>'+(top.length>1?'（一樣多次）':'')+'。<br>④ 在 3 個故事裡，我'+(money?'<b>有</b>':'<b>沒有</b>')+'點過「錢」。'),
   t,
   el('p','note warm','想一想：阿算只看錢，所以常常以為自己什麼都沒割愛。可是，時間、朋友、開心、健康、學到的東西和家人，也都是會被割愛的東西。'));
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}
render();
})();
</script>
