<meta charset="utf-8">
<script src="fresh.js"></script>
<title>四草沙灘淨灘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: the tablet secretly puts each student in 海浪組 (asked as a favour) or 沙灘組 (offered 1 token per minute) → 秀琴阿姨 invites you → 60-second beach clean-up, tap trash to bag it (can stop early) → two no-right-answer questions → summary for a show of hands. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5;
  --sand:#EBD9AE; --sand2:#E0C98F; --wave:#9CC7DD;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700}
.btn.alt.pick{border-color:var(--gold);background:#FBF1DC}
.btn.ghost{background:var(--card);color:var(--rust);border:3px solid var(--rust);padding:10px 16px}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:#FBF1DC}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.4vw,22px)}
td{padding:10px 8px;border-bottom:2px solid var(--line);vertical-align:top} td.k{color:var(--muted);font-weight:700;white-space:nowrap}
/* intro */
.aunt{display:flex;gap:14px;align-items:flex-start}
.aunt svg{width:clamp(76px,14vw,110px);height:auto;flex:none}
.say{position:relative;background:#FFF8E6;border:3px solid #EAD7A6;border-radius:18px;padding:12px 16px;font-size:clamp(21px,3vw,27px);font-weight:700;line-height:1.6;margin:0;flex:1}
.who{font-size:clamp(19px,2.4vw,22px);color:var(--muted);font-weight:700;margin:0}
.mini{width:100%;height:auto;border-radius:16px;display:block}
/* game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.clock{font-size:clamp(34px,7vw,56px);font-weight:900;color:var(--rust);font-variant-numeric:tabular-nums;margin:0;line-height:1.1}
.clock small{font-size:.45em;color:var(--muted);font-weight:700}
.bag{display:flex;align-items:center;gap:8px;font-size:clamp(24px,4.4vw,36px);font-weight:900;font-variant-numeric:tabular-nums}
.bag svg{width:clamp(46px,8vw,62px);height:auto}
.bag.bump svg{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.18)}}
.beach{position:relative;width:100%;height:clamp(380px,58vh,560px);border-radius:22px;overflow:hidden;border:3px solid var(--line);
  background:linear-gradient(180deg,#CFE6F1 0,#CFE6F1 12%,var(--wave) 12%,var(--wave) 22%,#F4EBD3 22%,var(--sand) 30%,var(--sand2) 100%);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.beach .foam{position:absolute;left:0;right:0;top:20%;height:14px;background:radial-gradient(circle at 12px 0,#fff 9px,transparent 10px) 0 0/24px 14px repeat-x;opacity:.85}
.trash{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:0;padding:4px;background:rgba(255,255,255,.35);border-radius:50%;cursor:pointer;animation:pop .3s ease-out}
.trash svg{width:100%;height:100%;display:block;pointer-events:none}
.trash.got{animation:fly .45s ease-in forwards;pointer-events:none}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.25);opacity:0}}
.plus{position:absolute;font-weight:900;color:var(--good);font-size:26px;pointer-events:none;animation:up .7s ease-out forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.row{display:flex;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){.trash,.trash.got,.plus,.bag.bump svg{animation-duration:.01s}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
var app=document.getElementById('app');
var KEY='beach-cleanup-v1';
var DUR=60;
var GN={wave:'海浪組',sand:'沙灘組'};
var ASK={wave:'可以幫阿姨一起撿垃圾嗎？海邊乾淨，大家都開心。謝謝你喔！',
         sand:'可以幫忙撿垃圾嗎？撿一分鐘，阿姨給你 1 枚代幣。'};
var Q1={t:'剛剛撿的時候，你覺得自己比較像在？',o:['幫阿姨的忙','做一份工作','玩遊戲','說不上來']};
var Q2={t:'如果下次阿姨說：「撿一分鐘，阿姨給你 1 枚代幣。」你會？',o:['更想幫','一樣','比較不想幫','覺得不用給錢']};
var L='ABCD';

function rint(n){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
var st=load();
if(!st||!st.g){st={g:rint(2)?'wave':'sand',stage:'intro',n:0,end:0,secs:null,q1:null,q2:null};save(st)}

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function btn(t,cls,fn){var b=el('button','btn'+(cls?' '+cls:''),t);b.type='button';b.addEventListener('click',fn);return b}

/* ---------- pictures ---------- */
var ART={
 bottle:'<svg viewBox="0 0 48 48"><g transform="rotate(-28 24 24)"><rect x="19" y="4" width="10" height="6" rx="2" fill="#2F7D4F"/><path d="M18 10h12l3 7v24a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V17z" fill="#BFE3F2" stroke="#5B8FA8" stroke-width="2"/><rect x="15" y="23" width="18" height="8" fill="#E2725B"/></g></svg>',
 straw:'<svg viewBox="0 0 48 48"><path d="M10 40 L32 12 L40 6" fill="none" stroke="#C0392B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 40 L32 12 L40 6" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/></svg>',
 bag:'<svg viewBox="0 0 48 48"><path d="M14 14c0-7 4-10 6-10M34 14c0-7-4-10-6-10" fill="none" stroke="#8A9AA0" stroke-width="3"/><path d="M8 14h32l-3 28c-.3 2-2 3-4 3H15c-2 0-3.7-1-4-3z" fill="#F4F6F7" stroke="#8A9AA0" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 22l4 14M28 20l2 16" stroke="#C9D2D5" stroke-width="2"/></svg>',
 net:'<svg viewBox="0 0 48 48"><g fill="none" stroke="#2C7A7B" stroke-width="2.5"><path d="M6 12 L42 8 M5 24 L43 22 M7 36 L41 38 M10 6 L8 42 M22 5 L20 43 M34 6 L36 42"/></g><g fill="#E8A13A"><circle cx="8" cy="12" r="3"/><circle cx="42" cy="38" r="3"/></g></svg>'
};
var KINDS=['bottle','straw','bag','net'];
var BAGSVG='<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M20 14c0-6 4-9 10-9s10 3 10 9" fill="none" stroke="#205E86" stroke-width="4"/><path d="M8 16h44l-4 36c-.3 3-2.5 5-5.5 5h-25c-3 0-5.2-2-5.5-5z" fill="#2F7D4F"/><path d="M22 30l8 10 9-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var AUNT='<svg viewBox="0 0 100 120" aria-hidden="true"><ellipse cx="50" cy="112" rx="34" ry="6" fill="#00000014"/><path d="M18 118c2-28 14-42 32-42s30 14 32 42z" fill="#C0577A"/><path d="M38 80l12 14 12-14" fill="#fff"/><circle cx="50" cy="50" r="24" fill="#F1C9A5"/><path d="M24 48c0-18 12-28 26-28s26 10 26 28c-6-10-16-14-26-14s-20 4-26 14z" fill="#4A4A4A"/><path d="M14 40h72c0-4-6-8-12-8H26c-6 0-12 4-12 8z" fill="#E8C35A"/><path d="M28 32c4-14 12-20 22-20s18 6 22 20z" fill="#F2D27A"/><circle cx="41" cy="52" r="3" fill="#1F2A2E"/><circle cx="59" cy="52" r="3" fill="#1F2A2E"/><path d="M42 62q8 7 16 0" fill="none" stroke="#A8441A" stroke-width="3" stroke-linecap="round"/><circle cx="35" cy="60" r="4" fill="#E99A8E" opacity=".6"/><circle cx="65" cy="60" r="4" fill="#E99A8E" opacity=".6"/></svg>';
function sceneSVG(){
  var s='<svg class="mini" viewBox="0 0 600 220" role="img" aria-label="四草沙灘上散落著寶特瓶、吸管、塑膠袋和漁網碎片">'+
   '<rect width="600" height="60" fill="#CFE6F1"/><circle cx="520" cy="30" r="18" fill="#F6C453"/>'+
   '<rect y="52" width="600" height="30" fill="#9CC7DD"/><path d="M0 82 Q30 72 60 82 T120 82 T180 82 T240 82 T300 82 T360 82 T420 82 T480 82 T540 82 T600 82 V90 H0Z" fill="#fff" opacity=".8"/>'+
   '<rect y="86" width="600" height="134" fill="#EBD9AE"/>';
  var spots=[[40,110,'bottle'],[130,160,'bag'],[220,118,'straw'],[300,170,'net'],[390,125,'bottle'],[470,165,'straw'],[540,115,'bag'],[80,180,'net'],[350,105,'straw'],[250,190,'bottle']];
  spots.forEach(function(p){s+='<g transform="translate('+(p[0]-20)+' '+(p[1]-20)+') scale(.85)">'+ART[p[2]].replace(/^<svg viewBox="0 0 48 48">/,'').replace(/<\/svg>$/,'')+'</g>'});
  return s+'</svg>';
}

/* ---------- steps ---------- */
function render(){
  if(st.stage==='play'){
    if(Date.now()>=st.end){finishPlay(DUR);return}
    play();return;
  }
  if(st.stage==='q1'){question(Q1,'q1','下一題',function(){st.stage='q2'});return}
  if(st.stage==='q2'){question(Q2,'q2','看看我的紀錄',function(){st.stage='end'});return}
  if(st.stage==='end'){end();return}
  intro();
}
function intro(){
  app.innerHTML='';
  var c=el('div','card');
  c.innerHTML=sceneSVG();
  c.append(el('p','lead','星期六早上，你來到安南區的四草沙灘，遠遠可以看到一格一格的魚塭。潮水退去以後，沙灘上留下好多垃圾：寶特瓶、吸管、塑膠袋，還有被海浪沖上來的漁網碎片。'));
  var a=el('div','card');
  var row=el('div','aunt');row.innerHTML=AUNT;
  var right=el('div');right.style.flex='1';right.style.display='flex';right.style.flexDirection='column';right.style.gap='6px';
  right.append(el('p','who','住在四草、家裡養虱目魚的秀琴阿姨提著袋子走過來，對你說：'),el('p','say','「'+ASK[st.g]+'」'));
  row.appendChild(right);a.appendChild(row);
  a.append(el('p','lead','等一下會有 60 秒。垃圾出現時，點一下就能撿進袋子裡。撿夠了也可以自己按「我撿夠了」。'));
  app.append(el('h1',null,'四草沙灘淨灘'),c,a,btn('好，開始','',function(){st.stage='play';st.end=Date.now()+DUR*1000;st.n=0;save(st);render()}));
}

var timers=[];
function clearTimers(){timers.forEach(function(t){clearInterval(t);clearTimeout(t)});timers=[]}
function play(){
  clearTimers();app.innerHTML='';
  var hud=el('div','hud');
  var clock=el('p','clock');
  var bag=el('div','bag');bag.innerHTML=BAGSVG;var cnt=el('span',null,st.n+' 件');bag.appendChild(cnt);bag.setAttribute('aria-label','袋子裡的垃圾數量');
  hud.append(clock,bag);
  var beach=el('div','beach');beach.appendChild(el('div','foam'));
  var stopB=btn('我撿夠了','ghost',function(){
    if(!stopB.dataset.ok){stopB.dataset.ok='1';stopB.textContent='確定要結束嗎？再按一次';return}
    var used=DUR-Math.max(0,(st.end-Date.now())/1000);finishPlay(Math.max(1,Math.min(DUR,Math.round(used))));
  });
  var row=el('div','row');row.appendChild(stopB);
  app.append(hud,beach,row);

  function tick(){
    var left=Math.max(0,Math.ceil((st.end-Date.now())/1000));
    clock.innerHTML=left+' <small>秒</small>';
    if(left<=0){finishPlay(DUR)}
  }
  tick();timers.push(setInterval(tick,250));

  var live=[];
  function spawn(){
    if(live.length>=7)return;
    var W=beach.clientWidth,H=beach.clientHeight;if(!W||!H)return;
    var top=H*0.30+36,bottom=H-38,left=38,right=W-38;
    var x,y,ok=false;
    for(var k=0;k<12&&!ok;k++){
      x=left+rint(Math.max(1,right-left));y=top+rint(Math.max(1,bottom-top));
      ok=live.every(function(o){return Math.abs(o.x-x)>70||Math.abs(o.y-y)>70});
    }
    if(!ok)return;
    var kind=KINDS[rint(4)];
    var b=el('button','trash',ART[kind]);b.type='button';
    b.setAttribute('aria-label',{bottle:'寶特瓶',straw:'吸管',bag:'塑膠袋',net:'漁網碎片'}[kind]);
    b.style.left=x+'px';b.style.top=y+'px';
    var o={x:x,y:y,b:b};live.push(o);
    b.addEventListener('pointerdown',function(e){e.preventDefault();grab()});
    b.addEventListener('click',grab);
    function grab(){
      if(b.classList.contains('got')||st.stage!=='play')return;
      b.classList.add('got');
      var br=bag.getBoundingClientRect(),bb=b.getBoundingClientRect();
      b.style.setProperty('--dx',(br.left+br.width/2-(bb.left+bb.width/2))+'px');
      b.style.setProperty('--dy',(br.top+br.height/2-(bb.top+bb.height/2))+'px');
      var p=el('div','plus','+1');p.style.left=(x-8)+'px';p.style.top=(y-50)+'px';beach.appendChild(p);
      setTimeout(function(){p.remove()},700);
      live=live.filter(function(z){return z!==o});
      setTimeout(function(){b.remove()},450);
      st.n++;save(st);cnt.textContent=st.n+' 件';
      bag.classList.remove('bump');void bag.offsetWidth;bag.classList.add('bump');
    }
    beach.appendChild(b);
  }
  for(var i=0;i<4;i++)spawn();
  timers.push(setInterval(function(){spawn();if(live.length<3)spawn()},650));
}
function finishPlay(secs){
  if(st.stage!=='play')return;
  clearTimers();st.secs=secs;st.stage='q1';save(st);render();
}
function question(Q,key,next,adv){
  app.innerHTML='';
  var n=key==='q1'?1:2;
  var p=el('p','lead','撿完了！你的袋子裡有 '+st.n+' 件垃圾。想一想，這兩題沒有對錯（第 '+n+' 題，共 2 題）。');
  var g=el('div','opts');var box=el('div');
  Q.o.forEach(function(t,k){
    var b=btn(L[k]+'　'+t,'alt',function(){
      st[key]=k;save(st);
      Array.prototype.forEach.call(g.children,function(x){x.classList.remove('pick')});b.classList.add('pick');
      box.innerHTML='';var nx=btn(next,'',function(){adv();save(st);render()});box.appendChild(nx);
    });
    if(st[key]===k)b.classList.add('pick');
    g.appendChild(b);
  });
  if(st[key]!=null)box.appendChild(btn(next,'',function(){adv();save(st);render()}));
  app.append(p,el('h2',null,Q.t),g,box);
}
function end(){
  app.innerHTML='';
  var t=el('table');
  function r(k,v){var tr=el('tr');tr.append(el('td','k',k),el('td',null,v));t.appendChild(tr)}
  r('你是',  '<b>'+GN[st.g]+'</b>');
  r('撿了',  '<b>'+st.n+' 件</b>');
  r('撿了多久','<b>'+(st.secs>=DUR?'60 秒（撿到時間結束）':st.secs+' 秒（提早結束）')+'</b>');
  r('第 1 題',Q1.t+'<br><b>'+(st.q1!=null?L[st.q1]+'　'+Q1.o[st.q1]:'—')+'</b>');
  r('第 2 題',Q2.t+'<br><b>'+(st.q2!=null?L[st.q2]+'　'+Q2.o[st.q2]:'—')+'</b>');
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c,
    el('p','note warm','同樣是撿垃圾，當成「幫忙」和當成「賺錢」，人心裡用的規則不一樣。心理學家把這叫做「社會規範」和「市場規範」。'));
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&st.stage==='play'&&Date.now()>=st.end)finishPlay(DUR)});
render();
})();
</script>
