<script src="fresh.js"></script>
<title>WOOP 登山路線</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Flow: two-climber story (tap through 7 lines, Ah-Qing climbs past a rock) > demo mountain (recorder wish): place flag (W) at the summit, scenery photo (O) beside it, a rock (O, own obstacle; other-people cards get a one-tap rewrite) on the slope, a rope ladder (P, "如果…我就…" sentence block) beside the rock > climber walks the route, ladder lights at the rock > own mountain (4 everyday wishes, "其他" opens 6 common obstacles) > climb > reminder page (summit only vs full route) > "which step is hardest" (no right answer) > summary with the plan in large type. Fixed script, no randomness. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --cW:#8A6414; --cO:#205E86; --cB:#A8441A; --cP:#2F7D4F;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;justify-content:flex-start;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.soft{background:var(--card);color:var(--sea);border:3px solid var(--sea)}
.btn.go{background:var(--good)}
.btn:focus-visible,.pcard:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1 1 220px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
svg.i{width:1.4em;height:1.4em;flex:none;color:var(--ink)}
.btn svg.i{width:1.5em;height:1.5em}
.btn:not(.alt):not(.soft) svg.i{color:#fff}
/* WOOP letters */
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;border-radius:50%;color:#fff;font-weight:900;font-size:.9em;flex:none;line-height:1;padding:0 .2em}
.lt.w{background:var(--cW)}.lt.o{background:var(--cO)}.lt.b{background:var(--cB)}.lt.p{background:var(--cP)}.lt.n{background:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;font-weight:900;font-size:19px;color:var(--muted)}
.chip.now{border-color:var(--ink);color:var(--ink);box-shadow:0 3px 0 rgba(31,42,46,.15)}
.chip.done{color:var(--ink)}
.chip.done svg.i{color:var(--good);width:1.2em;height:1.2em}
/* scene */
.sbox{position:relative;background:#E3EFF4;border:3px solid var(--line);border-radius:20px;overflow:hidden}
.sbox.zone{outline:4px dashed var(--gold);outline-offset:-4px}
.sbox.over{outline-color:var(--good);outline-style:solid;box-shadow:0 0 0 6px #CFE3C4}
.scene{width:100%;height:auto;display:block}
.scene .tg circle.ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.55}}
.scene .pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.scene .fall{animation:fall .7s cubic-bezier(.5,0,.8,.6)}
@keyframes fall{from{transform:translateY(-190px) rotate(-30deg);opacity:0}30%{opacity:1}to{transform:none}}
.scene .flagc{transform-box:fill-box;transform-origin:0 50%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(5deg) scaleX(.94)}}
.scene .halo{opacity:0;transition:opacity .35s}
.scene .lit .halo{opacity:1}
.scene .bub{transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important;transition:none!important}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0;font-size:19px;font-weight:700;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.cap{margin:0;font-size:clamp(19px,2.7vw,25px);line-height:1.7;min-height:3.4em}
.cap b{color:var(--sea)}
/* place cards */
.hint{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted);display:flex;align-items:center;gap:6px}
.hint .tap{display:none}
.pcards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:12px}
.pcard{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:22px 14px 14px;display:flex;flex-direction:column;gap:6px;cursor:grab;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pcard::before{content:"";position:absolute;top:8px;left:50%;width:30px;height:8px;margin-left:-15px;border-radius:5px;background:var(--bg);border:2px solid var(--line)}
.pcard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard .top svg.i{width:44px;height:44px}
.pcard .tx{font-size:clamp(19px,2.4vw,23px);font-weight:700;line-height:1.5}
.pcard .tag{font-size:19px;font-weight:900;color:var(--gold);background:var(--warm);border-radius:10px;padding:0 8px}
.pcard .on{display:none;font-size:19px;font-weight:900;color:var(--good);align-items:center;gap:4px}
.pcard.pick{border-color:var(--gold);background:var(--warm)}
.pcard.pick .on{display:flex}
.pcard.w{border-top:8px solid var(--cW)}.pcard.o{border-top:8px solid var(--cO)}.pcard.b{border-top:8px solid var(--cB)}.pcard.p{border-top:8px solid var(--cP)}
.pcard.dash{border-style:dashed;border-top-style:solid}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.93;transform:rotate(-3deg);box-shadow:0 12px 26px rgba(31,42,46,.25);margin:0}
/* feedback */
.fb{border-color:var(--gold)}
.fb p{margin:0;font-size:clamp(19px,2.5vw,23px);line-height:1.7}
.fb .fix{font-weight:900;color:var(--rust)}
.picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.picker .btn.alt{font-size:clamp(19px,2.4vw,22px);padding:10px 14px}
/* sentence builder */
.builder{background:var(--card);border:3px solid var(--cP);border-radius:20px;padding:14px 18px;font-size:clamp(22px,3.2vw,30px);font-weight:900;line-height:1.8;margin:0}
.builder .k{display:inline-block;background:var(--cP);color:#fff;border-radius:10px;padding:0 10px;margin:0 4px}
.builder .ob{color:var(--rust)}
.builder .slot{display:inline-block;min-width:6em;border-bottom:4px dashed var(--cP);color:var(--muted)}
.builder .pl{color:var(--cP);border-bottom:4px solid var(--cP)}
/* route list */
.route{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.route li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;font-size:clamp(19px,2.5vw,23px);line-height:1.6}
.route li .lt{margin-top:.15em}
.route .lb{display:block;font-size:19px;font-weight:700;color:var(--muted)}
.route .vv{font-weight:900}
/* compare */
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp2 .card{gap:8px}
.cmp2 p{margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6}
/* end */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
.sum td:first-child{color:var(--muted);font-weight:700;width:40%}
.sum td b{font-size:1.05em}
.bigplan{margin:0;background:#FFFDF6;border:3px solid var(--gold);border-radius:18px;padding:16px 20px;font-size:clamp(28px,4.6vw,42px);font-weight:900;line-height:1.75;background-image:repeating-linear-gradient(transparent 0 calc(1.75em - 3px),#EADFC4 calc(1.75em - 3px) 1.75em);background-position:0 16px;text-wrap:pretty}
.bigplan .ob{color:var(--rust)}.bigplan .pl{color:var(--cP)}
.ec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6}
.ec dt{font-weight:900;white-space:nowrap;color:var(--good)}
.ec dd{margin:0}
@media (max-width:760px){
  .pcards{grid-template-columns:minmax(0,1fr)}
  .cmp2{grid-template-columns:minmax(0,1fr)}
  .picker{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .pcard{touch-action:pan-y;cursor:pointer}
  .hint .drag{display:none}.hint .tap{display:inline}
  .sum,.sum tbody,.sum tr,.sum td{display:block}
  .sum td{border:0;padding:2px 0}
  .sum td:first-child{width:auto}
  .sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ec{grid-template-columns:1fr;gap:0}
  .ec dd{margin-bottom:6px}
  .chip{padding:2px 10px 2px 4px}
}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

/* ---------- animation helpers ---------- */
function setPos(g,x,y){g.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')')}
function walk(g,pts,speed,done){
  var tok=ANIM,segs=[],tot=0;
  for(var i=1;i<pts.length;i++){var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1],d=Math.sqrt(dx*dx+dy*dy);segs.push(d);tot+=d}
  if(RM||!tot){setPos(g,pts[pts.length-1][0],pts[pts.length-1][1]);done&&done();return}
  var t0=null;
  function fr(ts){
    if(tok!==ANIM)return;
    if(t0==null)t0=ts;
    var d=(ts-t0)/1000*speed;
    if(d>=tot){setPos(g,pts[pts.length-1][0],pts[pts.length-1][1]);done&&done();return}
    var i=0;while(d>segs[i]){d-=segs[i];i++}
    var f=d/segs[i],x=pts[i][0]+(pts[i+1][0]-pts[i][0])*f,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*f;
    setPos(g,x,y-Math.abs(Math.sin((ts-t0)/110))*3);
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
}
function later(ms,fn){var tok=ANIM;setTimeout(function(){if(tok===ANIM)fn()},RM?0:ms)}

function feedback(k){

/* drag (pointer) + tap/keyboard (click) */
function dragify(btn,zone,onPlace){
  var sx,sy,ghost=null,dragged=false,offX,offY,pid=null;
  function over(x,y){var r=zone.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
  btn.addEventListener('pointerdown',function(e){if(e.button>0)return;sx=e.clientX;sy=e.clientY;dragged=false;pid=e.pointerId;var r=btn.getBoundingClientRect();offX=sx-r.left;offY=sy-r.top});
  btn.addEventListener('pointermove',function(e){
    if(pid!==e.pointerId)return;
    if(!ghost){if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<10)return;
      if(getComputedStyle(btn).touchAction.indexOf('pan')>=0&&e.pointerType!=='mouse')return;
      try{btn.setPointerCapture(e.pointerId)}catch(_){}
      var r=btn.getBoundingClientRect();ghost=btn.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';ghost.removeAttribute('id');document.body.appendChild(ghost);dragged=true}
    ghost.style.left=(e.clientX-offX)+'px';ghost.style.top=(e.clientY-offY)+'px';
    zone.classList.toggle('over',over(e.clientX,e.clientY));
  });
  function end(e,ok){if(pid!==e.pointerId)return;pid=null;if(ghost){ghost.remove();ghost=null;zone.classList.remove('over');if(ok&&over(e.clientX,e.clientY)){onPlace()}}}
  btn.addEventListener('pointerup',function(e){end(e,true)});
  btn.addEventListener('pointercancel',function(e){end(e,false)});
  btn.addEventListener('click',function(){if(dragged){dragged=false;return}onPlace()});
}
