<title>老鼠尾巴換獎金</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: story + town-hall notice → five weeks on a week calendar; each week flip one of three action cards (catch / cut tail and release / breed rats), then a settlement page (tails bar chart, my coins, rat line chart, what the 99 computer residents did, who switches next week) → mayor cancels the bounty and caged rats are let go → result with the two lines side by side → "if you were mayor" (every option allowed, shows effect and cost) → summary for a show of hands. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --catch:#2F7D4F; --cut:#9A6A12; --farm:#7A4E9A; --tail:#205E86; --rat:#A8441A;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.go{background:var(--rust)}
.btn:focus-visible,.flip:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.letter{display:inline-block;min-width:1.4em;font-weight:900;color:var(--sea)}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn.alt svg.i{width:1.6em;height:1.6em}
/* scene + notice */
.scene{width:100%;height:auto;display:block}
.notice{display:flex;align-items:center;gap:14px;background:var(--warm);border:3px dashed var(--gold);border-radius:18px;padding:12px 16px}
.notice svg.i{width:56px;height:56px}
.notice p{margin:0;font-size:clamp(21px,3.2vw,30px);font-weight:900;line-height:1.45}
.notice small{display:block;font-size:clamp(19px,2.3vw,21px);font-weight:700;color:var(--muted)}
.notice.slim svg.i{width:40px;height:40px}
.notice.slim p{font-size:clamp(19px,2.6vw,23px)}
/* week calendar */
.calw{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;min-height:96px;justify-content:flex-start}
.day .dl{font-size:clamp(15px,2vw,19px);font-weight:900;color:var(--muted);white-space:nowrap}
.day .dv{font-size:clamp(15px,2vw,19px);font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.day svg.i{width:34px;height:34px;margin:2px 0}
.day.now{border-color:var(--gold);background:var(--warm)}
.day.now .dl{color:#7A5A16}
.day.later{opacity:.55;border-style:dashed}
.day .ph{width:34px;height:34px;margin:2px 0;border-radius:50%;border:3px dashed var(--line)}
.c-c{color:var(--catch)}.c-k{color:var(--cut)}.c-f{color:var(--farm)}
/* flip cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.flip{font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;perspective:1100px;text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.flip .in{display:grid;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;height:100%}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--line);border-radius:20px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:8px}
.flip .back{transform:rotateY(180deg);background:var(--warm);border-color:var(--gold)}
.flip.on .in{transform:rotateY(180deg)}
.flip.dim{opacity:.55}
.flip .top{display:flex;align-items:center;gap:10px}
.flip .top svg.i{width:52px;height:52px}
.flip .nm{font-size:clamp(21px,2.6vw,25px);font-weight:900;line-height:1.35}
.flip .ds{margin:0;font-size:clamp(19px,2.2vw,21px);line-height:1.6;color:var(--muted)}
.flip .tag{margin-top:auto;font-size:clamp(19px,2.3vw,22px);font-weight:900;display:block;line-height:1.45}
.flip .tag svg.i{margin-right:4px}
.flip .tap{font-size:19px;font-weight:700;color:var(--sea)}
.flip .back .res{margin:0;font-size:clamp(19px,2.3vw,22px);line-height:1.6}
.flip .back .res b{font-size:1.1em}
.flip .back .me{font-size:clamp(19px,2.4vw,22px);font-weight:900;color:#7A5A16;display:flex;align-items:center;gap:10px}
.flip .back .me svg.i{width:48px;height:48px}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}
/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 12px;text-align:center}
.tile .k{margin:0;font-size:clamp(19px,2.3vw,21px);font-weight:700;color:var(--muted);line-height:1.4}
.tile .v{margin:0;font-size:clamp(36px,6vw,54px);font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-size:.42em;margin-left:3px}
.tile .d{margin:0;font-size:19px;font-weight:700;color:var(--muted)}
.tile.t .v{color:var(--tail)}.tile.m .v{color:#7A5A16}.tile.r .v{color:var(--rat)}
/* charts */
.chart{width:100%;height:auto;display:block}
.solo .chart{max-width:600px;margin-inline:auto}
.chart text{font-family:var(--font)}
.cap{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted)}
.twoc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jump{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.4s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0;animation:pop .4s 1.5s forwards}
@keyframes pop{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.jump{animation:none;stroke-dashoffset:0}.pop{animation:none;opacity:1}}
/* residents dots */
.dots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;width:100%;max-width:520px;margin-inline:auto}
.dot{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px}
.dot svg.i{width:78%;height:78%}
.dot.c{background:#E3EFE6}.dot.k{background:#F5EAD3}.dot.f{background:#ECE3F3}
.dot.me{outline:3px solid var(--ink);outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;font-size:clamp(19px,2.3vw,21px);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:4px}
/* mayor */
.say{display:flex;gap:14px;align-items:flex-start}
.say .av{width:84px;height:84px;flex:none}
.bubble{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-size:clamp(19px,2.6vw,24px);line-height:1.65;margin:0;position:relative}
.bubble b{display:block;color:var(--sea);font-size:.85em}
.ec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6}
.ec dt{font-weight:900;white-space:nowrap}
.ec dd{margin:0}
.ec dt.e{color:var(--good)}.ec dt.c{color:var(--rust)}
.other{border-top:2px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.other h4{margin:0;font-size:clamp(19px,2.5vw,23px);display:flex;align-items:center;gap:8px}
/* chips + table */
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chip{border:3px solid var(--line);border-radius:14px;background:var(--card);text-align:center;padding:6px 2px;font-weight:900;font-size:clamp(17px,2.2vw,20px);line-height:1.3}
.chip svg.i{width:30px;height:30px;display:block;margin:2px auto}
.chip small{display:block;font-size:clamp(15px,1.9vw,17px);color:var(--muted);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.6vw,24px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
td:first-child{color:var(--muted);font-weight:700;width:40%}
td b{font-size:1.1em}
@media (max-width:700px){
  .cards{grid-template-columns:1fr}
  .flip .top svg.i{width:44px;height:44px}
  .twoc{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .tiles{grid-template-columns:1fr}
  .tile{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px}
  .tile .k{flex:1}
  .tile .v{font-size:40px}
  .tile .d{display:none}
  .day{min-height:84px;padding:4px 0}
  .day svg.i,.day .ph{width:28px;height:28px}
  .say .av{width:64px;height:64px}
  td:first-child{width:auto}
  table,tbody,tr,td{display:block}
  td{border:0;padding:2px 0}
  tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ec{grid-template-columns:1fr;gap:0}
  .ec dd{margin-bottom:6px}
}
</style>

function ic(k,c){return '<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICI[k]+'</svg>'}
var MAYOR='<svg class="av" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#EEF1EC"/><path d="M12 64 Q13 44 32 44 Q51 44 52 64 Z" fill="#205E86"/><path d="M21 47 L45 63" stroke="#E2B65A" stroke-width="5" fill="none"/><circle cx="32" cy="27" r="13" fill="#E9BE96"/><path d="M19 25 Q19 12 32 13 Q45 12 45 25 Q40 18 32 18.5 Q24 18 19 25 Z" fill="#7C8580"/><circle cx="27.5" cy="27" r="1.8" fill="#1F2A2E"/><circle cx="36.5" cy="27" r="1.8" fill="#1F2A2E"/><path d="M27.6 31.6 Q32 29.6 36.4 31.6" fill="none" stroke="#7C8580" stroke-width="2.4" stroke-linecap="round"/><path d="M28.5 34.6 Q32 37 35.5 34.6" fill="none" stroke="#1F2A2E" stroke-width="2" stroke-linecap="round"/></svg>';

function rnd(){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1))}

var R0=1000,GROW=0.2,WEEKS=5;
var ACT={
  c:{name:'下水溝抓老鼠',short:'抓老鼠',ab:'抓',icon:'net',cls:'c-c'},
  k:{name:'剪尾巴、把老鼠放走',short:'剪尾巴放走',ab:'剪',icon:'scissors',cls:'c-k'},

/* ---------- computer residents (99) ----------
   week 1: about 84 catch, 12 cut, 3 start breeding rats.
   after each week: about 27-33% of catchers switch to cutting (cutting earned 4 coins, catching 3);
   new breeders next week = about 50-65% of the current breeders ("neighbours are doing it"),
   60% of them were catchers and 40% were cutters. Breeders keep breeding (they bought a cage).
   every established cage lets 0-2 rats escape each week. */
function genPlan(){
  for(var tries=0;tries<300;tries++){
    var c=ri(82,86),k=96-c,f=3,nf=3,P={c:[],k:[],f:[],nf:[],cc:[],cf:[],kf:[],esc:[]};
    for(var w=0;w<WEEKS;w++){
      if(w>0){
        var p=0.27+rnd()*0.06,r=0.5+rnd()*0.15;
        var n=Math.max(1,Math.round(f*r)),fromC=Math.min(c,Math.round(n*0.6)),fromK=n-fromC;
        var cc=Math.round((c-fromC)*p);
        c-=cc+fromC;k+=cc-fromK;f+=n;nf=n;
        P.cc.push(cc);P.cf.push(fromC);P.kf.push(fromK);
      }else{P.cc.push(0);P.cf.push(0);P.kf.push(0)}
      P.c.push(c);P.k.push(k);P.f.push(f);P.nf.push(nf);
      var e=0;for(var i=0;i<f-nf;i++)e+=ri(0,2);P.esc.push(e);
    }
    if(planOk(P))return P;
  }
  return {c:[84,58,37,23,12],k:[12,36,54,63,66],f:[3,5,8,13,21],nf:[3,2,3,5,8],cc:[0,25,18,11,7],cf:[0,1,2,3,5],kf:[0,1,1,2,3],esc:[0,3,5,8,13]};
}
function resTails(P,w){return 3*P.c[w]+4*P.k[w]+6*(P.f[w]-P.nf[w])}
function planOk(P){
  var R=[R0];for(var w=0;w<WEEKS;w++){var r=R[w];R.push(r+Math.round(r*GROW)-3*P.c[w]+P.esc[w])}
  for(w=1;w<WEEKS;w++)if(resTails(P,w)-resTails(P,w-1)<8)return false;
  if(R[1]>R0-25)return false;
  for(w=2;w<=WEEKS;w++)if(R[w]-R[w-1]<12)return false;
  return true;
}

function fresh(){return {step:'intro',plan:genPlan(),esc:[0,1,2,3,4].map(function(){return ri(0,2)}),picks:[],tmp:null,mayor:null}}
var st=load();
if(!st||!st.plan||!st.esc||!st.picks){st=fresh()}
window.addEventListener('hashchange',function(){

  st=fresh();render();try{window.scrollTo(0,0)}catch(e){}
});

/* my outcome in week w with action a */
function outcome(w,a){
  var hadCage=st.picks.slice(0,w).indexOf('f')>=0;
  if(a==='c')return {t:3,coin:3,caught:3,esc:0};
  if(a==='k')return {t:4,coin:4,caught:0,esc:0};
  if(!hadCage)return {t:0,coin:-2,caught:0,esc:0,cage:true};
  return {t:6,coin:6,caught:0,esc:st.esc[w]};
}
function sim(){
  var P=st.plan,R=[R0],T=[],coins=0,myT=0,out=[];
  for(var w=0;w<st.picks.length;w++){
    var o=outcome(w,st.picks[w]);out.push(o);
    T.push(resTails(P,w)+o.t);coins+=o.coin;myT+=o.t;
    var r=R[w];R.push(r+Math.round(r*GROW)-3*P.c[w]-o.caught+P.esc[w]+o.esc);
  }
  var relRes=0,hh=0;for(w=0;w<WEEKS;w++){relRes+=P.nf[w]*(8+2*(WEEKS-w));hh+=P.nf[w]}
  var fw=st.picks.filter(function(x){return x==='f'}).length,relMe=fw?8+2*fw:0;
  return {R:R,T:T,coins:coins,myT:myT,out:out,relRes:relRes,relMe:relMe,hh:hh+(fw?1:0),rel:relRes+relMe,final:R[R.length-1]+relRes+relMe};
}
function sgn(n){return n>0?'+'+n:(n<0?'−'+(-n):'0')}
function sum(a){return a.reduce(function(s,x){return s+x},0)}

/* ---------- charts ---------- */
function chart(o){
  /* o: {vals, slots(labels), max, ticks, color, type:'bar'|'line', unit, jumpLast} */
  var W=340,H=214,L=52,Rr=12,Tp=26,B=36,iw=W-L-Rr,ih=H-Tp-B,n=o.slots.length,step=iw/n;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+o.aria+'">';
  o.ticks.forEach(function(t){var y=Tp+ih-ih*t/o.max;s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y+'" y2="'+y+'" stroke="#D4D9D2" stroke-width="1.5"/><text x="'+(L-6)+'" y="'+(y+5)+'" text-anchor="end" font-size="16" fill="#56605C">'+t+'</text>'});
  s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+(Tp+ih)+'" y2="'+(Tp+ih)+'" stroke="#56605C" stroke-width="2"/>';
  o.slots.forEach(function(lb,i){var x=L+step*(i+.5);s+='<text x="'+x+'" y="'+(H-12)+'" text-anchor="middle" font-size="16" fill="#56605C" font-weight="700">'+lb+'</text>'});
  function Y(v){return Tp+ih-ih*v/o.max}
  if(o.type==='bar'){
    var bw=Math.min(step*.62,40);
    o.slots.forEach(function(lb,i){
      var x=L+step*(i+.5)-bw/2,v=o.vals[i];
      if(v==null){s+='<rect x="'+x+'" y="'+(Tp+ih-24)+'" width="'+bw+'" height="22" rx="4" fill="none" stroke="#D4D9D2" stroke-width="2" stroke-dasharray="4 4"/>';return}
      var y=Y(v),last=i===o.vals.length-1;
      s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+(Tp+ih-y)+'" rx="4" fill="'+o.color+'" opacity="'+(last?1:.55)+'"/>';
      s+='<text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="17" font-weight="900" fill="#1F2A2E">'+v+'</text>';
    });
  }else{
    var pts=o.vals.map(function(v,i){return [L+step*(i+.5),Y(v)]});
    var main=o.jumpLast?pts.slice(0,-1):pts;
    if(main.length>1)s+='<polyline points="'+main.map(function(p){return p[0]+','+p[1]}).join(' ')+'" fill="none" stroke="'+o.color+'" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>';
    if(o.jumpLast&&pts.length>1){var a=pts[pts.length-2],b=pts[pts.length-1];s+='<line class="jump" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+o.color+'" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5 0"/>'}
    pts.forEach(function(p,i){
      var last=i===pts.length-1,cls=(o.jumpLast&&last)?' class="pop"':'';
      s+='<g'+cls+'><circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(last?6:4.5)+'" fill="'+(last?o.color:'#FBFCF9')+'" stroke="'+o.color+'" stroke-width="3"/>';
      if(o.labelAll||last||i===0)s+='<text x="'+p[0]+'" y="'+(p[1]-11)+'" text-anchor="middle" font-size="17" font-weight="900" fill="#1F2A2E">'+o.vals[i]+'</text>';
      s+='</g>';
    });
  }
  return s+'</svg>';
}
var WK=['第1週','第2週','第3週','第4週','第5週'];
function tailChart(T,line){
  var v=WK.map(function(_,i){return i<T.length?T[i]:null});
  if(line)return chart({type:'line',vals:T,slots:WK,max:450,ticks:[150,300,450],color:'#205E86',labelAll:true,aria:'鎮公所每週收到的尾巴數'});
  return chart({type:'bar',vals:v,slots:WK,max:450,ticks:[150,300,450],color:'#205E86',aria:'鎮公所每週收到的尾巴數'});
}
function ratChart(R,withEnd,jump){
  var slots=['開始','1','2','3','4','5'];if(withEnd)slots.push('取消後');
  var vals=R.slice();
  return chart({type:'line',vals:vals,slots:slots,max:2000,ticks:[500,1000,1500,2000],color:'#A8441A',labelAll:false,jumpLast:!!jump,aria:'鎮上老鼠的數量'});
}

  var s=sim(),c=el('div','calw');c.setAttribute('aria-label','五週的週曆');
  for(var w=0;w<WEEKS;w++){

    if(w<st.picks.length&&w!==curIdx){
      var a=ACT[st.picks[w]],o=s.out[w];
      d=el('div','day','<span class="dl">'+WK[w]+'</span>'+ic(a.icon,a.cls)+'<span class="dv">'+sgn(o.coin)+' 枚</span>');
    }else if(w===curIdx){

      if(w<st.picks.length){var a2=ACT[st.picks[w]];inner+=ic(a2.icon,a2.cls)+'<span class="dv">'+sgn(s.out[w].coin)+' 枚</span>'}
      else inner+='<span class="ph"></span><span class="dv">這週</span>';
      d=el('div','day now',inner);
    }else d=el('div','day later','<span class="dl">'+WK[w]+'</span><span class="ph"></span>');
    c.appendChild(d);
  }
  return c;
}

  var tw=el('div','twoc');tw.append(c1,c2);
  var mine=el('div','card');mine.append(el('h3',null,'你五週的選擇'),myChips(),el('p','cap','你一共交了 '+s.myT+' 條尾巴，拿到 '+s.coins+' 枚銅板。'));
  app.append(el('p','case','五週的結果'),el('h2',null,'尾巴越收越多，老鼠呢？'),tw,
    el('p','note warm','獎勵看的是<b>尾巴</b>，大家想要的是<b>老鼠變少</b>。兩件事不一樣，大家就去追尾巴。'),
    mine,button('下一步','btn',function(){go('mayor')}));
}

/* ---------- step: if you were mayor ---------- */
var MO=[
 {k:'A',icon:'lens',t:'改成交老鼠的身體（要確認是死的）',e:'剪尾巴、把老鼠放走就沒有用了。交上來的每一隻，鎮上就真的少一隻。',c:'還是有人可以養老鼠、再整隻拿來交。鎮公所要派人一隻一隻檢查，處理一大堆死老鼠，又臭又辛苦，也可能讓人生病。'},
 {k:'B',icon:'trend',t:'照全鎮老鼠有沒有變少來給獎勵',e:'獎勵直接看大家真正想要的結果。養老鼠、剪尾巴都拿不到好處。',c:'老鼠躲在水溝裡，很難數得準。全鎮一起變少時，也很難算出誰出了多少力，有人可能等別人去做。'},
 {k:'C',icon:'helmet',t:'請專人抓老鼠，付他們薪水',e:'薪水看工作，不看尾巴，抓的人沒有理由去養老鼠。抓老鼠的人也會越來越熟練。',c:'鎮上要一直花錢請人；也要有人看看他們是不是真的認真在抓。'},
 {k:'D',icon:'broom',t:'不用獎金，大家一起清水溝',e:'把老鼠住的地方、吃的垃圾清掉，從根本讓老鼠變少。大家是為了自己住的地方，不是為了銅板。',c:'要很多人願意出力；有人不來幫忙，也拿他沒辦法。清水溝很累，可能要一直做下去。'}];
function mayor(){
  if(st.picks.length<WEEKS){go('pick');return}
  app.innerHTML='';
  var g=el('div','opts'),panel=el('div');
  var nx=button('下一步','btn',function(){if(st.mayor!=null)go('end')});nx.disabled=st.mayor==null;
  function show(){
    panel.innerHTML='';if(st.mayor==null)return;
    var m=MO[st.mayor],c=el('div','card');
    c.append(el('h3',null,'你選了 '+m.k+'：'+m.t));
    var dl=el('dl','ec');dl.innerHTML='<dt class="e">作用</dt><dd>'+m.e+'</dd><dt class="c">代價</dt><dd>'+m.c+'</dd>';c.appendChild(dl);
    var ot=el('div','other');ot.appendChild(el('p','cap','其他做法也有各自的作用和代價：'));
    MO.forEach(function(o,i){if(i===st.mayor)return;ot.appendChild(el('h4',null,ic(o.icon)+o.k+'　'+o.t));var d2=el('dl','ec');d2.innerHTML='<dt class="e">作用</dt><dd>'+o.e+'</dd><dt class="c">代價</dt><dd>'+o.c+'</dd>';ot.appendChild(d2)});
    c.appendChild(ot);panel.appendChild(c);
  }
  MO.forEach(function(m,i){
    var b=button(ic(m.icon)+'<span><span class="letter">'+m.k+'</span>'+m.t+'</span>','btn alt'+(st.mayor===i?' pick':''),function(){
      st.mayor=i;save(st);Array.prototype.forEach.call(g.children,function(x){x.classList.remove('pick')});b.classList.add('pick');nx.disabled=false;show();
      try{panel.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}
    });
    g.appendChild(b);
  });
  show();
  app.append(el('p','case','換你想一想'),el('h2',null,'如果你是鎮長，你會改成？'),
    el('p','lead','每一個做法都可以選。選了以後，會看到這個做法的作用和代價。沒有標準答案，等一下全班一起討論。'),g,panel,nx);
}

/* ---------- step: end ---------- */
function end(){
  if(st.picks.length<WEEKS||st.mayor==null){go(st.picks.length<WEEKS?'pick':'mayor');return}
  var s=sim(),m=MO[st.mayor];
  app.innerHTML='';
  var cnt={c:0,k:0,f:0};st.picks.forEach(function(p){cnt[p]++});
  var t=el('table');
  [['五週我各選了什麼',st.picks.map(function(p,i){return '第'+(i+1)+'週 <b>'+ACT[p].ab+'</b>'}).join('、')+'<br>（抓老鼠 '+cnt.c+' 週、剪尾巴放走 '+cnt.k+' 週、養老鼠 '+cnt.f+' 週）'],
   ['我賺了幾枚銅板','<b>'+s.coins+'</b> 枚'],
   ['鎮公所總共收到幾條尾巴','<b>'+sum(s.T)+'</b> 條'],
   ['鎮上的老鼠','第 1 週結束 <b>'+s.R[1]+'</b> 隻，最後（獎金取消後）<b>'+s.final+'</b> 隻'],
   ['如果我是鎮長，我會改成','<b>'+m.k+'</b>　'+m.t]].forEach(function(r){
    var tr=el('tr');tr.append(el('td',null,r[0]),el('td',null,r[1]));t.appendChild(tr);
  });
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c,myChips());
}

function render(){
  var S={intro:intro,pick:pick,settle:settle,cancel:cancel,result:result,mayor:mayor,end:end};
  (S[st.step]||intro)();
}
render();
})();
</script>
