<meta charset="utf-8">
<script src="fresh.js"></script>
<title>甘蔗園請幫手</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: story → drag one of three name cards (toads / strong spray / rotate crops + dig + birds) into the cane field → three two-way guesses about year 1 and year 10 → drag a timeline handle from year 1 to year 10 while the SVG field, three meters and a village-news sentence change → pick a second (optionally third) method and drag again → year-1 / year-10 comparison table → "if you were the village head" (every option allowed, effect and cost only) → summary for a show of hands. Fixed script, no randomness. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --mA:#7A5A16; --mB:#A8441A; --mC:#2F7D4F;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.soft{background:var(--card);color:var(--sea);border:3px solid var(--sea)}
.btn:focus-visible,.ncard:focus-visible,.tl:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
.hint{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn.alt svg.i{width:1.7em;height:1.7em}
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;border-radius:50%;color:#fff;font-weight:900;font-size:.9em;flex:none;line-height:1}
.lt.A{background:var(--mA)}.lt.B{background:var(--mB)}.lt.C{background:var(--mC)}.lt.D{background:var(--sea)}
/* scene */
.sbox{position:relative;background:#E3EFF4;border:3px solid var(--line);border-radius:20px;overflow:hidden}
.scene{width:100%;height:auto;display:block}
.scene .it{transition:opacity .4s}
.scene .bt{transition:opacity .35s,transform .45s}
.scene .grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .45s}
.scene .cs{transition:opacity .4s}
.scene .lf{transition:fill .4s}
.scene .spot{transition:opacity .4s}
.scene #water,.scene .veg{transition:fill .4s}
@media (prefers-reduced-motion:reduce){.scene *{transition:none!important}}
.cap{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted)}
/* drop zone */
.zone{outline:4px dashed var(--gold);outline-offset:-4px}
.zone.over{outline-color:var(--good);outline-style:solid;box-shadow:0 0 0 6px #CFE3C4}
.zlabel{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(251,252,249,.94);border:3px dashed var(--gold);border-radius:16px;padding:8px 16px;font-weight:900;font-size:clamp(19px,2.8vw,26px);white-space:nowrap;display:flex;align-items:center;gap:8px;pointer-events:none}
.zsign{position:absolute;left:3%;top:6%;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-weight:900;font-size:clamp(19px,2.6vw,24px);display:flex;align-items:center;gap:8px;pointer-events:none;box-shadow:0 4px 0 rgba(31,42,46,.18)}
.zsign svg.i{width:1.6em;height:1.6em}
/* name cards */
.ncards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ncard{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:22px 14px 14px;display:flex;flex-direction:column;gap:6px;cursor:grab;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.ncard::before{content:"";position:absolute;top:8px;left:50%;width:30px;height:8px;margin-left:-15px;border-radius:5px;background:var(--bg);border:2px solid var(--line)}
.ncard .top{display:flex;align-items:center;gap:8px}
.ncard .top svg.i{width:52px;height:52px}
.ncard .nm{font-size:clamp(21px,2.6vw,25px);font-weight:900;line-height:1.35}
.ncard .ds{margin:0;font-size:clamp(19px,2.2vw,21px);line-height:1.6;color:var(--muted)}
.ncard.A{border-top:8px solid var(--mA)}.ncard.B{border-top:8px solid var(--mB)}.ncard.C{border-top:8px solid var(--mC)}
.ncard.in{opacity:.4;border-style:dashed}
.ncard.done{opacity:.5;cursor:default}
.ncard .tag{font-size:19px;font-weight:900;color:var(--muted)}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.93;transform:rotate(-3deg);box-shadow:0 12px 26px rgba(31,42,46,.25)}
/* guess */
.q{display:flex;flex-direction:column;gap:8px}
.q h3 .n{color:var(--sea);margin-right:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn.alt{justify-content:center;text-align:center}
/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 236px;grid-template-areas:"sc mt" "tl mt";gap:12px;align-items:start}
.stage .sbox{grid-area:sc}
.meters{grid-area:mt;display:flex;flex-direction:column;gap:8px}
.tlw{grid-area:tl}
.mt{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.mt .mh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;line-height:1.3}
.mt .mh svg.i{width:38px;height:38px}
.mt .mh .mw{margin-left:auto;font-size:clamp(21px,2.6vw,25px)}
.mcap{margin-top:2px}
.bar{height:16px;border-radius:8px;background:#E3E6E0;position:relative;margin:4px 0 2px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .4s}
.bar .base{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:var(--ink);opacity:.55;border-radius:2px;transition:left .4s}
.mt.h .bar i{background:var(--good)}.mt.h .mw{color:var(--good)}
.mt.b .bar i{background:var(--rust)}.mt.b .mw{color:var(--rust)}
.mt.a .bar i{background:var(--sea)}.mt.a .mw{color:var(--sea)}
.mt .mb{font-size:19px;color:var(--muted);margin:0;line-height:1.35}
.mcap{line-height:1.45}
@media (max-width:760px){.mcap{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.bar i,.bar .base{transition:none}}
/* timeline */
.tl{position:relative;overflow:hidden;padding:50px 26px 4px;background:var(--card);border:3px solid var(--line);border-radius:20px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.tin{position:relative;height:64px}
.trk{position:absolute;left:0;right:0;top:12px;height:14px;border-radius:7px;background:#E3E6E0}
.trk .seen{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:#F3E3BE}
.trk .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--gold);transition:width .2s}
.tk{position:absolute;top:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.tk i{display:block;width:4px;height:30px;border-radius:2px;background:#B9BFB6}
.tk em{font-style:normal;font-weight:900;font-size:19px;color:var(--muted);line-height:1.4;font-variant-numeric:tabular-nums}
.tk.v i{background:var(--gold)}
.tk.now em{color:var(--ink)}
.hd{position:absolute;top:19px;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--card);border:5px solid var(--gold);box-shadow:0 3px 0 rgba(31,42,46,.2);transition:left .2s;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.hd svg.i{width:26px;height:26px}
.hb{position:absolute;bottom:42px;left:18px;transition:transform .2s;background:var(--ink);color:#fff;font-weight:900;font-size:19px;padding:2px 12px;border-radius:12px;white-space:nowrap}
.tl.drag .hd,.tl.drag .hb,.tl.drag .trk .fill{transition:none}
.news{min-height:5.2em;display:flex;gap:12px;align-items:flex-start}
.news svg.i{width:44px;height:44px;margin-top:2px}
.news .nt{display:block;font-size:19px;font-weight:900;color:var(--sea)}
/* tables */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
th{font-size:clamp(19px,2.3vw,21px);color:var(--muted)}
.cmp td.m{font-weight:900;width:30%}
.cmp td.m .mn{display:flex;align-items:center;gap:8px;line-height:1.35}
.cmp .row{display:flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.5}
.cmp .row svg.i{width:26px;height:26px}
.cmp .row b{font-weight:900}
.w-h{color:var(--good)}.w-b{color:var(--rust)}.w-a{color:var(--sea)}
.cmp td.y10{background:#F7F3E8}
.cmp td.mm{display:none;font-weight:900}
.cmp td.mm .mn{display:flex;align-items:center;gap:8px}
.gtab td:first-child{color:var(--muted);font-weight:700}
.gtab .same{color:var(--good);font-weight:900}.gtab .diff{color:var(--rust);font-weight:900}
.sum td:first-child{color:var(--muted);font-weight:700;width:42%}
.sum td b{font-size:1.1em}
.ec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6}
.ec dt{font-weight:900;white-space:nowrap}
.ec dd{margin:0}
.ec dt.e{color:var(--good)}.ec dt.c{color:var(--rust)}
.say{display:flex;gap:14px;align-items:center}
.say .av{width:76px;height:76px;flex:none}
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-areas:"sc" "tl" "mt"}
  .meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .mt{padding:6px 8px}
  .mt .mh{flex-wrap:wrap;gap:2px 6px}
  .mt .mh svg.i{width:30px;height:30px}
  .mt .mh .lb{order:3;width:100%}
  .mt .mb{display:none}
  .ncards{grid-template-columns:1fr}
  .ncard{padding:18px 12px 10px}
  .ncard .top svg.i{width:44px;height:44px}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .tl{padding:48px 26px 2px}
  .gtab,.gtab tbody,.gtab tr,.gtab td{display:block}
  .gtab td{border:0;padding:2px 0}
  .gtab tr{border-bottom:2px solid var(--line);padding:8px 0}
  .tk em{font-size:19px;letter-spacing:-1px}
  .cmp th:first-child,.cmp td.m{display:none}
  .cmp td.mm{display:table-cell;border-bottom:0;padding-bottom:0}
  .sum td:first-child{width:auto}
  .sum,.sum tbody,.sum tr,.sum td{display:block}
  .sum td{border:0;padding:2px 0}
  .sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ec{grid-template-columns:1fr;gap:0}
  .ec dd{margin-bottom:6px}
  .say .av{width:60px;height:60px}
}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

  showN(svg,'crate',k==='A'&&y>=1?1:0);showN(svg,'drum',o.spray);showN(svg,'hoe',C?1:0);

  svg.querySelector('[data-g="mist"]').setAttribute('opacity',(o.spray*0.13).toFixed(2));

  svg.querySelectorAll('.veg').forEach(function(e){e.setAttribute('fill',mix('#8DBF6A','#DCC35C',o.veg/2))});
  svg.querySelector('#yl').textContent=y===0?'開始前':'第 '+y+' 年';
}

function dragify(b,k,zone,onDrop){
  var sx=0,sy=0,down=false,dragging=false,ghost=null,moved=false,pid=null;
  function over(x,y){var r=zone.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
  b.addEventListener('pointerdown',function(e){if(e.button>0)return;down=true;dragging=false;sx=e.clientX;sy=e.clientY;pid=e.pointerId;try{b.setPointerCapture(pid)}catch(_){}});
  b.addEventListener('pointermove',function(e){
    if(!down)return;
    if(!dragging&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8){
      dragging=true;var r=b.getBoundingClientRect();ghost=b.cloneNode(true);ghost.classList.add('ghost');ghost.classList.remove('in');ghost.style.width=r.width+'px';ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';ghost._dx=sx-r.left;ghost._dy=sy-r.top;document.body.appendChild(ghost);
    }
    if(dragging){ghost.style.left=(e.clientX-ghost._dx)+'px';ghost.style.top=(e.clientY-ghost._dy)+'px';zone.classList.toggle('over',over(e.clientX,e.clientY));e.preventDefault()}
  });
  function end(e,cancel){
    if(!down)return;down=false;
    if(dragging){moved=true;var hit=!cancel&&over(e.clientX,e.clientY);if(ghost){ghost.remove();ghost=null}zone.classList.remove('over');dragging=false;if(hit)onDrop()}
  }
  b.addEventListener('pointerup',function(e){end(e,false)});
  b.addEventListener('pointercancel',function(e){end(e,true)});
  b.addEventListener('click',function(){if(moved){moved=false;return}onDrop()});
}

/* ---------- guesses ---------- */
var GQ=[
  {id:'y1',t:'第 1 年，甘蔗園裡的甲蟲會怎樣？',o:['會少很多','不會少很多']},

];
function truth(k){var o1=lv(k,1),o10=lv(k,10);return {y1:o1.b<=BASE.b-4?0:1,h10:o10.h>BASE.h?0:1,a10:o10.a>=A0?0:1}}

    q.o.forEach(function(t,oi){var b=button(t,'btn alt'+(st.g[q.id]===oi?' pick':''),function(){st.g[q.id]=oi;save(st);bs.forEach(function(x,xi){x.classList.toggle('pick',xi===oi);x.setAttribute('aria-pressed',xi===oi?'true':'false')});chk()});b.setAttribute('aria-pressed',st.g[q.id]===oi?'true':'false');bs.push(b);two.appendChild(b)});
    box.append(two);c.append(box);
  });

/* ---------- timeline ---------- */
function timePage(){
  var k=st.cur,nth=st.order.indexOf(k)+1;
  if(!st.yr[k])st.yr[k]=1;if(!st.mx[k])st.mx[k]=1;
  app.append(el('p','case','第 '+nth+' 個辦法：'+ic(M[k].icon)+lt(k)+' '+M[k].name));
  app.append(el('h2',null,'把時間軸往右拖，看看每一年的甘蔗園。'));
  var stage=el('div','stage');
  var sb=el('div','sbox');sb.innerHTML=sceneSVG();var svg=sb.querySelector('svg');
  var ms=el('div','meters');
  var MT=[['h','cane_cane','甘蔗收成'],['b','cane_beetle','甲蟲'],['a','cane_frog','田邊動物']];var mref={};
  MT.forEach(function(m){var d=el('div','mt '+m[0]);d.innerHTML='<div class="mh">'+ic(m[1])+'<span class="lb">'+m[2]+'</span><b class="mw"></b></div><div class="bar"><i></i><span class="base" title="開始前"></span></div><p class="mb"></p>';ms.appendChild(d);mref[m[0]]=d});ms.appendChild(el('p','cap mcap','田邊動物：青蛙、鳥、魚、蜜蜂。深色細線是「開始前」。'));
  var tlw=el('div','tlw');
  var tl=el('div','tl');tl.setAttribute('role','slider');tl.tabIndex=0;tl.setAttribute('aria-label','時間軸：第幾年');tl.setAttribute('aria-valuemin','1');tl.setAttribute('aria-valuemax','10');
  var tin=el('div','tin');var trk=el('div','trk','<div class="seen"></div><div class="fill"></div>');tin.appendChild(trk);
  var tks=[];for(var y=1;y<=10;y++){var t=el('span','tk','<i></i><em>'+y+'</em>');t.style.left=((y-1)/9*100)+'%';tin.appendChild(t);tks.push(t)}
  var hd=el('div','hd',ic('grip')+'<span class="hb"></span>');tin.appendChild(hd);
  tl.appendChild(tin);tlw.appendChild(tl);
  stage.append(sb,ms,tlw);app.append(stage);
  var news=el('div','note warm news');app.append(news);
  var extra=el('div');app.append(extra);
  var hint=el('p','hint');app.append(hint);
  var nxt=button(st.order.length===1?'再挑另一個辦法看看':'看看比較表','btn',function(){
    if(st.mx[k]<10)return;
    if(st.order.length===1){st.place=null;go('pick2')}else go('comp');
  });app.append(nxt);

  function set(y,quiet){
    y=Math.max(1,Math.min(10,y));
    st.yr[k]=y;if(y>st.mx[k])st.mx[k]=y;save(st);
    paint(svg,k,y);
    var o=lv(k,y),p=(y-1)/9*100;
    hd.style.left=p+'%';var hb=hd.querySelector('.hb');hb.textContent='第 '+y+' 年';hb.style.transform='translateX(-'+Math.round(p)+'%)';
    trk.querySelector('.fill').style.width=p+'%';trk.querySelector('.seen').style.width=((st.mx[k]-1)/9*100)+'%';
    tks.forEach(function(t,i){t.classList.toggle('v',i+1<=st.mx[k]);t.classList.toggle('now',i+1===y)});
    tl.setAttribute('aria-valuenow',y);tl.setAttribute('aria-valuetext','第 '+y+' 年');
    [['h',o.h,BASE.h],['b',o.b,BASE.b],['a',o.a,A0]].forEach(function(r){var d=mref[r[0]];d.querySelector('.mw').textContent=word(r[1]);d.querySelector('.bar i').style.width=(r[1]*10)+'%';d.querySelector('.base').style.left=(r[2]*10)+'%';d.querySelector('.mb').textContent='開始前：'+word(r[2])});
    news.innerHTML=ic('mega')+'<p style="margin:0"><span class="nt">庄裡的消息</span>'+D[k].news[y]+'</p>';
    var ok=st.mx[k]>=10;nxt.disabled=!ok;
    hint.innerHTML=ok?'':ic('clock')+'要把時間軸拖到第 10 年，才能按下一步。（現在看到第 '+st.mx[k]+' 年）';
    hint.style.display=ok?'none':'';
    extra.innerHTML='';
    if(ok&&k===st.first)extra.appendChild(guessCheck(k));
  }
  function fromX(x){var r=tin.getBoundingClientRect();return Math.round((x-r.left)/r.width*9)+1}
  var dragging=false;
  tl.addEventListener('pointerdown',function(e){if(e.button>0)return;dragging=true;tl.classList.add('drag');try{tl.setPointerCapture(e.pointerId)}catch(_){}set(fromX(e.clientX));e.preventDefault()});
  tl.addEventListener('pointermove',function(e){if(!dragging)return;var y=fromX(e.clientX);if(y!==st.yr[k])set(y)});
  function stop(){dragging=false;tl.classList.remove('drag')}
  tl.addEventListener('pointerup',stop);tl.addEventListener('pointercancel',stop);
  tl.addEventListener('keydown',function(e){var y=st.yr[k];
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){set(y+1);e.preventDefault()}
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){set(y-1);e.preventDefault()}
    else if(e.key==='Home'){set(1);e.preventDefault()}else if(e.key==='End'){set(10);e.preventDefault()}});
  set(st.yr[k]);
}
function guessCheck(k){
  var tr=truth(k),c=el('div','card');

  GQ.forEach(function(q,i){var g=st.g[q.id],same=g===tr[q.id];
    h+='<tr><td>'+lab[i]+'</td><td>你猜：<b>'+q.o[g]+'</b><br>結果：<b>'+q.o[tr[q.id]]+'</b></td><td class="'+(same?'same':'diff')+'">'+(same?'和你猜的一樣':'和你猜的不一樣')+'</td></tr>'});
  tb.innerHTML=h+'</tbody>';c.append(tb);
  c.append(el('p','note','第 1 年看到的，不一定就是第 10 年的樣子。想一個辦法的時候，可以多問自己兩句：「然後呢？」「多久以後呢？」'));

}

/* ---------- village head question (no right answer) ---------- */
var MY={
  A:{n:'放大蟾蜍進園子',e:'第 1 年很熱鬧，大家覺得「有在做事」，也不用碰到藥。',c:'甲蟲沒有變少；大蟾蜍越生越多，跑到水溝和隔壁庄，本地的小青蛙變少，放出去就收不回來。'},
  B:{n:'灑強力殺蟲藥',e:'最快見效，第 1、2 年甲蟲幾乎不見，收成最好，可以馬上救急。',c:'甲蟲越來越不怕藥，要越灑越多；水溝的魚、田邊的蜜蜂和隔壁庄的菜，都會跟著受影響。'},
  C:{n:'輪作、翻土、請鳥來吃',e:'第 3 年起慢慢穩住，第 10 年收成和田邊的小動物都還不錯。',c:'頭兩年甲蟲只少一點、收成不好，大家要很累、很有耐心，一起做好幾年。'},

};

function render(){
  app.innerHTML='';
  var s=st.step;
  if(s==='intro')intro();
  else if(s==='pick')pickPage(false);
  else if(s==='guess'&&st.first)guessPage();

  else if(s==='comp'&&st.order.length>=2)compPage();
  else if(s==='mayor')mayorPage();
  else if(s==='end'&&st.mayor&&st.first)endPage();
  else{st=fresh();save(st);intro()}
}
render();

})();
