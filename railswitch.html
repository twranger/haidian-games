<meta charset="utf-8">
<script src="fresh.js"></script>
<title>換一條軌道</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: intro, then three school stories; each: story page, then SVG railway (train carrying "this thing" from the left, a junction fanning into 4 tracks, a switch lever to tap/drag, 開車 / 倒車, terminus board with tiredness thermometer, mood faces and "someone secretly breaking the deal" chip; must try two different tracks), then value question "你最想扳到哪一條？" (every option allowed, effect and cost only), then summary for a show of hands. Fixed script, no randomness. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --plum:#6B5A9E; --note:#EAF1F5; --warm:#FBF1DC;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;justify-content:flex-start;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.soft{background:var(--card);color:var(--sea);border:3px solid var(--sea)}
.btn:focus-visible,.chip:focus-visible,.lever:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
.hint.lv{flex-wrap:nowrap;align-items:flex-start}
.hint.lv svg.i{margin-top:.2em}
.hint{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn svg.i{width:1.5em;height:1.5em}
.btn.alt svg.i{width:1.8em;height:1.8em}
/* track colours */
.k-more{--k:#A8441A;--kb:#F8E3DA}.k-cap{--k:#205E86;--kb:#DCE8F0}.k-self{--k:#2F7D4F;--kb:#DCEBD5}.k-team{--k:#8A6416;--kb:#F6EAC8}.k-worth{--k:#6B5A9E;--kb:#EAE5F3}
.tn{color:var(--k);font-weight:900}
.dot{display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--kb);color:var(--k);border:3px solid var(--k);flex:none}
.dot svg.i,.btn.alt .dot svg.i,.btn .dot svg.i{width:1.15em;height:1.15em}
/* story */
.story p{margin:0;font-size:clamp(19px,2.6vw,24px);line-height:1.75}
.cargo{display:flex;align-items:center;gap:12px;background:var(--warm);border-radius:16px;padding:10px 14px;font-weight:900;font-size:clamp(19px,2.6vw,24px)}
.cargo svg.i{width:44px;height:44px;color:var(--rust)}
.cargo small{display:block;font-size:19px;color:var(--muted);font-weight:700}
.introsvg{width:100%;height:auto;display:block;border-radius:16px;background:#E3EFF4}
/* railway */
.rbox{background:#E9EEE0;border:3px solid var(--line);border-radius:20px;overflow:hidden;position:relative}
.rail{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rail .br{transition:opacity .3s}
.rail .br.off{opacity:.38}
.rail .hl{transition:opacity .3s}
.rail .tlab{font-family:var(--font);font-weight:900;font-size:22px}
.rail .tap{cursor:pointer}
.rail .lever{cursor:grab;outline:none}
.rail .lever:focus-visible .knob{stroke:#B7862B;stroke-width:6}
.rail .arm{transition:transform .25s}
.rail.drag .arm{transition:none}
.rail .st{transition:opacity .3s}
.rail .puff{opacity:0}
.rail.moving .puff{animation:puff 1.1s infinite}
.rail.moving .puff.p2{animation-delay:.55s}
@keyframes puff{0%{opacity:.85;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-18px,-26px) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.rail *{transition:none!important;animation:none!important}}
@media (max-width:560px){.rail .tlab{display:none}}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font-size:clamp(19px,2.4vw,22px);font-weight:700;line-height:1.4;position:relative}
.chip.on{border-color:var(--k);background:var(--kb)}
.chip .ok{margin-left:auto;color:var(--good);display:flex;align-items:center;gap:2px;font-size:19px;white-space:nowrap}
.chip .ok svg.i{width:1.1em;height:1.1em}
.chip[disabled]{cursor:default}
.chip[disabled]:not(.on){opacity:.55}
.ctrl{display:flex;flex-direction:column;gap:12px}
.plan{margin:0;font-size:clamp(19px,2.6vw,24px);line-height:1.6;display:flex;gap:12px;align-items:flex-start}
.plan .dot{margin-top:2px}
.plan b{display:block;font-size:19px;color:var(--muted)}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:10px}
/* terminus board */
.board{border:3px solid var(--k);border-radius:22px;overflow:hidden;background:var(--card)}
.board .bh{background:var(--k);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(21px,3vw,27px);line-height:1.35}
.board .bh small{display:block;font-size:19px;font-weight:700;opacity:.9}
.board .bh .dot{background:#fff;border-color:#fff}
.board .bb{padding:clamp(12px,2.6vw,20px);display:flex;flex-direction:column;gap:14px}
.board .bs{margin:0;font-size:clamp(19px,2.6vw,24px);line-height:1.75}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g{background:#F4F6F1;border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.g .gt{font-weight:900;font-size:19px;color:var(--muted);line-height:1.3}
.g .gv{font-weight:900;font-size:clamp(19px,2.6vw,24px);line-height:1.3}
.thermo{width:44px;height:96px}
.faces{display:flex;gap:4px;justify-content:center;align-items:center;min-height:96px}
.faces svg.i{width:34px;height:34px;opacity:.25}
.faces svg.i.on{width:50px;height:50px;opacity:1}
.sneak{min-height:96px;display:flex;align-items:center;justify-content:center}
.sneak svg.i{width:50px;height:50px}
.lvl{display:flex;gap:4px;margin-top:2px}
.lvl i{display:block;width:16px;height:10px;border-radius:4px;background:#DADFD6}
.lvl i.on{background:var(--rust)}
.care{margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6;background:#F6E3D6;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.care svg.i{width:1.6em;height:1.6em;margin-top:1px}
.wait{border:3px dashed var(--line);border-radius:22px;padding:18px;color:var(--muted);font-weight:700;font-size:clamp(19px,2.5vw,23px);display:flex;gap:12px;align-items:center;margin:0}
.wait svg.i{width:2em;height:2em}
.tried{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px 2px 4px;background:var(--kb);color:var(--k);font-weight:900;font-size:19px;border:2px solid var(--k)}
.tag .dot{width:1.6em;height:1.6em;border-width:2px}
/* pick */
.btn.alt .tx{display:flex;flex-direction:column;gap:2px}
.btn.alt .tx small{font-size:19px;color:var(--muted);font-weight:500;line-height:1.5}
.btn.alt .tx em{font-style:normal;font-size:19px;color:var(--good);font-weight:900}
.btn.alt.pick{border-color:var(--k);background:var(--kb)}
.ec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6}
.ec dt{font-weight:900;white-space:nowrap}
.ec dd{margin:0}
.ec dt.e{color:var(--good)}.ec dt.c{color:var(--rust)}
/* summary */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:middle}
.sum td:first-child{color:var(--muted);font-weight:700;width:44%}
.sum td b{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (max-width:760px){
  .chips{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .btns{grid-template-columns:1fr 1fr}
  .g{padding:8px 4px}
  .faces svg.i{width:24px;height:24px}
  .faces svg.i.on{width:40px;height:40px}
  .sum,.sum tbody,.sum tr,.sum td{display:block}
  .sum td{border:0;padding:2px 0}
  .sum td:first-child{width:auto}
  .sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ec{grid-template-columns:1fr;gap:0}
  .ec dd{margin-bottom:6px}
}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

function ic(k,c){return '<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICI[k]+'</svg>'}

function route(y){return 'M0 '+MY+' L'+JX+' '+MY+' C330 '+MY+' 350 '+y+' 430 '+y+' L'+STOP+' '+y}

function railPath(d,cls){

         '<path d="'+d+'" fill="none" stroke="#7C8A8E" stroke-width="16"/>'+
         '<path d="'+d+'" fill="none" stroke="#E9EEE0" stroke-width="9"/>';
}
function iconSvg(k,x,y,s,col){return '<svg x="'+x+'" y="'+y+'" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+(col||'#1F2A2E')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICI[k]+'</svg>'}
function trainSVG(cargo){

function railSVG(sc){
  var s='<svg class="rail" viewBox="0 0 800 370" role="img" aria-label="鐵道：小火車從左邊開過來，前面的分岔口分成四條軌道，每條軌道通到一個終點站；左下角是轉轍器的拉桿">';

  // branches
  sc.tracks.forEach(function(id,i){

  // stations

    s+='<g class="st" data-i="'+i+'"><rect x="662" y="'+(y+12)+'" width="138" height="12" fill="#C9CCC4" stroke="#8D958B" stroke-width="2"/>'+
       '<path d="M684 '+(y-30)+'L732 '+(y-50)+'L780 '+(y-30)+'Z" fill="'+t.col+'" stroke="#1F2A2E" stroke-width="2.5" stroke-linejoin="round"/>'+
       '<rect x="690" y="'+(y-31)+'" width="84" height="43" rx="3" fill="'+t.bg+'" stroke="#1F2A2E" stroke-width="2.5"/>'+
       iconSvg(t.ic,714,y-28,36,t.col)+'<rect class="lamp" x="684" y="'+(y-54)+'" width="96" height="70" rx="10" fill="none" stroke="'+t.col+'" stroke-width="5" opacity="0"/></g>';
    s+='<text class="tlab" x="448" y="'+(y+35)+'" fill="'+t.col+'">'+t.n+'</text>';
    s+='<path class="tap" data-i="'+i+'" d="'+branch(y)+'" fill="none" stroke="transparent" stroke-width="56" pointer-events="stroke"/>';
  });

  sc.tracks.forEach(function(id,i){s+='<path class="route" data-i="'+i+'" d="'+route(TY[i])+'" fill="none" stroke="none" visibility="hidden"/>'});
  // lever
  var px=PIV[0],py=PIV[1];

  s+='<circle cx="'+px+'" cy="'+(py-60)+'" r="92" fill="transparent"/>';
  s+='<path d="M'+(px-118*Math.sin(Math.PI*58/180)).toFixed(1)+' '+(py-118*Math.cos(Math.PI*58/180)).toFixed(1)+'A118 118 0 0 1 '+(px+118*Math.sin(Math.PI*58/180)).toFixed(1)+' '+(py-118*Math.cos(Math.PI*58/180)).toFixed(1)+'" fill="none" stroke="#C9CCC4" stroke-width="6" stroke-linecap="round"/>';
  sc.tracks.forEach(function(id,i){var a=ANG[i]*Math.PI/180;s+='<circle class="notch" data-i="'+i+'" cx="'+(px+118*Math.sin(a)).toFixed(1)+'" cy="'+(py-118*Math.cos(a)).toFixed(1)+'" r="11" fill="'+TR[id].col+'" stroke="#FBFCF9" stroke-width="3"/>'});
  s+='<g class="arm" style="transform-origin:'+px+'px '+py+'px"><path d="M'+px+' '+py+'V'+(py-ARM)+'" stroke="#56605C" stroke-width="10" stroke-linecap="round"/><circle class="knob" cx="'+px+'" cy="'+(py-ARM)+'" r="21" fill="#C0532C" stroke="#1F2A2E" stroke-width="3"/></g>';
  s+='<rect x="'+(px-46)+'" y="'+(py-6)+'" width="92" height="24" rx="8" fill="#DCE8F0" stroke="#1F2A2E" stroke-width="3"/><circle cx="'+px+'" cy="'+py+'" r="9" fill="#FBFCF9" stroke="#1F2A2E" stroke-width="3"/>';
  s+='</g>';
  s+=trainSVG(sc.icon);
  return s+'</svg>';
}

/* ---------- railway page ---------- */
function ptAt(path,s){var L=path.getTotalLength();s=Math.max(0,Math.min(L,s));return path.getPointAtLength(s)}
function placeTrain(svg,idx,s){
  var path=svg.querySelector('.route[data-i="'+idx+'"]');
  function put(g,d){var p=ptAt(path,d),a=ptAt(path,d-3),b=ptAt(path,d+3);var ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;g.setAttribute('transform','translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') rotate('+ang.toFixed(1)+')')}
  put(svg.querySelector('.loco'),s);put(svg.querySelector('.wagon'),s-WAG);
}
function routeLen(svg,idx){return svg.querySelector('.route[data-i="'+idx+'"]').getTotalLength()}
function paintSwitch(svg,sc,sw,at){
  svg.querySelectorAll('.br').forEach(function(g){g.classList.toggle('off',+g.getAttribute('data-i')!==sw)});
  svg.querySelectorAll('.hl').forEach(function(g){g.setAttribute('opacity',+g.getAttribute('data-i')===sw?.22:0)});
  svg.querySelectorAll('.st').forEach(function(g){var i=+g.getAttribute('data-i');g.style.opacity=i===sw?1:.55;g.querySelector('.lamp').setAttribute('opacity',at&&i===sw?1:0)});
  svg.querySelectorAll('.notch').forEach(function(n){n.setAttribute('r',+n.getAttribute('data-i')===sw?14:10)});
  svg.querySelector('.arm').style.transform='rotate('+ANG[sw]+'deg)';
  svg.querySelector('.knob').setAttribute('fill',TR[sc.tracks[sw]].col);
  var lv=svg.querySelector('.lever');lv.setAttribute('aria-valuenow',sw+1);lv.setAttribute('aria-valuetext',TR[sc.tracks[sw]].n);
}

  return '<svg class="thermo" viewBox="0 0 44 96" aria-hidden="true"><rect x="15" y="4" width="14" height="72" rx="7" fill="#FBFCF9" stroke="#1F2A2E" stroke-width="2.5"/>'+
    '<rect x="19" y="'+(72-h)+'" width="6" height="'+(h+8)+'" rx="3" fill="'+col+'"/><circle cx="22" cy="82" r="11" fill="'+col+'" stroke="#1F2A2E" stroke-width="2.5"/>'+
    '<path d="M31 18h5M31 30h5M31 42h5M31 54h5M31 66h5" stroke="#8D958B" stroke-width="2" stroke-linecap="round"/></svg>';
}
function boardHTML(i,id){
  var r=SC[i].res[id],b=BRK[r.b];
  var faces=['worry','meh','rail_smile'].map(function(k,fi){return ic(k,fi+1===r.m?'on':'')}).join('');
  var lv='';for(var n=1;n<=3;n++)lv+='<i class="'+(n<=b[1]?'on':'')+'"></i>';
  return '<div class="board k-'+id+'"><div class="bh">'+dot(id)+'<span><small>終點站</small>'+TR[id].n+'</span></div><div class="bb">'+
    '<p class="bs">'+r.s+'</p>'+
    '<div class="gauges">'+
      '<div class="g"><span class="gt">大家多累</span>'+thermo(r.t)+'<span class="gv">'+TIRED[r.t]+'</span></div>'+
      '<div class="g"><span class="gt">開不開心</span><span class="faces">'+faces+'</span><span class="gv">'+MOOD[r.m]+'</span></div>'+
      '<div class="g"><span class="gt">有人偷偷破壞約定</span><span class="sneak">'+ic(r.b==='none'?'rail_more':'rail_sneak')+'</span><span class="gv">'+b[0]+'</span><span class="lvl">'+lv+'</span></div>'+
    '</div>'+
    '<p class="care">'+ic('rail_sneak')+'<span>'+r.bn+'</span></p></div></div>';
}

function railPage(i){
  var sc=SC[i],ss=st.sc[i];
  app.append(el('p','case','故事'+NUM[i]+'：'+sc.short));
  app.append(el('h2',null,'扳動拉桿，選一條軌道，再按「開車」。'));
  var rb=el('div','rbox');rb.innerHTML=railSVG(sc);var svg=rb.querySelector('svg');app.append(rb);
  app.append(el('p','hint lv',ic('rail_lever')+'點一下左下角的拉桿，或按住拉桿左右拖；也可以點軌道或下面的名稱。'));
  var chips=el('div','chips');var cb=[];
  sc.tracks.forEach(function(id,k){
    var b=button(dot(id)+'<span>'+TR[id].n+'</span><span class="ok"></span>','chip k-'+id,function(){setSw(k)});
    cb.push(b);chips.appendChild(b);
  });
  app.append(chips);
  var ctrl=el('div','card ctrl');var plan=el('p','plan');ctrl.append(plan);
  var btns=el('div','btns');
  var goB=button(ic('rail_train')+'開車','btn',function(){drive()});
  var backB=button(ic('undo')+'倒車','btn soft',function(){reverse()});
  btns.append(goB,backB);ctrl.append(btns);app.append(ctrl);
  var bd=el('div');app.append(bd);
  var tried=el('div','tried');app.append(tried);
  var nx=button('我試好了，下一步','btn',function(){if(ss.tried.length>=2&&!busy)go('pick'+i)});app.append(nx);
  var busy=false;

  function upd(){
    var id=sc.tracks[ss.sw];
    paintSwitch(svg,sc,ss.sw,ss.at);
    cb.forEach(function(b,k){var on=k===ss.sw;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');b.disabled=busy||ss.at;
      b.querySelector('.ok').innerHTML=ss.tried.indexOf(sc.tracks[k])>=0?ic('check')+'試過':''});
    plan.innerHTML=dot(id)+'<span><b>'+(ss.at?'火車停在這一站':'轉轍器現在扳到「'+TR[id].n+'」')+'</b>'+sc.plan[id]+'</span>';
    goB.disabled=busy||ss.at;backB.disabled=busy||!ss.at;
    bd.innerHTML='';
    if(ss.at)bd.innerHTML=boardHTML(i,id);
    else bd.appendChild(el('p','wait',ic('rail_train')+(busy?'火車開出去了……':'扳好拉桿，按「開車」。火車開到哪一站，那一站的看板就會亮起來。')));
    var n=ss.tried.length;
    tried.innerHTML='<span class="hint" style="margin-right:4px">已經試開：</span>'+(n?ss.tried.map(function(t){return '<span class="tag k-'+t+'">'+dot(t)+TR[t].n+'</span>'}).join(''):'<span class="hint">還沒有</span>');
    if(n<2)tried.innerHTML+='<span class="hint" style="width:100%">至少要試開兩條不同的軌道，才能往下（還差 '+(2-n)+' 條）。</span>';
    nx.disabled=busy||n<2;
  }
  function setSw(k){
    if(busy)return;
    if(ss.at){flash();return}
    k=(k+4)%4;if(k===ss.sw)return;ss.sw=k;save(st);upd();
  }
  var fl=null;
  function flash(){var h=app.querySelector('.hint.lv');if(!h)return;h.innerHTML=ic('undo')+'火車還停在終點站。先按「倒車」回來，才能扳轉轍器。';clearTimeout(fl);fl=setTimeout(function(){h.innerHTML=ic('rail_lever')+'點一下左下角的拉桿，或按住拉桿左右拖；也可以點軌道或下面的名稱。'},2600)}
  function anim(from,to,dur,done){
    if(rafId)cancelAnimationFrame(rafId);
    if(reduce){placeTrain(svg,ss.sw,to);done();return}
    svg.classList.add('moving');var t0=null;
    function f(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/dur);var e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      placeTrain(svg,ss.sw,from+(to-from)*e);
      if(p<1)rafId=requestAnimationFrame(f);else{rafId=null;svg.classList.remove('moving');done()}}
    rafId=requestAnimationFrame(f);
  }
  function drive(){
    if(busy||ss.at)return;busy=true;upd();
    anim(START,routeLen(svg,ss.sw),2100,function(){
      busy=false;ss.at=true;var id=sc.tracks[ss.sw];if(ss.tried.indexOf(id)<0)ss.tried.push(id);save(st);upd();
      try{bd.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}catch(e){}
    });
  }
  function reverse(){
    if(busy||!ss.at)return;busy=true;ss.at=false;save(st);upd();
    try{rb.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}catch(e){}
    anim(routeLen(svg,ss.sw),START,1600,function(){busy=false;upd()});
  }
  // lever: tap = next track, drag = choose by angle, keys = up/down
  var lever=svg.querySelector('.lever');var down=false,moved=false,sx=0,sy=0;
  function toSvg(e){var r=svg.getBoundingClientRect();return [(e.clientX-r.left)/r.width*800,(e.clientY-r.top)/r.height*370]}
  function angIdx(e){var p=toSvg(e);var a=Math.atan2(p[0]-PIV[0],PIV[1]-p[1])*180/Math.PI;var best=0,bd2=999;ANG.forEach(function(g,k){var d=Math.abs(g-a);if(d<bd2){bd2=d;best=k}});return best}
  lever.addEventListener('pointerdown',function(e){if(e.button>0)return;down=true;moved=false;sx=e.clientX;sy=e.clientY;try{lever.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
  lever.addEventListener('pointermove',function(e){if(!down)return;if(!moved&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8){moved=true;svg.classList.add('drag')}if(moved)setSw(angIdx(e))});
  function up(e,cancel){if(!down)return;down=false;svg.classList.remove('drag');if(!moved&&!cancel)setSw(ss.sw+1)}
  lever.addEventListener('pointerup',function(e){up(e,false)});
  lever.addEventListener('pointercancel',function(e){up(e,true)});
  lever.addEventListener('keydown',function(e){
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){setSw(Math.max(0,ss.sw-1));e.preventDefault()}
    else if(e.key==='ArrowDown'||e.key==='ArrowRight'){setSw(Math.min(3,ss.sw+1));e.preventDefault()}
    else if(e.key===' '||e.key==='Enter'){setSw(ss.sw+1);e.preventDefault()}});
  svg.querySelectorAll('.tap').forEach(function(p){p.addEventListener('click',function(){setSw(+p.getAttribute('data-i'))})});

  placeTrain(svg,ss.sw,ss.at?routeLen(svg,ss.sw):START);
  upd();
}

/* ---------- value question (no right answer) ---------- */
function pickPage(i){
  var sc=SC[i],ss=st.sc[i];
  app.append(el('p','case','故事'+NUM[i]+'：'+sc.short));
  app.append(el('h2',null,'你最想扳到哪一條？'));
  app.append(el('p','lead','這一題<b>沒有標準答案</b>，每一條都可以選。選好以後，會看到這條路的作用和代價，等一下全班一起討論。'));
  var o=el('div','opts');var bs={};var fb=el('div');
  sc.tracks.forEach(function(id){
    var b=button(dot(id)+'<span class="tx"><span>'+TR[id].n+'</span><small>'+sc.plan[id]+'</small>'+(ss.tried.indexOf(id)>=0?'<em>剛剛試開過</em>':'')+'</span>','btn alt k-'+id,function(){ss.pick=id;save(st);upd()});
    bs[id]=b;o.appendChild(b);
  });
  var last=i===2;
  var nx=button(last?'看看我的三個選擇':'下一個故事','btn',function(){if(ss.pick)go(last?'end':'story'+(i+1))});
  app.append(o,fb,nx);
  function upd(){
    Object.keys(bs).forEach(function(k){bs[k].classList.toggle('pick',ss.pick===k);bs[k].setAttribute('aria-pressed',ss.pick===k?'true':'false')});
    fb.innerHTML='';nx.disabled=!ss.pick;
    if(ss.pick){var r=sc.res[ss.pick];var c=el('div','card');c.append(el('h3',null,dot(ss.pick)+'你選了「'+TR[ss.pick].n+'」'));
      c.append(el('dl','ec','<dt class="e">作用</dt><dd>'+r.e+'</dd><dt class="c">代價</dt><dd>'+r.c+'</dd>'));fb.appendChild(c)}
  }
  upd();
}

/* ---------- end ---------- */
function endPage(){
  app.append(el('h1',null,'做完了！請停在這一頁，等其他同學。'));
  var picks=st.sc.map(function(s){return s.pick});
  var cnt={};picks.forEach(function(p){cnt[p]=(cnt[p]||0)+1});
  var mx=0;Object.keys(cnt).forEach(function(k){if(cnt[k]>mx)mx=cnt[k]});
  var most=mx>=2?Object.keys(cnt).filter(function(k){return cnt[k]===mx})[0]:null;
  var mostTxt=most?dot(most)+TR[most].n+'（'+mx+' 次）':'三個故事選的都不一樣';
  var moreIn=[];picks.forEach(function(p,k){if(p==='more')moreIn.push('故事'+NUM[k])});
  var moreTxt=moreIn.length?'有（'+moreIn.join('、')+'）':'沒有';
  var triedN=st.sc.reduce(function(a,s){return a+s.tried.length},0);
  var rows=SC.map(function(sc,k){return ['故事'+NUM[k]+'：'+sc.short,dot(picks[k])+TR[picks[k]].n]});
  rows.push(['你最常選的軌道',mostTxt]);
  rows.push(['有沒有在任何故事選「繼續加碼」',moreTxt]);
  rows.push(['三個故事一共試開了幾條軌道',triedN+' 條']);
  var c=el('div','card');var tb=el('table','sum');
  tb.innerHTML='<tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>'}).join('')+'</tbody>';
  c.append(tb);app.append(c);
  app.append(el('p','note warm','老師等一下會請大家舉手：每個故事，選「繼續加碼」「約定上限」「跟以前的自己比」「改成一起完成」「想想值不值得比」的，各有幾個人？'));
}

function render(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null}
  app.innerHTML='';
  var s=st.step,m=/^(story|rail|pick)([0-2])$/.exec(s);
  if(s==='intro')intro();
  else if(m&&m[1]==='story')storyPage(+m[2]);
  else if(m&&m[1]==='rail')railPage(+m[2]);
  else if(m&&m[1]==='pick'&&st.sc[+m[2]].tried.length>=2)pickPage(+m[2]);
  else if(s==='end'&&st.sc.every(function(x){return x.pick}))endPage();
  else{st=fresh();save(st);intro()}
}
render();
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}st=fresh();save(st);render();try{window.scrollTo(0,0)}catch(e){}}});
})();
</script>
