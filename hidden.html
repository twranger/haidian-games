<meta charset="utf-8">
<script src="fresh.js"></script>
<title>找出藏鏡人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one tablet screen per round — a 12-month line chart of two things that rise and fall together; tap suspect cards to overlay their line, then accuse one. Score kept on the device. Single light classroom look on purpose. */
:root{
  --bg:#EFF1EC; --card:#FBFCF8; --ink:#1F2A2E; --muted:#56605C; --line:#D3D8CF;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6}
.wrap{min-height:100%;max-width:900px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.case{font-size:clamp(18px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0;font-size:clamp(17px,2.4vw,22px);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:26px;height:6px;border-radius:3px}
svg.chart{width:100%;height:auto}
.sus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{font:inherit;font-size:clamp(20px,3vw,27px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.4}
.btn:disabled{background:#A7B0AE;cursor:default}
.s{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left}
.s[aria-pressed="true"]{border-color:var(--gold);background:#FBF1DC}
.s.no{border-color:var(--rust);background:#F6E4DC;opacity:.75}
.s.yes{border-color:var(--good);background:#E3F1E8}
.s:disabled{background:var(--card);color:var(--muted)}
.s.yes:disabled{background:#E3F1E8;color:var(--ink)}
.fb{display:flex;flex-direction:column;gap:12px}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.verdict{margin:0;font-size:clamp(23px,3.4vw,32px);font-weight:900}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--rust)}
.explain{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.7vw,25px);line-height:1.7;margin:0}
.big{font-size:clamp(70px,14vw,130px);font-weight:900;line-height:1.1;margin:0;color:var(--sea);font-variant-numeric:tabular-nums}
.small{font-size:clamp(15px,2vw,18px);color:var(--muted);margin:0}
@media (max-width:480px){.sus{grid-template-columns:1fr}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
var app=document.getElementById('app');
var KEY='hidden-cause-v1';
var M=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
// 0–100 的相對高低（課堂自編的示意資料，不是真實統計）
var HOT=[10,15,35,55,75,90,100,100,90,70,40,15];
var COLD=HOT.map(function(v){return 100-v});
var RAIN=[10,15,20,30,70,90,85,100,70,20,10,10];
var SCHOOL=[60,30,100,95,100,90,10,10,95,100,100,100];
var EXAM=[60,0,0,100,0,100,0,0,0,100,0,60];
var FLU=[100,95,70,40,20,10,10,10,15,30,60,90];
var MOVIE=[90,100,40,50,40,45,95,100,40,45,40,60];
var R=[
 {a:'冰品賣出的數量',b:'救生員吹哨子的次數',A:[12,18,30,52,78,88,100,96,86,66,38,14],B:[0,5,20,50,70,92,100,98,80,45,10,0],
  sus:[{n:'天氣有多熱',d:HOT,ok:true},{n:'上學的天數',d:SCHOOL},{n:'感冒的人數',d:FLU},{n:'月考的次數',d:EXAM}],
  e:'「天氣有多熱」的線，和兩條線一起高、一起低。天氣熱，大家想吃冰，下水玩的人也多，救生員就要多吹哨子。吃冰不會讓人不守規矩。'},
 {a:'暖暖包賣出的數量',b:'熱可可賣出的杯數',A:[100,92,60,35,15,5,0,0,8,30,62,95],B:[95,100,68,40,22,10,5,6,12,35,58,90],
  sus:[{n:'電影院的人數',d:MOVIE},{n:'天氣有多冷',d:COLD,ok:true},{n:'上學的天數',d:SCHOOL},{n:'下雨的天數',d:RAIN}],
  e:'「天氣有多冷」的線，和兩條線一起高、一起低。天氣冷，大家買暖暖包，也想喝熱可可。不是暖暖包讓人想喝熱可可。'},
 {a:'雨傘賣出的數量',b:'雨鞋賣出的數量',A:[8,12,22,35,72,92,80,100,66,25,12,8],B:[5,15,18,30,65,95,88,96,70,18,8,10],
  sus:[{n:'月考的次數',d:EXAM},{n:'電影院的人數',d:MOVIE},{n:'下雨的天數',d:RAIN,ok:true},{n:'上學的天數',d:SCHOOL}],
  e:'「下雨的天數」的線，和兩條線一起高、一起低。下雨天多，雨傘和雨鞋都賣得好。不是買了雨傘，才讓人去買雨鞋。'},
 {a:'來七股看黑面琵鷺的遊客',b:'路邊蚵仔攤的生意',A:[100,90,55,15,5,0,0,0,5,30,75,95],B:[95,92,60,25,12,10,8,10,12,35,70,100],
  sus:[{n:'天氣有多熱',d:HOT},{n:'下雨的天數',d:RAIN},{n:'月考的次數',d:EXAM},{n:'找不到藏鏡人：遊客真的會去買蚵仔',d:null,ok:true}],
  e:'這一回合，沒有一條線剛好吻合。黑面琵鷺冬天才來七股，遊客看完鳥，順便買了蚵仔。<br>有時候真的是 A 造成 B，只是還要再查一查，例如問問蚵仔攤的老闆。'}
];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
if(location.hash==='#reset'){save(null)}
var st=load()||{i:0,s:0,tries:[]};
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function path(d,x0,w,y0,h){return d.map(function(v,k){return (k?'L':'M')+(x0+k*w/11).toFixed(1)+' '+(y0+h-v/100*h).toFixed(1)}).join(' ')}
function chart(r,over){
  var x0=60,w=820,y0=20,h=260;
  var s='<svg class="chart" viewBox="0 0 900 330" role="img" aria-label="一年 12 個月的折線圖">';
  for(var g=0;g<=4;g++){var y=y0+g*h/4;s+='<line x1="'+x0+'" y1="'+y+'" x2="'+(x0+w)+'" y2="'+y+'" stroke="#E2E6DE" stroke-width="2"/>'}
  s+='<text x="20" y="'+(y0+12)+'" font-size="18" fill="#56605C">多</text><text x="20" y="'+(y0+h)+'" font-size="18" fill="#56605C">少</text>';
  M.forEach(function(m,k){s+='<text x="'+(x0+k*w/11)+'" y="318" text-anchor="middle" font-size="18" fill="#56605C">'+m+'</text>'});
  if(over&&over.d)s+='<path d="'+path(over.d,x0,w,y0,h)+'" fill="none" stroke="#B7862B" stroke-width="7" stroke-dasharray="14 10" stroke-linecap="round"/>';
  s+='<path d="'+path(r.A,x0,w,y0,h)+'" fill="none" stroke="#205E86" stroke-width="6" stroke-linejoin="round"/>';
  s+='<path d="'+path(r.B,x0,w,y0,h)+'" fill="none" stroke="#A8441A" stroke-width="6" stroke-linejoin="round"/>';
  return s+'</svg>';
}
function legend(r,over){
  var l='<span><i style="background:#205E86"></i>'+r.a+'</span><span><i style="background:#A8441A"></i>'+r.b+'</span>';
  if(over&&over.d)l+='<span><i style="background:repeating-linear-gradient(90deg,#B7862B 0 8px,transparent 8px 12px)"></i>'+over.n+'</span>';
  return el('p','legend',l);
}
function intro(){
  app.innerHTML='';
  var c=el('div','card');
  c.append(el('p','lead','一共 4 回合。每一回合，你會看到兩件事在一年 12 個月裡，一起變多、一起變少。'),
           el('p','lead','請你一張一張翻開「嫌疑人」卡片，看看誰的線也跟著一起變，把躲在背後的「藏鏡人」找出來。'),
           el('p','small','圖上的線是課堂自編的示意資料，只比高低，不是真實統計。'));
  var b=el('button','btn','開始找藏鏡人');b.type='button';b.addEventListener('click',round);
  app.append(el('h1',null,'找出藏鏡人'),c,b);
}
function round(){
  var n=st.i,r=R[n],sel=null,tries=0,done=false;app.innerHTML='';
  var cs=el('p','case','<span>第 <b>'+(n+1)+'</b> 回合，共 4 回合</span><span>一次就找到 <b>'+st.s+'</b> 回合</span>');
  var h=el('h2',null,'「'+r.a+'」和「'+r.b+'」一起變多、一起變少。<br>背後是誰在推動它們？');
  var c=el('div','card');var box=el('div');var lg=el('div');c.append(box,lg);
  function draw(){box.innerHTML=chart(r,sel);lg.innerHTML='';lg.appendChild(legend(r,sel))}
  var tip=el('p','lead','先點嫌疑人卡片，看看它的線（黃色虛線）。覺得是它，再按「就是它！」');
  var g=el('div','sus');var bs=[];
  r.sus.forEach(function(s,k){var b=el('button','btn s',s.n);b.type='button';b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){if(done||b.classList.contains('no'))return;sel=s;bs.forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');go.disabled=false;draw()});bs.push(b);g.appendChild(b)});
  var go=el('button','btn','就是它！');go.type='button';go.disabled=true;
  var fb=el('div','fb');
  go.addEventListener('click',function(){
    if(!sel||done)return;tries++;
    var k=r.sus.indexOf(sel);
    if(sel.ok){done=true;if(tries===1)st.s++;st.tries[n]=tries;st.i++;save(st);
      bs[k].classList.add('yes');go.disabled=true;bs.forEach(function(x){x.disabled=true});
      fb.innerHTML='';fb.append(el('p','verdict ok',tries===1?'一次就找到了！':'找到了！'),el('p','explain',r.e));
      var nx=el('button','btn',st.i>=R.length?'看結果':'下一回合');nx.type='button';nx.addEventListener('click',function(){st.i>=R.length?end():round()});fb.appendChild(nx);nx.scrollIntoView({behavior:'smooth',block:'end'});
    }else{bs[k].classList.add('no');bs[k].setAttribute('aria-pressed','false');sel=null;go.disabled=true;draw();
      fb.innerHTML='';fb.appendChild(el('p','verdict no','不是它。它的線和兩條線沒有一起高、一起低，再找找看！'))}
  });
  draw();app.append(cs,h,c,tip,g,go,fb);
}
function end(){
  app.innerHTML='';
  var c=el('div','card');c.append(el('p','lead','4 回合裡，你一次就找到藏鏡人的有'),el('p','big',st.s+' / 4 回合'));
  c.appendChild(el('p','lead','第 4 回合沒有藏鏡人：有時候兩件事真的是誰造成誰，還要再查一查。'));
  app.append(el('h2',null,'全部找完了！請停在這一頁，等其他同學。'),c);
}
if(st.i>=R.length)end();else if(st.i>0)round();else intro();
})();
</script>
