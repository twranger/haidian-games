<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="fresh.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>掉了票，還是掉了錢？・全班連線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="live.js"></script>
<script src="room.js"></script>
<style>
.sc{background:#fff;border:3px solid #E3DED7;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.sc p{font-size:clamp(20px,4.2vw,26px);font-weight:700;line-height:1.6}
.sc .tg{align-self:flex-start;font-size:18px;font-weight:900;color:#fff;border-radius:999px;padding:4px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{font-size:clamp(22px,4.6vw,30px);padding:16px 4px}
.rs .btn{font-size:clamp(19px,4vw,24px);padding:14px 10px;text-align:left}
.rs{display:flex;flex-direction:column;gap:8px}
.huge{font-size:clamp(46px,6.4vw,90px);font-weight:900;line-height:1.15}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hb{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.hb .lb{font-size:22px;font-weight:900;display:flex;justify-content:space-between}
.hb .bw{background:#EEE9E1;border-radius:10px;height:40px;overflow:hidden}
.hb .bw i{display:block;height:100%;border-radius:10px}
</style>
</head>
<body>
<script>
/* 依進場座號輪流：一半拿到「掉了 300 元現金」，一半拿到「掉了 300 元的電影票」。答完自己的，再看另一題 */
var SC={cash:{t:'掉了錢',c:'#2A6F68',s:'你決定今天去看一部電影，票價 <b>300 元</b>，打算到電影院再買。走到售票口，你發現錢包裡<b>掉了 300 元現金</b>，找不回來了。你身上還有足夠的錢可以買票。'},
 ticket:{t:'掉了票',c:'#D95D39',s:'你已經花 <b>300 元</b>，先買好了一張紙本電影票。走到入口，你發現<b>電影票掉了</b>，找不回來，也不能補印。要看，就得再花 300 元買一張。你身上還有足夠的錢。'}};
var Q='你還會花 300 元買票，進去看這部電影嗎？';
var WHY=[['a','看電影的錢已經花過了，再買等於看一部電影花 600 元'],['b','掉的錢和看電影是兩回事，想看就買'],['c','反正已經少了 300 元，看不看要另外想'],['d','其他理由']];
var STUDY={cash:88,ticket:46};
function players(H){return Object.keys(H.seats).length}
function grp(g,seat){var i=(g.order||[]).indexOf(+seat);return (i<0?0:i)%2===0?'cash':'ticket'}
function other(x){return x==='cash'?'ticket':'cash'}
function scHTML(k,tag){var x=SC[k];return '<div class="sc">'+(tag?'<span class="tg" style="background:'+x.c+'">'+tag+'</span>':'')+'<p>'+x.s+'</p></div>'}
function hbar(lab,y,n,col,study){var p=n?Math.round(y/n*100):0;return '<div class="hb"><span class="lb"><span>'+lab+'</span><span style="color:'+col+'">'+(n?p+'%':'—')+'</span></span><div class="bw"><i style="width:'+p+'%;background:'+col+'"></i></div><span style="font-size:18px;color:#64748B">'+(study?'1981 年研究':y+' / '+n+' 人說「會買」')+'</span></div>'}
function stats(g){var o={cash:{y:0,n:0},ticket:{y:0,n:0}},o2={cash:{y:0,n:0},ticket:{y:0,n:0}},why={a:0,b:0,c:0,d:0},chg=0;
 Object.keys(g.a||{}).forEach(function(k){var A=g.a[k],G=grp(g,k);o[G].n++;if(A.v1)o[G].y++;var G2=other(G);o2[G2].n++;if(A.v2)o2[G2].y++;if(why[A.w]!=null)why[A.w]++;if(A.v1!==A.v2)chg++});return {o:o,o2:o2,why:why,chg:chg}}
ROOM.start({
 key:'lostticket',title:'掉了票，還是掉了錢？',kick:'第 7 節・全班連線',studentUrl:'lostticket.html',
 rules:'<p>你要去看一部 <b>300 元</b>的電影，可是出了一點意外。</p><p>平板會給你一個情境，選你<b>真的會怎麼做</b>。沒有對錯。</p>',
 init:function(H){H.g={a:{}}},
 onStart:function(H){H.g={a:{},t0:Date.now(),order:Object.keys(H.seats).map(Number).sort(function(a,b){return a-b})};H.ph='play'},
 pub:function(H){var g=H.g;return {g:{t0:g.t0,order:g.order}}},
 onMsg:function(H,d,seat){if(d.t==='a'&&H.ph==='play'){H.g.a[seat]={v1:d.v1?1:0,v2:d.v2?1:0,w:['a','b','c','d'].indexOf(d.w)>=0?d.w:'d'};return true}},
 act:{reveal:function(H){H.ph='reveal'},both:function(H){H.ph='both'}},
 bar:function(H){if(H.ph==='play')return '<button class="btn" data-act="reveal">公布第一次的選擇</button>';if(H.ph==='reveal')return '<button class="btn" data-act="both">看完兩題以後呢？</button>';return ''},
 hostView:function(H){var g=H.g,N=players(H),h='',S=stats(g);
  if(H.ph==='play')h+='<div class="card dark"><p class="huge">要去看 300 元的電影……</p><p class="stat">可是出了一點意外。在平板上選你真的會怎麼做。</p></div><div class="card"><p class="stat">已經送出：'+Object.keys(g.a).length+' / '+N+' 人</p></div>';
  else if(H.ph==='reveal'){h+='<div class="card warm"><p class="huge" style="font-size:clamp(34px,4.4vw,60px)">其實全班拿到的情境不一樣！</p><p class="stat">一半的人<b style="color:#2A6F68">掉了 300 元現金</b>，一半的人<b style="color:#D95D39">掉了 300 元的電影票</b>。兩種都是少了 300 元。</p></div>'+
   '<div class="cmp"><div class="card"><h2>我們班：還會買票嗎？</h2>'+hbar('掉了錢的人',S.o.cash.y,S.o.cash.n,'#2A6F68')+hbar('掉了票的人',S.o.ticket.y,S.o.ticket.n,'#D95D39')+'</div>'+
   '<div class="card"><h2>1981 年研究（電影換成看戲，10 美元）</h2>'+hbar('掉了 10 美元現金（183 人）',88,100,'#2A6F68',1)+hbar('掉了 10 美元的票（200 人）',46,100,'#D95D39',1)+'</div></div>'+
   '<div class="card dark"><p class="stat">一樣少了 300 元，為什麼「掉了票」的人比較不想再買？</p><p style="font-size:22px">這是我們班一次的結果，不一定每一班都一樣。</p></div>'}
  else{var W=S.why,T=Math.max(1,W.a+W.b+W.c+W.d);
   h+='<div class="cmp"><div class="card"><h2>看到另一題時，大家怎麼選？</h2>'+hbar('原本掉錢、這次看掉票',S.o2.ticket.y,S.o2.ticket.n,'#D95D39')+hbar('原本掉票、這次看掉錢',S.o2.cash.y,S.o2.cash.n,'#2A6F68')+'<p class="stat">兩題選得不一樣的人：'+S.chg+' 人</p></div>'+
   '<div class="card"><h2>大家的理由</h2>'+WHY.map(function(x){return hbar(x[1],W[x[0]],T,'#7C5CC4')}).join('')+'</div></div>'+
   '<div class="card dark"><p class="stat">「看電影的錢已經花過了」：我們心裡好像有一個<b style="color:#F2A65A">「看電影」的抽屜</b>。票掉了，就像這個抽屜已經花掉 300 元。</p></div>'}
  return h},
 studentView:function(ST,me,api){var g=ST.g||{},k='l'+g.t0,L=api.local[k]||{},G=grp(g,me),h='';
  if(ST.ph==='play'){
   if(L.sent)h+='<h1>送出了！</h1><p class="lead">看大螢幕，等老師公布。</p>';
   else if(L.v1==null)h+='<h1>出了一點意外……</h1>'+scHTML(G)+'<p class="lead"><b>'+Q+'</b></p><div class="two"><button class="btn gh" data-act="v1" data-arg="1">會，再買票看</button><button class="btn gh" data-act="v1" data-arg="0">不會，不看了</button></div>';
   else if(L.w==null)h+='<h1>你為什麼這樣選？</h1><p class="lead">你選了「'+(L.v1?'會，再買票看':'不會，不看了')+'」。最接近你的想法是：</p><div class="rs">'+WHY.map(function(x){return '<button class="btn gh" data-act="w" data-arg="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
   else if(L.v2==null)h+='<h1>換一個情境</h1><p class="lead">另一半的同學，拿到的是這一題：</p>'+scHTML(other(G))+'<p class="lead"><b>如果是你，'+Q+'</b></p><div class="two"><button class="btn gh" data-act="v2" data-arg="1">會，再買票看</button><button class="btn gh" data-act="v2" data-arg="0">不會，不看了</button></div>';
   else h+='<h1>都選好了</h1><div class="card"><p class="lead">'+SC[G].t+'：'+(L.v1?'會買':'不買')+'<br>'+SC[other(G)].t+'：'+(L.v2?'會買':'不買')+'</p></div><button class="btn" data-act="send">送出</button>'}
  else if(ST.ph==='reveal'||ST.ph==='both')h+='<h1>看大螢幕！</h1><div class="card"><p class="lead">你先拿到的是「'+SC[G].t+'」，你選'+(L.v1?'「會買」':'「不買」')+'；另一題你選'+(L.v2?'「會買」':'「不買」')+'。</p></div>';
  else h+='<h1>等老師開始</h1><p class="lead">等一下要去看一部 300 元的電影。</p>';
  return h},
 sact:(function(){function upd(ST,api,f){var k='l'+(ST.g||{}).t0,L=api.local[k]||{};f(L);var o={};o[k]=L;api.local=o;api.save()}
  return {v1:function(ST,me,api,v){upd(ST,api,function(L){L.v1=+v})},w:function(ST,me,api,v){upd(ST,api,function(L){L.w=v})},v2:function(ST,me,api,v){upd(ST,api,function(L){L.v2=+v})},
  send:function(ST,me,api){var L=api.local['l'+ST.g.t0]||{};if(L.v1==null||L.v2==null||L.w==null)return;api.send({t:'a',v1:L.v1,v2:L.v2,w:L.w});upd(ST,api,function(L){L.sent=1})}}})()
});
</script>
</body>
</html>
