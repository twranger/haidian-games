<meta charset="utf-8">
<script src="fresh.js"></script>
<title>封起來的信封</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: guess 4 quiz questions and seal each answer in an envelope (CSS flap + wax seal) → answers revealed one by one while envelopes stay sealed → recall what you sealed + confidence → tap wax seals to open, compare sealed vs remembered → summary for a show of hands. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5;
  --paper:#F3E6C8; --paper2:#E8D6AE; --wax:#9E2B25;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:16px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.q{font-size:clamp(23px,3.4vw,31px);font-weight:900;line-height:1.5;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700}
.btn.alt.pick{border-color:var(--gold);background:#FBF1DC}
.btn.alt.right{border-color:var(--good);background:#E3F1E7}
.btn.alt b{display:inline-block;min-width:1.6em;color:var(--sea)}
.btn:disabled{cursor:default;opacity:.45}
.btn.alt:disabled{opacity:1}
.btn:focus-visible,button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.conf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.conf .btn.alt{text-align:center;padding:12px 6px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:#FBF1DC}
.sub{font-size:clamp(19px,2.4vw,22px);color:var(--muted);margin:0}

/* ---------- envelope ---------- */
.env{position:relative;width:min(100%,300px);aspect-ratio:3/2;margin:0 auto;perspective:900px}
.env:not(.sm){margin-top:min(46%,138px)}
.pair .env:not(.sm){margin-top:min(46%,120px)}
.env.sm{width:100%}
.env .back{position:absolute;inset:0;background:var(--paper2);border-radius:10px;box-shadow:0 4px 10px rgba(31,42,46,.18)}
.env .letter{position:absolute;left:8%;right:8%;top:10%;height:80%;background:#fff;border:2px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:var(--ink);transition:transform .7s ease;z-index:1;text-align:center;line-height:1.3;padding:4px}
.env .letter .big{font-size:clamp(34px,6vw,54px);color:var(--sea);line-height:1.05}
.env .letter .small{font-size:clamp(16px,2vw,19px);color:var(--muted)}
.env .pocket{position:absolute;inset:0;border-radius:10px;background:var(--paper);clip-path:polygon(0 30%,50% 62%,100% 30%,100% 100%,0 100%);z-index:2}
.env .flap{position:absolute;left:0;right:0;top:0;height:64%;background:#DCC28C;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .6s ease, z-index 0s .3s;z-index:3;border-radius:10px 10px 0 0}
.env .lab{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-weight:900;font-size:clamp(19px,2.6vw,24px);color:#5B4520;z-index:2}
.env .seal{position:absolute;left:50%;top:58%;width:19%;aspect-ratio:1;min-width:44px;transform:translate(-50%,-50%);border-radius:50%;border:0;background:radial-gradient(circle at 35% 35%,#C4463E,var(--wax) 60%,#6E1B17);color:#F6D9C9;font:inherit;font-weight:900;font-size:clamp(19px,2.6vw,24px);display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 2px 0 #5A1512,0 0 0 4px rgba(158,43,37,.25);padding:0;transition:transform .35s ease,opacity .35s ease}
.env button.seal{cursor:pointer}
.env button.seal:hover{transform:translate(-50%,-50%) scale(1.08)}
/* states */
.env.opened .flap{transform:rotateX(180deg);z-index:0;transition:transform .6s ease, z-index 0s 0s}
.env.opened .letter{transform:translateY(-38%)}
.env.opened .seal{opacity:0;transform:translate(-50%,-50%) scale(.3);pointer-events:none}
.env.closed .letter{transform:translateY(8%);opacity:0}
.env.closed .seal{opacity:1}
.env.empty .seal{opacity:0;transform:translate(-50%,-50%) scale(2.2);pointer-events:none}
.env.empty .lab{opacity:0}
.env.empty .flap{transform:rotateX(180deg);z-index:0}
.env.opened .lab{opacity:0}
.env.stamp .seal{animation:stamp .45s ease .55s both}
.env.stamp .lab{animation:fadein .4s ease .9s both}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(.9)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.row4 .env .lab{font-size:clamp(14px,2vw,19px)}
.row4 .env .seal{min-width:30px;font-size:clamp(14px,2vw,19px)}
.minirow{display:flex;flex-direction:column;gap:6px}

/* open step */
.pair{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:center}
.cmp{display:flex;flex-direction:column;gap:6px;font-size:clamp(19px,2.5vw,23px)}
.cmp .k{color:var(--muted);font-weight:700}
.tag{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:900;font-size:clamp(17px,2.2vw,20px);align-self:flex-start}
.tag.move{background:#FBF1DC;color:#7A4E07;border:2px solid var(--gold)}
.tag.ok{background:#E3F1E7;color:#1E5A37;border:2px solid var(--good)}
.tag.same{background:var(--note);color:var(--sea);border:2px solid #BCD3E2}
.tag.diff{background:#F1EEE8;color:var(--muted);border:2px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.6vw,24px)}
td{padding:10px 8px;border-bottom:2px solid var(--line);vertical-align:top} td.n{text-align:right;font-weight:900;white-space:nowrap;color:var(--rust)}
.final{font-size:clamp(21px,3vw,28px);font-weight:900;line-height:1.6;margin:0;color:var(--sea)}
@media (max-width:620px){.pair{grid-template-columns:1fr}.pair .env{width:min(100%,260px)}.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.env *{transition:none!important;animation:none!important}}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
var ICI={"check": "<path d=\"M5 12.5l4.5 4.5L19 7.5\"/>"};
function ic(k,c){return '<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICI[k]+'</svg>'}

var app=document.getElementById('app');
var KEY='sealed-envelope-v1';
var L=['A','B','C','D'];
var Q=[
 {q:'黑面琵鷺冬天來台江，夏天回去哪裡生寶寶？',o:['日本','朝鮮半島','菲律賓','澳洲'],a:1,
  e:'黑面琵鷺大多在朝鮮半島西海岸的無人小島上生寶寶。每年秋天，牠們再飛來台江、七股的溼地過冬。'},
 {q:'招潮蟹那支特別大的螯，誰才有？',o:['公的母的都有','只有公的有','只有母的有','只有小時候有'],a:1,
  e:'只有公的招潮蟹有一支特別大的螯，牠會揮動大螯吸引母蟹，也用它跟別的公蟹比劃。母蟹的兩支螯都小小的，用來把泥巴裡的食物送進嘴巴。'},
 {q:'彈塗魚離開水，除了用鰓，還可以靠什麼幫忙呼吸？',o:['皮膚','尾巴','鰭','眼睛'],a:0,
  e:'彈塗魚的皮膚只要保持溼溼的，就能吸進空氣裡的氧氣；牠也會用嘴巴和喉嚨裡面幫忙呼吸。所以牠常常在泥灘上打滾，讓身體保持溼潤。'},
 {q:'台江的水筆仔，種子在哪裡就開始發芽？',o:['掉進泥巴以後','還掛在媽媽樹上的時候','漂在海上的時候','被鳥吃下去以後'],a:1,
  e:'水筆仔的種子還掛在媽媽樹上，就已經發芽，長成一根像毛筆的小苗，所以叫「胎生苗」。小苗掉下來以後，會插進泥巴或漂到別的地方再長大。'}
];
var CF=['很確定','有點確定','不確定'];

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function rnd4(){var a=new Uint8Array(1);crypto.getRandomValues(a);return a[0]%4}
function fresh(){return {ph:0,i:0,k:[rnd4(),rnd4(),rnd4(),rnd4()],s:[],rc:[],cf:[],op:[false,false,false,false],sealing:false}}
var st=load()||fresh();
/* sealed answers are stored lightly scrambled, so the page itself never shows them before the envelopes are opened */
function seal(i,v){st.s[i]=(v+st.k[i])%4}
function unseal(i){return st.s[i]==null?null:(st.s[i]-st.k[i]+4)%4}

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function btn(cls,html,fn){var b=el('button',cls,html);b.type='button';if(fn)b.addEventListener('click',fn);return b}
function envelope(n,state,letterHTML,extra){
  var e=el('div','env '+state+(extra?' '+extra:''));
  e.append(el('div','back'),el('div','letter',letterHTML||''),el('div','pocket'),el('div','flap'),el('div','seal','封'),el('div','lab','第 '+n+' 題'));
  return e;
}
function sealedRow(){
  var r=el('div','row4');for(var k=0;k<4;k++)r.appendChild(envelope(k+1,'closed sm'));return r;
}
function go(){window.scrollTo(0,0);render()}
function render(){
  app.innerHTML='';
  if(st.ph===0)intro();else if(st.ph===1)guess();else if(st.ph===2)reveal();else if(st.ph===3)recall();else if(st.ph===4)opening();else end();
}

function intro(){
  var c=el('div','card');
  c.append(el('p','lead','接下來有 4 題台江的小問題。每一題，請你先選一個答案，再把答案封進信封。'),
           el('p','lead','信封一封起來，就看不到裡面寫什麼，也不能再改了。等一下會發生什麼事，做到就知道！'));
  app.append(el('h1',null,'封起來的信封'),envelope(1,'opened','<span class="small">你的答案</span><span class="big">?</span>'),c,
    btn('btn','開始',function(){st.ph=1;st.i=0;save(st);go()}));
}

function guess(){
  var i=st.i,q=Q[i];
  app.append(el('p','case','猜猜看・第 '+(i+1)+' 題，共 4 題'));
  if(st.s[i]!=null){ /* already sealed */
    app.append(el('h2',null,'第 '+(i+1)+' 題的答案封好了。'),envelope(i+1,'closed'),
      el('p','sub','信封已經封起來，看不到、也不能改了。'),
      btn('btn',i<3?'下一題':'4 題都封好了，看答案',function(){if(i<3){st.i++}else{st.ph=2;st.i=0}save(st);go()}));
    return;
  }
  var c=el('div','card');c.appendChild(el('p','q',q.q));
  var g=el('div','opts');var pick=null;
  var sb=btn('btn','把答案封進信封');sb.disabled=true;
  q.o.forEach(function(t,k){var b=btn('btn alt','<b>'+L[k]+'</b>'+t,function(){
    Array.prototype.forEach.call(g.children,function(x){x.classList.remove('pick')});b.classList.add('pick');pick=k;sb.disabled=false});g.appendChild(b)});
  c.appendChild(g);
  app.append(c,el('p','sub','選好以後，按下面的按鈕。封起來就不能改了喔。'),sb);
  sb.addEventListener('click',function(){
    if(pick==null)return;
    seal(i,pick);save(st);
    app.innerHTML='';
    app.append(el('p','case','猜猜看・第 '+(i+1)+' 題，共 4 題'),el('h2',null,'正在封信封……'));
    var e=envelope(i+1,'opened','<span class="small">我的答案</span><span class="big">'+L[pick]+'</span>');
    app.appendChild(e);
    var tip=el('p','sub','');app.appendChild(tip);
    var nx=btn('btn',i<3?'下一題':'4 題都封好了，看答案',function(){if(i<3){st.i++}else{st.ph=2;st.i=0}save(st);go()});
    nx.style.visibility='hidden';app.appendChild(nx);
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      e.className='env empty';
      e.querySelector('.letter').style.transform='translateY(8%)';
      setTimeout(function(){e.className='env closed stamp';e.querySelector('.letter').innerHTML='';},700);
      setTimeout(function(){app.querySelector('h2').textContent='第 '+(i+1)+' 題的答案封好了。';tip.textContent='蠟封蓋好了，看不到、也不能改了。';nx.style.visibility='visible';},1700);
    })});
  });
}

function reveal(){
  var i=st.i,q=Q[i];
  app.append(el('p','case','公布答案・第 '+(i+1)+' 題，共 4 題'));
  var m=el('div','minirow');m.append(sealedRow(),el('p','sub','4 個信封都還封著，先不要打開。'));app.appendChild(m);
  var c=el('div','card');c.appendChild(el('p','q',q.q));
  var g=el('div','opts');
  q.o.forEach(function(t,k){var b=btn('btn alt'+(k===q.a?' right':''),'<b>'+L[k]+'</b>'+t+(k===q.a?'　'+ic('check')+' 答案':''));b.disabled=true;g.appendChild(b)});
  c.append(g,el('p','note',q.e));
  app.append(c,btn('btn',i<3?'看下一題的答案':'4 題答案都看完了',function(){if(i<3){st.i++}else{st.ph=3;st.i=0}save(st);go()}));
}

function recall(){
  var i=st.i,q=Q[i];
  app.append(el('p','case','回想・第 '+(i+1)+' 題，共 4 題'),
    el('h2',null,'先不要打開信封。你剛剛封進去的是哪一個？'));
  var top=el('div','pair');var re=envelope(i+1,'closed sm');re.style.maxWidth='220px';top.append(re,el('p','sub','請照你「記得」的選。想不起來也沒關係，選最像的那一個。'));app.appendChild(top);
  var c=el('div','card');c.appendChild(el('p','q',q.q));
  var g=el('div','opts');
  var nx=btn('btn',i<3?'下一題':'回想完了，去拆信封',function(){if(st.rc[i]==null||st.cf[i]==null)return;if(i<3){st.i++}else{st.ph=4}save(st);go()});
  function upd(){nx.disabled=(st.rc[i]==null||st.cf[i]==null)}
  q.o.forEach(function(t,k){var b=btn('btn alt'+(st.rc[i]===k?' pick':''),'<b>'+L[k]+'</b>'+t,function(){
    Array.prototype.forEach.call(g.children,function(x){x.classList.remove('pick')});b.classList.add('pick');st.rc[i]=k;save(st);upd()});g.appendChild(b)});
  c.appendChild(g);
  var c2=el('div','card');c2.appendChild(el('p','q','你有多確定？'));
  var cg=el('div','conf');
  CF.forEach(function(t,k){var b=btn('btn alt'+(st.cf[i]===k?' pick':''),t,function(){
    Array.prototype.forEach.call(cg.children,function(x){x.classList.remove('pick')});b.classList.add('pick');st.cf[i]=k;save(st);upd()});cg.appendChild(b)});
  c2.appendChild(cg);
  upd();
  app.append(c,c2,nx);
}

function kind(i){
  var s=unseal(i),r=st.rc[i],a=Q[i].a;
  if(s===a)return r===a?'ok':'okdiff';
  if(r===a)return 'move';
  return r===s?'same':'diff';
}
var TAG={ok:['ok','本來就猜對，也記得一樣'],okdiff:['ok','本來就猜對（但記成別的了）'],move:['move','記得的變成了正確答案，封進去的其實不是'],same:['same','記得和封進去的一樣'],diff:['diff','記得的和封進去的不一樣']};
function opening(){
  app.append(el('p','case','拆信封'),el('h2',null,'點每個信封上的蠟封，把它打開。'));
  var list=el('div','minirow');list.style.gap='14px';
  var done=el('div','minirow');done.style.gap='14px';
  Q.forEach(function(q,i){
    var s=unseal(i);
    var c=el('div','card');var p=el('div','pair');
    var e=envelope(i+1,st.op[i]?'opened':'closed','<span class="small">封進去的</span><span class="big">'+(st.op[i]?L[s]:'')+'</span>');
    var sealEl=e.querySelector('.seal');var sb=btn('seal','封');sb.setAttribute('aria-label','打開第 '+(i+1)+' 題的信封');e.replaceChild(sb,sealEl);
    var cmp=el('div','cmp');
    function fill(){
      cmp.innerHTML='';
      cmp.append(el('p','q',(i+1)+'. '+q.q.replace(/？$/,'？')));
      cmp.lastChild.style.fontSize='clamp(19px,2.5vw,23px)';
      cmp.append(el('div',null,'<span class="k">封進去的答案：</span><b>'+(st.op[i]?L[s]+' '+q.o[s]:'？（還封著）')+'</b>'),
                 el('div',null,'<span class="k">你記得的答案：</span><b>'+L[st.rc[i]]+' '+q.o[st.rc[i]]+'</b>（'+CF[st.cf[i]]+'）'),
                 el('div',null,'<span class="k">正確答案：</span>'+L[q.a]+' '+q.o[q.a]));
      if(st.op[i]){var t=TAG[kind(i)];cmp.append(el('span','tag '+t[0],t[1]))}
    }
    fill();
    sb.addEventListener('click',function(){
      if(st.op[i])return;
      st.op[i]=true;save(st);
      e.querySelector('.letter .big').textContent=L[s];
      e.className='env opened';fill();
      if(st.op.every(Boolean))setTimeout(finish,500);
    });
    p.append(e,cmp);c.appendChild(p);list.appendChild(c);
  });
  app.append(list,done);
  function finish(){
    if(done.childNodes.length)return;
    var n0=0,mv=0;for(var i=0;i<4;i++){if(unseal(i)===Q[i].a)n0++;if(kind(i)==='move')mv++}
    var c=el('div','card');
    c.append(el('p','q','4 個信封都打開了。'),
      el('p','note','封進去的時候，你本來就猜對 <b>'+n0+'</b> 題。<br>「記得的答案」變成了正確答案、但封進去的其實不是：<b>'+mv+'</b> 題。'),
      el('p','note warm',mv?'這很常見，不代表你不誠實。知道答案以後，很多人的記憶會悄悄往答案那邊靠過去，自己卻一點也沒發現。':'這一次，你的記憶沒有往答案那邊靠。不過很多人會，而且自己一點也沒發現；這很常見，不代表那個人不誠實。'),
      btn('btn','看最後一頁',function(){st.ph=5;save(st);go()}));
    done.appendChild(c);
    c.scrollIntoView({behavior:'smooth',block:'start'});
  }
  if(st.op.every(Boolean))finish();
}

function end(){
  var n0=0,nr=0,mv=0,sureWrong=0;
  for(var i=0;i<4;i++){var s=unseal(i);if(s===Q[i].a)n0++;if(st.rc[i]===Q[i].a)nr++;if(kind(i)==='move')mv++;if(st.cf[i]===0&&st.rc[i]!==s)sureWrong++}
  var s1=unseal(0)===1,r1=st.rc[0]===1;
  var t=el('table');
  [['① 封進去的時候，本來就猜對',n0+' 題'],
   ['② 回想時，說自己猜對',nr+' 題'],
   ['③ 記得的答案往正確答案移動',mv+' 題'],
   ['④ 第 1 題黑面琵鷺：封進去的是 B（朝鮮半島）嗎？',s1?'是':'不是'],
   ['⑤ 第 1 題黑面琵鷺：回想時說的是 B 嗎？',r1?'是':'不是'],
   ['⑥ 說「很確定」，但和封進去的不一樣',sureWrong+' 題']
  ].forEach(function(r){var tr=el('tr');tr.append(el('td',null,r[0]),el('td','n',r[1]));t.appendChild(tr)});
  var c=el('div','card');c.append(t);
  var c2=el('div','card');
  c2.append(el('p','lead','知道答案以後，覺得自己「早就知道了」的這種感覺，叫做「後見之明」。'),
            el('p','final','事情發生以前先寫下來，才知道自己是不是真的「早就知道」。'));
  var hh=el('h2',null,'做完了！請停在這一頁，等其他同學。');hh.style.textWrap='wrap';app.append(hh,c,c2);
}

render();
})();
</script>
