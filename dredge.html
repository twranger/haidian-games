<meta charset="utf-8">
<script src="fresh.js"></script>
<title>清港跑不停</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: story, then 10 months of a harbour cross-section (side view). Each month the creek's silt flows in and the bed rises; the student drags the wooden bucket from the bamboo raft onto the silt (or taps the silt) - the bucket scoops, is hauled back and dumped on the bank, the bed drops one unit. Fixed bucket quota per month; a dot on the depth chart and a bar on the "how tired" chart at each month end. Month 7: choose A more hands / B move the port south / C trees and silt dam upstream (effect + cost shown, any choice allowed), then months 7-10. Result page, then final question (effect + cost only), then summary. Fixed script, no randomness. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --mA:#7A5A16; --mB:#A8441A; --mC:#2F7D4F;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:960px;margin:0 auto;padding-inline:20px;padding-block:20px 36px;display:flex;flex-direction:column;gap:14px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.4vw,32px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lead{font-size:clamp(19px,2.6vw,24px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,2.6vw,22px);display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.soft{background:var(--card);color:var(--sea);border:3px solid var(--sea)}
.btn.small{font-size:19px;padding:10px 14px;font-weight:700}
.btn:focus-visible,.scene:focus-visible,.copt:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.5vw,23px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
.hint{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted);font-weight:700;display:flex;align-items:flex-start;gap:8px}
.hint svg.i{margin-top:.2em}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn.alt svg.i{width:1.7em;height:1.7em}
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;border-radius:50%;color:#fff;font-weight:900;font-size:.9em;flex:none;line-height:1}
.lt.A{background:var(--mA)}.lt.B{background:var(--mB)}.lt.C{background:var(--mC)}.lt.N{background:var(--sea)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:0 12px 0 4px;color:var(--ink);letter-spacing:0;font-size:19px}
/* stage */
.stage{display:flex;gap:12px;align-items:flex-start}
.colL{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:12px}
.colR{flex:0 0 300px;display:flex;flex-direction:column;gap:12px}
.sbox{position:relative;background:#E3EFF4;border:3px solid var(--line);border-radius:20px;overflow:hidden}
.act{display:flex;flex-direction:column;gap:10px}
.scene{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.scene #silt{transition:transform .25s ease}
.scene #bk{cursor:grab}
.sbox.aim #siltTop{stroke:#F3D27A;stroke-width:6}
.scene .flow path{opacity:0}
.sbox.flowing .scene .flow path{animation:flow 1.5s ease-in-out infinite}
.sbox.flowing .scene .flow path:nth-child(2){animation-delay:.35s}
.sbox.flowing .scene .flow path:nth-child(3){animation-delay:.7s}
@keyframes flow{0%{transform:translateX(-60px);opacity:0}25%{opacity:.95}100%{transform:translateX(420px);opacity:0}}
.ov{position:absolute;pointer-events:none;background:rgba(251,252,249,.94);border:2px solid var(--line);border-radius:12px;padding:0 10px;font-weight:900;font-size:19px;line-height:1.5;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ov.dl{left:1.2%;top:60.9%;transform:translateY(-50%);border-color:var(--sea);color:var(--sea)}
.ov.dl.bad{border-color:var(--rust);color:var(--rust)}
.ov.up{left:1.2%;top:2.5%}
.ov.bank{right:1.2%;top:50%}
.ov.port{right:1.2%;top:13%;border-color:var(--rust);color:var(--rust)}
.ov.ban{left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);font-size:clamp(19px,2.8vw,26px);padding:6px 14px;border:3px solid var(--rust);opacity:0;transition:opacity .3s,transform .3s}
.ov.ban.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ov svg.i{width:1.3em;height:1.3em}
@media (prefers-reduced-motion:reduce){.scene #silt,.ov.ban{transition:none!important}.sbox.flowing .scene .flow path{animation:none;opacity:.8}}
/* hud */
.hud{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.bks{display:flex;flex-wrap:wrap;gap:2px 4px}
.bks svg.i{width:29px;height:29px;color:var(--ink);transition:opacity .25s}
.bks svg.i.used{opacity:.22}
.bks svg.i.rest{opacity:.22;color:var(--muted)}
.left{margin:0;font-size:19px;font-weight:700}
.left b{font-size:1.25em;color:var(--sea)}
.stat{margin:0;font-weight:900;font-size:clamp(19px,2.3vw,21px);line-height:1.45;border-radius:12px;padding:6px 10px}
.stat.ok{background:#E4F0DE;color:var(--good)}.stat.sh{background:#FBE9DD;color:var(--rust)}
.stat span{display:block;font-weight:700;color:var(--ink)}
/* chart */
.chart{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ch-t{margin:0;font-weight:900;font-size:19px;line-height:1.4;display:flex;align-items:center;gap:6px}
.ch-t svg.i{width:1.5em;height:1.5em}
.plot{position:relative;height:140px;border-radius:8px;overflow:hidden;margin-top:2px}
.plot .z{position:absolute;left:0;right:0}
.plot .z.sh{top:0;height:55.6%;background:#FBE9DD}
.plot .z.ok{top:55.6%;bottom:0;background:#E4F0DE;border-top:3px dashed var(--sea)}
.plot svg{position:absolute;inset:0;width:100%;height:100%}
.dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2.5px solid var(--card);box-shadow:0 0 0 1px rgba(31,42,46,.25)}
.dot.ok{background:var(--good)}.dot.sh{background:var(--rust)}
.dot.new{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
.lgd{margin:0;font-size:19px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 12px;line-height:1.5}
.lgd span{display:inline-flex;align-items:center;gap:5px}
.lgd i{display:inline-block;width:18px;height:14px;border-radius:4px}
.lgd i.sh{background:#FBE9DD;border:2px solid #E8C2AC}.lgd i.ok{background:#E4F0DE;border:2px solid #B9D3AE}
.lgd i.dl{height:0;border-top:3px dashed var(--sea);border-radius:0}
.bars{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));height:92px;align-items:end;border-bottom:2px solid var(--line);margin-top:2px}
.bc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bc b{font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}
.bc i{display:block;width:62%;max-width:26px;border-radius:5px 5px 0 0;background:var(--gold)}
.bc i.hi{background:var(--rust)}
.bc.new i{animation:grow .5s ease-out;transform-origin:50% 100%}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.mos{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));text-align:center;font-size:19px;font-weight:700;color:var(--muted);line-height:1.4;font-variant-numeric:tabular-nums}
.mos span.on{color:var(--ink)}
.mos-x{margin:0;font-size:19px;color:var(--muted);text-align:center;line-height:1.3}
@media (prefers-reduced-motion:reduce){.dot.new,.bc.new i{animation:none}}
/* month end */
.fl{margin:0;display:flex;gap:10px;align-items:flex-start;font-size:clamp(19px,2.4vw,22px);line-height:1.55}
.fl svg.i{width:1.6em;height:1.6em;margin-top:0;flex:none}
.fl b{font-weight:900}
.fl.ok b{color:var(--good)}.fl.sh b{color:var(--rust)}
/* choice */
.copt{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.copt.pick{border-color:var(--gold);background:var(--warm);box-shadow:0 0 0 4px #F3E3BE}
.copt .top{display:flex;align-items:center;gap:10px;font-size:clamp(21px,2.8vw,25px);font-weight:900;line-height:1.35}
.copt .top svg.i{width:46px;height:46px}
.copt .top .sel{margin-left:auto;font-size:19px;color:var(--gold);display:none;align-items:center;gap:4px;white-space:nowrap}
.copt.pick .top .sel{display:inline-flex}
.copt.A{border-left:10px solid var(--mA)}.copt.B{border-left:10px solid var(--mB)}.copt.C{border-left:10px solid var(--mC)}
.ec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6}
.ec dt{font-weight:900;white-space:nowrap}
.ec dd{margin:0}
.ec dt.e{color:var(--good)}.ec dt.c{color:var(--rust)}
/* result */
.res{display:flex;flex-direction:column;gap:10px}
.rc{border:3px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--card)}
.rc.me{border-color:var(--gold);background:var(--warm)}
.rc h3 .me{font-size:19px;color:var(--gold);font-weight:900}
.rc p{margin:2px 0 0;font-size:clamp(19px,2.4vw,22px);line-height:1.55}
.rc p b{font-weight:900}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
.sum td:first-child{color:var(--muted);font-weight:700;width:46%}
.sum td b{font-size:1.1em}
@media (max-width:760px){
  .stage{flex-direction:column;align-items:stretch}
  .colL,.colR{display:contents}
  .stage .hud{order:1}.stage .sbox{order:2}.stage .act{order:3}.stage .chart{order:4}
  .hud{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px}
  .bks{width:100%}
  .bks svg.i{width:30px;height:30px}
  .stat{flex:1 1 200px}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .plot{height:120px}
  .bars{height:84px}
  .bc i{width:70%}
  .ov{padding:0 6px;border-radius:10px}
  .ov.port{top:16%}
  .sum,.sum tbody,.sum tr,.sum td{display:block}
  .sum td{border:0;padding:2px 0;width:auto!important}
  .sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ec{grid-template-columns:1fr;gap:0}
  .ec dd{margin-bottom:6px}
  .copt .top svg.i{width:40px;height:40px}
}
</style>

        var x1=bx,y1=by;
        tween(230,function(t){bx=x1+(REST[0]-x1)*t;by=y1+(REST[1]-y1)*t;setBk()},function(){
          var tx=736,tY=pileTop(st.pile)-26;
          tween(230,function(t){bx=REST[0]+(tx-REST[0])*t;by=REST[1]+(tY-REST[1])*t-Math.sin(t*Math.PI)*40;rot=-55*t;setBk()},function(){
            mud.setAttribute('opacity','0');pile.setAttribute('d',pileD(st.pile));
            if(ended){wait(260,function(){render()});return}
            setBusy(false);
            var x2=bx,y2=by;
            tween(200,function(t){bx=x2+(REST[0]-x2)*t;by=y2+(REST[1]-y2)*t;rot=-55*(1-t);setBk()},null,own);
          },own);
        },own);
      });
    },own);
  }
}
function endCard(act){
  var r=st.hist[st.hist.length-1],m=st.m,c=el('div','card');
  c.append(el('h3',null,ic('check')+'第 '+m+' 個月結束了'));
  c.append(el('p','fl',ic('dredge_silt')+'<span>這個月，溪水帶進來 <b>'+r.S+' 份</b>泥沙。</span>'));
  var rest=r.q-r.dug;
  c.append(el('p','fl',ic('raise_bucket')+'<span>大家撈起了 <b>'+r.dug+' 桶</b>'+(rest>0?'，剩下 '+rest+' 桶沒有撈，休息了。':'。')+'</span>'));
  if(r.o)c.append(el('p','fl',ic(st.choice==='B'?'dredge_south':'dredge_tree')+'<span>另外有 <b>'+r.o+' 個人</b>'+(st.choice==='B'?'去搬家、蓋新碼頭。':'去上游種樹、蓋擋沙的堤。')+'</span>'));
  var x=rel(r.d),diff=r.d-r.d0;
  c.append(el('p','fl '+(x.ok?'ok':'sh'),ic('boat')+'<span>月底，<b>'+x.t+'</b>，'+x.s+'。</span>'));
  var cmp=diff>1?'和這個月月初比，港道深了 '+diff+' 份。':diff===1?'和這個月月初比，港道只深了 1 份。':diff===0?'拚命撈完，港底只是回到和月初一樣的地方。':'撈完以後，港道還是比這個月月初淺了 '+(-diff)+' 份。';
  if(m===7&&st.choice==='B')cmp=diff>=0?'新港一開始就很深，這個月還多深了 '+diff+' 份。':'新港這個月淺了 '+(-diff)+' 份。';
  c.append(el('p','note warm',cmp));
  act.append(c);
  var lab=m<6||(m>=7&&m<10)?'開始第 '+(m+1)+' 個月':m===6?'第 7 個月：要不要換個做法？':'看看 10 個月的結果';
  act.append(button(lab,'btn',function(){if(m===6)go('choice');else if(m===10)go('result');else startMonth(m+1)}));
}

function choicePage(){
  app.append(el('p','case',ic('cal')+'第 7 個月開始以前'));
  app.append(el('h2',null,'泥沙一個月比一個月多。接下來 4 個月，你要怎麼做？'));
  var last=st.hist[st.hist.length-1],x=rel(last.d);
  app.append(el('p','lead','第 6 個月月底，<b>'+x.t+'</b>，'+x.s+'。上游還在開墾，雨季也還沒過。'));
  app.append(el('p','lead','這一題<b>沒有標準答案</b>。每個做法都有作用，也都有代價，選一個試試看。'));
  var o=el('div','opts');var bs={};
  CK.forEach(function(k){var c=CH[k];
    var b=el('button','copt '+k,'<span class="top">'+ic(c.icon)+lt(k)+'<span>'+c.n+'</span><span class="sel">'+ic('check')+'你選的</span></span><dl class="ec"><dt class="e">作用</dt><dd>'+c.e+'</dd><dt class="c">代價</dt><dd>'+c.c+'</dd></dl>');
    b.type='button';b.setAttribute('data-k',k);b.addEventListener('click',function(){st.pick=k;save(st);upd()});bs[k]=b;o.appendChild(b)});
  app.append(o);
  var nx=button('就這樣做，開始第 7 個月','btn',function(){if(!st.pick)return;st.choice=st.pick;startMonth(7)});app.append(nx);
  app.append(chartEl());
  function upd(){CK.forEach(function(k){bs[k].classList.toggle('pick',st.pick===k);bs[k].setAttribute('aria-pressed',st.pick===k?'true':'false')});nx.disabled=!st.pick}
  upd();
}

var FUT={
  A:{s:'13 份，還在變多',w:'每個月 12 次',f:'泥沙每個月都比上個月多。12 桶很快就不夠了，到時候要再加人，大家會更累。'},
  B:{s:'12 份，追上來了',w:'每個月 8 次',f:'新港也會慢慢變淺，變得和舊港一樣。到時候又要拚命挖，或是再搬一次。'},
  C:{s:'2 份，變少了',w:'每個月 8 次，之後可以少一點',f:'每個月撈幾桶就夠了，大家可以少出一點力；可是上游的樹和堤，要一直有人照顧。'}
};
function resultPage(){
  app.append(el('p','case','10 個月過去了'));
  app.append(el('h2',null,'這 10 個月，港道怎麼了？大家有多累？'));
  var H=st.hist,ok=H.filter(function(r){return deep(r.d)}).length;
  var c=el('div','card');
  c.append(el('p','fl',ic('raise_bucket')+'<span>10 個月一共撈了 <b>'+st.total+' 桶</b>泥沙。</span>'));
  c.append(el('p','fl',ic('boat')+'<span>港道夠深、船進得來的月份：<b>'+ok+' 個月</b>（一共 10 個月）。</span>'));
  c.append(el('p','fl',ic(CH[st.choice].icon)+'<span>第 7 個月起，你選了 <b>'+st.choice+' '+CH[st.choice].n+'</b>。</span>'));
  app.append(c,chartEl());
  app.append(el('h3',null,'如果再這樣過幾個月，會怎樣？'));
  var res=el('div','res');
  CK.forEach(function(k){var u=FUT[k],me=k===st.choice;
    var d=el('div','rc'+(me?' me':''));d.append(el('h3',null,lt(k)+CH[k].n+(me?'<span class="me">（你選的）</span>':'')));
    d.append(el('p',null,'第 10 個月流進港的泥沙：<b>'+u.s+'</b>'),el('p',null,'大家出工：<b>'+u.w+'</b>'),el('p',null,u.f));res.append(d)});
  app.append(res);
  app.append(el('p','note warm','想一想：每個月拚命挖，是讓港口<b>變好</b>，還是只是讓它<b>不要變壞</b>？要一直挖下去，還是換一個做法？'));
  app.append(button('最後一題','btn',function(){go('final')}));
}

var FQ={
  1:{n:'全部的人都去挖港',icon:'raise_bucket',e:'港道每個月都馬上變深，船這個月就進得來。',c:'泥沙越來越多，就要一直加人、一直挖，大家越來越累；只要一停下來，港道就變淺。'},
  2:{n:'一半挖港，一半去上游',icon:'split',e:'一邊顧著港口，一邊從源頭讓泥沙變少，過一陣子就不用那麼拚。',c:'頭幾個月挖港的人變少，港道會變淺、船比較難進來；上游的效果要等很久，也要上游的人願意一起配合。'},
  3:{n:'搬到新的港口',icon:'dredge_south',e:'新港一開始很深，船馬上進得來，暫時不用天天拚命挖。',c:'搬家、蓋碼頭很辛苦，舊港要放下；溪水的泥沙還是會慢慢追過來，過一陣子可能又要再搬。'}
};
function finalPage(){
  app.append(el('p','case','最後一題'));
  app.append(el('h2',null,'如果你是港口負責人，你會怎麼分配人手？'));
  app.append(el('p','lead','這一題<b>沒有標準答案</b>。選好以後，會看到這個做法的作用和代價，等一下全班一起討論。'));
  var o=el('div','opts');var bs={};var fb=el('div');
  [1,2,3].forEach(function(k){var b=button(ic(FQ[k].icon)+lt('N',k)+'<span>'+FQ[k].n+'</span>','btn alt'+(st.final===k?' pick':''),function(){st.final=k;save(st);upd()});b.setAttribute('data-k',k);bs[k]=b;o.appendChild(b)});
  var nx=button('下一步','btn',function(){if(st.final)go('end')});
  app.append(o,fb,nx);
  function upd(){
    [1,2,3].forEach(function(k){bs[k].classList.toggle('pick',st.final===k);bs[k].setAttribute('aria-pressed',st.final===k?'true':'false')});
    fb.innerHTML='';nx.disabled=!st.final;
    if(st.final){var q=FQ[st.final];var c=el('div','card');c.append(el('h3',null,lt('N',st.final)+q.n));c.append(el('dl','ec','<dt class="e">作用</dt><dd>'+q.e+'</dd><dt class="c">代價</dt><dd>'+q.c+'</dd>'));fb.appendChild(c)}
  }
  upd();
}

function endPage(){
  app.append(el('h1',null,'做完了！請停在這一頁，等其他同學。'));
  var H=st.hist,ok=H.filter(function(r){return deep(r.d)}).length,rest=H.filter(function(r){return r.dug<r.q}).length;
  var rows=[
    ['10 個月一共撈了幾桶',st.total+' 桶'],
    ['港道夠深（船進得來）的月份',ok+' 個月（一共 10 個月）'],
    ['第 7 個月選的做法',lt(st.choice)+' '+CH[st.choice].n],
    ['最後一題：怎麼分配人手',lt('N',st.final)+' '+FQ[st.final].n]
  ];
  if(rest)rows.push(['有幾個月沒撈滿、先休息',rest+' 個月']);
  var c=el('div','card');var tb=el('table','sum');
  tb.innerHTML='<tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>'}).join('')+'</tbody>';
  c.append(tb);app.append(c);
  app.append(el('p','note warm','老師等一下會請大家舉手：第 7 個月選 A、B、C 的各有幾個人？最後一題選 1、2、3 的又各有幾個人？'));
}

function render(){
  tok++;app.innerHTML='';
  var s=st.step;
  if(s==='intro')intro();
  else if(s==='month'&&st.m>=1&&st.m<=10&&(st.m<=6||st.choice))monthPage();
  else if(s==='choice'&&st.hist.length>=6)choicePage();
  else if(s==='result'&&st.hist.length>=10)resultPage();
  else if(s==='final'&&st.hist.length>=10)finalPage();
  else if(s==='end'&&st.final&&st.choice)endPage();
  else{st=fresh();save(st);intro()}
  if(s!=='month')setBusy(false);
}
render();
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}st=fresh();save(st);render();try{window.scrollTo(0,0)}catch(e){}}});
})();
</script>
