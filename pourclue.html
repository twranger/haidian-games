<meta charset="utf-8">
<script src="fresh.js"></script>
<title>這條線索有多重</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: intro → for each of three cases: story page (two empty-ish see-through jugs = two possible answers) → four clue pages (press and hold a faucet over a jug to pour; or press "不倒") → after each clue a reference card with two measuring cups ("if the answer were left / right, how likely is this clue?") → pick an answer (or "not sure yet") and compare your water level with a reference level → summary page for a show of hands. Fixed script, no randomness, no scoring. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --wl:#7DB7DE; --wls:#205E86; --wr:#8CCFB5; --wrs:#2F7D4F;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:pretty}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:1px;margin:0;display:flex;align-items:flex-start;gap:8px}
.case svg.i{margin-top:.2em}
.nw{white-space:nowrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn[disabled]{opacity:.4;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;justify-content:flex-start;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.soft{background:var(--card);color:var(--sea);border:3px solid var(--sea)}
.btn.ghostb{background:transparent;color:var(--muted);border:3px dashed var(--line);font-size:clamp(19px,2.3vw,21px);padding:8px 14px}
.btn:focus-visible,.tap:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
.hint{margin:0;font-size:clamp(19px,2.3vw,22px);color:var(--muted);font-weight:700;display:flex;align-items:flex-start;gap:8px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn.alt svg.i{width:1.7em;height:1.7em}
.big svg.i{width:64px;height:64px}
.ask{display:flex;gap:12px;align-items:center;background:var(--warm);border:3px solid #EBD9AE;border-radius:18px;padding:12px 16px;font-size:clamp(20px,2.8vw,26px);font-weight:900;line-height:1.5}
.ask svg.i{width:46px;height:46px}
.sideL{color:var(--wls)}.sideR{color:var(--wrs)}
.tagL,.tagR{display:inline-flex;align-items:center;gap:4px;font-weight:900;border-radius:10px;padding:0 8px;white-space:nowrap}
.tagL{background:#E2EEF7;color:var(--wls)}.tagR{background:#E1F2EA;color:var(--wrs)}
/* clue */
.clue{font-size:clamp(23px,3.8vw,32px);font-weight:900;line-height:1.55;margin:0;background:var(--card);border:3px solid var(--line);border-left:10px solid var(--gold);border-radius:18px;padding:14px 18px;text-wrap:pretty}
/* jugs */
.jugs{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,3vw,40px);align-items:end;max-width:640px;width:100%;margin:0 auto}
.jcol{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.tap{font:inherit;width:100%;max-width:230px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;border-radius:16px;border:3px solid var(--sea);background:#DCE8F0;color:var(--ink);font-weight:900;font-size:clamp(19px,2.6vw,23px);cursor:pointer;line-height:1.3;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:relative;z-index:1}
.tap svg.i{width:42px;height:42px}
.tap.R{border-color:var(--wrs);background:#E1F2EA}
.tap.on{background:var(--sea);color:#fff;transform:translateY(2px)}
.tap.R.on{background:var(--wrs)}
.tap[disabled]{opacity:.45;cursor:default}
.jsvg{width:100%;max-width:min(200px,22vh);height:auto;display:block;margin-top:-4px}
.jname{display:flex;align-items:center;gap:6px;font-weight:900;font-size:clamp(20px,2.8vw,26px);line-height:1.3;text-align:center;justify-content:center;margin-top:2px}
.jname svg.i{width:36px;height:36px}
.strm{opacity:0;transition:opacity .12s}
.pouring .strm{opacity:1}
.strm .fl{stroke-dasharray:16 9;animation:flow .35s linear infinite}
.splash{opacity:0}
.pouring .splash{opacity:1}
.splash ellipse{transform-box:fill-box;transform-origin:50% 50%;animation:rip .6s ease-out infinite}
@keyframes flow{to{stroke-dashoffset:-25}}
@keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.strm .fl,.splash ellipse{animation:none}}
.capmsg{min-height:1.2em;line-height:1.2;margin:0;font-size:19px;color:var(--rust);font-weight:700;text-align:center}
/* split bar */
.split{display:flex;flex-direction:column;gap:6px;max-width:640px;width:100%;margin:0 auto}
.split .st{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:clamp(19px,2.5vw,23px);flex-wrap:wrap}
.split .st .lb{color:var(--muted);font-weight:700}
.sbar{height:22px;border-radius:11px;overflow:hidden;display:flex;border:3px solid var(--line);background:var(--card)}
.sbar i{display:block;height:100%;transition:width .15s}
.sbar .l{background:var(--wl)}.sbar .r{background:var(--wr)}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.acts .btn{flex:1 1 260px}
.acts .btn.ghostb{flex:0 0 auto}
/* reference */
.ref h3{display:flex;align-items:center;gap:8px}
.ref h3 svg.i{width:40px;height:40px}
.cups{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.cupc{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.cupc .if{font-size:19px;font-weight:700;color:var(--muted);line-height:1.4}
.cupc .pw{font-size:clamp(20px,2.7vw,25px);font-weight:900;line-height:1.3}
.cupsvg{width:84px;height:auto}
.gap{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:clamp(19px,2.5vw,23px);text-align:center;line-height:1.35;color:var(--gold)}
.gap svg{width:62px;height:auto}
.wt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:900;font-size:clamp(20px,2.7vw,25px)}
.wt .blk{display:flex;gap:4px}
.wt .blk i{display:block;width:26px;height:18px;border-radius:5px;background:#E3E6E0;border:2px solid var(--line)}
.wt .blk i.on{background:var(--gold);border-color:#8C6A1E}
.cmpp{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.5vw,23px);line-height:1.55;align-items:center}
.cmpp dt{font-weight:900;color:var(--muted);white-space:nowrap}
.cmpp dd{margin:0;display:flex;flex-direction:column;gap:4px}
.amt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mbar{display:inline-flex;width:120px;height:14px;border-radius:7px;background:#E3E6E0;overflow:hidden;flex:none}
.mbar i{display:block;height:100%}
.mbar.L i{background:var(--wl)}.mbar.R i{background:var(--wr)}
.exp{margin:0;font-size:clamp(19px,2.5vw,23px);line-height:1.75}
/* compare */
.cmpj{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmpj .pane{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.cmpj .pane.ref{border-color:#EBD9AE;background:#FFFCF4}
.cmpj .pt{font-weight:900;font-size:clamp(19px,2.5vw,23px)}
.cmpj .mj{display:flex;gap:6px;justify-content:center;width:100%}
.cmpj .mj svg{width:46%;max-width:110px;height:auto}
.cmpj .pv{font-size:19px;line-height:1.5;font-weight:700}
/* tables */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
.sum td:first-child{color:var(--muted);font-weight:700;width:44%}
.sum td b{font-size:1.05em}
.sum .sub{display:block;font-size:19px;color:var(--muted);font-weight:500}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .acts .btn{flex:1 1 100%}
  .tap{padding:6px 6px;gap:4px}
  .tap svg.i{width:34px;height:34px}
  .cups{grid-template-columns:1fr 1fr}
  .gap{grid-column:1/-1;order:3;flex-direction:row;justify-content:center}
  .gap svg{width:44px}
  .cupsvg{width:70px}
  .cmpp{grid-template-columns:1fr;gap:0}
  .cmpp dd{margin-bottom:8px}
  .sum,.sum tbody,.sum tr,.sum td{display:block}
  .sum td{border:0;padding:2px 0;width:auto!important}
  .sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ask svg.i{width:38px;height:38px}
}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

var CASES=[

  story:['星期三放學的時候，五年13班的小安一摸書包，發現家裡的鑰匙不見了。',

function pword(p){return p>=9?'幾乎一定會':p>=7?'很可能會':p>=5?'有可能':p>=3?'偶爾會':p>=1?'很少會':'幾乎不會'}

function post(c){var o=1;CASES[c].clues.forEach(function(k){o*=k.pL/k.pR});return o/(1+o)}

function tenths(L,R){return Math.round(L/(L+R)*10)}
function splitText(c,L,R,br){var x=tenths(L,R),C=CASES[c];if(x===5)return '兩邊一半一半';return C.L.n+' '+x+' 成'+(br?'<br>':'、')+C.R.n+' '+(10-x)+' 成'}
function tag(c,s){var C=CASES[c],o=C[s];return '<span class="tag'+s+'">'+ic(o.ic)+o.n+'</span>'}

function setLevel(svg,v){

function jugPair(c,lv,opt){

function intro(){

  c.append(el('p','lead','等一下有三個案子。每個案子都有<b>兩個透明水壺</b>，代表兩個可能的答案。每看到一條線索，你就決定要把水倒進哪一壺、倒多少：<b>按住水壺上面的水龍頭</b>，按越久，倒越多。'));
  c.append(el('p','lead','如果你覺得這條線索<b>兩邊都會出現</b>，就按「不倒」。兩壺水的多少，就是你現在的想法。'));
  app.append(c);

}

function casePage(){
  var c=st.c,C=CASES[c];

  var jp=jugPair(c,[BASE,BASE]);app.append(jp.el);
  app.append(el('p','hint','兩壺現在一樣多水，代表你覺得兩個答案一樣有可能。接下來會出現 4 條線索。'));
  app.append(button('看第 1 條線索','btn',function(){st.k=0;go('clue')}));
}

function cluePage(){
  var c=st.c,k=st.k,C=CASES[c],K=C.clues[k],key=id(c,k);
  var rv=!!st.rv[key];
  app.append(el('p','case',ic(C.icon)+'<span>第 '+(c+1)+' 案：'+C.name+'　<span class="nw">・ 線索 '+(k+1)+'／4</span></span>'));
  app.append(el('p','clue',K.t));
  app.append(el('p','hint',ic('think')+'<span>想一想：如果答案是「'+C.L.n+'」，會有這條線索嗎？如果答案是「'+C.R.n+'」，還會有嗎？</span>'));
  var lv=levels(c,k);
  var jp=jugPair(c,lv,{taps:!rv});app.append(jp.el);
  var msg=el('p','capmsg','');if(!rv)app.append(msg);
  var sb=splitBar(c,lv[0],lv[1]);app.append(sb);
  var acts=el('div','acts');
  var done=button(ic('check')+'倒好了，看參考倒法','btn',function(){finish(false)});
  var none=button(ic('pour_none')+'這條線索兩邊都會出現，不倒','btn soft',function(){finish(true)});
  var redo=button(ic('undo')+'重倒這一條','btn ghostb',function(){st.p[key]=[0,0];save(st);render()});
  if(!rv){acts.append(done,none,redo);app.append(acts)}
  function upBtns(){var a=pv(c,k),t=a[0]+a[1];done.disabled=t<0.05;none.disabled=t>=0.05;none.style.display=t>=0.05?'none':'';redo.style.display=t>=0.05?'':'none'}
  if(!rv){
    upBtns();
    var pouring=null,last=0,raf=0;
    function frame(ts){
      if(!pouring)return;
      var dt=last?Math.min(0.1,(ts-last)/1000):0;last=ts;
      var a=pv(c,k).slice(),si=pouring==='L'?0:1;
      var room=Math.min(PERCLUE-a[si],CAP-levels(c,k)[si]);
      var add=Math.min(room,RATE*dt);
      if(add>0){a[si]+=add;st.p[key]=a}
      if(room<=0.0001){msg.textContent='這一條線索，這一壺最多倒到這裡。'}
      var l=levels(c,k);setLevel(jp.cols.L.svg,l[0]);setLevel(jp.cols.R.svg,l[1]);sb.upd(l[0],l[1]);upBtns();
      raf=requestAnimationFrame(frame);
    }
    function start(s){if(pouring)return;pouring=s;last=0;msg.textContent='';var cl=jp.cols[s];cl.tap.classList.add('on');cl.svg.parentNode.classList.add('pouring');cl.tap.querySelector('.tl').textContent='倒水中…';raf=requestAnimationFrame(frame)}
    function stop(){if(!pouring)return;var cl=jp.cols[pouring];cl.tap.classList.remove('on');cl.svg.parentNode.classList.remove('pouring');cl.tap.querySelector('.tl').textContent='按住倒水';pouring=null;cancelAnimationFrame(raf);var a=pv(c,k);st.p[key]=[Math.round(a[0]*100)/100,Math.round(a[1]*100)/100];save(st);upBtns()}
    ['L','R'].forEach(function(s){
      var t=jp.cols[s].tap;
      t.addEventListener('pointerdown',function(e){if(e.button>0)return;e.preventDefault();try{t.setPointerCapture(e.pointerId)}catch(_){}start(s)});
      t.addEventListener('pointerup',stop);t.addEventListener('pointercancel',stop);t.addEventListener('lostpointercapture',stop);
      t.addEventListener('contextmenu',function(e){e.preventDefault()});
      t.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')){e.preventDefault();if(!e.repeat)start(s)}});
      t.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();stop()}});
      t.addEventListener('blur',stop);
    });
    window.addEventListener('blur',stop,{once:true});
  }else{
    app.append(refCard(c,k));
    var last3=k===3;
    app.append(button(last3?'選一個答案'+ic('chev'):'下一條線索'+ic('chev'),'btn',function(){if(last3)go('decide');else{st.k=k+1;go('clue')}}));
  }
  function finish(no){
    var a=pv(c,k);if(no){st.p[key]=[0,0];st.np[key]=true}else{delete st.np[key]}
    st.rv[key]=true;save(st);render();

  }
}

  cups.innerHTML=cc('L',K.pL)+'<div class="gap">'+scaleSVG(K.w)+'<span>'+WGAP[K.w]+'</span></div>'+cc('R',K.pR);
  card.append(cups);
  var wt=el('div','wt','<span>這條線索的重量：</span><span class="blk">'+[1,2,3,4].map(function(i){return '<i class="'+(i<=K.w?'on':'')+'"></i>'}).join('')+'</span><span>'+WNAME[K.w]+'</span>');
  card.append(wt);
  card.append(el('p','exp',K.e));
  var refTxt=K.w===0?'不用倒（兩邊都會出現）':amtRow(c,K.side,WAMT[K.w],K.w===1?'頂多倒一點點，不倒也可以':WPOUR[K.w]);
  var yours;
  if(st.np[key])yours='你選了「兩邊都會出現，不倒」。';
  else{var parts=[];if(a[0]>=0.05)parts.push(amtRow(c,'L',a[0]));if(a[1]>=0.05)parts.push(amtRow(c,'R',a[1]));yours=parts.join('')||'沒有倒'}
  card.append(el('dl','cmpp','<dt>你的倒法</dt><dd>'+yours+'</dd><dt>參考倒法</dt><dd>'+refTxt+'</dd>'));
  card.append(el('p','hint','參考倒法只是給你比一比，你的倒法不扣分。'));
  return card;
}

function decidePage(){
  var c=st.c,C=CASES[c];
  app.append(el('p','case',ic(C.icon)+'<span>第 '+(c+1)+' 案：'+C.name+'　<span class="nw">・ 4 條線索都看完了</span></span>'));
  app.append(el('h2',null,C.q));
  var lv=levels(c,3);
  var jp=jugPair(c,lv);app.append(jp.el);app.append(splitBar(c,lv[0],lv[1]));
  var o=el('div','opts');var bs={};var fb=el('div');fb.style.display='contents';
  [['L',C.L.ic,C.L.n],['R',C.R.ic,C.R.n],['U','think','還不能確定']].forEach(function(x){
    var b=button(ic(x[1])+'<span>'+x[2]+'</span>','btn alt'+(st.ans[c]===x[0]?' pick':''),function(){st.ans[c]=x[0];save(st);upd(true)});bs[x[0]]=b;o.appendChild(b)});
  var nx=button(c<2?'下一案'+ic('chev'):'看看結果'+ic('chev'),'btn',function(){if(!st.ans[c])return;if(c<2){st.c=c+1;st.k=0;go('case')}else go('end')});
  app.append(o,fb,nx);
  function upd(scroll){
    Object.keys(bs).forEach(function(k){bs[k].classList.toggle('pick',st.ans[c]===k);bs[k].setAttribute('aria-pressed',st.ans[c]===k?'true':'false')});
    fb.innerHTML='';nx.disabled=!st.ans[c];
    if(st.ans[c]){var cc=compareCard(c,lv);fb.appendChild(cc);if(scroll)try{cc.scrollIntoView({block:'nearest'})}catch(e){}}
  }
  upd(false);
}
function refText(p){return p>=0.95?['超過 9 成','不到 1 成']:['大約 '+Math.round(p*10)+' 成','大約 '+(10-Math.round(p*10))+' 成']}
function compareCard(c,lv){
  var C=CASES[c],P=post(c),ans=st.ans[c];
  var card=el('div','card');
  card.append(el('h3',null,'比一比：你的水位和參考水位'));
  var g=el('div','cmpj');
  var you=el('div','pane');you.append(el('span','pt','你的水位'));
  var mj=el('div','mj');mj.innerHTML=jugSVG('L','m'+(uidN++),true)+jugSVG('R','m'+(uidN++),true);you.append(mj);
  you.append(el('span','pv',splitText(c,lv[0],lv[1],true)));
  var ref=el('div','pane ref');ref.append(el('span','pt','參考水位'));
  var mj2=el('div','mj');mj2.innerHTML=jugSVG('L','m'+(uidN++),true)+jugSVG('R','m'+(uidN++),true);ref.append(mj2);
  var rt=refText(P);ref.append(el('span','pv',C.L.n+' '+rt[0]+'<br>'+C.R.n+' '+rt[1]));
  g.append(you,ref);card.append(g);
  var sv=mj.querySelectorAll('svg');setLevel(sv[0],lv[0]);setLevel(sv[1],lv[1]);
  var tot=12,sv2=mj2.querySelectorAll('svg');setLevel(sv2[0],tot*P);setLevel(sv2[1],tot*(1-P));
  card.append(el('p','exp',C.why));
  var yf=lv[0]/(lv[0]+lv[1]),lean;
  if(yf<0.5)lean='你的水位比較偏向「'+C.R.n+'」。可以回頭想想：哪一條線索你倒得最多？它在兩邊是不是都很可能出現？';
  else if(P-yf>0.15)lean='你的水位比參考水位平一些，可能是很重的那幾條，你倒得比參考少一點。';
  else lean='你的水位和參考水位差不多。';
  var pick=ans==='U'?'你選了「還不能確定」。多查一點再下結論是好習慣；你可以想想：還需要哪一條線索，你才會比較確定？'
    :(ans==='L'?'你選了「'+C.L.n+'」，和參考水位偏的方向一樣。':'你選了「'+C.R.n+'」，和參考水位偏的方向不一樣。等一下可以說說看，是哪一條線索讓你這樣選。');
  card.append(el('p','note',pick+'<br>'+lean));
  return card;
}

function endPage(){
  app.append(el('h1',null,'做完了！請停在這一頁，等其他同學。'));
  var rows=[];
  CASES.forEach(function(C,c){var a=st.ans[c];rows.push(['第 '+(c+1)+' 案：'+C.name,a==='U'?'還不能確定':(a?C[a].n:'—')])});
  var nb=0;CASES.forEach(function(C,c){C.clues.forEach(function(K,k){if(K.both&&st.np[id(c,k)])nb++})});
  rows.push(['「兩邊都會出現」的線索（共 '+BOTH_TOTAL+' 條），你選擇不倒的有',nb+' 條']);
  var all=[];
  CASES.forEach(function(C,c){C.clues.forEach(function(K,k){var a=pv(c,k),t=a[0]+a[1];if(t>=0.05)all.push({c:c,k:k,K:K,a:a,t:t})})});
  var best=null;
  if(all.length){
    var mx=Math.max.apply(null,all.map(function(x){return x.t}));
    // near-ties (within a twentieth of a second of pouring) count as the same amount; then prefer the heavier clue
    all.filter(function(x){return x.t>=mx-0.08}).forEach(function(x){if(!best||x.K.w>best.K.w)best=x});
  }
  if(best){
    var into=best.a[0]>=best.a[1]?'L':'R';
    rows.push(['你倒最多水的線索','「'+best.K.s+'」<span class="sub">第 '+(best.c+1)+' 案第 '+(best.k+1)+' 條，倒進「'+CASES[best.c][into].n+'」</span>']);
    rows.push(['它是不是那一案最重的線索',(best.K.w===4?'是':'不是')+'<span class="sub">它的參考重量：'+WNAME[best.K.w]+'</span>']);
  }else{
    rows.push(['你倒最多水的線索','你每一條都沒有倒水']);
    rows.push(['它是不是那一案最重的線索','—']);
  }
  var card=el('div','card');var tb=el('table','sum');
  tb.innerHTML='<tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>'}).join('')+'</tbody>';
  card.append(tb);app.append(card);
  app.append(el('div','ask',ic('pour_cup')+'<span>記得這個問題：「如果答案是另一個，這條線索還會出現嗎？」</span>'));
  app.append(el('p','note warm','老師等一下會請大家舉手：三案各選了什麼？「兩邊都會出現」的線索，你有幾條沒有倒？你倒最多水的那一條，是不是最重的那一條？'));
}

function render(){
  app.innerHTML='';
  var s=st.step;
  if(s==='intro')intro();
  else if(s==='case'&&CASES[st.c])casePage();
  else if(s==='clue'&&CASES[st.c]&&st.k>=0&&st.k<4)cluePage();
  else if(s==='decide'&&CASES[st.c])decidePage();
  else if(s==='end')endPage();
  else{st=fresh();save(st);intro()}
}
render();
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}st=fresh();save(st);render();try{window.scrollTo(0,0)}catch(e){}}});
})();
</script>
