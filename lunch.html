<meta charset="utf-8">
<script src="fresh.js"></script>
<title>午餐夾夾樂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: school lunch tray with 12 pieces → drag chopsticks onto a piece to pick it up, then drag to the big mouth (or tap piece, then tap mouth) → after each bite a small "still want the next bite?" popup → "I'm full" any time → two after-meal questions → summary page. Secret groups: red tray = 12 of one dish; blue tray = 6 dishes × 2, shuffled. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --steel:#C3CACD; --well:#E3E7E8; --wood:#B7834A;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 36px;display:flex;flex-direction:column;gap:14px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.gtag{display:inline-block;border-radius:999px;padding:2px 14px;font-size:clamp(15px,2vw,18px);font-weight:700;letter-spacing:1px;color:#fff;align-self:flex-start}
.gtag.red{background:#C8352B}.gtag.blue{background:#2F6FB0}
.opts{display:flex;flex-direction:column;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);font-weight:700}
.opts .btn.alt{text-align:left}
.btn.full{background:var(--warm);color:var(--rust);border:3px solid #E6CF9F}
.btn:disabled{cursor:default;opacity:.45}
.btn:focus-visible,summary:focus-visible,.tile:focus-visible,.mouth:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.small{font-size:clamp(16px,2.1vw,19px);color:var(--muted);margin:0}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.6vw,24px)}
td{padding:10px 8px;border-bottom:2px solid var(--line);vertical-align:top} td.k{color:var(--muted);font-weight:700} td.v{font-weight:900;text-align:right}
details{background:var(--card);border:3px dashed var(--line);border-radius:18px;padding:12px 16px}
summary{font-size:clamp(19px,2.8vw,25px);font-weight:900;cursor:pointer}

/* play area */
.play{position:relative;display:flex;flex-direction:column;gap:12px;user-select:none;-webkit-user-select:none}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.mouth{position:relative;width:clamp(112px,18vw,160px);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit}
.mouth svg{width:100%;height:auto;display:block;transition:transform .2s}
.mouth span{font-size:clamp(16px,2.1vw,19px);font-weight:700;color:var(--muted)}
.mouth.ready svg{transform:scale(1.08)}
.mouth.hover svg{transform:scale(1.16)}
.mouth.chew svg{animation:chew .5s ease-in-out 2}
@keyframes chew{50%{transform:scaleY(.72)}}
.meter{display:flex;flex-direction:column;gap:6px;min-width:0}
.meter b{font-size:clamp(17px,2.2vw,20px)}
.bar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px}
.bar i{display:block;height:20px;border-radius:4px;background:#ECEFEA}
.bar i.on{background:var(--good)}
.rest{width:62px;height:172px;border:3px dashed var(--line);border-radius:14px;position:relative;display:flex;align-items:flex-start;justify-content:center}
.rest small{font-size:15px;color:var(--muted);font-weight:700;padding-top:2px}
.tray{background:var(--steel);border-radius:26px;padding:clamp(8px,1.6vw,14px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.2vw,10px);box-shadow:inset 0 0 0 3px #B2BABE}
@media (min-width:700px){.tray{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{aspect-ratio:1/1;border:0;border-radius:16px;background:var(--well);box-shadow:inset 0 3px 6px rgba(0,0,0,.12);padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.tile svg{width:86%;height:86%}
.tile.empty{cursor:default;background:#D7DCDE}
.tile.hover{transform:scale(1.07);box-shadow:inset 0 0 0 4px var(--gold)}
.tile.held svg{opacity:.18}
.chop{position:absolute;left:0;top:0;width:56px;height:140px;touch-action:none;cursor:grab;z-index:5;will-change:transform;pointer-events:none}
.chop .hit{pointer-events:stroke;touch-action:none}
.chop.anim{transition:transform .3s ease-out}
.chop.drag{cursor:grabbing}
.chop svg.st{width:56px;height:140px;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.22))}
.chop .food{position:absolute;left:-14px;top:110px;width:40px;height:40px;pointer-events:none}
.chop .food svg{width:100%;height:100%}
.hint{min-height:1.6em}
.endrow{display:flex;flex-direction:column;gap:10px}
.confirm{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* bite question popup */
.veil{position:fixed;inset:0;background:rgba(31,42,46,.38);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.pop{width:min(560px,100%);background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pop .ate{display:flex;align-items:center;gap:12px}
.pop .ate svg{width:64px;height:64px;flex:none}
.pop .ate p{margin:0;font-size:clamp(19px,2.6vw,23px);color:var(--muted)}
@media (max-width:440px){.three{grid-template-columns:1fr}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
var app=document.getElementById('app');
var KEY='lunch-v1';
var N=12;
var GN={red:'紅組',blue:'藍組'};
var KINDS=['chicken','cabbage','corn','egg','fish','tomato'];
var NAME={chicken:'滷雞腿肉丁',cabbage:'炒高麗菜',corn:'玉米',egg:'滷蛋',fish:'虱目魚丸',tomato:'小番茄'};
var WANT=['還想','普通','不太想'];
var Q1={q:'這一餐，你覺得好吃嗎？',o:['很好吃','普通','吃到後來有點膩']};
var Q2={q:'如果明天午餐還是一樣的菜，你會？',o:['很期待','還好','希望換菜色']};

function rint(n){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rint(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function makeTray(g){if(g==='red'){var r=[];for(var i=0;i<N;i++)r.push('chicken');return r}var b=[];KINDS.forEach(function(k){b.push(k,k)});return shuffle(b)}
function fresh(g){return {g:g,stage:0,tray:makeTray(g),eaten:[],want:[],ask:false,q1:null,q2:null}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
function clearHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
var h=location.hash;
if(h==='#reset'){save(null);clearHash()}
var st=load();
if(h==='#red'||h==='#blue'){var want=h.slice(1);if(!st||st.g!==want){st=fresh(want);save(st)}clearHash()}
if(!st||!GN[st.g]||!st.tray||st.tray.length!==N){st=fresh(rint(2)?'blue':'red');save(st)}

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function btn(t,cls,fn){var b=el('button','btn'+(cls?' '+cls:''),t);b.type='button';b.addEventListener('click',fn);return b}
function gtag(){return el('span','gtag '+st.g,GN[st.g])}

/* food drawings */
var FOOD={
 chicken:'<svg viewBox="0 0 60 60" aria-hidden="true"><rect x="7" y="24" width="22" height="20" rx="6" fill="#8A4B22"/><rect x="27" y="15" width="24" height="22" rx="6" fill="#9C5A2B"/><rect x="18" y="34" width="25" height="19" rx="6" fill="#7A3F1B"/><ellipse cx="14" cy="29" rx="5" ry="2.4" fill="#fff" opacity=".35"/><ellipse cx="35" cy="20" rx="6" ry="2.6" fill="#fff" opacity=".35"/><ellipse cx="26" cy="39" rx="6" ry="2.4" fill="#fff" opacity=".3"/></svg>',
 cabbage:'<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M6 38C8 22 24 13 33 23C40 12 56 19 52 35C48 50 12 53 6 38Z" fill="#B8DC9C"/><path d="M14 44C18 30 34 26 44 34C48 44 30 52 14 44Z" fill="#8FC46E"/><path d="M12 38Q28 28 48 30M22 22Q28 32 26 44M40 20Q38 32 42 42" fill="none" stroke="#5E9A44" stroke-width="2" stroke-linecap="round"/></svg>',
 corn:'<svg viewBox="0 0 60 60" aria-hidden="true"><g fill="#F2C230" stroke="#D29A16" stroke-width="1.4"><circle cx="18" cy="22" r="5"/><circle cx="29" cy="19" r="5"/><circle cx="40" cy="22" r="5"/><circle cx="13" cy="32" r="5"/><circle cx="24" cy="30" r="5"/><circle cx="35" cy="30" r="5"/><circle cx="46" cy="32" r="5"/><circle cx="18" cy="41" r="5"/><circle cx="29" cy="40" r="5"/><circle cx="40" cy="41" r="5"/><circle cx="29" cy="49" r="5"/></g></svg>',
 egg:'<svg viewBox="0 0 60 60" aria-hidden="true"><ellipse cx="30" cy="31" rx="24" ry="20" fill="#8A5326"/><ellipse cx="30" cy="31" rx="18" ry="14" fill="#EDCB98"/><circle cx="30" cy="31" r="8" fill="#E7A62A"/><ellipse cx="19" cy="20" rx="6" ry="2.6" fill="#fff" opacity=".3"/></svg>',
 fish:'<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="21" cy="34" r="14" fill="#F5F3EC" stroke="#C9C3B0" stroke-width="2"/><circle cx="39" cy="27" r="14" fill="#F7F5EF" stroke="#C9C3B0" stroke-width="2"/><ellipse cx="16" cy="29" rx="4" ry="2.4" fill="#fff"/><ellipse cx="34" cy="22" rx="4" ry="2.4" fill="#fff"/></svg>',
 tomato:'<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="34" r="19" fill="#D93A2B"/><ellipse cx="22" cy="27" rx="5" ry="3" fill="#fff" opacity=".45"/><path d="M30 16L34 21L41 19L37 24L42 28L34 26L30 31L26 26L18 28L23 24L19 19L26 21Z" fill="#3E8E3A"/><path d="M30 16V10" stroke="#3E8E3A" stroke-width="3" stroke-linecap="round"/></svg>'
};
var MOUTH='<svg viewBox="0 0 160 120" aria-hidden="true"><ellipse cx="80" cy="62" rx="76" ry="54" fill="#FBD9C0"/><ellipse cx="30" cy="74" rx="12" ry="7" fill="#F2A7A0" opacity=".7"/><ellipse cx="130" cy="74" rx="12" ry="7" fill="#F2A7A0" opacity=".7"/><path d="M28 54Q80 14 132 54Q80 118 28 54Z" fill="#D9474F"/><path d="M38 56Q80 26 122 56Q80 104 38 56Z" fill="#5A1E22"/><path d="M52 44Q80 32 108 44L106 52Q80 46 54 52Z" fill="#fff"/><ellipse cx="80" cy="80" rx="27" ry="12" fill="#F28A9A"/><path d="M80 72V86" stroke="#D9677A" stroke-width="2"/></svg>';
var CHOP='<svg class="st" viewBox="0 0 56 140" aria-hidden="true"><path class="hit" d="M44 6L12 133" stroke="transparent" stroke-width="34" stroke-linecap="round"/><path d="M36 4L8 132" stroke="#8C5A2B" stroke-width="7" stroke-linecap="round"/><path d="M52 8L16 134" stroke="#B7834A" stroke-width="7" stroke-linecap="round"/><path d="M36 4L31 27M52 8L46 31" stroke="#C8352B" stroke-width="8" stroke-linecap="round"/></svg>';
var TIPX=12,TIPY=133; /* tip point inside the chopstick box */

function intro(){
  app.innerHTML='';
  var c=el('div','card');
  c.append(el('p','lead','現在是海佃國小的營養午餐時間。你的餐盤上有 12 小塊菜，請想像你真的在吃。'),
           el('p','lead','用筷子把一塊菜夾起來，送進畫面上方的大嘴巴，就是吃一口。每吃一口，會問你一個小問題。'),
           el('p','lead','吃飽了，隨時都可以按「我吃飽了」。不一定要吃完。'));
  app.append(el('h1',null,'午餐夾夾樂'),gtag(),c,
    el('p','note','怎麼夾：把筷子拖到一塊菜上放開，筷子就會夾住它；再把筷子拖到嘴巴上放開，就吃下去了。<br>手指不好拖的話，也可以先點一塊菜，再點嘴巴。'),
    btn('開動！',null,function(){st.stage=1;save(st);render()}));
}

var held=-1,cleanup=null;
function eat(){
  held=-1;app.innerHTML='';
  var left=N-st.eaten.length;
  var cs=el('p','case');cs.append(el('span',null,'吃了 '+st.eaten.length+' 塊，還剩 '+left+' 塊'),gtag());
  var play=el('div','play');
  var top=el('div','top');
  var mouth=el('button','mouth',MOUTH+'<span>嘴巴</span>');mouth.type='button';mouth.setAttribute('aria-label','嘴巴：把夾住的菜送進來');
  var meter=el('div','meter');meter.appendChild(el('b',null,'飽足感'));
  var bar=el('div','bar');for(var i=0;i<N;i++)bar.appendChild(el('i',i<st.eaten.length?'on':null));meter.appendChild(bar);
  var rest=el('div','rest','<small>筷架</small>');
  top.append(mouth,meter,rest);
  var tray=el('div','tray');var tiles=[];
  st.tray.forEach(function(k,i){
    var gone=st.eaten.indexOf(i)>=0;
    var t=el('button','tile'+(gone?' empty':''),gone?'':FOOD[k]);t.type='button';
    t.setAttribute('aria-label',gone?'空的格子':NAME[k]);if(gone)t.disabled=true;
    t.addEventListener('click',function(){if(!gone)grab(i,true)});
    tray.appendChild(t);tiles.push(t);
  });
  var chop=el('div','chop',CHOP);var food=el('div','food');chop.appendChild(food);
  play.append(top,tray,chop);
  var hint=el('p','small hint','把筷子拖到一塊菜上，或先點一塊菜。');
  var endrow=el('div','endrow');
  function showFull(){endrow.innerHTML='';endrow.appendChild(btn('我吃飽了','full',function(){
    endrow.innerHTML='';var cf=el('div','confirm');
    cf.append(btn('對，我吃飽了',null,function(){finishMeal()}),btn('再吃一點','alt',showFull));
    endrow.append(el('p','lead','真的吃飽了嗎？'),cf);
  }))}
  showFull();
  app.append(cs,play,hint,endrow);

  var px=0,py=0;
  function prect(){return play.getBoundingClientRect()}
  function setTip(x,y,anim){px=x;py=y;chop.classList.toggle('anim',!!anim);chop.style.transform='translate('+(x-TIPX)+'px,'+(y-TIPY)+'px)'}
  function center(e){var r=e.getBoundingClientRect(),p=prect();return [r.left-p.left+r.width/2,r.top-p.top+r.height/2]}
  function restPos(anim){var r=rest.getBoundingClientRect(),p=prect();setTip(r.left-p.left+TIPX+3,r.top-p.top+TIPY+28,anim)}
  function inside(e,cx,cy,pad){var r=e.getBoundingClientRect();pad=pad||0;return cx>=r.left-pad&&cx<=r.right+pad&&cy>=r.top-pad&&cy<=r.bottom+pad}
  function grab(i,anim){
    if(held>=0)tiles[held].classList.remove('held');
    held=i;tiles[i].classList.add('held');food.innerHTML=FOOD[st.tray[i]];
    var c=center(tiles[i]);setTip(c[0]-4,c[1]+6,anim);
    mouth.classList.add('ready');hint.textContent='夾住了「'+NAME[st.tray[i]]+'」！把筷子拖到嘴巴，或點一下嘴巴。';
  }
  function bite(){
    if(held<0){hint.textContent='先用筷子夾一塊菜喔。';return}
    var c=center(mouth);setTip(c[0],c[1]+10,true);
    var i=held;chop.style.pointerEvents='none';
    setTimeout(function(){
      food.innerHTML='';mouth.classList.add('chew');
      st.eaten.push(i);st.ask=true;save(st);
      setTimeout(render,700);
    },320);
  }
  mouth.addEventListener('click',bite);

  var dragging=false,pid=null,offX=0,offY=0;
  function clearHover(){tiles.forEach(function(t){t.classList.remove('hover')});mouth.classList.remove('hover')}
  function hoverAt(cx,cy){
    clearHover();
    if(held>=0){if(inside(mouth,cx,cy,24))mouth.classList.add('hover');return}
    for(var i=0;i<tiles.length;i++){if(!tiles[i].disabled&&inside(tiles[i],cx,cy)){tiles[i].classList.add('hover');return i}}
    return -1;
  }
  chop.addEventListener('pointerdown',function(e){
    dragging=true;pid=e.pointerId;try{chop.setPointerCapture(pid)}catch(_){}
    chop.classList.add('drag');var p=prect();offX=px-(e.clientX-p.left);offY=py-(e.clientY-p.top);
    if(Math.abs(offX)>60||Math.abs(offY)>150){offX=0;offY=0}
    e.preventDefault();
  });
  chop.addEventListener('pointermove',function(e){
    if(!dragging||e.pointerId!==pid)return;
    var p=prect();var x=Math.min(p.width,Math.max(0,e.clientX-p.left+offX)),y=Math.min(p.height+40,Math.max(0,e.clientY-p.top+offY));
    setTip(x,y,false);hoverAt(p.left+x,p.top+y);e.preventDefault();
  });
  function up(e){
    if(!dragging||e.pointerId!==pid)return;dragging=false;chop.classList.remove('drag');
    var p=prect();var cx=p.left+px,cy=p.top+py;clearHover();
    if(held>=0){
      if(inside(mouth,cx,cy,24)){bite();return}
      for(var j=0;j<tiles.length;j++){if(j!==held&&!tiles[j].disabled&&inside(tiles[j],cx,cy)){grab(j,true);return}}
      return;
    }
    for(var i=0;i<tiles.length;i++){if(!tiles[i].disabled&&inside(tiles[i],cx,cy)){grab(i,true);return}}
    restPos(true);
  }
  chop.addEventListener('pointerup',up);chop.addEventListener('pointercancel',up);
  function onResize(){if(dragging)return;if(held>=0){var c=center(tiles[held]);setTip(c[0]-4,c[1]+6,false)}else restPos(false)}
  window.addEventListener('resize',onResize);
  cleanup=function(){window.removeEventListener('resize',onResize)};
  restPos(false);
  requestAnimationFrame(function(){restPos(false)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(!dragging&&held<0)restPos(false)});
  if(st.ask)askPop();
}

function askPop(){
  var k=st.tray[st.eaten[st.eaten.length-1]];
  var last=st.eaten.length>=N;
  var v=el('div','veil');var p=el('div','pop');p.setAttribute('role','dialog');p.setAttribute('aria-modal','true');
  var ate=el('div','ate',FOOD[k]);ate.appendChild(el('p',null,'你吃了第 '+st.eaten.length+' 塊：<b style="color:var(--ink)">'+NAME[k]+'</b>'));
  p.append(ate,el('h2',null,last?'如果還有下一口，你還想吃嗎？':'下一口，你還想吃嗎？'));
  var g=el('div','three');
  WANT.forEach(function(t,i){g.appendChild(btn(t,'alt',function(){
    st.want[st.eaten.length-1]=i;st.ask=false;
    if(st.eaten.length>=N)st.stage=2;
    save(st);render();
  }))});
  p.append(g,el('p','small','照你現在的感覺選就好，沒有對錯。'));
  v.appendChild(p);app.appendChild(v);
  var f=g.querySelector('button');if(f)try{f.focus({preventScroll:true})}catch(e){}
}

function finishMeal(){st.stage=2;st.ask=false;save(st);render()}

function after(n){
  app.innerHTML='';var Q=n===1?Q1:Q2;
  var cs=el('p','case');cs.append(el('span',null,'吃完以後，第 '+n+' 題，共 2 題'),gtag());
  var g=el('div','opts');
  Q.o.forEach(function(t,i){g.appendChild(btn(t,'alt',function(){if(n===1)st.q1=i;else st.q2=i;st.stage=n===1?3:4;save(st);render()}))});
  app.append(cs,el('p','lead','你這一餐吃了 '+st.eaten.length+' 塊（共 12 塊）。'),el('h2',null,Q.q),g,el('p','small','沒有對錯，選最接近你感覺的那一個。'));
}

function firstNo(){for(var i=0;i<st.want.length;i++){if(st.want[i]===2)return i+1}return 0}
function finish(){
  app.innerHTML='';
  var t=el('table');var fn=firstNo();
  [['你的組別',GN[st.g]],
   ['你吃了幾塊（共 12 塊）',st.eaten.length+' 塊'],
   ['吃完第幾塊，開始出現「不太想」',fn?'第 '+fn+' 塊':'沒有出現'],
   ['這一餐好吃嗎？',st.q1!=null?Q1.o[st.q1]:'—'],
   ['明天還是一樣的菜，你會？',st.q2!=null?Q2.o[st.q2]:'—']
  ].forEach(function(r){var tr=el('tr');tr.append(el('td','k',r[0]),el('td','v',r[1]));t.appendChild(tr)});
  var c=el('div','card');c.appendChild(t);
  var d=el('details');d.appendChild(el('summary',null,'老師說可以再打開'));
  d.appendChild(el('p','note','紅組的餐盤只有一種菜，藍組有六種菜。')).style.marginTop='10px';
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),gtag(),c,d);
}

window.addEventListener('hashchange',function(){var x=location.hash;if(x==='#reset'||x==='#red'||x==='#blue')location.reload()});
function render(){
  if(cleanup){cleanup();cleanup=null}
  if(st.stage<=0)intro();else if(st.stage===1)eat();else if(st.stage===2)after(1);else if(st.stage===3)after(2);else finish();
  window.scrollTo(0,0);
}
render();
})();
</script>
