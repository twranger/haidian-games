<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>手遊商城大搶購・全班連線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="live.js"></script>
<script src="room.js"></script>
<style>
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{font:inherit;text-align:left;border:3px solid #E3DED7;background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;touch-action:manipulation}
.it.hot{border-color:#F2A65A;background:linear-gradient(160deg,#FFF7E6,#FFE9C7)}
.it.on{outline:5px solid #2A6F68;background:#F0F7F6}
.it .nm{font-size:22px;font-weight:900;line-height:1.3}
.it .pw{font-size:26px;font-weight:900;color:#2A6F68}
.it .pr{font-size:20px;font-weight:900}
.it .pr s{color:#94A3B8;font-weight:500;margin-right:6px}
.it .tag{align-self:flex-start;font-size:15px;font-weight:900;color:#fff;background:#D95D39;border-radius:999px;padding:1px 10px;animation:blink 1s infinite}
.it .fine{font-size:11px;line-height:1.3;color:#A0A6AD;margin-top:2px}
@keyframes blink{50%{background:#F2A65A}}
.hud{position:sticky;top:0;z-index:5;background:#1E242B;color:#FAF7F2;border-radius:16px;padding:10px 16px;display:flex;justify-content:space-between;gap:10px;font-weight:900;font-size:20px;flex-wrap:wrap}
.hud b{color:#F2A65A}
.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}
.rk .no{width:44px;text-align:right;color:#94A3B8}.rk .who{width:90px}
.rk .barw{flex:1;background:#EEE9E1;border-radius:10px;height:34px;overflow:hidden}.rk .barw i{display:block;height:100%;background:#2A6F68;border-radius:10px}
.rk.fall .barw i{background:#D95D39}.rk .mv{width:120px;font-size:20px}
.huge{font-size:clamp(50px,7vw,96px);font-weight:900;line-height:1.1}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (prefers-reduced-motion:reduce){.it .tag{animation:none}}
</style>
</head>
<body>
<script>
var START=1000,DUR=60;
// trap：結算時才生效的小字。real(power)＝結算後真正的戰力；fee＝結算時另外扣的鑽石
var ITEMS=[
 {id:'armor',nm:'傳說龍鎧',price:400,old:800,pw:80,hot:'限時 5 折！',fine:'※試用版裝備，結算時自動收回。',real:0,why:'小字寫「試用版，結算時收回」，戰力變成 0'},
 {id:'sword',nm:'烈焰大劍',price:300,pw:50,fine:'',real:50},
 {id:'chest',nm:'神秘寶箱',price:350,pw:120,pwText:'最高 +120',hot:'最後 3 個！',fine:'※開出 +120 的機率為 5%，其餘為 +10。',real:10,why:'小字寫「95% 只有 +10」，這次開出 +10'},
 {id:'boots',nm:'閃電靴',price:250,pw:35,fine:'',real:35},
 {id:'card',nm:'黃金月卡',price:200,old:400,pw:40,hot:'首儲雙倍！',fine:'※本商品為自動續訂，結算時再扣 300 鑽。',real:40,fee:300,why:'小字寫「自動續訂，結算時再扣 300 鑽」'},
 {id:'helmet',nm:'鐵頭盔',price:200,pw:30,fine:'',real:30},
 {id:'potion',nm:'經驗藥水',price:150,pw:25,hot:'今日熱賣',fine:'※限 50 等以上角色使用（你是 12 等）。',real:0,why:'小字寫「50 等以上才能用」，你只有 12 等，戰力 0'},
 {id:'shield',nm:'木盾',price:100,pw:15,fine:'',real:15}];
var BY={};ITEMS.forEach(function(x){BY[x.id]=x});
function players(H){return Object.keys(H.seats).length}
function cost(c){var s=0;(c||[]).forEach(function(i){s+=BY[i].price});return s}
function shown(c){var p=0;(c||[]).forEach(function(i){p+=BY[i].pw});return p+Math.round((START-cost(c))/10)}
function real(c){var p=0,fee=0;(c||[]).forEach(function(i){p+=BY[i].real;fee+=BY[i].fee||0});return p+Math.round((START-cost(c)-fee)/10)}
function traps(c){return (c||[]).filter(function(i){return BY[i].why}).length}
function ranks(g,fn){var C=g.cart||{};return Object.keys(C).map(function(s){return {s:+s,v:fn(C[s])}}).sort(function(a,b){return b.v-a.v||a.s-b.s})}
function rankHTML(list,max,prev){var pos={};(prev||[]).forEach(function(x,i){pos[x.s]=i});
 return '<div class="rank">'+list.slice(0,10).map(function(x,i){var mv='';if(prev){var d=pos[x.s]-i;mv=d>0?'<span style="color:#2A6F68">↑ 升 '+d+' 名</span>':d<0?'<span style="color:#D95D39">↓ 掉 '+(-d)+' 名</span>':'<span style="color:#94A3B8">不變</span>'}
  return '<div class="rk'+(prev&&pos[x.s]<i?' fall':'')+'"><span class="no">'+(i+1)+'</span><span class="who">'+x.s+' 號</span><div class="barw"><i style="width:'+Math.max(2,x.v/max*100)+'%"></i></div><span style="width:70px">'+x.v+'</span>'+(prev?'<span class="mv">'+mv+'</span>':'')+'</div>'}).join('')+'</div>'}
ROOM.start({
 key:'shopgrab',title:'手遊商城大搶購',kick:'第 1 節・注意力　全班連線',studentUrl:'shopgrab.html',
 rules:'<p>每個人有 <b>1000 鑽石</b>。商城只開 <b>60 秒</b>，請買裝備，讓自己的<b>戰力</b>越高越好。</p><p>每樣裝備只能買一個，再按一次可以退掉。沒花完的鑽石，每 10 鑽也算 1 點戰力。時間到，全班比戰力排行榜！</p>',
 init:function(H){H.g={}},
 onStart:function(H){H.g={cart:{}};H.ph='ready'},
 pub:function(H){var g=H.g,open=H.ph==='rank1'||H.ph==='rank2'||H.ph==='sum';return {g:{t0:g.t0,n:Object.keys(g.cart||{}).length,top:open?ranks(g,H.ph==='rank1'?shown:real).slice(0,3):null}}},
 onMsg:function(H,d,seat){if(d.t==='cart'&&H.ph==='play'){var c=(d.items||[]).filter(function(i){return BY[i]});if(cost(c)<=START){H.g.cart[seat]=c;return true}}},
 tick:function(H){if(H.ph==='play'&&Date.now()-H.g.t0>=DUR*1000){H.ph='rank1';return true}},
 tickText:function(H){return '還剩 '+Math.max(0,Math.ceil(DUR-(Date.now()-H.g.t0)/1000))+' 秒'},
 act:{go:function(H){H.g.t0=Date.now();H.ph='play'},r2:function(H){H.ph='rank2'},sum:function(H){H.ph='sum'}},
 bar:function(H){if(H.ph==='ready')return '<button class="btn" data-act="go">商城開門！（60 秒）</button>';
  if(H.ph==='rank1')return '<button class="btn" data-act="r2">等一下……把「小字」算進去</button>';
  if(H.ph==='rank2')return '<button class="btn te" data-act="sum">小字到底寫了什麼？</button>';return ''},
 hostView:function(H){var g=H.g,N=players(H),C=g.cart||{},h='';
  if(H.ph==='ready')h+='<div class="card dark"><p class="huge">每人 1000 鑽石</p><p class="stat">商城只開 60 秒，買裝備比戰力！</p></div>';
  else if(H.ph==='play'){var r=ranks(g,shown);
   h+='<div class="card dark"><p class="stat">商城營業中　<span id="hdtick" style="color:#F2A65A"></span>　已經下手：'+r.length+' / '+N+' 人</p></div><div class="card"><h2>目前戰力排行榜</h2>'+(r.length?rankHTML(r,Math.max(100,r[0].v)):'<p class="lead">還沒有人買。</p>')+'</div>'}
  else if(H.ph==='rank1'){var r1=ranks(g,shown);h+='<div class="card dark"><p class="huge">時間到！</p><p class="stat">商城畫面上的戰力排行榜</p></div><div class="card">'+(r1.length?rankHTML(r1,Math.max(100,r1[0].v)):'<p class="lead">沒有人買東西。</p>')+'</div>'}
  else if(H.ph==='rank2'){var a=ranks(g,shown),b=ranks(g,real);
   h+='<div class="card warm"><p class="stat" style="color:#D95D39">把商品角落的「小字」算進去以後……</p></div><div class="card"><h2>真正的戰力排行榜</h2>'+(b.length?rankHTML(b,Math.max(100,a.length?a[0].v:100),a):'')+'</div>'}
  else{var ks=Object.keys(C),clean=ks.filter(function(s){return !traps(C[s])}).length;
   h+='<div class="card dark"><p class="stat">全班 '+ks.length+' 人裡，完全沒被小字騙到的：<span style="color:#F2A65A;font-size:56px">'+clean+'</span> 人</p></div><div class="card"><table><tr><th>閃亮的商品</th><th>大字寫</th><th>角落的小字</th><th>買的人</th></tr>'+
    ITEMS.filter(function(x){return x.why}).map(function(x){var n=ks.filter(function(s){return C[s].indexOf(x.id)>=0}).length;return '<tr><td><b>'+x.nm+'</b></td><td style="color:#D95D39">'+x.hot+'　戰力 '+(x.pwText||'+'+x.pw)+'</td><td>'+x.fine.replace('※','')+'</td><td><b>'+n+' 人</b></td></tr>'}).join('')+'</table></div>'+
    '<div class="card warm"><p style="font-size:24px">小字一直都在畫面上，你的眼睛也掃過了。可是商城把「限時」「最後 3 個」「雙倍」做得又大又閃，再加上倒數計時，你的注意力就被帶走了。<b>畫面要你看哪裡，是設計好的。</b>按下購買之前，把整個畫面再看一遍。</p></div>'}
  return h},
 studentView:function(ST,me,api){var g=ST.g||{},k='s'+g.t0,L=api.local[k]||{c:[]},h='';
  if(ST.ph==='ready')h+='<h1>準備搶購！</h1><p class="lead">你有 1000 鑽石。等老師開門，商城只開 60 秒。</p>';
  else if(ST.ph==='play'){var m=window._lt||(window._lt={});if(!m[g.t0])m[g.t0]=Date.now();var left=Math.max(0,Math.ceil(DUR-(Date.now()-m[g.t0])/1000)),c=L.c,rest=START-cost(c);
   h+='<div class="hud"><span>鑽石 <b>'+rest+'</b></span><span>戰力 <b>'+shown(c)+'</b></span><span>剩 <b id="sgleft">'+left+'</b> 秒</span></div><div class="shop">'+
    ITEMS.map(function(x){var on=c.indexOf(x.id)>=0,can=on||rest>=x.price;return '<button class="it'+(x.hot?' hot':'')+(on?' on':'')+'" data-act="buy" data-arg="'+x.id+'" '+(can?'':'style="opacity:.45"')+'>'+(x.hot?'<span class="tag">'+x.hot+'</span>':'')+
     '<span class="nm">'+x.nm+'</span><span class="pw">戰力 '+(x.pwText||'+'+x.pw)+'</span><span class="pr">'+(x.old?'<s>'+x.old+'</s>':'')+x.price+' 鑽</span>'+(on?'<span style="font-weight:900;color:#2A6F68">已購買（再按一次退掉）</span>':'')+(x.fine?'<span class="fine">'+x.fine+'</span>':'')+'</button>'}).join('')+'</div>'}
  else if(ST.ph==='rank1')h+='<h1>時間到！</h1><div class="card"><p class="stat">你的戰力：'+shown(L.c)+'</p></div><p class="lead">看大螢幕的排行榜。</p>';
  else{var c2=L.c,bad=c2.filter(function(i){return BY[i].why});
   h+='<h1>把小字算進去以後</h1><div class="card '+(bad.length?'warm':'cool')+'"><p class="stat">商城寫的戰力：'+shown(c2)+'<br>真正的戰力：<span style="color:'+(bad.length?'#D95D39':'#2A6F68')+'">'+real(c2)+'</span></p></div>'+
    (bad.length?bad.map(function(i){return '<div class="card"><p><b>'+BY[i].nm+'</b>：'+BY[i].why+'。</p></div>'}).join(''):'<div class="card cool"><p class="stat">你一個小字陷阱都沒踩到！</p></div>')+'<p class="lead">看大螢幕。</p>'}
  return h},
 sact:{buy:function(ST,me,api,id){if(ST.ph!=='play')return;var g=ST.g,k='s'+g.t0,L=api.local[k]||{c:[]},c=L.c.slice(),i=c.indexOf(id);
  if(i>=0)c.splice(i,1);else{if(START-cost(c)<BY[id].price)return;c.push(id)}L.c=c;api.local={};api.local[k]=L;api.send({t:'cart',items:c});api.save()}}
});
setInterval(function(){var e=document.getElementById('sgleft'),m=window._lt;if(e&&m){var t0=Object.keys(m).pop();e.textContent=Math.max(0,Math.ceil(DUR-(Date.now()-m[t0])/1000))}},500);
</script>
</body>
</html>
