<meta charset="utf-8">
<script src="fresh.js"></script>
<title>誰最適合當隊長</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: story → your hand of 9 clue cards → round table meeting (3 rounds: 3 teammates speak in bubbles and their cards slide onto the table; you push one card from your hand to the table centre) → vote → group result → flip everyone's hand (all 14 clues) + who do you now think fits → what will you do first next time → summary for a show of hands. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --kc:#205E86; --kf:#E4EEF5; --qc:#2F7D4F; --qf:#E3F1E7; --dc:#8A6216; --df:#FBF1DC;
  --wood:#EBD7AE; --woodline:#C9A66B;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,3vw,27px);font-weight:900;margin:0;display:flex;align-items:center;gap:8px}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;justify-content:flex-start}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.go{background:var(--rust)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.hcard:focus-visible,.cand:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.letter{display:inline-block;min-width:1.6em;font-weight:900;color:var(--sea);flex:none}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note.green{background:var(--qf)}
.opts{display:flex;flex-direction:column;gap:10px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
svg.av{width:100%;height:100%;display:block}
/* people */
.ppl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.pp .face{width:clamp(64px,11vw,96px);height:clamp(64px,11vw,96px)}
.pp b{font-size:clamp(21px,3vw,27px)}
.pp span{font-size:clamp(19px,2.3vw,21px);color:var(--muted);line-height:1.4}
/* clue cards (hand preview + reveal) */
.clist{display:flex;flex-direction:column;gap:8px}
.clue{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;border:3px solid var(--cc);background:var(--cf);border-radius:16px;padding:10px 14px}
.clue>svg.i{width:1.9em;height:1.9em;margin-top:2px}
.clue p{margin:0;font-size:clamp(19px,2.5vw,23px);line-height:1.6}
.clue .tags{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:clamp(19px,2.2vw,20px);font-weight:700;color:var(--muted)}
.clue .tags span{display:inline-flex;align-items:center;gap:4px}
.clue .tags .said{color:var(--good)}
.clue .tags .nos{color:var(--rust)}
.clue.unsaid{border-style:dashed}
.ctag{display:inline-flex;align-items:center;gap:6px;font-weight:900;color:var(--cc)}
.ctag .mini{width:30px;height:30px;flex:none}
.K{--cc:var(--kc);--cf:var(--kf)} .Q{--cc:var(--qc);--cf:var(--qf)} .D{--cc:var(--dc);--cf:var(--df)}
/* meeting */
.mtg{display:flex;flex-direction:column;align-items:stretch;gap:0;position:relative}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 16px 12px;margin-bottom:14px;min-height:7.2em;display:flex;flex-direction:column;gap:6px}
.bubble::after{content:"";position:absolute;bottom:-13px;left:calc(var(--tail,50%) - 11px);width:20px;height:20px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg);border-bottom-right-radius:4px}
.bubble.none::after{display:none}
.bubble .who{margin:0;font-weight:900;font-size:clamp(19px,2.4vw,22px);color:var(--muted)}
.bubble .say{margin:0;font-size:clamp(19px,2.7vw,25px);font-weight:700;line-height:1.55}
.bcard{display:flex;gap:10px;align-items:flex-start;border:3px solid var(--cc);background:var(--cf);border-radius:14px;padding:8px 12px;font-size:clamp(19px,2.4vw,22px);line-height:1.55}
.bcard svg.i{width:1.6em;height:1.6em;margin-top:1px}
.bubble.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.2}to{transform:none;opacity:1}}
.seats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:relative;z-index:2;margin-bottom:-26px}
.seat{display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .2s}
.seat .face{width:clamp(58px,10vw,84px);height:clamp(58px,10vw,84px);border-radius:50%;border:4px solid transparent;transition:border-color .2s}
.seat .nm{font-weight:900;font-size:clamp(19px,2.4vw,22px);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:0 10px;margin-top:-8px;line-height:1.5}
.seat.on .face{border-color:var(--gold)}
.seat.on{transform:translateY(-4px)}
.tbl{position:relative;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#F4E6C6 0%,var(--wood) 70%);border:5px solid var(--woodline);box-shadow:inset 0 -6px 0 rgba(150,110,50,.18);min-height:clamp(230px,34vw,300px);padding:46px 15% 52px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px;transition:box-shadow .2s,border-color .2s}
.tbl .empty{color:#8C7A4C;font-weight:700;font-size:clamp(19px,2.4vw,21px);text-align:center}
.tbl.drop{border-color:var(--gold);box-shadow:0 0 0 6px rgba(183,134,43,.35),inset 0 -6px 0 rgba(150,110,50,.18);cursor:pointer}
.tbl.over{background:radial-gradient(ellipse at 50% 40%,#FFF5DC 0%,#F2DFB4 70%)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--cc);background:var(--cf);color:var(--ink);border-radius:999px;padding:2px 10px 2px 3px;font-weight:900;font-size:clamp(17px,2.2vw,20px);line-height:1.4;max-width:100%}
.chip .mini{width:28px;height:28px;flex:none}
.chip .x{white-space:nowrap;background:var(--cc);color:#fff;border-radius:999px;padding:0 7px;font-size:.85em;font-variant-numeric:tabular-nums}
.chip.land{animation:land .45s ease-out}
.chip.hide{visibility:hidden}
@keyframes land{0%{transform:scale(1.25)}100%{transform:none}}
.me{display:flex;flex-direction:column;align-items:center;margin-top:-30px;position:relative;z-index:2}
.me .face{width:clamp(58px,10vw,84px);height:clamp(58px,10vw,84px);border-radius:50%;border:4px solid transparent}
.me.on .face{border-color:var(--gold)}
.me .nm{font-weight:900;font-size:clamp(19px,2.4vw,22px);background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;margin-top:-8px;line-height:1.5}
.roundbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots span{width:18px;height:18px;border-radius:50%;border:3px solid var(--sea)}
.dots span.on{background:var(--sea)}
/* hand */
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hcard{font:inherit;text-align:left;color:var(--ink);border:3px solid var(--cc);background:var(--cf);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:84px;position:relative;transition:transform .12s,box-shadow .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.hcard .top{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--cc);font-size:clamp(17px,2vw,19px)}
.hcard .top .mini{width:26px;height:26px;flex:none}
.hcard .top svg.i{margin-left:auto;width:1.4em;height:1.4em;color:var(--ink)}
.hcard .t{font-weight:900;font-size:clamp(19px,2.4vw,22px);line-height:1.35}
.hcard .s{font-size:clamp(16px,1.9vw,18px);font-weight:700;color:var(--muted)}
.hcard.sel{transform:translateY(-6px);box-shadow:0 8px 0 var(--gold);border-color:var(--gold);touch-action:none}
.hcard.used{opacity:.42;cursor:default;border-style:dashed}
.hcard.dragging{opacity:.3}
.pick-panel{display:flex;flex-direction:column;gap:10px}
.fly{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border:3px solid var(--cc);background:var(--cf);border-radius:14px;padding:6px 10px;font-weight:900;box-shadow:0 10px 24px rgba(0,0,0,.22);display:flex;align-items:center;gap:6px;font-size:clamp(17px,2.2vw,20px);white-space:nowrap;overflow:hidden}
.fly .mini{width:26px;height:26px;flex:none}
/* vote */
.cands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cand{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center}
.cand .face{width:clamp(60px,11vw,90px);height:clamp(60px,11vw,90px)}
.cand b{font-size:clamp(21px,3vw,27px);color:var(--cc)}
.cand span{font-size:clamp(17px,2.1vw,19px);color:var(--muted);font-weight:700;line-height:1.35}
.cand.pick{border-color:var(--gold);background:var(--warm);box-shadow:0 5px 0 var(--gold)}
.votes{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px 12px}
.vrow .face{width:56px;height:56px;grid-row:span 2}
.vrow .v1{font-size:clamp(19px,2.6vw,24px);font-weight:900;margin:0}
.vrow .v1 em{font-style:normal;color:var(--cc)}
.vrow .v2{font-size:clamp(19px,2.2vw,21px);color:var(--muted);margin:0;line-height:1.5}
.vrow.anim{animation:vin .45s ease-out both}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.final{background:var(--warm);border:3px solid var(--gold);border-radius:22px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.fade{animation:vin .45s ease-out both}
.final.anim{animation:vin .5s ease-out both}
.final .k{margin:0;font-size:clamp(19px,2.6vw,24px);font-weight:700;color:var(--muted)}
.final .v{margin:0;font-size:clamp(34px,6vw,52px);font-weight:900;display:flex;align-items:center;gap:10px;line-height:1.2;color:var(--cc)}
.final .v svg.i{width:1.2em;height:1.2em;color:var(--ink)}
.final .v .face{width:1.5em;height:1.5em}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tally div{border:3px solid var(--cc);background:var(--cf);border-radius:16px;padding:8px;text-align:center}
.tally b{display:block;font-size:clamp(21px,3vw,26px);color:var(--cc)}
.tally span{font-size:clamp(17px,2.2vw,20px);font-weight:700;line-height:1.45;display:block}
/* summary */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:middle}
.rec td:first-child{font-weight:700;color:var(--muted);width:46%}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .hand{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl{padding:40px 8% 46px}
  .chip{font-size:16px;gap:4px}
  .chip .mini{width:24px;height:24px}
  .card.K,.card.Q,.card.D{padding:12px 10px}
  .clue{padding:8px 10px;gap:4px 8px}
  .tally{grid-template-columns:1fr}
  .rec td:first-child{width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* replay everything said so far → table entries */
function replay(upto){
  // upto: {r, ph, li} ; returns {tab:{id:{n,by:[]}}, order:[ids], events:[...]}
  var tab={},order=[],ev=[];
  function add(id,who){if(!tab[id]){tab[id]={n:0,by:[]};order.push(id)}tab[id].n++;tab[id].by.push(who)}
  for(var rr=0;rr<=upto.r;rr++){
    var snap={};order.forEach(function(k){snap[k]=1});
    var ls=lines(rr,snap);
    var nl=rr<upto.r?3:(upto.ph==='talk'?upto.li+1:3);
    for(var i=0;i<nl;i++){ev.push({kind:'line',r:rr,i:i,line:ls[i],was:!!tab[ls[i].c]});add(ls[i].c,ls[i].w)}
    if(st.mine[rr]&&(rr<upto.r||upto.ph==='react')){var id=st.mine[rr];ev.push({kind:'me',r:rr,id:id,was:!!tab[id]});add(id,'Y')}
  }
  return {tab:tab,order:order,ev:ev};
}

}

/* fly a card image from a rect to an element */
function fly(fromRect,toEl,html,cls,cb){
  if(!toEl||!fromRect||reduced()||!document.body.animate){cb();return}
  var f=el('div','fly '+cls,html);document.body.appendChild(f);
  var tr=toEl.getBoundingClientRect();
  var fw=Math.min(fromRect.width,320);
  f.style.width=fw+'px';
  var x0=fromRect.left+(fromRect.width-fw)/2,y0=fromRect.top,x1=tr.left+tr.width/2-fw/2,y1=tr.top+tr.height/2-f.offsetHeight/2;
  var a=f.animate([{transform:'translate('+x0+'px,'+y0+'px) scale(1)',opacity:1},{transform:'translate('+((x0+x1)/2)+'px,'+(Math.min(y0,y1)-30)+'px) scale(1.05) rotate(-4deg)',opacity:1,offset:.45},{transform:'translate('+x1+'px,'+y1+'px) scale(.8)',opacity:.85}],{duration:700,easing:'ease-in-out',fill:'forwards'});
  var done=false;function fin(){if(done)return;done=true;f.remove();cb()}
  a.onfinish=fin;setTimeout(fin,1100);
}

  app.append(el('p','case',ic('table')+'開會選隊長'),el('h1',null,'誰最適合當隊長'),c,c2,n,button('看看我的線索卡','btn',function(){go(1)}));
}

/* ---------- step 2: the meeting ---------- */
function meeting(animate,fromRect){
  st.step=2;
  app.innerHTML='';
  var R=replay({r:st.r,ph:st.ph,li:st.li});
  var last=R.ev[R.ev.length-1];
  var bar=el('div','roundbar');
  var dots='<span class="dots">';for(var i=0;i<3;i++)dots+='<span class="'+(i<=st.r?'on':'')+'"></span>';dots+='</span>';
  bar.append(el('p','case',ic('table')+'第 '+(st.r+1)+' 回合（共 3 回合）'),el('span',null,dots));
  app.appendChild(bar);
  var m=el('div','mtg');
  // bubble
  var who=null,bub=el('div','bubble');
  if(st.ph==='talk'){
    var ln=last.line;who=ln.w;var x=CL[ln.c];
    bub.style.setProperty('--tail',TAIL[who]);
    bub.innerHTML='<p class="who">'+MATE[who]+'說：</p><p class="say">'+ln.t+'</p><div class="bcard '+x.c+'">'+ic(x.g?'good':'bad')+'<span>'+x.s+'</span></div>';
  }else if(st.ph==='react'){
    var re=reaction(last.id,last.was);who=re.w;
    bub.style.setProperty('--tail',TAIL[who]);
    var xm=CL[last.id];bub.innerHTML='<div class="bcard '+xm.c+'">'+ic(xm.g?'good':'bad')+'<span><b>你說：</b>'+xm.s+'</span></div><p class="who">'+MATE[who]+'說：</p><p class="say">'+re.t+'</p>';
  }else{
    bub.className='bubble none';
    bub.innerHTML='<p class="who">三位組員都說完了。</p><p class="say">大家都看著你：「換你說了！」</p>';
  }
  if(animate)bub.classList.add('pop');
  m.appendChild(bub);
  var seats=el('div','seats');
  ['A','B','C'].forEach(function(k){var s=el('div','seat'+(k===who?' on':''));s.innerHTML=face(k)+'<span class="nm">'+MATE[k]+'</span>';seats.appendChild(s)});
  m.appendChild(seats);
  var hideId=animate?(last.kind==='line'?last.line.c:last.id):null;
  var tbl=el('div','tbl',chipsHtml(R,hideId&&!last.was?hideId:null));
  tbl.setAttribute('aria-label','會議桌：桌上說出來的線索');
  m.appendChild(tbl);
  var me=el('div','me'+(st.ph==='hand'?' on':''));me.innerHTML=face('Y')+'<span class="nm">你</span>';
  m.appendChild(me);
  app.appendChild(m);
  var below=el('div','opts');app.appendChild(below);
  var busy=!!animate;
  function land(){
    busy=false;
    var id=last.kind==='line'?last.line.c:last.id;
    var ch=tbl.querySelector('.chip[data-id="'+id+'"]');
    if(ch){ch.classList.remove('hide');ch.classList.add('land')}
    app.dataset.ready='1';
    if(st.ph==='react'){try{var r=tbl.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)tbl.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}}
  }
  app.dataset.ready=animate?'0':'1';
  if(animate){
    var src=fromRect||(bub.querySelector('.bcard')?bub.querySelector('.bcard').getBoundingClientRect():null);
    var id0=last.kind==='line'?last.line.c:last.id,x0=CL[id0];
    var target=tbl.querySelector('.chip[data-id="'+id0+'"]')||tbl;
    setTimeout(function(){fly(src,target,mini(x0.c)+CAND[x0.c]+'：'+x0.t,x0.c,land)},animate==='late'?0:350);
  }
  if(st.ph==='talk'){
    var nb=button(st.li<2?'下一位說':'輪到你了','btn',function(){
      if(busy)return;
      if(st.li<2){st.li++;save(st);meeting(true)}
      else{st.ph='hand';st.sel=null;save(st);meeting(false);try{document.querySelector('.hand').scrollIntoView({behavior:'smooth',block:'end'})}catch(e){}}
    });
    below.appendChild(nb);
  }else if(st.ph==='react'){
    below.appendChild(button(st.r<2?'下一回合':'三回合結束，大家來投票','btn',function(){
      if(busy)return;
      if(st.r<2){st.r++;st.ph='talk';st.li=0;st.sel=null;save(st);meeting(true);try{window.scrollTo(0,0)}catch(e){}}
      else{st.sel=null;go(3)}
    }));
  }else handPhase(below,tbl,R);
}

function handPhase(box,tbl,R){
  box.append(el('h2',null,'輪到你了！挑一張卡，把它推到桌子中央。'),el('p','lead','點一張卡，再把它往上推到桌子上（或按下面的按鈕）。已經在桌上的卡，你也可以再說一次。'));
  var hand=el('div','hand');hand.setAttribute('role','group');hand.setAttribute('aria-label','你的線索卡');
  var panel=el('div','pick-panel');
  var said={};st.mine.forEach(function(k){said[k]=1});
  var cards={};
  HAND.forEach(function(id){
    var x=CL[id];var used=!!said[id];var on=!!R.tab[id];
    var b=el('button','hcard '+x.c+(used?' used':'')+(st.sel===id?' sel':''));b.type='button';b.dataset.id=id;
    b.innerHTML='<span class="top">'+mini(x.c)+CAND[x.c]+ic(x.g?'good':'bad')+'</span><span class="t">'+x.t+'</span><span class="s">'+(used?'你說過了':(on?'桌上已經有了':'&nbsp;'))+'</span>';
    b.setAttribute('aria-label',CAND[x.c]+'：'+x.t+(used?'，你說過了':(on?'，桌上已經有了':'')));
    if(used)b.disabled=true;
    cards[id]=b;hand.appendChild(b);
    b.addEventListener('click',function(){if(used||dragMoved)return;select(id)});
    b.addEventListener('pointerdown',function(ev){if(used)return;startDrag(ev,id,b)});
  });
  var pushBtn=button(ic('push')+' 把這張推到桌子中央','btn go',function(){if(st.sel)push(st.sel)});
  function updPanel(){
    panel.innerHTML='';
    if(st.sel){var x=CL[st.sel];var d=el('div','bcard '+x.c,ic(x.g?'good':'bad')+'<span><b>你要說：</b>'+x.s+'</span>');panel.appendChild(d)}
    else panel.appendChild(el('p','note','還沒有選卡。點一下你想說的那一張。'));
    pushBtn.disabled=!st.sel;
    tbl.classList.toggle('drop',!!st.sel);
  }
  function select(id){
    st.sel=id;save(st);
    for(var k in cards)cards[k].classList.toggle('sel',k===id);
    updPanel();
  }
  tbl.addEventListener('click',function(){if(st.ph==='hand'&&st.sel)push(st.sel)});
  var pushing=false;
  function push(id){
    if(pushing)return;pushing=true;
    var rect=cards[id].getBoundingClientRect();
    st.mine[st.r]=id;st.ph='react';st.sel=null;save(st);
    meeting('late',rect);
  }
  /* drag (mouse/pen any card; touch only the selected card) */
  var dragMoved=false;
  function startDrag(ev,id,b){
    if(ev.pointerType==='touch'&&st.sel!==id)return;
    if(ev.button!=null&&ev.button!==0)return;
    var sx=ev.clientX,sy=ev.clientY,ghost=null;dragMoved=false;
    try{b.setPointerCapture(ev.pointerId)}catch(e){}
    function over(x,y){var r=tbl.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom+20}
    function mv(e){
      var dx=e.clientX-sx,dy=e.clientY-sy;
      if(!dragMoved&&Math.abs(dx)+Math.abs(dy)<10)return;
      if(!dragMoved){dragMoved=true;if(st.sel!==id)select(id);var x=CL[id];ghost=el('div','fly '+x.c,mini(x.c)+CAND[x.c]+'：'+x.t);document.body.appendChild(ghost);b.classList.add('dragging')}
      e.preventDefault();
      ghost.style.transform='translate('+(e.clientX-ghost.offsetWidth/2)+'px,'+(e.clientY-ghost.offsetHeight/2)+'px) rotate(-3deg)';
      tbl.classList.toggle('over',over(e.clientX,e.clientY));
    }
    function up(e){
      b.removeEventListener('pointermove',mv);b.removeEventListener('pointerup',up);b.removeEventListener('pointercancel',up);
      if(ghost){ghost.remove();b.classList.remove('dragging');tbl.classList.remove('over');
        if(e.type==='pointerup'&&over(e.clientX,e.clientY))push(id);
        setTimeout(function(){dragMoved=false},50);
      }
    }
    b.addEventListener('pointermove',mv);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
  }
  box.append(hand,panel,pushBtn);
  updPanel();
}

/* ---------- votes ---------- */
function teamVotes(tab){
  var p=points(tab),v={};
  ['A','B','C'].forEach(function(k){v[k]=p>=NEED[k]?'Q':'K'});
  return v;
}
var WHY={
  A:{K:'桌上說最多次的就是阿凱，我投阿凱。',Q:'我本來一直想投阿凱，可是聽完這些卡，我改投小晴。'},
  B:{K:'阿凱很熱心、聲音又大，我投阿凱。',Q:'小晴會注意大家的安全，我改投小晴。'},
  C:{K:'跑得快又會喊集合，我投阿凱。',Q:'去溪邊，安全最重要，我改投小晴。'}
};
function voteStep(){

/* ---------- step 5: reveal all hands ---------- */

  if(mineU>0){

  }else{

   ['看完全部線索，我覺得最適合的是',st.best?'<b>'+CAND[st.best]+'</b>':'—'],
   ['下次小組討論，我會先',st.next!=null?'<b>'+NX[st.next][0]+'</b>　'+NX[st.next][1]:'—']].forEach(function(r){
    var tr=el('tr');tr.append(el('td',null,r[0]),el('td',null,r[1]));t.appendChild(tr);
  });
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}

function render(){
  if(st.step>=3&&st.mine.length<3)st.step=2;
  if(st.step>=4&&!st.votes)st.step=3;
  if(st.step>=6&&!st.best)st.step=5;
  if(st.step>=7&&st.next==null)st.step=6;
  if(st.step===2){meeting(false);return}
  var S=[intro,handPreview,null,voteStep,resultStep,revealStep,nextStep,end];
  (S[st.step]||intro)();
}
window.hidden3Test={lines:lines,replay:replay,teamVotes:teamVotes,points:points,state:function(){return st}};
render();
})();
</script>
