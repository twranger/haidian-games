<meta charset="utf-8">
<script src="fresh.js"></script>
<title>敲開大石頭</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Flow: story → Tue/Wed/Thu nights (one big rock "做海報": start the poster or "明天再說" with three neutral options; starting only adds a tiny bit) → Thursday bedtime: sister hands over a small hammer, tap the rock (or drag the hammer) to knock off small concrete steps (at least 5 of 8, revealed in crypto-shuffled order) → drag to reorder, circle tonight's first stone → do that one → Fri/Sat: drag stones into tonight's basket (40 minutes), done stones become poster pieces → Monday: poster completion + big-rock nights vs small-stone nights → "where do you usually get stuck" (no right answer) → summary for a show of hands. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --stone:#E9E5DA; --stoneline:#8C8473;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4;display:flex;align-items:center;gap:8px}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.soft{background:var(--card);color:var(--sea);border:3px solid var(--sea)}
.btn:focus-visible,.grip:focus-visible,.stn:focus-visible,.hammer:focus-visible,.rockbtn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
.hint{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.btn.alt svg.i{width:1.7em;height:1.7em}
.case svg.i{width:1.5em;height:1.5em}
/* week strip */
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0;padding:0;list-style:none}
.wd{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:900;font-size:19px;line-height:1.4;color:var(--muted)}
.wd svg.i{width:30px;height:30px}
.wd .em{width:30px;height:30px;display:block}
.wd.now{border-color:var(--gold);background:var(--warm);color:var(--ink)}
.wd.past{opacity:.8}
.wd.mon{border-style:dashed}
/* scene */
.sbox{position:relative;background:#F4EFE3;border:3px solid var(--line);border-radius:20px;overflow:hidden}
.scene{width:100%;height:auto;display:block}
.rk{transform-origin:300px 300px;transform:scale(var(--sc,1));transition:transform .35s}
.rk .ck{transition:opacity .2s}
.rk.wob{animation:wob .45s ease-in-out 3}
@keyframes wob{25%{transform:scale(var(--sc,1)) rotate(-1.4deg)}75%{transform:scale(var(--sc,1)) rotate(1.4deg)}}
.rk.hit{animation:hit .25s ease-out}
@keyframes hit{30%{transform:scale(var(--sc,1)) translate(-5px,3px)}60%{transform:scale(var(--sc,1)) translate(4px,-2px)}}
.rk.gone{transform:scale(0);opacity:0;transition:transform .45s,opacity .45s}
.zsign{position:absolute;right:3%;top:5%;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;font-weight:900;font-size:clamp(19px,2.6vw,24px);display:flex;align-items:center;gap:8px;pointer-events:none;box-shadow:0 4px 0 rgba(31,42,46,.18);max-width:70%}
.prog{margin:-6px 0 0;font-weight:900;font-size:clamp(19px,2.6vw,23px);display:flex;align-items:center;gap:8px}
.prog b{color:var(--good)}
.chip{position:absolute;left:3%;top:5%;background:rgba(251,252,249,.95);border:3px solid var(--line);border-radius:14px;padding:2px 12px;font-weight:900;font-size:19px;pointer-events:none}
.chip b{color:var(--good)}
.done-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);border:3px solid var(--good);border-radius:16px;padding:8px 18px;font-weight:900;font-size:clamp(19px,3vw,28px);color:var(--good);white-space:nowrap;pointer-events:none}
.rockhit{cursor:pointer}
.hammer{position:absolute;right:1%;top:2%;width:24%;max-width:170px;aspect-ratio:1;background:none;border:0;padding:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transform-origin:88% 82%}
.hammer svg{width:100%;height:100%;display:block}
.hammer.swing{animation:swing .32s ease-in}
@keyframes swing{35%{transform:rotate(22deg)}75%{transform:rotate(-34deg)}100%{transform:rotate(0)}}
.hammer[disabled]{opacity:.35;cursor:default}
.hghost{position:fixed;z-index:60;pointer-events:none;width:110px;height:110px;opacity:.95}
.dust{position:absolute;width:12px;height:12px;border-radius:3px;background:#B9B19F;pointer-events:none;animation:dust .55s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),var(--dy)) rotate(160deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.rk,.rk.wob,.rk.hit,.hammer.swing,.dust,.stn.new,.pz.new{animation:none!important;transition:none!important}}
/* choose */
.choose{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px;align-items:stretch}
.bigbtn{flex-direction:column;align-items:flex-start!important;justify-content:center;gap:4px!important}
.bigbtn .bt{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(21px,2.9vw,26px)}
.bigbtn .bs{font-size:19px;color:var(--muted);font-weight:500}
.later{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.later h3{font-size:clamp(19px,2.6vw,23px)}
.later .btn.alt{padding:10px 14px;font-size:clamp(19px,2.5vw,22px)}
.bubble{position:relative;background:#FFFFFF;border:3px solid var(--ink);border-radius:26px;padding:12px 18px;font-weight:900;font-size:clamp(21px,3vw,27px)}
.worries{display:flex;flex-wrap:wrap;gap:8px}
.worries span{background:#EEF0EC;border-radius:12px;padding:2px 12px;font-size:19px;font-weight:700;color:var(--muted)}
.worries span:nth-child(odd){transform:rotate(-2deg)}.worries span:nth-child(even){transform:rotate(2deg)}
.say{display:flex;gap:14px;align-items:center}
.say .av{width:76px;height:76px;flex:none}
.say .sp{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 16px;margin:0;font-size:clamp(19px,2.6vw,23px)}
/* stones */
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;align-items:flex-start}
.stn{font:inherit;color:var(--ink);display:inline-flex;align-items:center;gap:8px;background:var(--stone);border:3px solid var(--stoneline);border-radius:46% 54% 42% 58% / 58% 46% 54% 42%;padding:10px 20px;font-weight:700;font-size:19px;line-height:1.35;text-align:left;max-width:100%}
.stn:nth-child(3n+2){border-radius:58% 42% 55% 45% / 45% 58% 42% 55%}
.stn:nth-child(3n){border-radius:40% 60% 50% 50% / 52% 44% 56% 48%}
.stn svg.i{width:30px;height:30px}
.stn .m{font-weight:900;color:var(--sea);white-space:nowrap}
.stn.new{animation:drop .55s ease-out both}
@keyframes drop{0%{transform:translateY(-90px) rotate(-18deg);opacity:0}60%{transform:translateY(6px) rotate(4deg);opacity:1}100%{transform:none}}
button.stn{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.stn.in{opacity:.35;border-style:dashed}
.stn.ok{background:#DCEBD5;border-color:var(--good)}
.sghost{position:fixed;z-index:50;pointer-events:none;opacity:.93;transform:rotate(-3deg);box-shadow:0 12px 26px rgba(31,42,46,.25)}
/* order list */
.olist{display:flex;flex-direction:column;gap:10px}
.oitem{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 10px}
.oitem.drag{border-color:var(--sea);box-shadow:0 8px 18px rgba(31,42,46,.18);background:#F2F7FA}
.oitem .no{font-weight:900;color:var(--muted);min-width:1.4em;text-align:center;flex:none}
.oitem .sw{position:relative;flex:0 1 auto;min-width:0;display:flex}
.oitem .sw .stn{min-width:0}
.oitem .circ{margin-left:auto}
.grip{flex:none;width:48px;height:56px;border-radius:12px;border:2px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;color:var(--muted);padding:0}
.grip svg.i{width:30px;height:30px}
.circ{font:inherit;flex:none;font-size:19px;font-weight:900;border-radius:14px;border:3px solid var(--rust);background:var(--card);color:var(--rust);padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:4px;line-height:1.3}
.circ svg.i{width:26px;height:26px}
.oitem.first{border-color:var(--rust);background:#FDF3EE}
.oitem.first .circ{background:var(--rust);color:#fff}
.oitem .ring{position:absolute;inset:-9px -12px;pointer-events:none;display:none}
.oitem.first .ring{display:block}
.ring svg{width:100%;height:100%;display:block;overflow:visible}
/* basket */
.bk{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.basket{background:#FBF4E2;border:4px dashed var(--gold);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:200px;transition:box-shadow .2s}
.basket.over{border-style:solid;border-color:var(--good);box-shadow:0 0 0 6px #CFE3C4}
.basket h3 svg.i{width:40px;height:40px}
.tbar{height:22px;border-radius:11px;background:#E3E6E0;position:relative;overflow:hidden}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:11px;transition:width .3s}
.tnum{font-weight:900;font-size:19px;margin:0}
.inb{display:flex;flex-wrap:wrap;gap:8px}
.inb .stn{cursor:pointer}
.empty{color:var(--muted);font-size:19px;margin:0}
.msg{margin:0;font-weight:700;color:var(--rust);font-size:19px;min-height:0}
.rockbtn{font:inherit;display:flex;align-items:center;gap:10px;background:var(--card);border:3px dashed var(--stoneline);border-radius:16px;padding:8px 14px;font-weight:700;font-size:19px;cursor:pointer;color:var(--ink);text-align:left}
.rockbtn svg.i{width:40px;height:40px}
/* poster */
.pwrap{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:center}
.poster{width:100%;height:auto;display:block}
.poster text{font-family:var(--font)}
.pz{opacity:0;transition:opacity .3s}
.pz.on{opacity:1}
.pz.on.new{animation:pop .7s ease-out both;animation-delay:var(--d,0s)}
@keyframes pop{0%{opacity:0;transform:translateY(-14px)}60%{opacity:1}100%{opacity:1;transform:none}}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .mt{font-weight:900;font-size:clamp(21px,3vw,28px)}
.meter .mt b{color:var(--good)}
.mbar{height:20px;border-radius:10px;background:#E3E6E0;position:relative;overflow:hidden}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:10px;transition:width .5s}
.mbar i.b{background:#B9B19F}
/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .card{gap:6px}
.cmp .big{border-color:#B9B19F}
.cmp .small{border-color:var(--good)}
.cmp .num{font-size:clamp(28px,4.6vw,40px);font-weight:900;line-height:1.2}
.cmp .big .num{color:var(--muted)}
.cmp .small .num{color:var(--good)}
.cmp p{margin:0}
.cmp h3 svg.i{width:40px;height:40px}
/* tables */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
.sum td:first-child{color:var(--muted);font-weight:700;width:46%}
.sum td b{font-size:1.1em}
.ec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6}
.ec dt{font-weight:900;white-space:nowrap}
.ec dd{margin:0}
.ec dt.e{color:var(--sea)}.ec dt.c{color:var(--good)}
@media (max-width:760px){
  .choose,.bk,.cmp{grid-template-columns:minmax(0,1fr)}
  .pwrap{grid-template-columns:minmax(0,1fr)}
  .pwrap .poster{max-width:280px;margin:0 auto}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .wd svg.i,.wd .em{width:24px;height:24px}
  .oitem{display:grid;grid-template-columns:44px auto minmax(0,1fr);grid-template-areas:"g n s" "g n c";gap:6px 8px;padding:8px}
  .oitem .grip{grid-area:g;width:44px;align-self:center}
  .oitem .no{grid-area:n;align-self:center}
  .oitem .sw{grid-area:s;justify-self:start;max-width:100%}
  .oitem .circ{grid-area:c;justify-self:end;margin-left:0}
  .oitem .stn{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;padding:8px 16px}
  .oitem .stn svg.i{grid-row:span 2}
  .oitem .stn .m{grid-column:2}
  .pwrap .poster{max-width:230px}
  .sum,.sum tbody,.sum tr,.sum td{display:block}
  .sum td{border:0;padding:2px 0;width:auto!important}
  .sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ec{grid-template-columns:1fr;gap:0}
  .ec dd{margin-bottom:6px}
  .say .av{width:60px;height:60px}
  .zsign{padding:2px 10px}
}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- state ---------- */
function fresh(){return {step:'intro',night:0,ch:[null,null,null],perm:null,knocked:0,order:[],first:null,bn:0,bk:[{ids:[],done:false},{ids:[],done:false}],done:[],ref:null}}
var st=load();if(!st||!st.step)st=fresh();
function go(s){st.step=s;save(st);render();try{window.scrollTo(0,0)}catch(e){}}
function workN(){return st.ch.filter(function(c){return c==='work'}).length}
function laterN(){return st.ch.filter(function(c){return c&&c!=='work'}).length}
function laterBefore(n){var c=0;for(var i=0;i<n;i++)if(st.ch[i]&&st.ch[i]!=='work')c++;return c}
function knockedIds(){return st.perm?st.perm.slice(0,st.knocked):[]}
function smallP(){return st.done.reduce(function(s,k){return s+P[k].p},0)}
function smallM(){return st.done.reduce(function(s,k){return s+P[k].m},0)}
function totalP(){return Math.min(100,workN()*BIGP+smallP())}
function cheng(p){var v=Math.round(p/5)/2;if(v===0)return '0 成';var n=Math.floor(v),h=v-n>0;if(n===0)return '半成';return n+' 成'+(h?'半':'')}
function stoneHTML(k){var d=P[k];return ic(d.ic)+'<span class="t">'+d.t+'</span><span class="m">'+d.m+' 分鐘</span>'}
function stone(k,tag,cls){var s=el(tag||'span','stn'+(cls?' '+cls:''),stoneHTML(k));s.setAttribute('data-k',k);if(tag==='button')s.type='button';return s}

/* ---------- week strip ---------- */
function weekStrip(cur){
  var ul=el('ol','week');ul.setAttribute('aria-label','這個星期的晚上');
  for(var i=0;i<6;i++){
    var icon='';
    if(i<3&&st.ch[i])icon=st.ch[i]==='work'?ic('poster'):ic(OPT[st.ch[i]].ic);
    else if((i===3||i===4)&&st.bk[i-3].done)icon=ic('rock_pebble');
    else if(i===5)icon=ic('rock_sun');
    else if(i<3)icon=ic('rock_big');else icon=ic('moon');
    var li=el('li','wd'+(i===cur?' now':'')+(i<cur?' past':'')+(i===5?' mon':''),'<span>'+DAY[i]+'</span>'+icon);
    li.setAttribute('aria-label','星期'+DAY[i]+(i===cur?'（現在）':''));
    ul.appendChild(li);
  }
  return ul;
}

function dust(sb,rk){
  var r=rk.getBoundingClientRect(),b=sb.getBoundingClientRect();if(!r.width)return;
  var x=r.left-b.left+r.width*0.7,y=r.top-b.top+r.height*0.25;

}
function hammerDrag(hm,target,onHit){
  var down=false,dragging=false,sx=0,sy=0,ghost=null,moved=false;
  function over(x,y){var r=target.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
  hm.addEventListener('pointerdown',function(e){if(e.button>0||hm.disabled)return;down=true;dragging=false;sx=e.clientX;sy=e.clientY;try{hm.setPointerCapture(e.pointerId)}catch(_){}});
  hm.addEventListener('pointermove',function(e){
    if(!down)return;
    if(!dragging&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8){dragging=true;ghost=el('div','hghost',HAMMER);document.body.appendChild(ghost);hm.style.opacity='.3'}
    if(dragging){ghost.style.left=(e.clientX-30)+'px';ghost.style.top=(e.clientY-30)+'px';e.preventDefault()}
  });
  function end(e,cancel){if(!down)return;down=false;if(dragging){moved=true;var hit=!cancel&&over(e.clientX,e.clientY);if(ghost){ghost.remove();ghost=null}hm.style.opacity='';dragging=false;if(hit)onHit()}}
  hm.addEventListener('pointerup',function(e){end(e,false)});
  hm.addEventListener('pointercancel',function(e){end(e,true)});
  hm.addEventListener('click',function(){if(moved){moved=false;return}onHit()});
}

  });

    if(B.ids.indexOf(k)>=0)return;
    var u=used();
    if(u+P[k].m>FREE){msg.textContent='「'+P[k].t+'」要 '+P[k].m+' 分鐘，今晚只剩 '+(FREE-u)+' 分鐘，放不下了。可以換一顆小一點的，或留到下一晚。';return}
    msg.textContent='';B.ids.push(k);save(st);fill();
  }
  fill();
}
function dragStone(b,zone,onDrop){
  var sx=0,sy=0,down=false,dragging=false,ghost=null,moved=false;
  function over(x,y){var r=zone.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
  b.addEventListener('pointerdown',function(e){if(e.button>0)return;down=true;dragging=false;sx=e.clientX;sy=e.clientY;try{b.setPointerCapture(e.pointerId)}catch(_){}});
  b.addEventListener('pointermove',function(e){
    if(!down)return;
    if(!dragging&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8){
      dragging=true;var r=b.getBoundingClientRect();ghost=b.cloneNode(true);ghost.classList.add('sghost');ghost.classList.remove('new');ghost.style.width=r.width+'px';ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';ghost._dx=sx-r.left;ghost._dy=sy-r.top;document.body.appendChild(ghost);
    }
    if(dragging){ghost.style.left=(e.clientX-ghost._dx)+'px';ghost.style.top=(e.clientY-ghost._dy)+'px';zone.classList.toggle('over',over(e.clientX,e.clientY));e.preventDefault()}
  });
  function end(e,cancel){if(!down)return;down=false;if(dragging){moved=true;var hit=!cancel&&over(e.clientX,e.clientY);if(ghost){ghost.remove();ghost=null}zone.classList.remove('over');dragging=false;if(hit)onDrop()}}
  b.addEventListener('pointerup',function(e){end(e,false)});
  b.addEventListener('pointercancel',function(e){end(e,true)});
  b.addEventListener('click',function(){if(moved){moved=false;return}onDrop()});
}
function basketResult(bn){
  var B=st.bk[bn],m=B.ids.reduce(function(s,k){return s+P[k].m},0),rest=FREE-m;
  var fresh=st._fresh||[];st._fresh=null;save(st);
  app.append(el('h2',null,B.ids.length?'今晚做完了 '+B.ids.length+' 顆小石頭！':'今晚沒有放小石頭。'));
  var c=el('div','card');
  if(B.ids.length){var row=el('div','tray');B.ids.forEach(function(k){row.append(stone(k,'span','ok'))});c.append(row)}
  c.append(el('p','lead',B.ids.length?'你花了 <b>'+m+' 分鐘</b>做小石頭。'+(rest>0?'剩下的 <b>'+rest+' 分鐘</b>，你去看了一集卡通。':'今晚的 40 分鐘剛好用完。'):'今晚的 40 分鐘，你都拿去看卡通、玩遊戲了。'));
  var pb=posterBlock(fresh);c.append(pb.wrap);
  app.append(c);
  var left=st.order.filter(function(k){return st.done.indexOf(k)<0}).length+(PK.length-st.knocked);
  if(bn===0)app.append(el('p','note',left?'還有 <b>'+left+' 塊</b>還沒做。星期六晚上，一樣有 40 分鐘。':'海報的每一塊都做完了！星期六晚上可以好好玩。'));
  app.append(button(bn===0?'下一晚：星期六晚上':'星期一早上','btn',function(){if(bn===0){st.bn=1;go('basket')}else go('monday')}));
}

/* ---------- Monday ---------- */
function mondayPage(){
  var tp=totalP(),w=workN(),bp=w*BIGP,sp=smallP(),sm=smallM(),sc=st.done.length;
  var play=st.bk.reduce(function(s,B){return s+FREE-B.ids.reduce(function(a,k){return a+P[k].m},0)},0);
  app.append(el('p','case',ic('rock_sun')+'星期一早上'));
  app.append(weekStrip(5));
  app.append(el('h2',null,'要交海報了！你的海報完成了 '+cheng(tp)+(tp>=100?'，全部做完了。':'。')));
  var c=el('div','card');var pb=posterBlock(null,'星期一的海報');c.append(pb.wrap);
  var todo=st.order.filter(function(k){return st.done.indexOf(k)<0}).map(function(k){return '「'+P[k].t+'」'});
  var un=PK.length-st.knocked;
  if(todo.length||un)pb.meter.append(el('p','hint',(todo.length?'還沒做的小石頭：'+todo.join('、')+'。':'')+(un?'還有 '+un+' 塊大石頭沒有敲開。':'')));
  app.append(c);
  app.append(el('h3',null,'兩段晚上，比一比'));
  var cmp=el('div','cmp');
  var a=el('div','card big');
  a.append(el('h3',null,ic('rock_big')+'大石頭的三個晚上'),el('p','hint','星期二、三、四'),
    el('div','num',cheng(bp)),
    el('p',null,w?'你坐下來做海報 <b>'+w+' 晚</b>，一共 <b>'+(w*FREE)+' 分鐘</b>，可是坐下來以後，不知道從哪裡開始。':'這三個晚上，你都選了「明天再說」。'),
    el('p',null,'選「明天再說」：<b>'+laterN()+' 次</b>'));
  var b=el('div','card small');
  b.append(el('h3',null,ic('rock_pebble')+'小石頭的兩個晚上'),el('p','hint','星期五、六（加上星期四睡前的第一顆）'),
    el('div','num',cheng(sp)),
    el('p',null,'你做完 <b>'+sc+' 顆</b>小石頭，一共 <b>'+sm+' 分鐘</b>。'),
    el('p',null,'星期五、六晚上，還剩 <b>'+play+' 分鐘</b>可以玩。'));
  cmp.append(a,b);app.append(cmp);
  var t='同樣是自己的晚上。差別在：那顆石頭，有沒有先敲小。';
  if(bp+sp>100)t+='（兩段加起來超過 10 成，是因為大石頭那幾晚畫的框，後來重新畫過了。）';
  app.append(el('p','note warm',t));
  app.append(button('下一步','btn',function(){go('reflect')}));
}

/* ---------- reflection (no right answer) ---------- */
function reflectPage(){
  app.append(el('p','case','最後一題'));
  app.append(el('h2',null,'你通常最常卡在哪裡？'));
  app.append(el('p','lead','這一題<b>沒有標準答案</b>，選一個最像你的就好。選好以後，會看到它的作用和一個小提醒。'));
  var o=el('div','opts'),bs={},fb=el('div');
  RK.forEach(function(k){var b=button(ic(REF[k].ic)+'<span>'+REF[k].n+'</span>','btn alt',function(){st.ref=k;save(st);upd()});bs[k]=b;o.append(b)});
  var nx=button('下一步','btn',function(){if(st.ref)go('end')});
  app.append(o,fb,nx);
  function upd(){
    RK.forEach(function(k){bs[k].classList.toggle('pick',st.ref===k);bs[k].setAttribute('aria-pressed',st.ref===k?'true':'false')});
    fb.innerHTML='';nx.disabled=!st.ref;
    if(st.ref){var r=REF[st.ref];var c=el('div','card');c.append(el('h3',null,ic(r.ic)+r.n));c.append(el('dl','ec','<dt class="e">作用</dt><dd>'+r.e+'</dd><dt class="c">小提醒</dt><dd>'+r.t+'</dd>'));fb.append(c)}
  }
  upd();
}

/* ---------- end ---------- */
function endPage(){
  app.append(el('h1',null,'做完了！請停在這一頁，等其他同學。'));
  var f=P[st.first];
  var rows=[
    ['前三晚，你選了幾次「明天再說」',laterN()+' 次'],
    ['你敲出幾顆小石頭',st.knocked+' 顆'],
    ['你選的第一顆',f.t+'（'+f.m+' 分鐘）'],
    ['星期一，海報完成了幾成',cheng(totalP())],
    ['你最常卡在哪裡',REF[st.ref].n]
  ];
  var c=el('div','card');var tb=el('table','sum');
  tb.innerHTML='<tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>'}).join('')+'</tbody>';
  c.append(tb);app.append(c);
  app.append(el('p','note warm','老師等一下會請大家舉手：前三晚選了 0 次、1 次、2 次、3 次「明天再說」的，各有幾個人？'));
}

function render(){
  app.innerHTML='';
  var s=st.step;
  if(s==='intro')intro();
  else if(s==='night'&&st.night>=0&&st.night<=2)nightPage();
  else if(s==='hammer'&&st.ch[2])hammerPage();
  else if(s==='order'&&st.order.length>=5)orderPage();
  else if(s==='first'&&st.first)firstPage();
  else if(s==='basket'&&st.first)basketPage();
  else if(s==='monday'&&st.first)mondayPage();
  else if(s==='reflect'&&st.first)reflectPage();
  else if(s==='end'&&st.first&&st.ref)endPage();
  else{st=fresh();save(st);intro()}
}
render();
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}st=fresh();save(st);render();try{window.scrollTo(0,0)}catch(e){}}});
})();
</script>
