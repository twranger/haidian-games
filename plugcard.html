<meta charset="utf-8">
<script src="fresh.js"></script>
<title>如果就插頭</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: story + demo plug → level 1 plug four "if" cards into a "good if" board (bulb) or a "too vague" board → level 2 same with four "then" cards → level 3 three daily situations, connect one "if" plug to one "then" socket each → level 4 plug the three sentences into "my week" board and play a fixed 5-day script: plugged + good sentences light up and the kid just does it; vague ones and the unplugged writing practice pop a "do it?" dialog with temptations (every choice allowed) → value question (every option allowed) → summary for a show of hands. Fixed script, no randomness. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --lit:#F7D65A; --wire:#8E968F;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(21px,2.9vw,26px);font-weight:900;margin:0;line-height:1.4}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45;display:flex;align-items:center;justify-content:center;gap:10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700;justify-content:flex-start}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn.soft{background:var(--card);color:var(--sea);border:3px solid var(--sea)}
.btn svg.i{width:1.4em;height:1.4em}
.btn.alt svg.i{width:1.7em;height:1.7em}
.btn:focus-visible,.pc:focus-visible,.board:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.note b{color:var(--ink)}
.hint{margin:0;font-size:clamp(19px,2.3vw,21px);color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.6em;border-radius:50%;color:#fff;background:var(--sea);font-weight:900;font-size:19px;flex:none;line-height:1}
.say{display:flex;gap:14px;align-items:center}
.say .av{width:76px;height:76px;flex:none}
.goal{display:flex;gap:12px;align-items:center;background:var(--warm);border-radius:18px;padding:12px 16px;font-size:clamp(19px,2.6vw,24px);font-weight:700;line-height:1.5}
.goal svg.i{width:48px;height:48px}
.goal b{color:var(--rust)}

/* bulb (scene drawing) */
svg.bulb{flex:none;overflow:visible}
.bulb .glass{fill:#E6E8E3;stroke:#1F2A2E;stroke-width:2.4;transition:fill .3s}
.bulb .rays{opacity:0;transition:opacity .3s}
.bulb.on .glass{fill:var(--lit)}
.bulb.on .rays{opacity:1}
.bulb.on{filter:drop-shadow(0 0 7px rgba(247,214,90,.95))}
.bulb.flick .glass{animation:flk 1s linear 1}
.bulb.flick .rays{animation:flr 1s linear 1}
@keyframes flk{0%,22%,48%{fill:var(--lit)}12%,36%,62%,100%{fill:#E6E8E3}}
@keyframes flr{0%,22%,48%{opacity:1}12%,36%,62%,100%{opacity:0}}

/* plug & socket cards */
.play{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:clamp(40px,9vw,96px);align-items:start}
.play.wk{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.play .col{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
svg.wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.w{fill:none;stroke-width:5;stroke-linecap:round;stroke:var(--wire)}
.w.on{stroke:#E0A82E;stroke-dasharray:16 7;animation:flow .9s linear infinite;filter:drop-shadow(0 0 3px rgba(247,214,90,.9))}
.w.off{stroke-dasharray:1 10}
@keyframes flow{to{stroke-dashoffset:-23}}
.pc{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;cursor:grab;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;min-height:64px}
.pc .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc .tag{font-size:19px;font-weight:900;color:#fff;background:var(--sea);border-radius:10px;padding:0 10px;line-height:1.6;display:inline-flex;align-items:center;gap:4px}
.pc .tag svg.i{width:1.1em;height:1.1em}
.pc.sock .tag{background:var(--rust)}
.pc .tx{font-size:clamp(19px,2.5vw,23px);font-weight:700;line-height:1.45}
.pc .wh{font-size:19px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.4}
.pc.sel{border-color:var(--gold);box-shadow:0 0 0 4px #F3E3BE}
.pc.used{background:#F4F6F2;border-style:dashed}
.pc.lit{border-color:#E0A82E;background:#FFF8DF}
.pc.dim{border-color:#A9AFA8}
.pc.ready{outline:4px dashed var(--gold);outline-offset:2px}
.pc.over{outline:4px solid var(--good);outline-offset:2px}
.jack{position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#C9CEC6;border:3px solid var(--ink);right:-11px}
.jack.l{right:auto;left:-11px}
.unp{font:inherit;font-size:19px;font-weight:700;color:var(--sea);background:var(--card);border:2px solid var(--sea);border-radius:12px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;line-height:1.6}
.unp svg.i{width:1em;height:1em}
.board{background:#FBF7EC;border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative}
.board.vb{background:#F2F3F0}
.board .bh{display:flex;align-items:center;gap:8px}
.board .bh svg.bulb{width:44px;height:52px}
.board .bh svg.i{width:44px;height:44px;color:var(--muted)}
.board .bn{font-weight:900;font-size:clamp(19px,2.6vw,24px);line-height:1.3;display:block}
.board .bs{font-size:19px;color:var(--muted);line-height:1.35;display:block}
.board.ready{outline:4px dashed var(--gold);outline-offset:2px}
.board.over{outline:4px solid var(--good);outline-offset:2px}
.slot{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:12px;min-height:50px;padding:4px 8px 4px 16px;position:relative;font-weight:900}
.slot .jack{left:-11px;right:auto}
.slot svg.bulb{width:24px;height:30px}
.slot svg.i{width:28px;height:28px}
.slot.empty{border-style:dashed;color:var(--muted);font-weight:700;font-size:19px;background:transparent}
.slot.empty .jack{background:var(--card)}
.slot.lit{border-color:#E0A82E;background:#FFF8DF}
.slot .sl{font-size:19px;line-height:1.3}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.93;transform:rotate(-3deg);box-shadow:0 12px 26px rgba(31,42,46,.25)}
.cnt{margin:0;font-size:19px;color:var(--muted);font-weight:700;text-align:center}

/* inline feedback */
.fbk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;scroll-margin:16px}
.fbk[hidden]{display:none}
.fbk svg.bulb{width:40px;height:48px;margin-top:2px}
.fbk p{margin:0;font-size:clamp(19px,2.5vw,23px);line-height:1.6;flex:1;min-width:0}
.play{-webkit-user-select:none;user-select:none}
/* sentence */
.sent{display:flex;gap:14px;align-items:center}
.sent svg.bulb{width:52px;height:62px}
.sent p{margin:0;font-size:clamp(21px,3vw,28px);font-weight:900;line-height:1.55}
.sent u{text-decoration:none;border-bottom:3px solid var(--line);padding:0 2px}
.sent .ki{color:var(--sea)}.sent .kd{color:var(--rust)}
.why{margin:0;font-size:clamp(19px,2.5vw,23px);color:var(--muted);line-height:1.6}

/* week */
.wkout{display:flex;gap:10px;align-items:center;border:3px dashed var(--line);border-radius:14px;padding:8px 12px;font-size:19px;color:var(--muted);font-weight:700;line-height:1.45}
.wkout svg.i{width:32px;height:32px}
.ctr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctr div{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;line-height:1.35}
.ctr b{font-size:clamp(28px,4.4vw,40px);margin-left:auto;font-variant-numeric:tabular-nums}
.ctr svg.bulb{width:34px;height:40px}
.ctr svg.i{width:36px;height:36px}
.ctr .c1 b{color:var(--gold)}.ctr .c2 b{color:var(--sea)}
.stage{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.stage .top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.stage .when{font-weight:900;font-size:clamp(21px,2.9vw,26px);color:var(--sea);line-height:1.4}
.stage .top svg.bulb{width:52px;height:62px}
.lane{position:relative;height:124px;background:#EEF3EA;border-radius:16px;overflow:hidden}
.lane .flr{position:absolute;left:0;right:0;bottom:0;height:16px;background:#DCE5D3}
.lane .kid{position:absolute;bottom:6px;left:2%;width:80px;height:80px;transition:left .9s ease}
.lane .kid .av{width:80px;height:80px}
.lane.go .kid{left:calc(98% - 160px)}
.lane .goal2:empty{display:none}
.lane .goal2{position:absolute;right:2%;bottom:12px;width:70px;height:70px;background:var(--card);border:3px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center}
.lane .goal2 svg.i{width:46px;height:46px}
.lane .bub{position:absolute;top:8px;left:96px;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:2px 12px;font-weight:900;font-size:19px;white-space:nowrap;opacity:0;transition:opacity .3s}
.lane.go .bub{opacity:1;left:auto;right:calc(2% + 84px)}
.lane.ask .bub{opacity:1}
.stage .msg{margin:0;font-size:clamp(19px,2.6vw,24px);line-height:1.6;min-height:3.2em}
.stage .msg .k{font-weight:900}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.day.now{border-color:var(--sea)}
.day .dn{font-weight:900;font-size:19px;line-height:1.3;white-space:nowrap}
.chip{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:#F4F6F2;color:#9AA19C}
.chip svg.i{width:26px;height:26px}
.chip.auto{background:var(--lit);border-color:#C99A1E;color:var(--ink)}
.chip.did{background:#DCE8F0;border-color:var(--sea);color:var(--ink)}
.chip.skip{background:#E3E6E0;border-color:#9AA19C;color:var(--muted)}
.chip.cur{outline:3px solid var(--ink);outline-offset:1px}
.stack{display:flex;flex-direction:column;gap:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;font-size:19px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:22px;border-radius:7px;border:2px solid}
.legend .a{background:var(--lit);border-color:#C99A1E}.legend .d{background:#DCE8F0;border-color:var(--sea)}.legend .s{background:#E3E6E0;border-color:#9AA19C}
.ov{position:fixed;inset:0;background:rgba(31,42,46,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.dlg{background:var(--card);border-radius:22px;border:3px solid var(--ink);padding:clamp(14px,3vw,24px);max-width:620px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
.dlg .why{color:var(--rust);font-weight:700}

/* tables */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.5vw,23px)}
td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
.sum td:first-child{color:var(--muted);font-weight:700;width:40%}
.sum td b{font-size:1.1em}
.sum .sub{display:block;font-size:19px;font-weight:700;color:var(--muted)}
.big3{display:flex;flex-direction:column;gap:10px}
.big3 .s3{display:flex;gap:10px;align-items:center;background:var(--warm);border-radius:16px;padding:10px 14px;font-size:clamp(22px,3.4vw,30px);font-weight:900;line-height:1.5}
.big3 svg.bulb{width:36px;height:44px}
.ec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:clamp(19px,2.4vw,22px);line-height:1.6}
.ec dt{font-weight:900;white-space:nowrap}
.ec dd{margin:0}
.ec dt.x{color:var(--sea)}.ec dt.e{color:var(--good)}.ec dt.c{color:var(--rust)}
@media (prefers-reduced-motion:reduce){.w.on{animation:none}.bulb.flick .glass,.bulb.flick .rays{animation:none}.lane .kid{transition:none}}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .board .bh{flex-direction:column;align-items:flex-start;gap:2px}
  .pc{padding:8px 10px}
  .say .av{width:60px;height:60px}
  .sum,.sum tbody,.sum tr,.sum td{display:block}
  .sum td{border:0;padding:2px 0}
  .sum td:first-child{width:auto}
  .sum tr{border-bottom:2px solid var(--line);padding:8px 0}
  .ec{grid-template-columns:1fr;gap:0}
  .ec dd{margin-bottom:6px}
  .ctr div{flex-wrap:wrap;gap:4px 8px}
  .chip{width:34px;height:34px}
  .chip svg.i{width:22px;height:22px}
  .lane .kid,.lane .kid .av{width:66px;height:66px}
  .lane.go .kid{left:calc(98% - 140px)}
  .lane .goal2{width:60px;height:60px}
  .lane .bub{left:78px}
  .lane.go .bub{right:calc(2% + 70px)}
  .sent svg.bulb{width:42px;height:50px}
  .play.wk .slot .sl{display:none}
  .play.wk .slot{justify-content:space-between}
}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

var curWires=null;

function drawWires(play,pairs){
  var svg=play.querySelector('svg.wires');if(!svg)return;
  var pr=play.getBoundingClientRect(),h='';
  pairs.forEach(function(p){
    if(!p[0]||!p[1])return;
    var a=p[0].getBoundingClientRect(),b=p[1].getBoundingClientRect();if(!a.width||!b.width)return;
    var x1=a.left+a.width/2-pr.left,y1=a.top+a.height/2-pr.top,x2=b.left+b.width/2-pr.left,y2=b.top+b.height/2-pr.top;
    var dx=Math.max(26,(x2-x1)*.6);
    h+='<path class="w '+p[2]+'" d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+'C'+(x1+dx).toFixed(1)+' '+y1.toFixed(1)+' '+(x2-dx).toFixed(1)+' '+y2.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1)+'"/>';
  });
  svg.setAttribute('viewBox','0 0 '+Math.max(1,pr.width).toFixed(1)+' '+Math.max(1,pr.height).toFixed(1));
  svg.innerHTML=h;
}

/* ---------- drag (or tap) ---------- */
function dnd(card,zonesFn,onDrop,onTap){
  var sx=0,sy=0,down=false,dragging=false,ghost=null,moved=false,hot=null;
  function hit(x,y){var zs=zonesFn();for(var i=0;i<zs.length;i++){var r=zs[i].getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return zs[i]}return null}
  function setHot(z){if(hot&&hot!==z)hot.classList.remove('over');hot=z;if(z)z.classList.add('over')}
  card.addEventListener('pointerdown',function(e){if(e.button>0)return;if(e.target.closest('.unp'))return;down=true;dragging=false;sx=e.clientX;sy=e.clientY;try{card.setPointerCapture(e.pointerId)}catch(_){}});
  card.addEventListener('pointermove',function(e){
    if(!down)return;
    if(!dragging&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8){
      dragging=true;var r=card.getBoundingClientRect();ghost=card.cloneNode(true);ghost.classList.add('ghost');ghost.classList.remove('sel','used','lit','dim');ghost.style.width=r.width+'px';ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';ghost._dx=sx-r.left;ghost._dy=sy-r.top;document.body.appendChild(ghost);
    }
    if(dragging){ghost.style.left=(e.clientX-ghost._dx)+'px';ghost.style.top=(e.clientY-ghost._dy)+'px';setHot(hit(e.clientX,e.clientY));e.preventDefault()}
  });
  function end(e,cancel){
    if(!down)return;down=false;
    if(dragging){moved=true;var z=cancel?null:hit(e.clientX,e.clientY);if(ghost){ghost.remove();ghost=null}setHot(null);dragging=false;if(z)onDrop(z)}
  }
  card.addEventListener('pointerup',function(e){end(e,false)});
  card.addEventListener('pointercancel',function(e){end(e,true)});
  card.addEventListener('click',function(e){if(e.target.closest('.unp'))return;if(moved){moved=false;return}onTap()});
  card.addEventListener('keydown',function(e){if(e.target!==card)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap()}});
}

  function idle(){
    when.textContent=W.i>0?'暫停在'+DAYS[EV[Math.min(W.i,EV.length)-1].d]:'還沒開始';
    sb.setAttribute('class','bulb');lane.className='lane';bub.textContent='';g2.innerHTML='';
    msg.textContent=W.i>0?'按「繼續播放」，接著看下去。':'按「播放一週」，看看星期一到星期五會發生什麼事。';
  }
  function stepNext(){
    timer=null;
    if(W.i>=EV.length){W.done=true;save(st);finish();return}
    var e=EV[W.i],q=qual(e.s);
    paintChips(W.i);
    if(q==='auto'){
      var i0=W.i;W.res[i0]='auto';W.i++;save(st);show(i0,'auto');paintChips(i0);
      timer=setTimeout(stepNext,1900);
    }else{W.wait=true;save(st);ask()}
  }
  function ask(){
    var e=EV[W.i],s=sOf(e.s),q=qual(e.s);
    show(W.i,q==='nodo'?'nodo':'ask');lane.className='lane ask';bub.textContent='要做嗎？';paintChips(W.i);
    var ov=el('div','ov');var dl=el('div','dlg');dl.setAttribute('role','dialog');dl.setAttribute('aria-modal','true');dl.setAttribute('aria-label','要做嗎？');
    dl.append(el('p','case',DAYS[e.d]+'・'+e.w));
    dl.append(el('h2',null,'要做嗎？'));
    dl.append(el('p','lead',e.ctx));
    var why=q==='none'?'練習寫字沒有接成一句，沒有插頭，燈不會自己亮，要自己決定。':
      q==='noif'?'你的插頭是「如果'+s.ifs[st.l3[e.s].i].t+'」。現在算是嗎？說不準，燈泡沒有亮，要自己決定。':
      '燈亮了，可是「'+s.dos[st.l3[e.s].d].t+'」要從哪裡開始？手不知道要先做什麼，要自己決定。';
    dl.append(el('p','why',why));
    var o=el('div','opts');
    [[s.doBtn,'did',s.goalIc],[e.tm[0],'skip','think'],[e.tm[1],'skip','think']].forEach(function(x){o.append(button(ic(x[2])+'<span>'+x[0]+'</span>','btn alt',function(){choose(x[1],ov)}))});
    dl.append(o);ov.append(dl);app.append(ov);
    try{o.querySelector('button').focus({preventScroll:true})}catch(_){}
  }
  function choose(r,ov){
    var i=W.i;W.res[i]=r;W.i++;W.wait=false;save(st);ov.remove();
    show(i,r);paintChips(i);
    timer=setTimeout(function(){paintChips(W.i);timer=setTimeout(stepNext,500)},1500);
  }
  function start(){ctl.innerHTML='';ctl.append(el('p','hint',ic('clock')+'播放中……'));stepNext()}
  function finish(){
    paintChips(null);idle();when.textContent='一週結束了';msg.textContent='星期一到星期五都播完了。';
    ctl.innerHTML='';var c=counts();
    var card=el('div','card');
    card.append(el('h3',null,'這一週，燈泡自動亮了 '+c.a+' 次；你停下來自己決定了 '+c.d+' 次，其中做了 '+c.k+' 次。'));
    card.append(el('p','note','插好插頭的句子，時候一到就直接做，不用想。沒有插頭的練習寫字，每一次都要停下來，和卡通、電動、「明天再說」拉扯一次，比較累，也比較容易說「等一下」。'));
    var bad=SIT.filter(function(s){return qual(s.id)!=='auto'});
    if(bad.length)card.append(el('p','note warm','你接的「'+bad.map(function(s){return s.short}).join('」「')+'」這一句，燈沒辦法自己亮：'+bad.map(function(s){return qual(s.id)==='noif'?'「如果」太模糊，看不出時候到了沒有':'「就」太大，不知道第一步做什麼'}).join('；')+'。'));
    fin.innerHTML='';fin.append(card);
    fin.append(button('下一步','btn',function(){go('val')}));
  }
  if(W.done){finish();return}
  paintChips(W.wait?W.i:null);
  if(W.wait){ctl.append(el('p','hint',ic('clock')+'播放中……'));ask();return}
  if(autoStart){autoStart=false;start();return}
  idle();
  ctl.append(button(ic('plug_play')+(W.i>0?'繼續播放':'播放一週'),'btn',start));
}

/* ---------- value question ---------- */
function valPage(){
  head('最後一題','你最想用「如果……就……」來幫自己做哪一件事？');
  app.append(el('p','lead','這一題<b>沒有標準答案</b>。選好以後，會看到一個例句、這樣做的作用，和要注意的地方。'));
  var o=el('div','opts');var bs={};var fb=el('div');
  Object.keys(VAL).forEach(function(k){var b=button(ic(VAL[k].ic)+lt(k)+'<span>'+VAL[k].n+'</span>','btn alt'+(st.val===k?' pick':''),function(){st.val=k;save(st);upd()});b.setAttribute('data-v',k);bs[k]=b;o.appendChild(b)});
  var nx=button('下一步','btn',function(){if(st.val)go('end')});
  app.append(o,fb,nx);
  function upd(){
    Object.keys(bs).forEach(function(k){bs[k].classList.toggle('pick',st.val===k);bs[k].setAttribute('aria-pressed',st.val===k?'true':'false')});
    fb.innerHTML='';nx.disabled=!st.val;
    if(st.val){var m=VAL[st.val];var c=el('div','card');c.append(el('h3',null,lt(st.val)+' '+m.n));c.append(el('dl','ec','<dt class="x">例句</dt><dd>'+m.x+'</dd><dt class="e">作用</dt><dd>'+m.e+'</dd><dt class="c">要注意</dt><dd>'+m.c+'</dd>'));fb.appendChild(c)}
  }
  upd();
}

/* ---------- end ---------- */
function endPage(){
  app.append(el('h1',null,'做完了！請停在這一頁，等其他同學。'));
  function cnt(cfg){var S=st[cfg.id];var r=cfg.items.filter(function(it){return it.ok&&S.first[it.k]==='g'}).length,m=cfg.items.filter(function(it){return !it.ok&&S.first[it.k]==='g'}).length;return r+' 個（共 2 個）<span class="sub">'+(cfg.kind==='if'?'太模糊的「如果」':'太大、太模糊的「就」')+'，第一次插進「好用的」：'+m+' 個</span>'}
  var W=st.wk,a=0,d=0,k=0;W.res.forEach(function(r){if(r==='auto')a++;else{d++;if(r==='did')k++}});
  var c=el('div','card');var tb=el('table','sum');
  var rows=[
    ['第 1 關：挑對的具體「如果」',cnt(L1)],
    ['第 2 關：挑對的小而具體的「就」',cnt(L2)],
    ['一週模擬：燈泡自動亮了',a+' 次'],
    ['一週模擬：自己重新決定',d+' 次（其中做了 '+k+' 次）'],
    ['最想用「如果……就……」幫自己',lt(st.val)+' '+VAL[st.val].n]
  ];
  tb.innerHTML='<tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>'}).join('')+'</tbody>';
  c.append(tb);
  c.append(el('p','hint','第 1、2 關算的是你第一次插的位置。'));
  app.append(c);
  var c2=el('div','card');c2.append(el('h3',null,'你接的三句「如果……就……」'));
  var b3=el('div','big3');
  SIT.forEach(function(s){var q=pairOk(s.id);b3.append(el('div','s3',bulb(q.i&&q.d?'on':'')+'<span>'+sentence(s.id)+'</span>'))});
  c2.append(b3);app.append(c2);
  app.append(el('p','note warm','老師等一下會請大家舉手：第 1、2 關各挑對幾個？一週裡燈泡自動亮了幾次？最想用「如果……就……」幫自己做哪一件事？'));
}

function render(){
  if(timer){clearTimeout(timer);timer=null}
  curWires=null;
  app.innerHTML='';
  var s=st.step;
  if(s==='intro')intro();
  else if(s==='l1')sortPage(L1);
  else if(s==='l2')sortPage(L2);
  else if(s==='l3'&&st.l3i>=0&&st.l3i<3)l3Page();
  else if(s==='wk'&&SIT.every(function(x){return st.l3[x.id]}))wkPage();
  else if(s==='val')valPage();
  else if(s==='end'&&st.val&&st.wk.done)endPage();
  else{st=fresh();save(st);intro()}
}
render();
window.addEventListener('hashchange',function(){if(location.hash==='#reset'){save(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}st=fresh();save(st);render();try{window.scrollTo(0,0)}catch(e){}}});
})();
</script>
