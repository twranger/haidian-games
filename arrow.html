<meta charset="utf-8">
<script src="fresh.js"></script>
<title>箭頭偵探</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one tablet screen per case — two things that happen together, four ways to explain the arrow, then a little arrow diagram and the reason. Score kept on the device. Single light classroom look on purpose. */
:root{
  --bg:#EEF1EE; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D2D8D1;
  --sea:#205E86; --rust:#A8441A; --good:#2F7D4F; --gold:#B7862B; --note:#EAF1F5;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,4vw,36px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.case{font-size:clamp(18px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.case b{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:14px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.thing{text-wrap:balance;border-radius:16px;padding:14px;text-align:center;font-size:clamp(20px,2.9vw,27px);font-weight:900;line-height:1.4}
.thing.a{background:#E3EEF5;color:var(--sea)} .thing.b{background:#F6E4DC;color:var(--rust)}
.with{font-size:clamp(18px,2.4vw,22px);font-weight:700;color:var(--muted);text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{font:inherit;font-size:clamp(20px,3vw,27px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.4}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left}
.opt small{display:block;font-size:.72em;font-weight:500;color:var(--muted)}
.opt.right{border-color:var(--good);background:#E3F1E8}
.opt.wrong{border-color:var(--rust);background:#F6E4DC}
.opt:disabled{cursor:default}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.verdict{margin:0;font-size:clamp(24px,3.6vw,34px);font-weight:900}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--rust)}
.explain{background:var(--note);border-radius:16px;padding:16px 20px;font-size:clamp(19px,2.7vw,25px);line-height:1.7;margin:0}
svg.map{width:100%;height:auto;max-height:240px}
.big{font-size:clamp(70px,14vw,130px);font-weight:900;line-height:1.1;margin:0;color:var(--sea);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:clamp(18px,2.5vw,23px)}
td{padding:8px;border-bottom:2px solid var(--line)} td.n{text-align:right;font-weight:900;white-space:nowrap}
@media (max-width:520px){.opts{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.with{display:none}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
var app=document.getElementById('app');
var KEY='arrow-detective-v1';
var TYPES=[
 {k:'ab',t:'A 造成 B',s:'第一件事，讓第二件事發生'},
 {k:'ba',t:'其實是 B 造成 A',s:'方向反過來了'},
 {k:'c', t:'第三件事同時造成兩個',s:'背後還有一個原因'},
 {k:'x', t:'只是剛好碰在一起',s:'兩件事沒有關係'}
];
var Q=[
 {a:'游泳圈賣得比較多的月份',sa:'游泳圈賣得多',sb:'中暑的人多',b:'中暑去看醫生的人也比較多',ans:'c',c:'天氣很熱',e:'天氣熱，去玩水的人多，游泳圈賣得好；天氣熱，中暑的人也變多。買游泳圈不會讓人中暑，是「天氣熱」同時推動了兩件事。'},
 {a:'常常去醫院的人',sa:'常去醫院',sb:'常生病',b:'比較常生病',ans:'ba',e:'不是去醫院讓人生病，而是生病了才去醫院。方向反過來了。'},
 {a:'腳比較大的小學生',sa:'腳比較大',sb:'認識的字多',b:'認識的國字也比較多',ans:'c',c:'年紀比較大',e:'六年級的同學腳比一年級大，讀過的書也比較多。腳變大不會讓人認識更多字，是「年紀」同時影響了兩件事。'},
 {a:'來七股看黑面琵鷺的人比較多的那幾個月',sa:'看鳥的遊客多',sb:'蚵仔攤生意好',b:'路邊蚵仔攤的生意也比較好',ans:'ab',e:'這一題真的有可能是 A 造成 B：來看鳥的遊客，順便買了蚵仔。<br>相關有時候背後真的有因果，只是要再查一查，例如問問老闆，客人是不是看完鳥才來的。'},
 {a:'有一個星期，班上剛好有三個人過生日',sa:'三個人過生日',sb:'午餐有炸雞',b:'那個星期的營養午餐，剛好每天都有炸雞',ans:'x',e:'營養午餐的菜單是很早以前就排好的，跟誰過生日沒有關係。兩件事只是剛好碰在同一個星期。'},
 {a:'出動越多台消防車的火災',sa:'消防車多',sb:'損失大',b:'造成的損失也越大',ans:'c',c:'火災本身越大',e:'不是消防車讓損失變大。火越大，派去的消防車越多，燒掉的東西也越多，是「火的大小」同時造成兩件事。'},
 {a:'常常被老師提醒的同學',sa:'老師常提醒',sb:'錯題多',b:'作業的錯題也比較多',ans:'ba',e:'很可能是先有比較多錯題，老師才多提醒他。不能說「老師提醒讓錯題變多」，方向可能是反過來的。'},
 {a:'超市的泡麵和礦泉水突然賣得特別多',sa:'泡麵賣得多',sb:'颱風來了',b:'第二天颱風就來了',ans:'c',also:'ba',c:'氣象局發布了颱風警報',e:'泡麵賣得多，不會把颱風叫來。是颱風要來的消息，讓大家先去買東西，所以兩件事一前一後發生。<br>如果你選「其實是 B 造成 A」，也算對：先發生的事，不一定是原因。'}
];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
if(location.hash==='#reset'){save(null)}
var st=load()||{i:0,s:0,wrong:[]};
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(t){return t.replace(/<br>/g,' ')}
function wrap(t,n){var out=[],s='';for(var i=0;i<t.length;i++){s+=t[i];if(s.length>=n){out.push(s);s=''}}if(s)out.push(s);return out.slice(0,3)}
function box(x,y,w,label,fill,stroke){var lines=wrap(label,9);var h=26+lines.length*28;var g='<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="14" fill="'+fill+'" stroke="'+stroke+'" stroke-width="3"/>';lines.forEach(function(l,k){g+='<text x="'+x+'" y="'+(y-h/2+38+k*28)+'" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2A2E">'+l+'</text>'});return g}
function map(q){
  var A=q.sa,B=q.sb;
  var defs='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2A2E"/></marker></defs>';
  var s='<svg class="map" viewBox="0 0 720 240" role="img" aria-label="箭頭圖">'+defs;
  var ay=q.ans==='c'?190:120;
  s+=box(150,ay,260,A,'#E3EEF5','#205E86')+box(570,ay,260,B,'#F6E4DC','#A8441A');
  if(q.ans==='ab')s+='<line x1="285" y1="120" x2="432" y2="120" stroke="#1F2A2E" stroke-width="5" marker-end="url(#ah)"/>';
  if(q.ans==='ba')s+='<line x1="435" y1="120" x2="288" y2="120" stroke="#1F2A2E" stroke-width="5" marker-end="url(#ah)"/>';
  if(q.ans==='x')s+='<text x="360" y="130" text-anchor="middle" font-size="30" font-weight="900" fill="#56605C">？</text>';
  if(q.ans==='c'){s+=box(360,48,260,q.c,'#FBF1DC','#B7862B')+'<line x1="300" y1="80" x2="190" y2="145" stroke="#1F2A2E" stroke-width="5" marker-end="url(#ah)"/><line x1="420" y1="80" x2="530" y2="145" stroke="#1F2A2E" stroke-width="5" marker-end="url(#ah)"/>'}
  return s+'</svg>';
}
function intro(){
  app.innerHTML='';
  var c=el('div','card');
  c.append(el('p','lead','一共 8 個案子。每個案子裡，都有兩件事常常一起發生。'),el('p','lead','請你判斷箭頭應該怎麼畫：是誰造成誰？還是背後有別的原因？'));
  var b=el('button','btn','開始辦案');b.type='button';b.addEventListener('click',ask);
  app.append(el('h1',null,'箭頭偵探'),c,b);
}
function ask(){
  var n=st.i,q=Q[n];app.innerHTML='';
  var cs=el('p','case','<span>第 <b>'+(n+1)+'</b> 案，共 8 案</span><span>破案 <b>'+st.s+'</b> 件</span>');
  var c=el('div','card');
  var pr=el('div','pair');pr.append(el('div','thing a','A　'+q.a),el('div','with','常常<br>一起出現'),el('div','thing b','B　'+q.b));
  c.append(pr,el('h2',null,'這兩件事的箭頭，應該怎麼畫？'));
  var g=el('div','opts');var bs=[];
  TYPES.forEach(function(t){var b=el('button','btn opt',t.t+'<small>'+t.s+'</small>');b.type='button';b.addEventListener('click',function(){pick(t.k)});bs.push(b);g.appendChild(b)});
  c.appendChild(g);app.append(cs,c);
  function pick(k){
    bs.forEach(function(b){b.disabled=true});
    var ok=k===q.ans||k===q.also;if(ok)st.s++;else st.wrong.push(n+1);
    TYPES.forEach(function(t,j){if(t.k===q.ans||(ok&&t.k===k))bs[j].classList.add('right');else if(t.k===k)bs[j].classList.add('wrong')});
    st.i++;save(st);
    var right=TYPES.filter(function(t){return t.k===q.ans})[0].t;
    c.append(el('p','verdict '+(ok?'ok':'no'),ok?'破案了！':'差一點！比較可能的是：'+right),el('div',null,map(q)),el('p','explain',q.e));
    var nx=el('button','btn',st.i>=Q.length?'看結果':'下一案');nx.type='button';nx.addEventListener('click',function(){st.i>=Q.length?end():ask()});
    app.appendChild(nx);nx.scrollIntoView({behavior:'smooth',block:'end'});
  }
}
function end(){
  app.innerHTML='';
  var c=el('div','card');c.append(el('p','lead','你一共破了'),el('p','big',st.s+' / 8 案'));
  if(st.wrong.length)c.appendChild(el('p','lead','沒破的案子：第 '+st.wrong.join('、')+' 案'));
  var t=el('table');
  [['第三件事同時造成兩個','第 1、3、6、8 案'],['其實是 B 造成 A','第 2、7 案'],['A 真的可能造成 B','第 4 案'],['只是剛好碰在一起','第 5 案']].forEach(function(r){var tr=el('tr');tr.append(el('td',null,r[0]),el('td','n',r[1]));t.appendChild(tr)});
  c.appendChild(t);
  app.append(el('h2',null,'辦案結束！請停在這一頁，等其他同學。'),c);
}
if(st.i>=Q.length)end();else if(st.i>0)ask();else intro();
})();
</script>
