<meta charset="utf-8">
<script src="fresh.js"></script>
<title>廣告快閃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: weekend at a big store in Annan with 300 dollars → round 1: eight flashy ad cards, 4 seconds each, cart or not → round 2 "next day": the same items as plain white cards, no timer, re-decide each cart item → compare totals → which ad trick pulled hardest → summary for a show of hands. No right answers. Single light classroom look on purpose; only the ad cards are loud. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700}
.btn.alt.pick{border-color:var(--gold);background:#FBF1DC}
.btn:disabled{cursor:default;opacity:.55}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:#FBF1DC}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.4vw,22px)}
td,th{padding:10px 8px;border-bottom:2px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--muted);font-size:.9em}
td.k{color:var(--muted);font-weight:700;white-space:nowrap}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}

/* cart bar */
.cart{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 14px;font-size:clamp(19px,2.6vw,24px);font-weight:700}
.cart svg{width:40px;height:40px;flex:none}
.cart .sum{font-weight:900;font-variant-numeric:tabular-nums}
.cart .bud{margin-left:auto;color:var(--muted);white-space:nowrap}
.cart .ov{flex-basis:100%;color:var(--rust);font-weight:900}
.cart.over{border-color:var(--rust);background:#FBEDE6}
.timer{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--rust);border-radius:99px}

/* the loud ad card */
.ad{position:relative;overflow:hidden;border-radius:26px;padding:clamp(16px,3vw,26px);color:#fff;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;justify-items:center;text-align:center;min-height:0;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.ad .pic{position:relative;width:clamp(120px,24vw,180px);height:clamp(120px,24vw,180px)}
.ad .pic>svg{width:100%;height:100%}
.ad .slogan{font-size:clamp(30px,6vw,52px);font-weight:900;line-height:1.25;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.18);text-wrap:balance}
.ad .sub{font-size:clamp(19px,3vw,27px);font-weight:900;margin:0;text-wrap:balance}
.ad .nm{font-size:clamp(19px,2.6vw,23px);font-weight:700;margin:0;opacity:.95}
.ad .price{position:absolute;right:12px;top:12px;background:#FFE14D;color:#7A2E00;font-weight:900;font-size:clamp(22px,3.6vw,32px);border-radius:99px;padding:4px 16px;transform:rotate(8deg);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ad .boom{position:absolute;left:10px;top:10px;background:#fff;color:#C2185B;font-weight:900;font-size:clamp(20px,3.2vw,30px);border-radius:16px;padding:2px 12px;transform:rotate(-8deg)}
.ad .spark{position:absolute;width:30px;height:30px}
.ad .mascot{display:flex;align-items:center;gap:8px;justify-content:center}
.ad .mascot svg{width:clamp(70px,12vw,96px);height:clamp(70px,12vw,96px);flex:none}
.ad .bubble{background:#fff;color:#1F2A2E;border-radius:18px;padding:6px 14px;font-weight:900;font-size:clamp(19px,2.8vw,25px);text-align:left}
@media (min-width:700px){
  .ad{grid-template-columns:auto minmax(0,1fr);text-align:left;justify-items:start;align-items:center;column-gap:22px}
  .ad .pic{grid-row:1/span 4}
}
.decide{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.btn.buy{background:var(--rust);font-size:clamp(22px,3.4vw,30px);padding:16px 12px}
.btn.skip{background:var(--card);color:var(--ink);border:3px solid var(--line);font-size:clamp(22px,3.4vw,30px);padding:16px 12px}
.flash{font-size:clamp(23px,3.8vw,32px);font-weight:900;text-align:center;margin:0;min-height:1.5em}

/* plain card */
.plain{background:#fff;border:2px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:6px}
.plain .pn{font-size:clamp(25px,4vw,34px);font-weight:900;margin:0}
.plain .pp{font-size:clamp(23px,3.4vw,30px);font-weight:700;margin:0;color:var(--ink)}
.plain .pd{font-size:clamp(19px,2.7vw,25px);margin:0;color:var(--muted)}

.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--note);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:clamp(28px,5vw,44px);font-weight:900;font-variant-numeric:tabular-nums;color:var(--sea);line-height:1.3}
.stat span{font-size:clamp(17px,2.3vw,21px);color:var(--muted);font-weight:700}
.stat.r b{color:var(--rust)}
@media (max-width:620px){
  .big3{grid-template-columns:1fr}
  td.k{white-space:normal;width:48%}
  .rt tr:first-child{display:none}
  .rt tr{display:block;border-bottom:2px solid var(--line);padding:8px 0}
  .rt td{display:block;border:0;padding:2px 4px;width:auto}
  .rt td:nth-child(2)::before{content:"廣告招數：";color:var(--muted);font-weight:700}
  .rt td:nth-child(3)::before{content:"隔天你選：";color:var(--muted);font-weight:400}
}

/* motion: only on the ad cards, gentle (no strobing) */
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:0}60%{transform:scale(1.04) rotate(1deg);opacity:1}100%{transform:none}}
@keyframes wob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(-3deg) scale(1.12)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
.ad{animation:pop .45s ease-out both}
.ad .boom{animation:wob .9s ease-in-out infinite}
.ad .spark{animation:twinkle 1.1s ease-in-out infinite}
.ad .pic>svg{animation:bob 1.2s ease-in-out infinite}
.ad::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:200% 100%;animation:shine 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){
  .ad,.ad .boom,.ad .spark,.ad .pic>svg,.ad::after{animation:none !important}
  .ad::after{display:none}
}
</style>

  var c=el('div','card');
  c.append(el('p','lead','星期六下午，你和家人到安南區的大賣場買東西。你的口袋裡有 <b style="color:var(--ink)">300 元</b>，這是你一整個星期的零用錢。'),
    el('p','lead','走過玩具和文具區的時候，一張又一張的廣告突然跳出來。每一張廣告，你只有 <b style="color:var(--ink)">'+SEC+' 秒</b>可以決定：「放進購物車」還是「不要」。時間到了還沒按，就算「不要」。'),
    el('p','lead','購物車可以超過 300 元，先照你當下的感覺按就好。'));
  app.append(el('p','case','第一輪・廣告快閃'),el('h1',null,'好想要！'),c,btn('準備好了，開始逛','',function(){st.i=0;st.d1=[];go('r1')}));
}

function r1(){
  clearT();locked=false;
  if(st.i>=P.length){go('night');return}
  var q=P[st.i],k=st.i;app.innerHTML='';
  var head=el('p','case','第一輪・第 '+(k+1)+' 張廣告，共 '+P.length+' 張');
  var bar=cartBar();
  var tm=el('div','timer');var ti=el('i');tm.appendChild(ti);tm.setAttribute('role','progressbar');tm.setAttribute('aria-label','剩下的時間');
  var ad=el('div','ad');ad.style.background=q.bg;
  var pic=el('div','pic');pic.innerHTML=PIC[k];
  [[-8,-6,'0s'],[82,-4,'.35s'],[-4,78,'.7s'],[88,86,'.2s']].forEach(function(s){var sp=el('span','spark',SPARK);sp.style.left=s[0]+'%';sp.style.top=s[1]+'%';sp.style.animationDelay=s[2];pic.appendChild(sp)});
  ad.appendChild(pic);
  ad.appendChild(el('p','nm',q.ad));
  if(q.say){var m=el('div','mascot');m.innerHTML=PIPI;m.appendChild(el('div','bubble','琵琵說：「'+q.say+'」'));ad.appendChild(m)}
  else ad.appendChild(el('p','slogan',q.s.replace('，','，<br>')));
  ad.appendChild(el('p','sub',q.sub));
  ad.appendChild(el('span','price',q.p+' 元'));
  ad.appendChild(el('span','boom',q.boom));
  var fl=el('p','flash','');
  var d=el('div','decide');
  var bBuy=btn('放進購物車','buy',function(){decide(1)});
  var bNo=btn('不要','skip',function(){decide(0)});
  d.append(bBuy,bNo);
  app.append(head,bar,tm,ad,d,fl);
  var t0=performance.now(),dur=SEC*1000;
  function tick(now){var left=Math.max(0,1-(now-t0)/dur);ti.style.width=(left*100).toFixed(1)+'%';if(left>0)raf=requestAnimationFrame(tick)}
  raf=requestAnimationFrame(tick);
  timer=setTimeout(function(){decide(-1)},dur);
  function decide(v){
    if(locked)return;locked=true;clearT();
    bBuy.disabled=true;bNo.disabled=true;
    st.d1[k]=v;st.i=k+1;save(st);
    var s=sumOf(cartIdx());
    if(v===1){fl.textContent='放進購物車了！';fl.style.color='var(--rust)'}
    else if(v===0){fl.textContent='不要，下一張。';fl.style.color='var(--muted)'}
    else{fl.textContent='時間到，這一張算「不要」。';fl.style.color='var(--muted)'}
    bar.replaceWith(cartBar());
    setTimeout(function(){if(st.s==='r1')render()},v===-1?1100:700);
  }
}

function night(){
  app.innerHTML='';
  var a=cartIdx(),s=sumOf(a);
  var c=el('div','card');
  c.append(el('p','lead','第一輪結束了。你一共放了 <b style="color:var(--ink)">'+a.length+' 樣</b>，加起來 <b style="color:var(--ink)">'+s+' 元</b>'+(s>BUDGET?'，已經超過零用錢了。':'。')));
  c.append(el('p','lead','賣場說：購物車可以先幫你保留到明天。'));
  c.append(el('p','lead','第二天早上，你打開保留的購物車再看一次。這次沒有廣告、沒有音效，也沒有人催你，每一樣東西只剩下名稱、價格和一句平平淡淡的說明。'));
  app.append(el('p','case','第二輪・隔天再看'),el('h1',null,'睡了一覺以後'),c);
  if(!a.length){
    app.append(el('p','note','你的購物車是空的，所以第二輪沒有東西要重新選。這也是一種選擇：廣告跳得再快，你都先說了「不要」。'),btn('看看結果','',function(){go('res')}));
  }else{
    app.append(btn('打開購物車','',function(){st.j=0;go('r2')}));
  }
}

function r2(){
  var a=cartIdx();
  if(st.j>=a.length){go('res');return}
  var k=a[st.j],q=P[k];app.innerHTML='';
  var pc=el('div','plain');pc.append(el('p','pn',q.pn),el('p','pp',q.p+' 元'),el('p','pd',q.pd));
  var h=el('h2',null,'現在再看一次，你覺得它是……');
  var g=el('div','opts');var fb=el('div');fb.style.display='flex';fb.style.flexDirection='column';fb.style.gap='12px';
  function show(key,scroll){
    Array.prototype.forEach.call(g.children,function(x){x.classList.toggle('pick',x.dataset.k===key)});
    fb.innerHTML='';
    var nx=btn(st.j<a.length-1?'下一樣':'看看結果','',function(){st.j++;save(st);if(st.j>=a.length)go('res');else{render();window.scrollTo(0,0)}});
    fb.append(el('p','note',R2[key].fb+'<br><span style="font-size:max(19px,.85em);color:var(--muted)">想換也可以，直接點別的選項。</span>'),nx);
    if(scroll)nx.scrollIntoView({behavior:'smooth',block:'end'});
  }
  ['want','no','need'].forEach(function(key){
    var b=btn(R2[key].l,'alt',function(){st.d2[k]=key;save(st);show(key,true)});b.dataset.k=key;g.appendChild(b);
  });
  var nav=[];
  if(st.j>0)nav.push(btn('回上一樣','alt',function(){st.j--;save(st);render()}));
  app.append(el('p','case','第二輪・第 '+(st.j+1)+' 樣，共 '+a.length+' 樣'),pc,h,g,fb);
  nav.forEach(function(n){n.style.alignSelf='flex-start';n.style.fontSize='19px';n.style.padding='8px 14px';app.appendChild(n)});
  if(st.d2[k])show(st.d2[k],false);
}

function nums(){
  var a=cartIdx(),s1=sumOf(a),kp=kept(),s2=sumOf(kp);
  var nw=a.filter(function(k){return st.d2[k]==='want'}),nn=a.filter(function(k){return st.d2[k]==='need'});
  return {a:a,s1:s1,kp:kp,s2:s2,diff:s1-s2,nw:nw,nn:nn};
}
function res(){
  app.innerHTML='';var n=nums();
  var g=el('div','big3');
  var x1=el('div','stat r');x1.append(el('b',null,n.s1+' 元'),el('span',null,'第一輪：'+n.a.length+' 樣'));
  var x2=el('div','stat');x2.append(el('b',null,n.s2+' 元'),el('span',null,'第二輪留下：'+n.kp.length+' 樣'));
  var x3=el('div','stat');x3.append(el('b',null,n.diff+' 元'),el('span',null,'中間差了'));
  g.append(x1,x2,x3);
  var c=el('div','card');c.appendChild(g);
  if(n.a.length){
    c.appendChild(el('p','lead','第二輪留下的 '+n.kp.length+' 樣裡，「還想要」有 '+n.nw.length+' 樣，「需要」有 '+n.nn.length+' 樣。'+(n.s2>BUDGET?'留下的東西加起來還是超過 300 元，接下來要想想先買哪幾樣。':'')));
    var t=el('table','rt');t.innerHTML='<tr><th>東西</th><th>廣告用了什麼招數</th><th>隔天你選</th></tr>';
    n.a.forEach(function(k){var tr=el('tr');tr.append(el('td','k',P[k].pn+'<br>'+P[k].p+' 元'),el('td',null,P[k].t.map(function(x){return TRICK[x]}).join('、')),el('td',null,'<b>'+(st.d2[k]?R2[st.d2[k]].l:'—')+'</b>'));t.appendChild(tr)});
    c.appendChild(t);
  }
  var msg=n.a.length===0?'你第一輪就沒有放東西進購物車。等一下聽聽看，其他同學的兩輪差了多少。'
    :n.diff===0?'你第二輪全部都留下來了。冷靜下來還是想要，或是本來就需要，都很正常。'
    :'你的兩輪差了 '+n.diff+' 元。廣告和「好想要」的感覺在的時候，和隔天冷靜下來的時候，你的選擇不太一樣。';
  app.append(el('p','case','結果'),el('h2',null,'兩輪比一比'),c,el('p','note',msg+'<br><span style="font-size:max(19px,.9em);color:var(--muted)">留得多或留得少，都沒有對錯。重點是看見：同一個你，在不同的時候想要的不一樣。</span>'),
    btn('最後一題','',function(){go('why')}));
}

function why(){
  app.innerHTML='';
  var h=el('h2',null,'回頭想一想：第一輪的廣告裡，哪一招最讓你想按「放進購物車」？');
  var g=el('div','opts');var fb=el('div');fb.style.display='flex';fb.style.flexDirection='column';fb.style.gap='12px';
  function show(i,scroll){
    Array.prototype.forEach.call(g.children,function(x,j){x.classList.toggle('pick',j===i)});
    fb.innerHTML='';var nx=btn('完成','',function(){go('end')});
    fb.append(el('p','note',WHY[i][2]),nx);if(scroll)nx.scrollIntoView({behavior:'smooth',block:'end'});
  }
  WHY.forEach(function(w,i){g.appendChild(btn(w[1],'alt',function(){st.why=w[0];save(st);show(i,true)}))});
  app.append(el('p','case','最後一題・沒有標準答案'),h,g,fb);
  WHY.forEach(function(w,i){if(st.why===w[0])show(i,false)});
}

function end(){
  app.innerHTML='';var n=nums();
  var t=el('table');
  var w=null;WHY.forEach(function(x){if(x[0]===st.why)w=x[1]});
  [['第一輪放進購物車',n.a.length+' 樣，'+n.s1+' 元'],
   ['第一輪有沒有超過 300 元',n.s1>BUDGET?'有，超過了':'沒有'],
   ['第二輪留下來',n.kp.length+' 樣，'+n.s2+' 元'],
   ['留下的裡面','還想要 '+n.nw.length+' 樣、需要 '+n.nn.length+' 樣'],
   ['兩輪差了',n.diff+' 元'],
   ['最讓我心動的廣告招數',w||'—']
  ].forEach(function(r){var tr=el('tr');tr.append(el('td','k',r[0]),el('td',null,'<b>'+r[1]+'</b>'));t.appendChild(tr)});
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}

function render(){
  clearT();
  ({intro:intro,r1:r1,night:night,r2:r2,res:res,why:why,end:end}[st.s]||intro)();
}
render();
})();
</script>
