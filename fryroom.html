<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="fresh.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>瘋狂魚苗拍賣會・全班版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{--bg:#FAF7F2;--card:#FFFFFF;--ink:#1E242B;--co:#D95D39;--te:#2A6F68;--mu:#475569;--ln:#E3DED7;--col:#FFF5F2;--tel:#F0F7F6;--dk:#1E242B;--or:#F2A65A;
--font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55}
p{margin:0}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
.host{max-width:none;padding:18px 28px}
h1{font-size:clamp(28px,5vw,44px);font-weight:900;margin:0;line-height:1.25}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:900;margin:0;line-height:1.4}
.kick{font-size:18px;font-weight:700;color:var(--co);letter-spacing:2px}
.lead{font-size:clamp(19px,2.6vw,23px);color:var(--mu)}
.card{background:var(--card);border:2px solid var(--ln);border-radius:20px;box-shadow:0 4px 24px rgba(30,36,43,.06);padding:clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:10px}
.card.dark{background:var(--dk);border:0;color:#FAF7F2}
.btn{font:inherit;font-size:clamp(20px,2.8vw,26px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--co);color:#fff;cursor:pointer;line-height:1.4}
.btn.te{background:var(--te)} .btn.gh{background:#fff;color:var(--ink);border:3px solid var(--ln)}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible{outline:4px solid var(--te);outline-offset:3px}
.net{font-size:15px;color:var(--mu)} .net b{color:var(--te)} .net.off b{color:var(--co)}
input.code{font:inherit;font-size:44px;font-weight:900;letter-spacing:12px;text-align:center;width:100%;border:3px solid var(--ln);border-radius:16px;padding:8px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.seat{font:inherit;font-size:24px;font-weight:900;border:3px solid var(--ln);background:#fff;border-radius:14px;padding:10px 0;cursor:pointer}
.seat.taken{background:#EEE;color:#AAA;cursor:default}
.seat.me{border-color:var(--te);background:var(--tel)}
.price{font-size:clamp(64px,16vw,120px);font-weight:900;line-height:1;color:var(--co);text-align:center}
.status{font-size:clamp(22px,3.4vw,30px);font-weight:900;text-align:center}
.bigbtn{font-size:clamp(28px,6vw,44px);padding:22px 18px;border-radius:24px}
.warn{background:var(--col);border:3px solid var(--co);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 大螢幕 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.roomcode{font-size:64px;font-weight:900;letter-spacing:10px;color:var(--te);line-height:1}
.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:stretch}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.podium{background:var(--dk);color:#FAF7F2;border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.podium .pr{font-size:120px;font-weight:900;line-height:1;color:var(--or)}
.podium .who{font-size:30px;font-weight:900}
.podium .sub{font-size:22px;color:#CBD5E1}
.timer{font-size:28px;font-weight:900;color:#fff;background:var(--co);border-radius:999px;padding:2px 20px}
.crowd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start}
.av{width:100px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default;transition:transform .2s}
.av svg{width:78px;height:100px}
.av .tag{font-weight:900;font-size:18px;border-radius:999px;padding:0 10px;min-height:27px;visibility:hidden}
.av.lead .tag{visibility:visible;background:var(--co);color:#fff}
.av.second .tag{visibility:visible;background:var(--te);color:#fff}
.av.hop{animation:hop .5s ease}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-22px)}100%{transform:translateY(0)}}
.log p{font-size:20px;border-bottom:1px solid var(--ln);padding:4px 0}
table{border-collapse:collapse;width:100%;font-size:24px}
th,td{border-bottom:2px solid var(--ln);padding:10px 12px;text-align:left}
th{background:#F3EEE7}
td b{color:var(--co)}
@media (prefers-reduced-motion:reduce){.av.hop{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var K=(function(){try{var k=new URLSearchParams(location.search).get('k');return k&&/^[a-z0-9]{3,16}$/.test(k)?k:null}catch(e){return null}})();
/* ===== 連線：同時連兩個公開服務，訊息用 id 去重複 ===== */
var BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
var CL=[],UP={},SEEN={},handlers=[];
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function connectAll(subs){BROKERS.forEach(function(u,i){var c;try{c=mqtt.connect(u,{connectTimeout:10000,reconnectPeriod:3000,clientId:'hdfry_'+uid()})}catch(e){return}
 CL.push(c);c.on('connect',function(){UP[i]=1;subs.forEach(function(t){c.subscribe(t)});netShow()});
 c.on('close',function(){UP[i]=0;netShow()});
 c.on('message',function(t,m){var d;try{d=JSON.parse(m.toString())}catch(e){return}
  if(d.id){if(SEEN[d.id])return;SEEN[d.id]=1}handlers.forEach(function(h){h(t,d)})})})}
function pub(t,obj,retain){obj.id=uid();var s=JSON.stringify(obj);CL.forEach(function(c){if(c.connected)c.publish(t,s,{qos:0,retain:!!retain})})}
function netOK(){return Object.keys(UP).some(function(k){return UP[k]})}
function netShow(){var e=document.getElementById('net');if(!e)return;var ok=netOK();e.className='net'+(ok?'':' off');e.innerHTML='連線：<b>'+(ok?'正常':'連線中…')+'</b>'}
function esc(s){return String(s).replace(/[<>&"]/g,'')}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var STEP=5,VALUE=100,MAXSEAT=35,QUIET=15;
var app=document.getElementById('app');
function person(fill,num,paddle){return '<svg viewBox="0 0 58 74" aria-hidden="true">'+
 (paddle?'<rect x="40" y="2" width="16" height="20" rx="4" fill="#F2A65A" stroke="#1E242B" stroke-width="2"/><path d="M48 22 L44 36" stroke="#1E242B" stroke-width="3"/>':'')+
 '<circle cx="29" cy="18" r="13" fill="'+fill+'"/><path d="M6 72 Q6 36 29 36 Q52 36 52 72 Z" fill="'+fill+'"/>'+
 '<text x="29" y="64" text-anchor="middle" font-size="18" font-weight="900" fill="#fff" font-family="Noto Sans TC,sans-serif">'+num+'</text></svg>'}

/* ======================= 老師的大螢幕 ======================= */
if(location.hash.indexOf('host')>=0){
 var H=ls('fryhost-v1');
 if(!H||location.hash.indexOf('new')>=0||(K&&H.room!==K)){H={room:K||String(1000+Math.floor(Math.random()*9000)),ph:'lobby',r:1,price:0,lead:null,bids:{},seats:{},stops:{},over:{},deadline:0,hist:[],log:[]};ls('fryhost-v1',H);try{history.replaceState(null,'','#host')}catch(e){}}
 var T='hdfry/'+H.room+'/';
 var lastLead=null;
 function second(){var b=null;Object.keys(H.bids).forEach(function(s){if(+s===H.lead)return;if(!b||H.bids[s]>H.bids[b])b=s});return b?+b:null}
 function endAt(){return H.hard?Math.min(H.deadline,H.hard):H.deadline}
 function left(){return H.ph==='live'?Math.max(0,Math.ceil((endAt()-Date.now())/1000)):0}
 function broadcast(){var s=second();pub(T+'state',{hard:H.hard?1:0,room:H.room,ph:H.ph,r:H.r,price:H.price,lead:H.lead,sec:s,secAmt:s?H.bids[s]:0,bids:H.bids,seats:H.seats,stops:H.stops,left:left(),hist:H.hist},true);ls('fryhost-v1',H)}
 handlers.push(function(t,d){if(t!==T+'in')return;var seat=+d.seat;
  if(d.t==='join'){if(!(seat>=1&&seat<=MAXSEAT))return;var own=H.seats[seat];if(!own||own===d.cid){
    Object.keys(H.seats).forEach(function(k){if(H.seats[k]===d.cid&&+k!==seat)delete H.seats[k]});H.seats[seat]=d.cid;render();broadcast()}else{broadcast()}}
  else if(d.t==='bid'){if(H.ph!=='live'||H.seats[seat]!==d.cid||H.lead===seat)return;
    if(H.hard&&Date.now()>=H.hard)return;H.price+=STEP;H.lead=seat;H.bids[seat]=H.price;if(!H.hard)H.deadline=Date.now()+QUIET*1000;
    if(H.r===2&&H.stops[seat]!=null&&H.price>H.stops[seat])H.over[seat]=1;
    H.log.unshift(seat+' 號喊 '+H.price+' 元');H.log=H.log.slice(0,8);render();broadcast()}
  else if(d.t==='stop'){if(H.seats[seat]!==d.cid)return;H.stops[seat]=Math.max(0,+d.v||0);render();broadcast()}
  else if(d.t==='hello'){broadcast()}});
 connectAll([T+'in']);
 setInterval(function(){if(H.ph==='live'&&((H.hard&&Date.now()>=H.hard)||(Date.now()>=H.deadline&&H.lead!=null))){hammer()}else if(H.ph==='live'){tick()}ctl()},250);
 setInterval(broadcast,2500);
 function tick(){var e=document.getElementById('tm');if(e)e.textContent=H.hard?'最後倒數 '+left()+' 秒（不再延長）':H.lead==null?'等第一個人舉牌':'還剩 '+left()+' 秒';}
 /* 老師控制列：固定在畫面下方，不會被重畫，喊價再激烈也按得到（也可以按鍵盤：F＝最後倒數 15 秒，H＝直接落槌） */
 var CB=document.createElement('div');CB.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9;display:none;gap:12px;justify-content:center;padding:12px;background:rgba(30,36,43,.92)';
 CB.innerHTML='<button id="cbF" class="btn" style="font-size:26px">最後倒數 15 秒（F）</button><button id="cbH" class="btn gh" style="font-size:26px">直接落槌（H）</button>';document.body.appendChild(CB);
 function finalCount(){if(H.ph!=='live'||H.hard)return;H.hard=Date.now()+15000;H.log.unshift('老師：最後倒數 15 秒！');H.log=H.log.slice(0,8);render();broadcast()}
 document.getElementById('cbF').addEventListener('pointerdown',function(e){e.preventDefault();finalCount()});
 document.getElementById('cbH').addEventListener('pointerdown',function(e){e.preventDefault();hammer()});
 document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if(k==='f'){finalCount()}else if(k==='h'){hammer()}});
 function ctl(){var on=H.ph==='live';CB.style.display=on?'flex':'none';var f=document.getElementById('cbF');f.textContent=H.hard?'最後倒數中：'+left()+' 秒':'最後倒數 15 秒（F）';f.disabled=!!H.hard}
 window.startRound=function(){H.ph='live';H.hard=0;H.price=0;H.lead=null;H.bids={};H.over={};H.deadline=Date.now()+QUIET*1000;H.log=[];render();broadcast()};
 window.hammer=function(){if(H.ph!=='live')return;var s=second();
  H.hist=H.hist.filter(function(x){return x.r!==H.r});
  H.hist.push({r:H.r,price:H.price,lead:H.lead,sec:s,secAmt:s?H.bids[s]:0,bidders:Object.keys(H.bids).length,
   stops:H.r===2?Object.keys(H.stops).filter(function(k){return H.bids[k]}).length:0,over:H.r===2?Object.keys(H.over).length:0});
  H.ph='end';render();broadcast()};
 window.toStop=function(){H.r=2;H.ph='stop';H.stops={};render();broadcast()};
 window.toSum=function(){H.ph='sum';render();broadcast()};
 window.setFor=function(s){var v=prompt(s+' 號的停損點要設多少元？（5 的倍數）',H.stops[s]!=null?H.stops[s]:100);if(v==null)return;v=Math.max(0,Math.round((+v||0)/5)*5);H.stops[s]=v;render();broadcast()};
 window.setAll=function(){Object.keys(H.seats).forEach(function(x){if(H.stops[x]==null)H.stops[x]=100});render();broadcast()};
 window.release=function(s){if(H.ph!=='lobby')return;if(confirm('要把 '+s+' 號空出來，讓別台平板重新選嗎？')){delete H.seats[s];render();broadcast()}};
 window.replay=function(){if(confirm('要從第 1 回合重新開始嗎？已經進場的座號會保留。')){H.ph='lobby';H.r=1;H.price=0;H.lead=null;H.bids={};H.stops={};H.over={};H.hist=[];H.log=[];render();broadcast()}};
 window.newRoom=function(){if(confirm(K?'清空紀錄、換新班級？\n已經進來的學生都會被退出、回到選座號，之前的紀錄不再計入。':'要全部重置、開新房號嗎？（換下一班時用）')){pub(T+'state',{ts:Date.now(),room:H.room,ph:'closed',seats:{},bids:{},stops:{},hist:[]},true);if(K)pub('hdboard/'+K+'/epoch',{ts:Date.now()},true);setTimeout(function(){if(K){ls('fryhost-v1',null);location.hash='#host'}else{location.hash='#host-new'}location.reload()},400)}};
 function crowd(){var h='';var sec=second();Object.keys(H.seats).map(Number).sort(function(a,b){return a-b}).forEach(function(s){
   if(H.ph==='stop'){var ok=H.stops[s]!=null;h+='<div class="av '+(ok?'second':'lead')+'" onclick="setFor('+s+')" style="cursor:pointer"><span class="tag">'+(ok?'✓ '+H.stops[s]+' 元':'還沒設')+'</span>'+person(ok?'#2A6F68':'#D95D39',s,false)+'</div>';return}
   var cls=s===H.lead?'lead':s===sec?'second':'';var fill=s===H.lead?'#D95D39':s===sec?'#2A6F68':'#94A3B8';
   h+='<div class="av '+cls+'" id="av'+s+'" onclick="release('+s+')"><span class="tag">'+(H.bids[s]?H.bids[s]+' 元':'－')+'</span>'+person(fill,s,s===H.lead)+'</div>'});
  return h||'<p class="lead">還沒有人進場。</p>'}
 function sumTable(){var h='<table><tr><th></th><th>成交價（得標者）</th><th>第二高（付錢、拿不到）</th><th>辦拍賣的人一共收到</th></tr>';
  H.hist.forEach(function(x){h+='<tr><td>第 '+x.r+' 回合</td><td><b>'+x.price+' 元</b>（'+(x.lead||'－')+' 號）</td><td><b>'+x.secAmt+' 元</b>（'+(x.sec||'－')+' 號）</td><td><b>'+(x.price+x.secAmt)+' 元</b></td></tr>'});
  return h+'</table>'}
 function render(){var s=second(),n=Object.keys(H.seats).length,h='';
  h+='<div class="wrap host"><div class="top"><div><p class="kick">第 3 課・活動二　全班版</p><h1>瘋狂魚苗拍賣會</h1>'+
   (K?'<p class="lead">學生用簡報上的「全班版」連結進來，按自己的座號就能進場。</p></div>':'<p class="lead">學生網址：games.twranger.com/fryroom.html　輸入房號 →</p></div>')+
   '<div style="text-align:right">'+(K?'<p class="lead">免房號</p>':'<p class="lead">房號</p><p class="roomcode">'+H.room+'</p>')+'<p id="net" class="net"></p>'+
   '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn gh" style="font-size:16px;padding:6px 12px" onclick="replay()">同一班重玩</button><button class="btn gh" style="font-size:16px;padding:6px 12px" onclick="newRoom()">清空紀錄・換新班級</button></div></div></div>';
  if(H.ph==='lobby'){
   h+='<div class="card"><h2>已經進場：'+n+' 人</h2><div class="crowd">'+crowd()+'</div><p class="net">選錯座號的同學：點他的小人，就能把座號空出來。</p></div>'+
   '<div class="card"><p>規則：魚苗值 <b>100 元</b>。每次舉牌多喊 <b>5 元</b>。'+QUIET+' 秒內沒有人再喊，就成交。<br>喊最高的人，付錢買走魚苗；喊<b>第二高</b>的人，也要照付自己喊的錢，卻什麼也拿不到。</p></div>'+
   '<button class="btn te" '+(n?'':'disabled')+' onclick="startRound()">大家都進場了，開始第 1 回合</button>';
  } else if(H.ph==='live'||H.ph==='end'){
   var end=H.ph==='end';
   h+='<div class="stage"><div class="podium"><p class="sub">第 '+H.r+' 回合　'+(end?'成交！':'這桶魚苗值 100 元')+'</p><p class="pr">'+H.price+' 元</p>'+
    '<p class="who">'+(H.lead?H.lead+' 號'+(end?'買走了魚苗':'目前最高'):'還沒有人舉牌')+'</p>'+
    (s?'<p class="sub">第二高：'+s+' 號（'+H.bids[s]+' 元）</p>':'')+
    (end?'':'<p class="timer" id="tm"></p>')+'</div>'+
    '<div class="card"><h2>剛剛的喊價</h2><div class="log">'+(H.log.map(function(x){return '<p>'+esc(x)+'</p>'}).join('')||'<p>（還沒有）</p>')+'</div></div></div>'+
    '<div class="card"><div class="crowd">'+crowd()+'</div></div>';
   if(!end)h+='<div style="height:90px"></div>';
   else{var x=H.hist[H.hist.length-1];
    h+='<div class="card dark"><h2>算一算</h2><p style="font-size:24px">'+(x.lead?x.lead+' 號付了 '+x.price+' 元買到值 100 元的魚苗：'+(x.price<=100?'賺了 '+(100-x.price)+' 元':'<b style="color:#F2A65A">賠了 '+(x.price-100)+' 元</b>')+'。':'沒有人喊價。')+
     (x.sec?'<br>'+x.sec+' 號付了 '+x.secAmt+' 元，<b style="color:#F2A65A">什麼也沒拿到</b>。':'')+
     '<br>辦拍賣的人一共收到 <b style="color:#F2A65A">'+(x.price+x.secAmt)+' 元</b>'+(x.price+x.secAmt>100?'，比魚苗的價值還多！':'。')+
     (H.r===2?'<br>第二回合：有 '+x.over+' 個人喊超過了自己設的停損點。':'')+'</p></div>'+
     (H.r===1?'<button class="btn te" onclick="toStop()">第 2 回合：先請大家設停損點</button>':'<button class="btn te" onclick="toSum()">看兩回合的比較</button>');}
  } else if(H.ph==='stop'){
   var k=Object.keys(H.stops).length,miss=Object.keys(H.seats).map(Number).filter(function(x){return H.stops[x]==null}).sort(function(a,b){return a-b});
   h+='<div class="card"><h2>第 2 回合開始前：請在平板上設好自己的「停損點」</h2><p class="lead">停損點，就是事先替自己畫好的一條線：最多喊到多少錢，就停下來。</p>'+
    '<p style="font-size:30px;font-weight:900">已經設好：'+k+' / '+n+' 人'+(miss.length?'　<span style="color:#D95D39">還沒設：'+miss.join('、')+' 號</span>':'　<span style="color:#2A6F68">全部設好了！</span>')+'</p></div>'+
    '<div class="card"><div class="crowd">'+crowd()+'</div><p class="net">紅色的小人還沒設。老師可以點任何一個小人，直接替他設停損點。</p>'+
    (miss.length?'<button class="btn gh" onclick="setAll()">還沒設的 '+miss.length+' 人，一律替他設 100 元</button>':'')+'</div>'+
    '<button class="btn te" onclick="startRound()">開始第 2 回合</button>';
  } else {
   h+='<div class="card"><h2>兩回合比一比</h2>'+sumTable()+'</div>'+
    '<div class="card"><p style="font-size:24px">第 2 回合有先設停損點，價錢有沒有比較低？喊超過停損點的人有幾個？</p></div>'+
    '<button class="btn gh" onclick="newRoom()">清空紀錄・換新班級</button>';
  }
  h+='</div>';app.innerHTML=h;netShow();tick();
  if(H.lead!==lastLead&&H.lead!=null){var a=document.getElementById('av'+H.lead);if(a){a.classList.add('hop')}}lastLead=H.lead;}
 render();
}
/* ======================= 學生的平板 ======================= */
else{
 var S=ls('fryme-v1')||{cid:uid(),room:'',seat:null};ls('fryme-v1',S);
 var ST=null,lastSeen=0,pending=false,ask=false,stopDraft=null;
 var m=location.hash.match(/room=(\d{4})/);if(m)S.room=m[1];if(K)S.room=K;if(K)S.room=K;
 function T(){return 'hdfry/'+S.room+'/'}
 function send(o){o.cid=S.cid;o.seat=S.seat;pub(T()+'in',o)}
 function join(){handlers.push(function(t,d){if(t!==T()+'state')return;if(d.ph==='closed'){try{if(d.ts&&sessionStorage.getItem('hdclosed')==String(d.ts))return;sessionStorage.setItem('hdclosed',String(d.ts))}catch(e){}if(!K)S.room='';S.seat=null;ls('fryme-v1',S);location.reload();return}ST=d;lastSeen=Date.now();pending=false;
   if(S.seat&&d.seats[S.seat]!==S.cid&&d.ph==='lobby'){S.seat=null;ls('fryme-v1',S)}render()});
  connectAll([T()+'state']);setTimeout(function(){send({t:'hello'})},1500);
  setTimeout(function(){if(!ST)render()},6000)}
 window.enter=function(){var v=(document.getElementById('code').value||'').replace(/\D/g,'');if(v.length!==4){alert('房號是 4 個數字');return}
  S.room=v;ls('fryme-v1',S);join();render()};
 window.pick=function(s){S.seat=s;ls('fryme-v1',S);send({t:'join'});render()};
 window.bid=function(force){if(!ST||ST.ph!=='live'||ST.lead===S.seat)return;
  var next=ST.price+STEP,stop=ST.stops&&ST.stops[S.seat];
  if(ST.r===2&&stop!=null&&next>stop&&!force){ask=true;render();return}
  ask=false;pending=true;send({t:'bid'});render()};
 window.noBid=function(){ask=false;render()};
 window.adj=function(d){window.stopTouched=true;stopDraft=Math.max(0,Math.min(300,(stopDraft==null?100:stopDraft)+d));render()};
 window.setStop=function(){send({t:'stop',v:stopDraft==null?100:stopDraft});};
 setInterval(function(){if(ST&&ST.ph==='live'){var e=document.getElementById('lf');if(e){var l=Math.max(0,ST.left-Math.floor((Date.now()-lastSeen)/1000));e.textContent=ST.hard?'老師喊最後倒數：還剩 '+l+' 秒！':ST.lead==null?'':'還剩大約 '+l+' 秒'}}},500);
 function render(){var h='<div class="wrap"><p class="kick">瘋狂魚苗拍賣會・全班版'+(S.seat?'　｜　我是 '+S.seat+' 號':'')+'</p>';
  if(!S.room||(!ST&&!CL.length)){
   h+='<h1>輸入房號</h1><p class="lead">看大螢幕右上角的 4 個數字。</p><input id="code" class="code" inputmode="numeric" maxlength="4" value="'+esc(S.room)+'"><button class="btn te" onclick="enter()">進入拍賣場</button>';
  } else if(!ST){
   h+='<h2>正在連到房號 '+esc(S.room)+'……</h2><p class="lead">如果一直停在這裡，請確認房號對不對。</p><button class="btn gh" onclick="localStorage.removeItem(\'fryme-v1\');location.reload()">重新輸入房號</button>';
  } else if(!S.seat||ST.seats[S.seat]!==S.cid){
   var mine=S.seat;h+='<h1>按下你的座號</h1><p class="lead">灰色的座號已經有人選了。按錯了請舉手告訴老師。</p><div class="seats">';
   for(var i=1;i<=MAXSEAT;i++){var tk=ST.seats[i]&&ST.seats[i]!==S.cid;h+='<button class="seat'+(tk?' taken':'')+(mine===i?' me':'')+'" '+(tk?'disabled':'')+' onclick="pick('+i+')">'+i+'</button>'}
   h+='</div>'+(mine?'<p class="lead">正在進場……</p>':'');
  } else if(ST.ph==='lobby'){
   h+='<div class="card" style="align-items:center">'+person('#2A6F68',S.seat,false)+'<h2>你已經進場了！</h2><p class="lead">看看大螢幕，你的小人出現了嗎？等老師開始。</p></div>';
  } else if(ST.ph==='stop'){
   var v=(!window.stopTouched&&ST.stops[S.seat]!=null)?ST.stops[S.seat]:(stopDraft==null?100:stopDraft);stopDraft=v;var done=ST.stops[S.seat]!=null;
   h+='<h1>第 2 回合：先設好你的停損點</h1><p class="lead">停損點，就是事先替自己畫好的一條線：喊到這條線，就停下來。</p>'+
    '<div class="card" style="align-items:center"><p class="lead">我最多喊到</p><p class="price">'+v+' 元</p>'+
    '<div class="grid2" style="width:100%"><button class="btn gh" onclick="adj(-5)">少 5 元</button><button class="btn gh" onclick="adj(5)">多 5 元</button></div>'+
    '<button class="btn te" style="width:100%" onclick="setStop()">'+(done?'已設好 '+ST.stops[S.seat]+' 元（可以再改）':'設好了')+'</button></div>';
  } else if(ST.ph==='live'){
   var me=ST.lead===S.seat,my=ST.bids[S.seat]||0,next=ST.price+STEP,stop=ST.r===2?ST.stops[S.seat]:null;
   h+='<p class="status">第 '+ST.r+' 回合　目前最高</p><p class="price">'+ST.price+' 元</p>'+
    '<p class="status" style="color:'+(me?'#2A6F68':'#1E242B')+'">'+(me?'你是目前最高！':ST.lead?ST.lead+' 號目前最高':'還沒有人舉牌')+'</p>'+
    '<p class="lead" style="text-align:center"><span id="lf"></span></p>'+
    '<div class="card"><p>我喊過的最高價：<b>'+my+' 元</b>'+(stop!=null?'　｜　我的停損點：<b>'+stop+' 元</b>':'')+'</p>'+
    (my&&!me?'<p style="color:#D95D39;font-weight:900">如果現在停下來，而你是第二高，這 '+my+' 元也要照付。</p>':'')+'</div>';
   if(ask)h+='<div class="warn"><p style="font-size:24px;font-weight:900">喊 '+next+' 元，會超過你的停損點 '+stop+' 元。</p><p>確定還要喊嗎？</p><div class="grid2"><button class="btn" onclick="bid(true)">還是要喊</button><button class="btn te" onclick="noBid()">停下來</button></div></div>';
   else h+='<button class="btn bigbtn" '+(me||pending?'disabled':'')+' onclick="bid()">'+(me?'等別人喊價':'舉牌！喊 '+next+' 元')+'</button>';
  } else if(ST.ph==='end'||ST.ph==='sum'){
   var x=ST.hist[ST.hist.length-1]||{};var my2=ST.bids[S.seat]||0,res;
   if(x.lead===S.seat)res='你用 '+x.price+' 元買到了魚苗，'+(x.price<=100?'賺了 '+(100-x.price)+' 元。':'賠了 '+(x.price-100)+' 元。');
   else if(x.sec===S.seat)res='你是第二高，要付 '+x.secAmt+' 元，卻什麼也沒拿到。';
   else res=my2?'你喊到 '+my2+' 元，不是最高也不是第二高，不用付錢。':'你這一回合沒有喊價，不用付錢。';
   h+='<h1>第 '+(x.r||ST.r)+' 回合結束</h1><div class="card"><p style="font-size:26px;font-weight:900">'+res+'</p><p class="lead">成交價 '+x.price+' 元；辦拍賣的人一共收到 '+((x.price||0)+(x.secAmt||0))+' 元。</p></div><p class="lead">請看大螢幕，等老師說下一步。</p>';
  }
  h+='<p id="net" class="net"></p></div>';app.innerHTML=h;netShow();
  var c=document.getElementById('code');if(c)c.focus()}
 if(S.room)join();render();
}
</script>
</body>
</html>
