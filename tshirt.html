<meta charset="utf-8">
<script src="fresh.js"></script>
<title>糗事記憶調查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: two private questions on the tablet — (1) how many classmates do you think still remember your last small blunder? (2) how many of your classmates' recent blunders do you remember? — then a summary card to report by show of hands. Nothing names anyone. Single light classroom look on purpose. */
:root{
  --bg:#F1F0EA; --card:#FCFBF7; --ink:#1F2A2E; --muted:#56605C; --line:#D5D2C6;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --note:#EAF1F5;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6}
.wrap{min-height:100%;max-width:860px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.step{font-size:clamp(18px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-size:clamp(20px,3vw,27px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.4}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.btn.alt[aria-pressed="true"]{border-color:var(--gold);background:#FBF1DC}
.btn:disabled{background:#A7B0AE;cursor:default}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.count{font-size:clamp(60px,12vw,110px);font-weight:900;text-align:center;color:var(--rust);margin:0;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--rust);height:40px}
.scale{display:flex;justify-content:space-between;font-size:clamp(16px,2.2vw,20px);color:var(--muted);font-weight:700;margin:0}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(18px,2.5vw,23px);line-height:1.7;margin:0}
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.7vw,25px)}
td{padding:12px 8px;border-bottom:2px solid var(--line)} td.n{text-align:right;font-weight:900;white-space:nowrap;color:var(--sea)}
@media (max-width:440px){.opts{grid-template-columns:repeat(2,1fr)}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
var app=document.getElementById('app');
var KEY='blunder-memory-v1';
var O=['0 件','1 件','2 件','3 件以上'];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
if(location.hash==='#reset'){save(null)}
var st=load()||{step:0,a1:null,a2:null};
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function intro(){
  app.innerHTML='';
  var c=el('div','card');c.append(el('p','lead','一共 2 題，請誠實回答。'),el('p','lead','不用寫名字，也不用寫是什麼事。只有你自己看得到。'));
  var b=el('button','btn','開始');b.type='button';b.addEventListener('click',function(){st.step=1;save(st);q1()});
  app.append(el('h1',null,'糗事記憶調查'),c,b);
}
function q1(){
  app.innerHTML='';
  var c=el('div','card');c.append(el('p','lead','想一想：你最近一次在班上小小出糗，例如念錯字、跌了一跤、穿錯衣服、上台忘詞。<br>不用說是什麼事，在心裡想就好。'));
  var h=el('h2',null,'你覺得，現在班上還有幾成同學記得那件事？');
  var r=document.createElement('input');r.type='range';r.min=0;r.max=10;r.step=1;r.value=st.a1!=null?st.a1:5;r.setAttribute('aria-label','幾成同學還記得');
  var out=el('p','count',r.value+' 成');r.addEventListener('input',function(){out.textContent=r.value+' 成'});
  var sc=el('p','scale');sc.append(el('span',null,'0 成：沒有人記得'),el('span',null,'10 成：全班都記得'));
  var b=el('button','btn','下一題');b.type='button';b.addEventListener('click',function(){st.a1=+r.value;st.step=2;save(st);q2()});
  app.append(el('p','step','第 1 題，共 2 題'),c,h,out,r,sc,b);
}
function q2(){
  app.innerHTML='';
  var c=el('div','card');c.append(el('p','lead','換個方向。想一想：班上其他同學最近的小糗事。<br>一樣不用說是誰、是什麼事。'));
  var h=el('h2',null,'你現在還記得的，有幾件？');
  var g=el('div','opts');
  O.forEach(function(t,k){var b=el('button','btn alt',t);b.type='button';b.addEventListener('click',function(){st.a2=k;st.step=3;save(st);end()});g.appendChild(b)});
  var back=el('button','btn alt','回上一題');back.type='button';back.addEventListener('click',function(){st.step=1;save(st);q1()});
  app.append(el('p','step','第 2 題，共 2 題'),c,h,g,back);
}
function end(){
  app.innerHTML='';
  var t=el('table');
  [['你覺得還記得你糗事的同學',st.a1+' 成'],['你記得別人的糗事',O[st.a2]]].forEach(function(r){var tr=el('tr');tr.append(el('td',null,r[0]),el('td','n',r[1]));t.appendChild(tr)});
  var c=el('div','card');c.append(t,el('p','note','等一下老師會請大家舉手。只要說出這兩個答案，不用說是誰、是什麼事。'));
  app.append(el('h2',null,'做完了！請停在這一頁，等其他同學。'),c);
}
var S=[intro,q1,q2,end];(S[st.step]||intro)();
})();
</script>
