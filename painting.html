<meta charset="utf-8">
<script src="fresh.js"></script>
<title>你喜歡哪一幅畫</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: story → gallery wall with two hand-drawn SVG paintings (tap one, spotlight + tag) → random team badge (crypto) → how points work → 4 rounds of a points balance (3 split buttons move two coin pans, beam tilts) → result + reveal that teams were drawn by lot → feeling question → summary for a show of hands. Single light classroom look on purpose. */
:root{
  --bg:#EEF0EC; --card:#FBFCF9; --ink:#1F2A2E; --muted:#56605C; --line:#D4D9D2;
  --sea:#205E86; --rust:#A8441A; --gold:#B7862B; --good:#2F7D4F; --note:#EAF1F5; --warm:#FBF1DC;
  --wave:#205E86; --waveF:#DCE8F0; --block:#A8441A; --blockF:#F6DCCF;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding-inline:20px;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:900;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,3.8vw,34px);font-weight:900;margin:0;line-height:1.45;text-wrap:balance}
h3{font-size:clamp(23px,3.2vw,28px);font-weight:900;margin:0;line-height:1.45}
.lead{font-size:clamp(19px,2.7vw,25px);color:var(--muted);margin:0}
.lead b{color:var(--ink)}
.case{font-size:clamp(19px,2.4vw,22px);font-weight:700;color:var(--sea);letter-spacing:2px;margin:0;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-size:clamp(19px,2.8vw,25px);font-weight:900;border:0;border-radius:16px;padding:14px 18px;background:var(--sea);color:#fff;cursor:pointer;line-height:1.45;touch-action:manipulation}
.btn[disabled]{opacity:.45;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);text-align:left;font-weight:700}
.btn.alt.pick{border-color:var(--gold);background:var(--warm)}
.btn:focus-visible,.art:focus-visible,.opt:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.note{background:var(--note);border-radius:16px;padding:14px 18px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;margin:0}
.note.warm{background:var(--warm)}
.opts{display:flex;flex-direction:column;gap:10px}
.opts .btn.alt{display:flex;align-items:center;gap:12px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.25em;flex:none;display:inline-block}
.opts .btn.alt svg.i{width:1.6em;height:1.6em}
.case svg.i{width:1.3em;height:1.3em}
/* gallery */
.wall{position:relative;border-radius:22px;padding:clamp(18px,3.4vw,34px) clamp(12px,3vw,30px) 26px;background:linear-gradient(#E9E4D8 0 84%,#CDBFA6 84% 100%);display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,3vw,30px);overflow:hidden}
.wall::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#D8D0BF}
.art{font:inherit;color:var(--ink);background:transparent;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .25s,opacity .25s}
.art .light{position:absolute;left:50%;top:-40px;width:130%;height:calc(100% + 40px);transform:translateX(-50%);background:radial-gradient(ellipse 50% 60% at 50% 30%,rgba(255,240,190,1),rgba(255,240,190,0) 72%);opacity:0;transition:opacity .3s;pointer-events:none}
.art .frm{display:block;position:relative;width:100%;border-radius:6px;padding:clamp(7px,1.4vw,12px);background:#9B6B3D;box-shadow:inset 0 0 0 3px #7A5130,0 6px 10px rgba(60,40,20,.18);transition:box-shadow .25s}
.art .mat{display:block;background:#FBF8F1;padding:clamp(6px,1.2vw,10px);border-radius:2px}
.art .mat svg{display:block;width:100%;height:auto}
.art .plaque{background:#FBFCF9;border:2px solid #CDBFA6;border-radius:8px;padding:2px 12px;font-weight:900;font-size:clamp(19px,2.6vw,23px)}
.art .tag{position:absolute;right:-6px;top:-14px;background:var(--warm);border:3px solid var(--gold);border-radius:999px;padding:2px 12px 2px 8px;font-size:clamp(17px,2.2vw,20px);font-weight:900;display:flex;align-items:center;gap:4px;transform:scale(0) rotate(-8deg);transition:transform .25s;white-space:nowrap;z-index:2;box-shadow:0 3px 6px rgba(60,40,20,.2)}
.art.on{transform:translateY(-6px)}
.art.on .light{opacity:1}
.art.on .frm{box-shadow:inset 0 0 0 3px #7A5130,0 0 0 5px var(--gold),0 16px 22px rgba(60,40,20,.25)}
.art.on .tag{transform:scale(1) rotate(-4deg)}
.wall.chosen .art:not(.on){opacity:.68}
@media (max-width:560px){.wall{grid-template-columns:1fr;gap:26px;padding-top:28px}.art .frm{max-width:330px}}
/* team badge */
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-block:8px}
.badge .big{width:clamp(110px,22vw,150px);height:auto;padding:16px;border-radius:50%;border:5px solid currentColor;background:var(--card);animation:pop .5s ease-out}
.badge .name{font-size:clamp(34px,6.6vw,58px);font-weight:900;margin:0;line-height:1.3}
.badge .sub{font-size:clamp(19px,2.8vw,26px);font-weight:700;margin:0;color:var(--muted)}
.t-wave{color:var(--wave)} .t-block{color:var(--block)}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
/* balance */
.balcard{padding-bottom:16px}
svg.bal{display:block;width:100%;max-width:560px;margin:0 auto;height:auto;overflow:visible}
.bal .beam,.bal .pan{transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.bal .beam{transform-box:view-box;transform-origin:300px 70px}
.bal .coin.new{animation:drop .35s ease-out both}
@keyframes drop{0%{transform:translateY(-40px);opacity:0}100%{transform:translateY(0);opacity:1}}
.bal .num{font:900 38px var(--font);fill:var(--ink)}
.bal .q{font:900 38px var(--font);fill:#A3ABA6}
.ppl{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:600px;margin:0 auto;width:100%}
.person{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:900;font-size:clamp(19px,2.6vw,24px);line-height:1.3;border-radius:14px;padding:8px 6px;border:3px solid currentColor;background:var(--card)}
.person svg.i{width:1.5em;height:1.5em}
.person small{display:block;font-size:clamp(15px,2vw,18px);font-weight:700;color:var(--muted)}
.person.t-wave{background:var(--waveF)} .person.t-block{background:var(--blockF)}
.info{margin:0;text-align:center;font-size:clamp(19px,2.6vw,23px);color:var(--muted);font-weight:700;min-height:1.6em}
.info b{color:var(--ink);font-variant-numeric:tabular-nums}
.optrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.opt:active{transform:scale(.97)}
.opt.pick{border-color:var(--gold);background:var(--warm)}
.opt .lt{font-size:clamp(23px,3.2vw,28px);font-weight:900;color:var(--sea);line-height:1.2}
.opt .pills{display:flex;flex-direction:column;gap:6px;width:100%}
.pill{display:flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;padding:3px 10px;font-weight:900;font-size:clamp(19px,2.5vw,22px);white-space:nowrap;border:2px solid currentColor}
.pill small{font-size:.8em;font-weight:700;color:var(--muted);margin-right:2px}
.pill.t-wave{background:var(--waveF)} .pill.t-block{background:var(--blockF)}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .optrow{grid-template-columns:1fr}
  .opt{flex-direction:row;padding:8px 10px}
  .opt .lt{width:1.4em;flex:none}
  .opt .pills{flex-direction:row}
  .pill{flex:1 1 0;padding:3px 6px}
  .person{flex-direction:column;gap:2px;padding:6px 4px}
  .person>span{white-space:nowrap}
}
/* result */
table{border-collapse:collapse;width:100%;font-size:clamp(19px,2.6vw,24px)}
th,td{padding:10px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td b{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
td.k{color:var(--muted);font-weight:700;width:38%}
.chip{display:inline-block;border-radius:10px;padding:0 8px;font-weight:900;margin-left:4px;font-size:.9em}
.chip.fav{background:var(--blockF);color:#7A2F12}
.chip.even{background:#DCEBD5;color:#1F5A36}
.reveal{border-color:var(--gold);background:var(--warm)}
.reveal .hd{display:flex;align-items:center;gap:12px}
.reveal .hd svg.i{width:2.4em;height:2.4em}
.reveal p{margin:0;font-size:clamp(19px,2.6vw,24px);line-height:1.7}
@media (max-width:620px){th,td{padding:8px 4px}td.k{width:42%}}
</style>

<main class="wrap" id="app" aria-live="polite"></main>

/* ---------- step 0: intro ---------- */
function intro(){
  app.innerHTML='';
  var c=el('div','card');
  c.append(el('p','lead','這個星期，海佃國小二樓的走廊變成了一間小畫廊。美術老師掛出兩幅新的畫，想知道大家比較喜歡哪一幅。'),
    el('p','lead','看完畫以後，老師還有一件事要請你幫忙：決定幾位同學可以拿到多少「班級點數」。'));
  app.append(el('h1',null,'你喜歡哪一幅畫'),c,el('p','note','每一題都沒有標準答案，照你自己的感覺選就好。'),button('走進畫廊','btn',function(){go(1)}));
}

/* ---------- step 1: gallery ---------- */
function gallery(){
  app.innerHTML='';
  var h=el('h2',null,'這兩幅畫，你比較喜歡哪一幅？');
  var l=el('p','lead','點一下你比較喜歡的那一幅，再按下面的按鈕。');
  var wall=el('div','wall'+(st.pick?' chosen':''));
  var nx=button('就是這一幅','btn',function(){
    if(!st.pick)return;
    if(!st.team)st.team=draw2()?'block':'wave';
    go(2);
  });
  nx.disabled=!st.pick;
  [['wave',ART_WAVE],['block',ART_BLOCK]].forEach(function(a){
    var b=el('button','art'+(st.pick===a[0]?' on':''),'<span class="light"></span><span class="tag">'+ic('heart')+'我比較喜歡</span><span class="frm"><span class="mat">'+a[1]+'</span></span><span class="plaque">'+T[a[0]].art+'</span>');

      st.pick=a[0];save(st);

    wall.appendChild(b);
  });
  app.append(el('p','case',ic('frame')+'畫廊挑畫'),h,l,wall,nx);
}

/* ---------- step 2: team ---------- */
function team(){
  app.innerHTML='';
  var t=T[st.team];
  var c=el('div','card');
  var bd=el('div','badge t-'+st.team);
  bd.innerHTML='<svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICI[t.ic]+'</svg><p class="sub">你是</p><p class="name">'+t.team+'</p><p class="sub">的一員</p>';
  c.appendChild(bd);
  app.append(el('p','case','分隊'),el('h2',null,'全班分成兩隊了！'),c,
    el('p','lead','班上一半的同學是<b>海浪隊</b>，另一半是<b>積木隊</b>。接下來的題目裡，你會看到其他同學是哪一隊的。'),
    button('下一步','btn',function(){go(3)}));
}

/* ---------- step 3: how points work ---------- */
function rules(){
  app.innerHTML='';
  var c=el('div','card');
  c.append(el('p','lead','老師要發「班級點數」給幾位同學，點數可以拿去換班上的小獎勵。'),
    el('p','lead','每一題會有兩位同學。你<b>不認識</b>他們，只知道他們的號碼，還有他們是哪一隊的。你自己<b>不會</b>拿到點數。'),
    el('p','lead','每一題有 A、B、C 三種分法。按一下，天平兩邊的點數就會跟著變；選好了，再按「確定」。'));
  app.append(el('p','case',ic('coins')+'班級點數'),el('h2',null,'點數要怎麼分，由你來決定'),c,
    el('p','note','分法沒有對錯，選你覺得最好的那一種就好。一共 4 題。'),
    button('開始分點數','btn',function(){go(4)}));
}

/* ---------- steps 4–7: points balance ---------- */
// who: 'me' = your team, 'op' = the other team
var Q=[
  {who:['me','op'],no:[18,24],opts:[[7,7],[9,5],[11,3]]},
  {who:['me','op'],no:[6,15],opts:[[13,13],[11,7],[9,3]]},
  {who:['op','op'],no:[2,22],opts:[[7,7],[9,5],[11,3]]},
  {who:['me','me'],no:[10,17],opts:[[7,7],[9,5],[11,3]]}
];
var L='ABC';
function tOf(w){return w==='me'?st.team:other(st.team)}
function qTitle(i){
  var q=Q[i],me=T[st.team].team,op=T[other(st.team)].team;
  if(i===0)return '一位是'+me+'（你們隊）的 '+q.no[0]+' 號，一位是'+op+'的 '+q.no[1]+' 號。你想怎麼分？';
  if(i===1)return '這次也是一位'+me+'（你們隊）的 '+q.no[0]+' 號，一位'+op+'的 '+q.no[1]+' 號，但是分法不一樣了。你想怎麼分？';
  if(i===2)return '這一題的兩位，都是'+op+'的同學：'+q.no[0]+' 號和 '+q.no[1]+' 號。你想怎麼分？';
  return '這一題的兩位，都是'+me+'（你們隊）的同學：'+q.no[0]+' 號和 '+q.no[1]+' 號。你想怎麼分？';
}
var COIN=7;
function panSVG(side,t){
  var fill=t==='wave'?'#DCE8F0':'#F6DCCF',ink=t==='wave'?'#205E86':'#A8441A';
  return '<g class="pan" id="pan'+side+'">'+
    '<path d="M0 0 L-64 170 M0 0 L64 170" stroke="#56605C" stroke-width="3" fill="none"/>'+
    '<circle cx="0" cy="0" r="5" fill="#56605C"/>'+
    '<g class="pile"></g>'+
    '<path d="M-80 170 H80 Q72 198 0 198 Q-72 198 -80 170Z" fill="'+fill+'" stroke="'+ink+'" stroke-width="4" stroke-linejoin="round"/>'+
    '<text class="q" x="0" y="242" text-anchor="middle">?</text>'+
  '</g>';
}
function balanceSVG(q){
  return '<svg class="bal" viewBox="0 0 600 390" role="img" aria-label="點數天平">'+
    '<rect x="228" y="352" width="144" height="20" rx="10" fill="#D4D9D2" stroke="#56605C" stroke-width="4"/>'+
    '<path d="M300 76 V352" stroke="#56605C" stroke-width="10" stroke-linecap="round"/>'+
    '<g class="beam"><rect x="84" y="63" width="432" height="14" rx="7" fill="#F3E3BE" stroke="#1F2A2E" stroke-width="4"/></g>'+
    '<circle cx="300" cy="70" r="13" fill="#FBF4E2" stroke="#1F2A2E" stroke-width="4"/>'+
    panSVG('L',tOf(q.who[0]))+panSVG('R',tOf(q.who[1]))+
  '</svg>';
}
function setBalance(svg,vals,animate){
  var a=vals?vals[0]:0,b=vals?vals[1]:0;
  var deg=Math.max(-15,Math.min(15,(b-a)*1.4)),r=deg*Math.PI/180,H=210;
  var beam=svg.querySelector('.beam');beam.style.transform='rotate('+deg+'deg)';
  var pl=svg.querySelector('#panL'),pr=svg.querySelector('#panR');
  pl.style.transform='translate('+(300-H*Math.cos(r))+'px,'+(70-H*Math.sin(r))+'px)';
  pr.style.transform='translate('+(300+H*Math.cos(r))+'px,'+(70+H*Math.sin(r))+'px)';
  [[pl,a],[pr,b]].forEach(function(x){
    var pile=x[0].querySelector('.pile'),have=pile.children.length,n=x[1];
    while(have>n){pile.removeChild(pile.lastChild);have--}
    for(var i=have;i<n;i++){
      var g=document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','coin'+(animate?' new':''));
      if(animate)g.style.animationDelay=((i-have)*35)+'ms';
      var y=162-i*COIN;
      g.innerHTML='<path d="M-27 '+y+' v5 a27 7 0 0 0 54 0 v-5" fill="#E2B33F" stroke="#8A6216" stroke-width="2.5"/><ellipse cx="0" cy="'+y+'" rx="27" ry="7" fill="#F3D27A" stroke="#8A6216" stroke-width="2.5"/>';
      pile.appendChild(g);
    }
    var tx=x[0].querySelector('text');
    if(vals){tx.setAttribute('class','num');tx.textContent=n+' 點'}else{tx.setAttribute('class','q');tx.textContent='?'}
  });
}
function question(i){
  var q=Q[i];app.innerHTML='';
  app.appendChild(el('p','case',ic('scale')+'點數天平　第 '+(i+1)+' 題（共 4 題）'));
  app.appendChild(el('h2',null,qTitle(i)));
  var card=el('div','card balcard');
  card.innerHTML=balanceSVG(q);
  var svg=card.querySelector('svg');
  var ppl=el('div','ppl');
  q.who.forEach(function(w,k){
    var t=tOf(w);
    ppl.appendChild(el('div','person t-'+t,ic(T[t].ic)+'<span>'+T[t].team+' '+q.no[k]+' 號'+(w==='me'?'<small>和你同一隊</small>':'<small>另一隊</small>')+'</span>'));
  });
  var info=el('p','info');
  card.append(ppl,info);
  function showInfo(){
    var v=st.ans[i]!=null?q.opts[st.ans[i]]:null;
    if(!v){info.innerHTML='先按下面的 A、B、C，選一種分法。';return}
    var d=Math.abs(v[0]-v[1]);
    info.innerHTML='兩人加起來 <b>'+(v[0]+v[1])+'</b> 點　'+(d===0?'兩人一樣多':(v[0]>v[1]?q.no[0]:q.no[1])+' 號多 <b>'+d+'</b> 點');
  }
  var row=el('div','optrow');
  var nx=button(i<3?'確定，下一題':'確定，看結果','btn',function(){if(st.ans[i]==null)return;go(5+i)});
  nx.disabled=st.ans[i]==null;
  q.opts.forEach(function(o,k){
    var pills='';
    o.forEach(function(v,j){var t=tOf(q.who[j]);pills+='<span class="pill t-'+t+'">'+ic(T[t].ic)+'<small>'+q.no[j]+' 號</small><b>'+v+' 點</b></span>'});
    var b=el('button','opt'+(st.ans[i]===k?' pick':''),'<span class="lt">'+L[k]+'</span><span class="pills">'+pills+'</span>');
    b.type='button';b.setAttribute('aria-pressed',st.ans[i]===k?'true':'false');
    b.setAttribute('aria-label','分法 '+L[k]+'：'+q.no[0]+' 號 '+o[0]+' 點，'+q.no[1]+' 號 '+o[1]+' 點');
    b.addEventListener('click',function(){
      st.ans[i]=k;save(st);
      Array.prototype.forEach.call(row.children,function(x){x.classList.remove('pick');x.setAttribute('aria-pressed','false')});
      b.classList.add('pick');b.setAttribute('aria-pressed','true');nx.disabled=false;
      setBalance(svg,o,true);showInfo();
    });
    row.appendChild(b);
  });
  app.append(card,row,nx);
  setBalance(svg,st.ans[i]!=null?q.opts[st.ans[i]]:null,false);
  showInfo();
}

/* ---------- step 8: result + reveal ---------- */
function favCount(){var n=0;if(st.ans[0]>0)n++;if(st.ans[1]>0)n++;return n}
function ansText(i){
  var k=st.ans[i];if(k==null)return '—';
  var q=Q[i],o=q.opts[k],me=T[st.team].team,op=T[other(st.team)].team;
  function nw(x){return '<span class="nw">'+x+'</span>'}
  if(i<2)return '<b>'+L[k]+'</b>　'+nw(me+' '+o[0]+' 點、')+nw(op+' '+o[1]+' 點');
  return '<b>'+L[k]+'</b>　'+nw(q.no[0]+' 號 '+o[0]+' 點、')+nw(q.no[1]+' 號 '+o[1]+' 點');
}
function result(){
  app.innerHTML='';
  var me=T[st.team].team;
  var c=el('div','card');
  var t=el('table');
  var q1=st.ans[0],q2=st.ans[1];
  var tag1=q1>0?'<span class="chip fav">'+me+'多 '+(q1===1?4:8)+' 點</span>':'<span class="chip even">兩邊一樣</span>';
  var tag2=q2===0?'<span class="chip even">兩邊一樣，兩人都拿最多</span>':q2===1?'<span class="chip fav">'+me+'多 4 點，兩人都比 13 點少</span>':'<span class="chip fav">兩人都少拿，'+me+'贏最多</span>';
  var same3=st.ans[2]===0?'兩邊一樣':'有一位多拿';
  var same4=st.ans[3]===0?'兩邊一樣':'有一位多拿';
  [['第 1 題<br><span class="nw">你們隊、</span><span class="nw">另一隊</span>',ansText(0)+'<br>'+tag1],
   ['第 2 題<br><span class="nw">你們隊、</span><span class="nw">另一隊</span>',ansText(1)+'<br>'+tag2],
   ['第 3 題<br><span class="nw">兩位都是</span><span class="nw">另一隊</span>',ansText(2)+'<br><span class="chip even">'+same3+'</span>'],
   ['第 4 題<br><span class="nw">兩位都是</span><span class="nw">你們隊</span>',ansText(3)+'<br><span class="chip even">'+same4+'</span>']].forEach(function(r){
    var tr=el('tr');tr.append(el('td','k',r[0]),el('td',null,r[1]));t.appendChild(tr);
  });
  c.appendChild(t);
  var n=favCount();
  var sum=n===0?'第 1、2 題，你兩題都讓兩隊拿一樣多。':'第 1、2 題，你有 <b>'+n+'</b> 題多給了自己這一隊。';
  if(q2===2)sum+='第 2 題你選了 C：兩人加起來只有 12 點，比 A 的 26 點少了一半還多，可是'+me+'贏得最多。';
  else if(q2===1)sum+='第 2 題你選了 B：兩人加起來 18 點，比 A 的 26 點少，可是'+me+'比較多。';
  c.appendChild(el('p','lead',sum));
  var rv=el('div','card reveal');
  var match=st.pick===st.team;
  rv.append(el('div','hd',ic('lots')+'<h3>其實，分隊是抽籤的，跟你喜歡哪一幅畫沒有關係。</h3>'),
    el('p',null,'你選的是'+T[st.pick].art+'，抽到的是<b>'+me+'</b>。'+(match?'名字剛好對得上，可是那只是運氣，抽籤的時候根本沒有看你選哪一幅。':'所以你的隊名，和你喜歡的那一幅畫並不一樣。')),
    el('p',null,'你不認識題目裡的同學，自己也拿不到任何點數，隊伍又是抽籤抽出來的。即使這樣，很多人還是會不知不覺多給「自己這一隊」一點；有些人甚至寧可兩個人都少拿，也要讓自己這一隊比對方多。也有很多人每一題都分得一樣多。'),
    el('p',null,'很多人只因為一個隨便的分組，就開始偏心自己這一隊。你這次是怎麼分的，等一下全班一起看看。'));
  app.append(el('p','case','結果'),el('h2',null,'你是怎麼分點數的？'),c,rv,button('下一步','btn',function(){go(9)}));
}

/* ---------- step 9: feeling ---------- */
var F=[['surprise','有點驚訝'],['flag','還是想讓我們隊贏'],['scale','覺得應該兩隊一樣'],['meh','沒什麼感覺']];
function feeling(){
  app.innerHTML='';
  var g=el('div','opts');
  var msg=el('div');
  var nx=button('選好了','btn',function(){if(st.feel==null)return;go(10)});
  nx.disabled=st.feel==null;
  function showMsg(){msg.innerHTML='';if(st.feel!=null)msg.appendChild(el('p','note','每一種感覺都有人有。等一下老師會請大家說說看，為什麼會這樣覺得。'))}
  F.forEach(function(f,k){
    var b=button(ic(f[0])+'<span>'+f[1]+'</span>','btn alt'+(st.feel===k?' pick':''),function(){
      st.feel=k;save(st);Array.prototype.forEach.call(g.children,function(x){x.classList.remove('pick');x.setAttribute('aria-pressed','false')});
      b.classList.add('pick');b.setAttribute('aria-pressed','true');nx.disabled=false;showMsg();
    });
    b.setAttribute('aria-pressed',st.feel===k?'true':'false');
    g.appendChild(b);
  });
  showMsg();
  app.append(el('p','case','說說感覺'),el('h2',null,'知道分隊是抽籤的，你覺得？'),g,msg,nx);
}

/* ---------- step 10: end ---------- */
function end(){
  app.innerHTML='';
  var me=T[st.team].team,match=st.pick===st.team;
  var t=el('table');
  [['我選的畫',T[st.pick].art],
   ['我被分到的隊','<b>'+me+'</b>（和我選的畫'+(match?'名字一樣':'不一樣')+'）'],
   ['第 1 題',ansText(0)],
   ['第 2 題',ansText(1)],
   ['第 3 題（兩位都是另一隊）',ansText(2)],
   ['第 4 題（兩位都是我們隊）',ansText(3)],
   ['第 1、2 題多給自己隊','<b>'+favCount()+'</b> 題'],
   ['我的感受',st.feel!=null?'<b>'+F[st.feel][1]+'</b>':'—']].forEach(function(r){
    var tr=el('tr');tr.append(el('td','k',r[0]),el('td',null,r[1]));t.appendChild(tr);
  });
  var c=el('div','card');c.appendChild(t);
  app.append(el('h2',null,'做完了！<br>請停在這一頁，等其他同學。'),c);
}

function render(){
  if(st.step>=2&&!st.pick)st.step=1;
  if(st.step>=2&&!st.team)st.team=draw2()?'block':'wave';
  for(var i=0;i<4;i++){if(st.step>4+i&&st.ans[i]==null){st.step=4+i;break}}
  if(st.step>=10&&st.feel==null)st.step=9;
  var S=[intro,gallery,team,rules,function(){question(0)},function(){question(1)},function(){question(2)},function(){question(3)},result,feeling,end];
  (S[st.step]||intro)();
}
render();
})();
</script>
